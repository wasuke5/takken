<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宅建 模試</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#fff; --ink:#2b2620; --sub:#7a7268; --line:#e6e0d6;
    --accent:#c1440e; --good:#2f8f4e; --bad:#c73e3e; --miss:#c98a1a;
    --ken:#5f4b8b; --hou:#3f7d46; --zei:#8a6d1f; --gyo:#a5432a; --men:#3a6280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,"Segoe UI",Meiryo,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding-bottom:78px;
  }
  button{font-family:inherit;}

  header{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(135deg,#2b2620,#463a2c); color:#f6f3ee;
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .burger{
    width:40px;height:40px;flex:0 0 auto;
    border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08);
    color:#f6f3ee; border-radius:10px; font-size:1.15rem; cursor:pointer;
  }
  .homebtn{
    width:40px;height:40px;flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;text-decoration:none;
    border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08);
    color:#f6f3ee; border-radius:10px; font-size:1.05rem;
  }
  .homebtn:hover{background:rgba(255,255,255,.2);}
  .htitle{flex:1 1 auto;min-width:0;}
  .htitle b{display:block;font-size:.92rem;line-height:1.25;}
  .htitle span{display:block;font-size:.7rem;color:#cfc4b0;}
  .hcount{font-size:.72rem;color:#cfc4b0;text-align:right;white-space:nowrap;}
  .hcount b{color:#fff;font-size:.92rem;}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:50;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:min(330px,86vw);
    background:var(--card);z-index:60;transform:translateX(-100%);
    transition:transform .22s ease;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,.2);
  }
  .drawer.on{transform:translateX(0);}
  .drawer h2{
    margin:0;padding:15px 16px 11px;font-size:.92rem;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .drawer h2 button{border:none;background:transparent;color:var(--sub);font-size:1.3rem;cursor:pointer;}
  .yearlist{padding:8px;}
  .yearbtn{
    display:block;width:100%;text-align:left;border:1px solid var(--line);
    background:#fdfcfa;border-radius:10px;padding:10px 12px;margin-bottom:6px;
    cursor:pointer;color:var(--ink);
  }
  .yearbtn:hover{border-color:var(--accent);}
  .yearbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .yearbtn .yl{font-size:.86rem;font-weight:700;display:block;}
  .yearbtn .ys{font-size:.68rem;color:var(--sub);display:block;margin-top:2px;}
  .yearbtn.on .ys{color:#f3d9cd;}
  .drawer .note{font-size:.68rem;color:var(--sub);padding:6px 16px 20px;line-height:1.7;}

  .wrap{max-width:820px;margin:0 auto;padding:12px;}

  /* 問題番号のマス目 */
  .navwrap{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px;margin-bottom:12px;
  }
  .navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
  .navcell{
    aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:6px;
    font-size:.66rem;color:var(--sub);cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;
  }
  .navcell.done{background:#e9f1ea;border-color:#9dc4a6;color:#2f6b41;font-weight:700;}
  .navcell.flag{box-shadow:inset 0 -3px 0 var(--miss);}
  .navcell.cur{outline:2px solid var(--accent);outline-offset:1px;}
  .navcell.ok{background:#dff0e4;border-color:var(--good);color:#1e5c33;font-weight:700;}
  .navcell.ng{background:#fbe3e3;border-color:var(--bad);color:#8c2a2a;font-weight:700;}
  .progline{display:flex;justify-content:space-between;font-size:.7rem;color:var(--sub);margin-bottom:7px;}
  .progbar{height:6px;background:#eee7dc;border-radius:99px;overflow:hidden;margin-bottom:9px;}
  .progbar div{height:100%;background:var(--accent);width:0;transition:width .25s;}
  .later-toolbar{display:flex;gap:8px;margin-top:10px;}
  .later-action{flex:1 1 0;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:.75rem;font-weight:700;cursor:pointer;}
  .later-action:hover{border-color:var(--accent);color:var(--accent);}
  .later-action b{color:var(--accent);}

  /* 問題カード */
  .qcard{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 16px 18px;
  }
  .qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .qnum{font-size:1.05rem;font-weight:800;}
  .qtag{
    font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;
    background:#efe9df;color:var(--sub);
  }
  .flagbtn{
    margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:5px 11px;font-size:.72rem;color:var(--sub);cursor:pointer;
  }
  .flagbtn.on{background:#fdf3e0;border-color:var(--miss);color:var(--miss);}
  .latercheck{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:.72rem;color:var(--sub);cursor:pointer;}
  .latercheck.on{background:#fdeee7;border-color:var(--accent);color:var(--accent);font-weight:700;}
  .latercheck input{width:16px;height:16px;margin:0;accent-color:var(--accent);}
  .navcell.later{border-style:dashed;}
  .navcell.flag.later{box-shadow:inset 0 -3px 0 var(--miss),inset 0 0 0 1px var(--accent);}
  .later-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .later-panel-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .later-panel-title{flex:1;min-width:0;}
  .later-panel-title b{display:block;font-size:.98rem;}
  .later-panel-title span{display:block;color:var(--sub);font-size:.72rem;margin-top:2px;}
  .later-close{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;color:var(--ink);font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap;}
  .later-group{border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden;}
  .later-group > summary{padding:10px 12px;background:#fbf8f3;cursor:pointer;font-size:.82rem;font-weight:700;}
  .later-group-body{padding:4px 10px 10px;}
  .later-year{border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden;}
  .later-year > summary{padding:9px 10px;background:#fff;cursor:pointer;font-size:.78rem;font-weight:700;}
  .later-year-body{padding:0 8px 4px;}
  .later-year-body .later-row:first-child{border-top:0;}
  .later-row{display:flex;align-items:flex-start;gap:9px;border-top:1px solid var(--line);padding:10px 2px;}
  .later-openq{flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left;color:var(--ink);cursor:pointer;}
  .later-openq b{display:block;color:var(--accent);font-size:.75rem;margin-bottom:3px;}
  .later-openq span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-size:.78rem;line-height:1.6;}
  .later-empty{padding:14px 6px;text-align:center;color:var(--sub);font-size:.8rem;}
  .stem{font-size:.95rem;line-height:1.85;margin:0 0 16px;white-space:pre-wrap;}
  .ocrwarn{
    font-size:.7rem;color:#8a6d1f;background:#fdf7ec;border-left:3px solid var(--miss);
    padding:7px 10px;border-radius:6px;margin:0 0 12px;line-height:1.6;
  }
  .items{margin:0 0 16px;display:flex;flex-direction:column;gap:10px;}
  .item{display:flex;gap:9px;font-size:.93rem;line-height:1.8;}
  .item .im{
    flex:0 0 auto;width:1.8em;height:1.8em;border-radius:6px;
    background:#efe9df;color:#6b6055;font-weight:700;font-size:.82rem;
    display:flex;align-items:center;justify-content:center;margin-top:.15em;
  }
  .item .it{flex:1 1 auto;min-width:0;}
  .imgbox{margin-bottom:12px;}
  .imgbox img{width:100%;height:auto;display:block;margin-bottom:6px;border-radius:6px;}
  .imgbox.zoom{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px dashed var(--line);border-radius:8px;padding:4px;}
  .imgbox.zoom img{width:auto;max-width:none;}
  .zoombtn{
    border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:5px 11px;font-size:.72rem;color:var(--sub);cursor:pointer;margin-bottom:8px;
  }
  .zoombtn.on{background:#fdeee7;border-color:var(--accent);color:var(--accent);}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice{
    display:flex;gap:10px;text-align:left;width:100%;
    border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:12px 13px;cursor:pointer;color:var(--ink);
    font-size:.9rem;line-height:1.75;
  }
  .choice:hover{border-color:var(--accent);}
  .choice .cn{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:.8rem;font-weight:700;color:var(--sub);background:#fbf8f3;
  }
  .choice .ct{flex:1 1 auto;min-width:0;}
  .choice.sel{background:#fdeee7;border-color:var(--accent);}
  .choice.sel .cn{background:var(--accent);border-color:var(--accent);color:#fff;}
  .choice.correct{background:#e9f6ec;border-color:var(--good);}
  .choice.correct .cn{background:var(--good);border-color:var(--good);color:#fff;}
  .choice.wrong{background:#fbeaea;border-color:var(--bad);}
  .choice.wrong .cn{background:var(--bad);border-color:var(--bad);color:#fff;}
  .graded .choice{cursor:default;}
  .judge{margin-top:14px;padding:11px 13px;border-radius:9px;font-size:.85rem;font-weight:700;display:none;}
  .judge.show{display:block;}
  .judge.ok{background:#e9f6ec;color:#1e5c33;}
  .judge.ng{background:#fbeaea;color:#8c2a2a;}
  .checkbtn{
    margin-top:14px;width:100%;padding:12px;border-radius:10px;
    border:1px solid var(--accent);background:#fff;color:var(--accent);
    font-size:.88rem;font-weight:700;cursor:pointer;
  }
  .checkbtn:hover:not(:disabled){background:#fdeee7;}
  .checkbtn:disabled{border-color:var(--line);color:var(--sub);background:#faf8f5;cursor:not-allowed;}
  .checkbtn.done{border-color:var(--line);color:var(--sub);font-weight:600;}
  .srcline{margin-top:14px;font-size:.7rem;color:var(--sub);}
  .srcline a{color:var(--accent);}

  /* 下部の移動バー */
  .footbar{
    position:fixed;left:0;right:0;bottom:0;z-index:35;
    background:rgba(253,252,250,.97);border-top:1px solid var(--line);
    display:flex;gap:8px;padding:10px 12px;
    max-width:820px;margin:0 auto;
    box-shadow:0 -2px 10px rgba(0,0,0,.06);
  }
  .footbar button{
    flex:1 1 0;border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:12px;font-size:.85rem;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .footbar button:disabled{opacity:.4;cursor:not-allowed;}
  .footbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1.3 1 0;}

  /* 結果 */
  .result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px 22px;}
  .scorebig{text-align:center;padding:6px 0 14px;}
  .scorebig .n{font-size:3rem;font-weight:800;line-height:1;}
  .scorebig .d{font-size:1rem;color:var(--sub);}
  .verdict{display:inline-block;margin-top:10px;padding:6px 18px;border-radius:99px;font-size:.85rem;font-weight:700;}
  .verdict.pass{background:#dff0e4;color:#1e5c33;}
  .verdict.fail{background:#fbe3e3;color:#8c2a2a;}
  .grow{margin-bottom:11px;}
  .grow .gl{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px;}
  .gbar{height:9px;background:#eee7dc;border-radius:99px;overflow:hidden;}
  .gbar div{height:100%;border-radius:99px;}
  .resbtns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .resbtns button{
    flex:1 1 140px;border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:12px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .resbtns button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .hint{font-size:.72rem;color:var(--sub);line-height:1.8;margin-top:14px;}
  @media(max-width:600px){
    .stem{font-size:.92rem;}
    .choice{font-size:.87rem;}
  }
</style>
</head>
<body>
<header>
  <a class="homebtn" href="index.html" aria-label="トップページへ戻る" title="トップページへ戻る">🏠</a>
  <button class="burger" id="burger" aria-label="模試を選ぶ">☰</button>
  <div class="htitle"><b id="h-title">—</b><span id="h-sub"></span></div>
  <div class="hcount"><b id="h-done">0</b>/50</div>
</header>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer">
  <h2>模試を選ぶ<button id="drawerclose" aria-label="閉じる">×</button></h2>
  <div class="yearlist" id="yearlist"></div>
  <p class="note" id="drawernote"></p>
  <div style="padding:0 8px 20px"><button type="button" class="yearbtn" data-backup-open>💾 データのバックアップ・復元</button></div>
</nav>

<div class="wrap">
  <div class="navwrap">
    <div class="progline"><span id="prog-text">0 / 50 問 回答済み</span><span id="prog-flag"></span></div>
    <div class="progbar"><div id="progfill"></div></div>
    <div class="navgrid" id="navgrid"></div>
    <div class="later-toolbar">
      <button type="button" class="later-action" id="btn-later-year">この模試のあとで解く（0）</button>
      <button type="button" class="later-action" id="btn-later-all">全模試のあとで解く（0）</button>
    </div>
  </div>
  <div id="laterhost" hidden></div>
  <div id="qhost"></div>
  <div id="resulthost"></div>
</div>

<div class="footbar" id="footbar">
  <button id="btn-prev">← 前の問題</button>
  <button id="btn-grade" class="primary">採点する</button>
  <button id="btn-next">次の問題 →</button>
</div>

/* ============================================================
   分野（宅建本試験の出題構成）
   ============================================================ */
const GROUPS = [
  {name:'権利関係',     from:1,  to:14, color:'var(--ken)'},
  {name:'法令上の制限', from:15, to:22, color:'var(--hou)'},
  {name:'税・その他',   from:23, to:25, color:'var(--zei)'},
  {name:'宅建業法',     from:26, to:45, color:'var(--gyo)'},
  {name:'5点免除科目',  from:46, to:50, color:'var(--men)'},
];
function groupOf(n){ return GROUPS.find(g => n >= g.from && n <= g.to); }

const KEY = 'takken_moshi_v2';
const LATER_KEY = 'takken_moshi_later_v1';

let store = {};
let laterStore = {};
let exam  = null;
let cur   = 1;
let mode  = 'quiz';        // quiz | result
let laterOpen = false;
let zoomOn = false;        // スキャン年度の画像を拡大表示するか
let scanOn = false;        // 書き起こし年度で原文写真も並べて出すか

function loadStore(){
  try{
    const raw = localStorage.getItem(KEY);
    const value = raw ? JSON.parse(raw) : {};
    store = value && typeof value === 'object' && !Array.isArray(value) ? value : {};
    // 最初の模試ページに記録がある場合は、元の記録を残したまま引き継ぐ。
    if(raw === null){
      const previous = JSON.parse(localStorage.getItem('takken_moshi1_v1') || 'null');
      if(previous && typeof previous === 'object' && !Array.isArray(previous)){
        const copyMap = (value, answers)=>{
          const out = {};
          if(!value || typeof value !== 'object' || Array.isArray(value)) return out;
          Object.keys(value).forEach(key=>{
            const n = Number(key), v = Number(value[key]);
            if(Number.isInteger(n) && n >= 1 && n <= 50){
              if(answers && [1,2,3,4].includes(v)) out[n] = v;
              else if(!answers && value[key]) out[n] = 1;
            }
          });
          return out;
        };
        const last = Number(previous.last);
        store.M1 = {ans:copyMap(previous.answers, true), flags:copyMap(previous.flags),
          checked:copyMap(previous.checked), graded:!!previous.graded,
          last:Number.isInteger(last) ? Math.min(50,Math.max(1,last)) : 1};
        saveStore();
      }
    }
  }catch(e){ store = {}; }
}
function saveStore(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
}
function loadLaterStore(){
  try{
    const value = JSON.parse(localStorage.getItem(LATER_KEY)) || {};
    laterStore = value && typeof value === 'object' && !Array.isArray(value) ? value : {};
  }catch(e){ laterStore = {}; }
}
function saveLaterStore(){
  try{ localStorage.setItem(LATER_KEY, JSON.stringify(laterStore)); }catch(e){}
}
function laterNumbers(id){
  const record = laterStore[id];
  if(!record || typeof record !== 'object' || Array.isArray(record)) return [];
  return Object.keys(record).map(Number)
    .filter(n => Number.isInteger(n) && n >= 1 && n <= 50 && !!record[n])
    .sort((a,b) => a-b);
}
function isLater(id, n){ return laterNumbers(id).includes(n); }
function setLater(id, n, checked){
  if(checked){
    if(!laterStore[id] || typeof laterStore[id] !== 'object' || Array.isArray(laterStore[id])) laterStore[id] = {};
    laterStore[id][n] = true;
  }else if(laterStore[id]){
    delete laterStore[id][n];
    if(!Object.keys(laterStore[id]).length) delete laterStore[id];
  }
  saveLaterStore();
  updateLaterButtons();
}
function countAllLater(){
  return EXAMS.reduce((total, e) => total + laterNumbers(e.id).length, 0);
}
function updateLaterButtons(){
  const yearButton = document.getElementById('btn-later-year');
  const allButton = document.getElementById('btn-later-all');
  if(!yearButton || !allButton) return;
  yearButton.textContent = 'この模試のあとで解く（' + (exam ? laterNumbers(exam.id).length : 0) + '）';
  allButton.textContent = '全模試のあとで解く（' + countAllLater() + '）';
}
function st(id){
  if(!store[id]) store[id] = {ans:{}, flags:{}, checked:{}, graded:false, last:1};
  const s = store[id];
  if(!s.ans) s.ans = {};
  if(!s.flags) s.flags = {};
  if(!s.checked) s.checked = {};      // その問だけ答え合わせ済みか
  return s;
}
function accepted(n){ return exam.ans[n-1]; }

/* ============================================================
   ドロワー
   ============================================================ */
function buildYearList(){
  const box = document.getElementById('yearlist');
  box.innerHTML = '';
  EXAMS.forEach(e=>{
    const s = st(e.id);
    const done = Object.keys(s.ans).length;
    const laterCount = laterNumbers(e.id).length;
    const b = document.createElement('button');
    b.className = 'yearbtn' + (exam && exam.id===e.id ? ' on' : '');
    let sub;
    if(s.graded)  sub = '採点済み ' + scoreOf(e).total + '点 / 50';
    else if(done) sub = '解答中 ' + done + '/50問';
    else          sub = '未着手（目標 ' + e.pass + '点）';
    b.innerHTML = '<span class="yl">' + e.label + '</span><span class="ys">' + sub + ' · あとで解く ' + laterCount + '問</span>';
    b.onclick = ()=>{ selectExam(e.id); closeDrawer(); };
    box.appendChild(b);
  });
  document.getElementById('drawernote').textContent =
    '模試1〜4の問題冊子から各50問、合計200問を文字に起こしています。問題と選択肢を読み、1〜4から答えを選んでください。'
  + '「原文写真で確かめる」から元の問題も確認できます。正解番号は付属の解答一覧に合わせています。';
}
function openDrawer(){
  buildYearList();
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}

/* ============================================================
   問題の表示
   ============================================================ */
function renderQuestion(){
  const host = document.getElementById('qhost');
  const s = st(exam.id);
  const q = exam.qs[cur-1];
  const g = groupOf(cur);
  const picked = s.ans[cur];
  const revealed = s.graded || !!s.checked[cur];   // 全体採点済み or この問だけ答え合わせ済み

  host.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'qcard' + (revealed ? ' graded' : '');

  const meta = document.createElement('div');
  meta.className = 'qmeta';
  meta.innerHTML = '<span class="qnum">問 ' + cur + '</span>'
                 + '<span class="qtag" style="color:' + g.color + '">' + g.name + '</span>';
  const laterLabel = document.createElement('label');
  const laterInput = document.createElement('input');
  const laterChecked = isLater(exam.id, cur);
  laterLabel.className = 'latercheck' + (laterChecked ? ' on' : '');
  laterInput.type = 'checkbox';
  laterInput.checked = laterChecked;
  laterInput.setAttribute('aria-label', 'この問題をあとで解く問題に保存');
  laterInput.onchange = ()=>{
    setLater(exam.id, cur, laterInput.checked);
    renderQuestion();
    renderNav();
  };
  const laterText = document.createElement('span');
  laterText.textContent = 'あとで解く';
  laterLabel.appendChild(laterInput);
  laterLabel.appendChild(laterText);
  meta.appendChild(laterLabel);
  const flag = document.createElement('button');
  flag.className = 'flagbtn' + (s.flags[cur] ? ' on' : '');
  flag.textContent = s.flags[cur] ? '△ 見直す' : '△ 見直し';
  flag.onclick = ()=>{
    if(s.flags[cur]) delete s.flags[cur]; else s.flags[cur] = 1;
    saveStore(); renderQuestion(); renderNav();
  };
  meta.appendChild(flag);
  card.appendChild(meta);

  if(exam.kind === 'text'){
    const stem = document.createElement('p');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);
    if(q.items && q.items.length){
      const box = document.createElement('div');
      box.className = 'items';
      q.items.forEach(it=>{
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = '<span class="im">' + it.m + '</span>'
                      + '<span class="it">' + escapeHtml(it.t) + '</span>';
        box.appendChild(row);
      });
      card.appendChild(box);
    }
    // 問題冊子がスキャン画像だった年度は、書き起こしの原文も出せるようにしておく
    if(q.img && q.img.length){
      const sb = document.createElement('button');
      sb.className = 'zoombtn' + (scanOn ? ' on' : '');
      sb.textContent = scanOn ? '原文写真を閉じる' : '原文写真で確かめる';
      sb.onclick = ()=>{
        scanOn = !scanOn;
        try{ localStorage.setItem(KEY + '_scan', scanOn ? '1' : ''); }catch(e){}
        renderQuestion();
      };
      card.appendChild(sb);
      if(scanOn){
        const box = document.createElement('div');
        box.className = 'imgbox';
        q.img.forEach(f=>{
          const im = document.createElement('img');
          im.src = 'moshi/q/' + f;
          im.alt = '問' + cur + ' の原文';
          im.loading = 'lazy';
          box.appendChild(im);
        });
        card.appendChild(box);
      }
    }
  }else{
    // スキャン年度：問題冊子の該当箇所をそのまま表示
    const zb = document.createElement('button');
    zb.className = 'zoombtn' + (zoomOn ? ' on' : '');
    zb.textContent = zoomOn ? '拡大中（横スクロール）｜画面に合わせる' : '⤢ 文字を大きく';
    zb.onclick = ()=>{
      zoomOn = !zoomOn;
      try{ localStorage.setItem(KEY + '_zoom', zoomOn ? '1' : ''); }catch(e){}
      renderQuestion();
    };
    card.appendChild(zb);
    const box = document.createElement('div');
    box.className = 'imgbox' + (zoomOn ? ' zoom' : '');
    q.img.forEach(f=>{
      const im = document.createElement('img');
      im.src = 'moshi/q/' + f;
      im.alt = '問' + cur;
      im.loading = 'lazy';
      box.appendChild(im);
    });
    card.appendChild(box);
  }

  const cbox = document.createElement('div');
  cbox.className = 'choices';
  for(let v=1; v<=4; v++){
    const b = document.createElement('button');
    b.className = 'choice';
    let cls = '';
    if(revealed){
      const acc = accepted(cur);
      if(acc.length === 4)                  cls = (picked === v) ? ' correct' : '';   // 全員正解
      else if(acc.includes(v))              cls = ' correct';
      else if(picked === v)                 cls = ' wrong';
    }else if(picked === v){
      cls = ' sel';
    }
    b.className = 'choice' + cls;
    const label = (exam.kind === 'text')
      ? '<span class="ct">' + escapeHtml(q.ch[v-1]) + '</span>'
      : '';
    b.innerHTML = '<span class="cn">' + v + '</span>' + label;
    b.onclick = ()=>choose(v);
    cbox.appendChild(b);
  }
  card.appendChild(cbox);

  if(revealed){
    const acc = accepted(cur);
    const ok = picked && acc.includes(picked);
    const j = document.createElement('div');
    j.className = 'judge show ' + (ok ? 'ok' : 'ng');
    let msg;
    if(acc.length === 4)      msg = 'この問題は正解のない問題として、全員正解の扱いです。';
    else if(acc.length === 2) msg = (ok?'正解！':'不正解。') + ' 正解は ' + acc.join(' と ') + '（どちらも正解）';
    else                      msg = (ok?'正解！':'不正解。') + ' 正解は ' + acc[0];
    if(!picked) msg = '未回答でした。正解は ' + acc.join(' または ');
    j.textContent = msg;
    card.appendChild(j);
  }

  if(!s.graded){
    const cb = document.createElement('button');
    cb.className = 'checkbtn' + (revealed ? ' done' : '');
    if(revealed){
      cb.textContent = 'この問題をもう一度解く';
      cb.onclick = uncheckOne;
    }else{
      cb.textContent = picked ? '答え合わせ' : '答えを選ぶと確認できます';
      cb.disabled = !picked;
      cb.onclick = checkOne;
    }
    card.appendChild(cb);
  }

  const src = document.createElement('div');
  src.className = 'srcline';
  src.innerHTML = '出典：' + escapeHtml(exam.label) + ' 問題冊子（' + q.page + 'ページ） '
    + '<a href="moshi/q/' + q.img[0] + '" target="_blank" rel="noopener">元の問題写真を開く ↗</a>';
  card.appendChild(src);

  host.appendChild(card);

  document.getElementById('btn-prev').disabled = (cur === 1);
  document.getElementById('btn-next').disabled = (cur === 50);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function choose(v){
  const s = st(exam.id);
  if(s.graded || s.checked[cur]) return;
  if(s.ans[cur] === v) delete s.ans[cur];      // もう一度押すと取り消し
  else s.ans[cur] = v;
  saveStore();
  renderQuestion();
  renderNav();
}

/* この問だけ答え合わせする */
function checkOne(){
  const s = st(exam.id);
  if(s.graded || s.checked[cur] || !s.ans[cur]) return;
  s.checked[cur] = 1;
  saveStore();
  renderQuestion();
  renderNav();
}
function uncheckOne(){
  const s = st(exam.id);
  delete s.checked[cur];
  saveStore();
  renderQuestion();
  renderNav();
}

function goto(n){
  if(laterOpen) closeLaterList();
  cur = Math.min(Math.max(n, 1), 50);
  st(exam.id).last = cur;
  saveStore();
  renderQuestion();
  renderNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============================================================
   1〜50のマス目
   ============================================================ */
function buildNav(){
  const box = document.getElementById('navgrid');
  box.innerHTML = '';
  for(let n=1; n<=50; n++){
    const b = document.createElement('button');
    b.className = 'navcell';
    b.textContent = n;
    b.id = 'nav' + n;
    b.onclick = ()=>{ if(mode==='result') backToQuiz(); goto(n); };
    box.appendChild(b);
  }
}

function renderNav(){
  const s = st(exam.id);
  const done = Object.keys(s.ans).length;
  const flags = Object.keys(s.flags).length;
  document.getElementById('h-done').textContent = done;
  document.getElementById('prog-text').textContent = done + ' / 50 問 回答済み';
  document.getElementById('prog-flag').textContent = flags ? ('見直し ' + flags + ' 問') : '';
  document.getElementById('progfill').style.width = (done/50*100) + '%';
  document.getElementById('btn-grade').textContent = s.graded ? '結果を見る' : '採点する';

  for(let n=1; n<=50; n++){
    const c = document.getElementById('nav'+n);
    const picked = s.ans[n];
    let cls = 'navcell';
    if(s.graded || s.checked[n]){
      cls += (picked && accepted(n).includes(picked)) ? ' ok' : ' ng';
    }else if(picked){
      cls += ' done';
    }
    if(s.flags[n]) cls += ' flag';
    if(isLater(exam.id, n)) cls += ' later';
    if(n === cur && mode === 'quiz') cls += ' cur';
    c.className = cls;
  }
}

/* ============================================================
   採点
   ============================================================ */
function scoreOf(e){
  const s = st(e.id);
  const per = {};
  GROUPS.forEach(g => per[g.name] = {ok:0, n:g.to-g.from+1});
  let total = 0;
  const wrong = [];
  for(let n=1; n<=50; n++){
    const picked = s.ans[n];
    const ok = picked && e.ans[n-1].includes(picked);
    if(ok){ total++; per[groupOf(n).name].ok++; }
    else wrong.push(n);
  }
  return {total, per, wrong};
}

function grade(){
  const s = st(exam.id);
  if(!s.graded){
    const done = Object.keys(s.ans).length;
    if(done < 50 && !confirm('未回答が ' + (50-done) + ' 問あります。このまま採点しますか？')) return;
    s.graded = true;
    saveStore();
  }
  showResult();
}

function showResult(){
  mode = 'result';
  const r = scoreOf(exam);
  const pass = r.total >= exam.pass;
  const host = document.getElementById('resulthost');
  host.style.display = '';
  document.getElementById('qhost').style.display = 'none';

  let html = '<div class="result"><div class="scorebig">'
    + '<div><span class="n" style="color:' + (pass?'var(--good)':'var(--bad)') + '">' + r.total + '</span>'
    + '<span class="d"> / 50点</span></div>'
    + '<div class="verdict ' + (pass?'pass':'fail') + '">'
    + (pass ? '目標点に到達' : 'あと ' + (exam.pass - r.total) + ' 点') + '</div>'
    + '<div style="font-size:.75rem;color:var(--sub);margin-top:8px">'
    + exam.label + '　目標点 ' + exam.pass + '点</div></div>';

  GROUPS.forEach(g=>{
    const p = r.per[g.name];
    const pct = Math.round(p.ok / p.n * 100);
    html += '<div class="grow"><div class="gl"><span>' + g.name + '</span>'
         +  '<b>' + p.ok + ' / ' + p.n + '（' + pct + '%）</b></div>'
         +  '<div class="gbar"><div style="width:' + pct + '%;background:' + g.color + '"></div></div></div>';
  });

  if(r.wrong.length){
    html += '<div style="margin-top:16px;font-size:.8rem;font-weight:700">'
         +  '間違えた問題（タップでその問題へ）</div><div class="navgrid" style="margin-top:8px">';
    r.wrong.forEach(n=>{
      html += '<button class="navcell ng" onclick="jumpFromResult(' + n + ')">' + n + '</button>';
    });
    html += '</div>';
  }

  const special = [];
  exam.ans.forEach((a,i)=>{
    if(a.length === 4)      special.push('問' + (i+1) + ' は正解のない問題として全員正解の扱い');
    else if(a.length === 2) special.push('問' + (i+1) + ' は ' + a.join(' と ') + ' のどちらも正解');
  });
  if(special.length) html += '<p class="hint">※ ' + special.join('／') + '（解答一覧に合わせています）</p>';

  html += '<div class="resbtns">'
       +  '<button class="primary" onclick="reviewWrong()">間違いを見直す</button>'
       +  '<button onclick="backToQuiz()">問題に戻る</button>'
       +  '<button onclick="resetExam()">やり直す</button>'
       +  '<button onclick="openDrawer()">別の模試</button>'
       +  '</div></div>';

  host.innerHTML = html;
  renderNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

function backToQuiz(){
  mode = 'quiz';
  document.getElementById('resulthost').innerHTML = '';
  document.getElementById('qhost').style.display = '';
  renderQuestion();
  renderNav();
}
function jumpFromResult(n){ backToQuiz(); goto(n); }
function reviewWrong(){
  const w = scoreOf(exam).wrong;
  backToQuiz();
  goto(w.length ? w[0] : 1);
}
function resetExam(){
  if(!confirm(exam.label + ' の解答を消してやり直します。よろしいですか？')) return;
  store[exam.id] = {ans:{}, flags:{}, checked:{}, graded:false, last:1};
  saveStore();
  backToQuiz();
  goto(1);
}

/* ============================================================
   年度の選択
   ============================================================ */
function selectExam(id){
  if(laterOpen) closeLaterList();
  exam = EXAMS.find(e=>e.id===id);
  const s = st(exam.id);
  cur = s.last || 1;
  mode = 'quiz';
  localStorage.setItem(KEY + '_last', id);
  document.getElementById('h-title').textContent = exam.label;
  document.getElementById('h-sub').textContent =
    '全50問・目標 ' + exam.pass + '点'
    + (exam.kind === 'image' ? '（問題冊子の画像で出題）' : '');
  document.getElementById('resulthost').innerHTML = '';
  document.getElementById('qhost').style.display = '';
  renderQuestion();
  renderNav();
  updateLaterButtons();
  if(s.graded) showResult();
}

function laterGroupTitle(g){
  if(g.name === '税・その他') return '税法・その他';
  if(g.name === '5点免除科目') return '5問免除問題';
  return g.name;
}
function openLaterList(scope){
  if(!exam) return;
  laterOpen = true;
  document.getElementById('qhost').style.display = 'none';
  document.getElementById('resulthost').style.display = 'none';
  document.getElementById('footbar').style.display = 'none';
  renderLaterList(scope);
  window.scrollTo({top:0, behavior:'smooth'});
}
function closeLaterList(){
  laterOpen = false;
  document.getElementById('laterhost').hidden = true;
  document.getElementById('footbar').style.display = '';
  if(mode === 'result') document.getElementById('resulthost').style.display = '';
  else{
    document.getElementById('qhost').style.display = '';
    renderQuestion();
  }
  renderNav();
}
function renderLaterList(scope){
  const host = document.getElementById('laterhost');
  const expandedGroups = new Set();
  host.querySelectorAll('.later-group[open]').forEach(details=>expandedGroups.add(details.dataset.group));
  const expandedYears = new Set();
  host.querySelectorAll('.later-year[open]').forEach(details=>expandedYears.add(details.dataset.yearKey));
  const selectedExams = scope === 'all' ? EXAMS : [exam];
  const grouped = GROUPS.map(g=>({group:g, items:[]}));
  selectedExams.forEach(e=>{
    laterNumbers(e.id).forEach(n=>{
      const group = groupOf(n);
      const bucket = grouped.find(row=>row.group === group);
      if(bucket) bucket.items.push({exam:e, n:n});
    });
  });
  const total = grouped.reduce((sum,row)=>sum+row.items.length,0);
  host.innerHTML = '';
  host.hidden = false;

  const panel = document.createElement('section');
  panel.className = 'later-panel';
  const head = document.createElement('div');
  head.className = 'later-panel-head';
  const title = document.createElement('div');
  title.className = 'later-panel-title';
  const titleText = document.createElement('b');
  titleText.textContent = scope === 'all' ? '全模試の「あとで解く」' : exam.label + 'の「あとで解く」';
  const subtitle = document.createElement('span');
  subtitle.textContent = total + '問 · ' + (scope === 'all' ? '分野・模試ごとに開閉できます' : '分野ごとに表示') + ' · 問題を押すとその問題へ移動します';
  title.appendChild(titleText);
  title.appendChild(subtitle);
  const close = document.createElement('button');
  close.type = 'button';
  close.className = 'later-close';
  close.textContent = '問題に戻る';
  close.onclick = closeLaterList;
  head.appendChild(title);
  head.appendChild(close);
  panel.appendChild(head);

  if(!total){
    const empty = document.createElement('div');
    empty.className = 'later-empty';
    empty.textContent = 'まだ保存した問題はありません。問題の「あとで解く」にチェックすると、ここに表示されます。';
    panel.appendChild(empty);
  }

  grouped.forEach(row=>{
    const details = document.createElement('details');
    details.className = 'later-group';
    details.dataset.group = row.group.name;
    details.open = (scope === 'year' && row.items.length > 0) || expandedGroups.has(row.group.name);
    const summary = document.createElement('summary');
    summary.textContent = laterGroupTitle(row.group) + '（' + row.items.length + '問）';
    details.appendChild(summary);
    if(row.items.length){
      const body = document.createElement('div');
      body.className = 'later-group-body';
      const appendItems = (container, items)=>items.forEach(item=>{
        const rowEl = document.createElement('div');
        rowEl.className = 'later-row';
        const open = document.createElement('button');
        open.type = 'button';
        open.className = 'later-openq';
        const label = document.createElement('b');
        label.textContent = (scope === 'all' ? item.exam.label + ' · ' : '') + '問 ' + item.n;
        const snippet = document.createElement('span');
        const q = item.exam.qs[item.n - 1];
        const stem = q.stem || '問題冊子の写真で表示される問題です。';
        snippet.textContent = stem.length > 240 ? stem.slice(0, 240) + '…' : stem;
        open.appendChild(label);
        open.appendChild(snippet);
        open.onclick = ()=>openLaterQuestion(item.exam.id, item.n);

        const toggle = document.createElement('label');
        toggle.className = 'latercheck on';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = true;
        input.setAttribute('aria-label', 'あとで解く一覧から外す');
        input.onchange = ()=>{
          setLater(item.exam.id, item.n, false);
          renderLaterList(scope);
        };
        const toggleText = document.createElement('span');
        toggleText.textContent = '保存中';
        toggle.appendChild(input);
        toggle.appendChild(toggleText);
        rowEl.appendChild(open);
        rowEl.appendChild(toggle);
        container.appendChild(rowEl);
      });
      if(scope === 'all'){
        selectedExams.forEach(e=>{
          const items = row.items.filter(item=>item.exam.id === e.id);
          if(!items.length) return;
          const yearDetails = document.createElement('details');
          yearDetails.className = 'later-year';
          yearDetails.dataset.yearKey = row.group.name + ':' + e.id;
          yearDetails.open = expandedYears.has(yearDetails.dataset.yearKey);
          const yearSummary = document.createElement('summary');
          yearSummary.textContent = e.label + '（' + items.length + '問）';
          yearDetails.appendChild(yearSummary);
          const yearBody = document.createElement('div');
          yearBody.className = 'later-year-body';
          appendItems(yearBody, items);
          yearDetails.appendChild(yearBody);
          body.appendChild(yearDetails);
        });
      }else{
        appendItems(body, row.items);
      }
      details.appendChild(body);
    }
    panel.appendChild(details);
  });

  host.appendChild(panel);
}
function openLaterQuestion(examId, n){
  closeLaterList();
  if(!exam || exam.id !== examId) selectExam(examId);
  if(mode === 'result') backToQuiz();
  goto(n);
}

});

/* 「moshi.html#M1-41」のように開かれたら、その年度のその問題を表示する
   （宅建業法ページの「この論点が出た過去問」から飛んできたとき） */
function openFromHash(){
  const m = /^#(\w+)-(\d+)$/.exec(location.hash);
  if(!m || !EXAMS.find(e=>e.id===m[1])) return false;
  const n = Number(m[2]);
  if(n < 1 || n > 50) return false;
  selectExam(m[1]);
  if(mode === 'result') backToQuiz();
  goto(n);
  return true;
}
window.addEventListener('hashchange', openFromHash);

const last = localStorage.getItem(KEY + '_last');
if(!openFromHash()) selectExam(EXAMS.find(e=>e.id===last) ? last : EXAMS[0].id);
