<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宅建 模試1</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#fff; --ink:#2b2620; --sub:#7a7268; --line:#e6e0d6;
    --accent:#c1440e; --good:#2f8f4e; --bad:#c73e3e; --miss:#c98a1a;
    --ken:#5f4b8b; --hou:#3f7d46; --zei:#8a6d1f; --gyo:#a5432a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,"Segoe UI",Meiryo,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:78px;
  }
  button{font-family:inherit;}
  header{
    position:sticky;top:0;z-index:40;background:linear-gradient(135deg,#2b2620,#463a2c);
    color:#f6f3ee;display:flex;align-items:center;gap:10px;padding:9px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .homebtn{
    width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    text-decoration:none;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);
    color:#f6f3ee;border-radius:10px;font-size:1.05rem;
  }
  .htitle{flex:1 1 auto;min-width:0;}
  .htitle b{display:block;font-size:.92rem;line-height:1.25;}
  .htitle span{display:block;font-size:.7rem;color:#cfc4b0;}
  .hcount{font-size:.72rem;color:#cfc4b0;text-align:right;white-space:nowrap;}
  .hcount b{color:#fff;font-size:.92rem;}
  .wrap{max-width:820px;margin:0 auto;padding:12px;}
  .navwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;}
  .progline{display:flex;justify-content:space-between;font-size:.7rem;color:var(--sub);margin-bottom:7px;}
  .progbar{height:6px;background:#eee7dc;border-radius:99px;overflow:hidden;margin-bottom:9px;}
  .progbar div{height:100%;background:var(--accent);width:0;transition:width .25s;}
  .navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
  .navcell{
    aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:6px;
    font-size:.66rem;color:var(--sub);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
  }
  .navcell.done{background:#e9f1ea;border-color:#9dc4a6;color:#2f6b41;font-weight:700;}
  .navcell.flag{box-shadow:inset 0 -3px 0 var(--miss);}
  .navcell.cur{outline:2px solid var(--accent);outline-offset:1px;}
  .navcell.ok{background:#dff0e4;border-color:var(--good);color:#1e5c33;font-weight:700;}
  .navcell.ng{background:#fbe3e3;border-color:var(--bad);color:#8c2a2a;font-weight:700;}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 18px;}
  .qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .qnum{font-size:1.05rem;font-weight:800;}
  .qtag{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;background:#efe9df;color:var(--sub);}
  .flagbtn{
    margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:5px 11px;font-size:.72rem;color:var(--sub);cursor:pointer;
  }
  .flagbtn.on{background:#fdf3e0;border-color:var(--miss);color:var(--miss);}
  .imgbox{margin-bottom:12px;}
  .imgbox img{width:100%;height:auto;display:block;margin-bottom:6px;border-radius:6px;}
  .imgbox.zoom{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px dashed var(--line);border-radius:8px;padding:4px;}
  .imgbox.zoom img{width:auto;max-width:none;}
  .zoombtn{
    border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;
    font-size:.72rem;color:var(--sub);cursor:pointer;margin-bottom:8px;
  }
  .zoombtn.on{background:#fdeee7;border-color:var(--accent);color:var(--accent);}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice{
    display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid var(--line);
    background:#fff;border-radius:10px;padding:10px 13px;cursor:pointer;color:var(--ink);font-size:.9rem;
  }
  .choice:hover{border-color:var(--accent);}
  .choice .cn{
    flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;
    color:var(--sub);background:#fbf8f3;
  }
  .choice.sel{background:#fdeee7;border-color:var(--accent);}
  .choice.sel .cn{background:var(--accent);border-color:var(--accent);color:#fff;}
  .choice.correct{background:#e9f6ec;border-color:var(--good);}
  .choice.correct .cn{background:var(--good);border-color:var(--good);color:#fff;}
  .choice.wrong{background:#fbeaea;border-color:var(--bad);}
  .choice.wrong .cn{background:var(--bad);border-color:var(--bad);color:#fff;}
  .graded .choice{cursor:default;}
  .judge{margin-top:14px;padding:11px 13px;border-radius:9px;font-size:.85rem;font-weight:700;display:none;}
  .judge.show{display:block;}
  .judge.ok{background:#e9f6ec;color:#1e5c33;}
  .judge.ng{background:#fbeaea;color:#8c2a2a;}
  .checkbtn{
    margin-top:14px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--accent);
    background:#fff;color:var(--accent);font-size:.88rem;font-weight:700;cursor:pointer;
  }
  .checkbtn:hover:not(:disabled){background:#fdeee7;}
  .checkbtn:disabled{border-color:var(--line);color:var(--sub);background:#faf8f5;cursor:not-allowed;}
  .checkbtn.done{border-color:var(--line);color:var(--sub);font-weight:600;}
  .srcline{margin-top:14px;font-size:.7rem;color:var(--sub);}
  .footbar{
    position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(253,252,250,.97);
    border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 12px;max-width:820px;
    margin:0 auto;box-shadow:0 -2px 10px rgba(0,0,0,.06);
  }
  .footbar button{
    flex:1 1 0;border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:12px;font-size:.85rem;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .footbar button:disabled{opacity:.4;cursor:not-allowed;}
  .footbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1.3 1 0;}
  .result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px 22px;}
  .scorebig{text-align:center;padding:6px 0 14px;}
  .scorebig .n{font-size:3rem;font-weight:800;line-height:1;}
  .scorebig .d{font-size:1rem;color:var(--sub);}
  .verdict{display:inline-block;margin-top:10px;padding:6px 18px;border-radius:99px;font-size:.85rem;font-weight:700;}
  .verdict.pass{background:#dff0e4;color:#1e5c33;}
  .verdict.fail{background:#fbe3e3;color:#8c2a2a;}
  .grow{margin-bottom:11px;}
  .grow .gl{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px;}
  .gbar{height:9px;background:#eee7dc;border-radius:99px;overflow:hidden;}
  .gbar div{height:100%;border-radius:99px;}
  .resbtns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .resbtns button{
    flex:1 1 140px;border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:12px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .resbtns button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .resultnote{font-size:.72rem;color:var(--sub);line-height:1.8;margin-top:14px;}
  @media(max-width:600px){.choice{font-size:.87rem;}}
</style>
</head>
<body>
<header>
  <a class="homebtn" href="index.html" aria-label="トップページへ戻る" title="トップページへ戻る">🏠</a>
  <div class="htitle"><b>模試1</b><span>50問・合格基準34点</span></div>
  <div class="hcount"><b id="h-done">0</b>/50</div>
</header>

<main class="wrap">
  <section class="navwrap" aria-label="問題番号と進み具合">
    <div class="progline"><span id="prog-text">0 / 50 問 回答済み</span><span id="prog-flag"></span></div>
    <div class="progbar"><div id="progfill"></div></div>
    <div class="navgrid" id="navgrid"></div>
  </section>
  <div id="qhost"></div>
  <div id="resulthost"></div>
</main>

<div class="footbar" id="footbar">
  <button id="btn-prev" type="button">← 前の問題</button>
  <button class="primary" id="btn-grade" type="button">採点する</button>
  <button id="btn-next" type="button">次の問題 →</button>
</div>

<script>
'use strict';
const STORAGE_KEY = 'takken_moshi1_v1';
const PASS_SCORE = 34;
const ANSWERS = [
  3,1,4,1,3,4,2,3,1,2,4,1,2,4,3,4,2,3,1,4,2,1,3,1,4,
  4,2,1,3,3,3,2,2,3,2,1,3,1,1,2,4,1,4,4,4,2,2,1,3,4
];
const GROUPS = [
  {name:'権利関係',from:1,to:14,color:'var(--ken)',goal:7},
  {name:'法令上の制限',from:15,to:22,color:'var(--hou)',goal:6},
  {name:'宅建業法',from:26,to:45,color:'var(--gyo)',goal:15},
  {name:'税・その他',from:23,to:25,color:'var(--zei)',goal:6},
  {name:'税・その他',from:46,to:50,color:'var(--zei)',goal:6}
];

function freshState(){return {answers:{},flags:{},checked:{},graded:false,last:1,zoom:false};}
let state=freshState();
let current=1;
let mode='quiz';

function loadState(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(saved && typeof saved==='object' && !Array.isArray(saved)){
      state={...freshState(),...saved};
      if(!state.answers || typeof state.answers!=='object' || Array.isArray(state.answers)) state.answers={};
      if(!state.flags || typeof state.flags!=='object' || Array.isArray(state.flags)) state.flags={};
      if(!state.checked || typeof state.checked!=='object' || Array.isArray(state.checked)) state.checked={};
      state.graded=!!state.graded;
      state.zoom=!!state.zoom;
      state.last=Number.isInteger(Number(state.last)) ? Math.min(50,Math.max(1,Number(state.last))) : 1;
    }
  }catch(e){}
}
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
}
function groupFor(n){return GROUPS.find(g=>n>=g.from && n<=g.to);}
function accepted(n){return ANSWERS[n-1];}
function answerCount(){
  return Object.keys(state.answers).filter(n=>Number(n)>=1 && Number(n)<=50 && [1,2,3,4].includes(Number(state.answers[n]))).length;
}
function flagCount(){return Object.keys(state.flags).filter(n=>state.flags[n]).length;}

function buildNav(){
  const grid=document.getElementById('navgrid');
  grid.innerHTML='';
  for(let n=1;n<=50;n++){
    const b=document.createElement('button');
    b.type='button';b.className='navcell';b.textContent=n;b.id='nav'+n;
    b.setAttribute('aria-label','問'+n+'へ移動');
    b.onclick=()=>{if(mode==='result') backToQuiz();goto(n);};
    grid.appendChild(b);
  }
}

function renderQuestion(){
  const host=document.getElementById('qhost');
  const picked=Number(state.answers[current])||0;
  const revealed=state.graded||!!state.checked[current];
  const group=groupFor(current);
  host.innerHTML='';
  const card=document.createElement('section');
  card.className='qcard'+(revealed?' graded':'');

  const meta=document.createElement('div');meta.className='qmeta';
  const num=document.createElement('span');num.className='qnum';num.textContent='問 '+current;meta.appendChild(num);
  const tag=document.createElement('span');tag.className='qtag';tag.style.color=group.color;tag.textContent=group.name;meta.appendChild(tag);
  const flag=document.createElement('button');flag.type='button';
  flag.className='flagbtn'+(state.flags[current]?' on':'');
  flag.textContent=state.flags[current]?'△ 見直す':'△ 見直し';
  flag.setAttribute('aria-pressed',state.flags[current]?'true':'false');
  flag.onclick=()=>{if(state.flags[current]) delete state.flags[current];else state.flags[current]=1;saveState();renderQuestion();renderNav();};
  meta.appendChild(flag);card.appendChild(meta);

  const zoom=document.createElement('button');zoom.type='button';
  zoom.className='zoombtn'+(state.zoom?' on':'');
  zoom.textContent=state.zoom?'拡大中（横スクロール）｜画面に合わせる':'⤢ 文字を大きく';
  zoom.onclick=()=>{state.zoom=!state.zoom;saveState();renderQuestion();};
  card.appendChild(zoom);

  const box=document.createElement('div');box.className='imgbox'+(state.zoom?' zoom':'');
  const img=document.createElement('img');
  img.src='moshi/q/q'+String(current).padStart(2,'0')+'.jpg';
  img.alt='模試1 問'+current+'の問題文と選択肢';img.loading='lazy';
  box.appendChild(img);card.appendChild(box);

  const choices=document.createElement('div');choices.className='choices';
  for(let v=1;v<=4;v++){
    const b=document.createElement('button');b.type='button';
    let cls='choice';
    if(revealed){
      if(v===accepted(current)) cls+=' correct';
      if(picked===v && picked!==accepted(current)) cls+=' wrong';
    }else if(picked===v){cls+=' sel';}
    b.className=cls;b.setAttribute('aria-pressed',picked===v?'true':'false');
    b.innerHTML='<span class="cn">'+v+'</span>';
    b.onclick=()=>choose(v);choices.appendChild(b);
  }
  card.appendChild(choices);

  if(revealed){
    const ok=picked===accepted(current);
    const judge=document.createElement('div');
    judge.className='judge show '+(ok?'ok':'ng');
    judge.textContent=picked ? (ok?'正解！':'不正解。')+' 正解は '+accepted(current) : '未回答でした。正解は '+accepted(current);
    card.appendChild(judge);
  }

  if(!state.graded){
    const check=document.createElement('button');check.type='button';
    if(revealed){check.className='checkbtn done';check.textContent='この問題をもう一度解く';check.onclick=uncheckOne;}
    else{
      check.className='checkbtn';check.textContent=picked?'答え合わせ':'答えを選ぶと確認できます';
      check.disabled=!picked;check.onclick=checkOne;
    }
    card.appendChild(check);
  }
  const source=document.createElement('div');source.className='srcline';source.textContent='出典：模試1 問題冊子（受け取った写真から表示）';card.appendChild(source);
  host.appendChild(card);

  document.getElementById('btn-prev').disabled=current===1;
  document.getElementById('btn-next').disabled=current===50;
}

function choose(value){
  if(state.graded||state.checked[current]) return;
  if(Number(state.answers[current])===value) delete state.answers[current];
  else state.answers[current]=value;
  saveState();renderQuestion();renderNav();
}
function checkOne(){
  if(state.graded||state.checked[current]||!state.answers[current]) return;
  state.checked[current]=1;saveState();renderQuestion();renderNav();
}
function uncheckOne(){delete state.checked[current];saveState();renderQuestion();renderNav();}
function goto(n){
  current=Math.min(50,Math.max(1,n));state.last=current;saveState();
  renderQuestion();renderNav();window.scrollTo({top:0,behavior:'smooth'});
}

function renderNav(){
  const done=answerCount(),flags=flagCount();
  document.getElementById('h-done').textContent=done;
  document.getElementById('prog-text').textContent=done+' / 50 問 回答済み';
  document.getElementById('prog-flag').textContent=flags?'見直し '+flags+' 問':'';
  document.getElementById('progfill').style.width=(done/50*100)+'%';
  document.getElementById('btn-grade').textContent=state.graded?'結果を見る':'採点する';
  for(let n=1;n<=50;n++){
    const cell=document.getElementById('nav'+n);const picked=Number(state.answers[n])||0;
    let cls='navcell';
    if(state.graded||state.checked[n]) cls+=picked===accepted(n)?' ok':' ng';
    else if(picked) cls+=' done';
    if(state.flags[n]) cls+=' flag';
    if(n===current && mode==='quiz') cls+=' cur';
    cell.className=cls;
  }
}

function score(){
  let total=0;const per={};const wrong=[];
  GROUPS.forEach(g=>{
    if(!per[g.name]) per[g.name]={ok:0,total:0,goal:g.goal};
    per[g.name].total+=g.to-g.from+1;
  });
  for(let n=1;n<=50;n++){
    const ok=Number(state.answers[n])===accepted(n);
    const g=groupFor(n);
    if(ok){total++;per[g.name].ok++;}else wrong.push(n);
  }
  return {total,per,wrong};
}
function grade(){
  if(!state.graded){
    const unanswered=50-answerCount();
    if(unanswered && !confirm('未回答が '+unanswered+' 問あります。このまま採点しますか？')) return;
    state.graded=true;saveState();
  }
  showResult();
}
function showResult(){
  mode='result';
  const r=score(),passed=r.total>=PASS_SCORE,host=document.getElementById('resulthost');
  document.getElementById('qhost').style.display='none';
  const section=document.createElement('section');section.className='result';
  section.innerHTML='<div class="scorebig"><div><span class="n" style="color:'+(passed?'var(--good)':'var(--bad)')+'">'+r.total+'</span><span class="d"> / 50点</span></div><div class="verdict '+(passed?'pass':'fail')+'">'+(passed?'合格基準点に到達':'あと '+(PASS_SCORE-r.total)+' 点</div><div style="font-size:.75rem;color:var(--sub);margin-top:8px">模試1　合格基準点 '+PASS_SCORE+'点</div></div>';
  GROUPS.filter((g,i,a)=>a.findIndex(x=>x.name===g.name)===i).forEach(g=>{
    const p=r.per[g.name],pct=Math.round(p.ok/p.total*100);
    const row=document.createElement('div');row.className='grow';
    const label=document.createElement('div');label.className='gl';
    const left=document.createElement('span');left.textContent=g.name+'（目標 '+p.goal+'点）';
    const right=document.createElement('b');right.textContent=p.ok+' / '+p.total+'（'+pct+'%）';
    label.append(left,right);
    const bar=document.createElement('div');bar.className='gbar';
    const fill=document.createElement('div');fill.style.width=pct+'%';fill.style.background=g.color;bar.appendChild(fill);
    row.append(label,bar);section.appendChild(row);
  });
  if(r.wrong.length){
    const title=document.createElement('div');title.style.cssText='margin-top:16px;font-size:.8rem;font-weight:700';
    title.textContent='間違えた問題（タップでその問題へ）';section.appendChild(title);
    const nums=document.createElement('div');nums.className='navgrid';nums.style.marginTop='8px';
    r.wrong.forEach(n=>{
      const b=document.createElement('button');b.type='button';b.className='navcell ng';b.textContent=n;
      b.onclick=()=>jumpFromResult(n);nums.appendChild(b);
    });
    section.appendChild(nums);
  }
  const note=document.createElement('p');note.className='resultnote';
  note.textContent='模試1の出題分野別の内訳です。解答と見直し印はこの端末のブラウザに保存されます。';section.appendChild(note);
  const actions=document.createElement('div');actions.className='resbtns';
  actions.innerHTML='<button class="primary" id="review-wrong">間違いを見直す</button><button id="back-quiz">問題に戻る</button><button id="reset-moshi">模試1をやり直す</button>';
  section.appendChild(actions);host.innerHTML='';host.appendChild(section);
  document.getElementById('review-wrong').onclick=reviewWrong;
  document.getElementById('back-quiz').onclick=backToQuiz;
  document.getElementById('reset-moshi').onclick=resetExam;
  document.getElementById('btn-grade').textContent='結果を見る';
  renderNav();
  window.scrollTo({top:0,behavior:'smooth'});
}
function backToQuiz(){
  mode='quiz';document.getElementById('resulthost').innerHTML='';
  document.getElementById('qhost').style.display='';renderQuestion();renderNav();
}
function jumpFromResult(n){backToQuiz();goto(n);}
function reviewWrong(){
  const wrong=score().wrong;
  if(!wrong.length){alert('間違えた問題はありません。');return;}
  jumpFromResult(wrong[0]);
}
function resetExam(){
  if(!confirm('模試1の解答と見直し記録を消して、最初からやり直しますか？')) return;
  state=freshState();current=1;mode='quiz';saveState();
  document.getElementById('resulthost').innerHTML='';document.getElementById('qhost').style.display='';
  renderQuestion();renderNav();window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('btn-prev').onclick=()=>goto(current-1);
document.getElementById('btn-next').onclick=()=>goto(current+1);
document.getElementById('btn-grade').onclick=grade;
loadState();current=state.last;buildNav();renderQuestion();renderNav();
if(state.graded) showResult();
</script>
</body>
</html>
