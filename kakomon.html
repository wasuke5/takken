<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宅建 過去問10年分</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#fff; --ink:#2b2620; --sub:#7a7268; --line:#e6e0d6;
    --accent:#c1440e; --good:#2f8f4e; --bad:#c73e3e; --miss:#c98a1a;
    --ken:#5f4b8b; --hou:#3f7d46; --zei:#8a6d1f; --gyo:#a5432a; --men:#3a6280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,"Segoe UI",Meiryo,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding-bottom:78px;
  }
  button{font-family:inherit;}

  header{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(135deg,#2b2620,#463a2c); color:#f6f3ee;
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .burger{
    width:40px;height:40px;flex:0 0 auto;
    border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08);
    color:#f6f3ee; border-radius:10px; font-size:1.15rem; cursor:pointer;
  }
  .homebtn{
    width:40px;height:40px;flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;text-decoration:none;
    border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08);
    color:#f6f3ee; border-radius:10px; font-size:1.05rem;
  }
  .homebtn:hover{background:rgba(255,255,255,.2);}
  .htitle{flex:1 1 auto;min-width:0;}
  .htitle b{display:block;font-size:.92rem;line-height:1.25;}
  .htitle span{display:block;font-size:.7rem;color:#cfc4b0;}
  .hcount{font-size:.72rem;color:#cfc4b0;text-align:right;white-space:nowrap;}
  .hcount b{color:#fff;font-size:.92rem;}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:50;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:min(330px,86vw);
    background:var(--card);z-index:60;transform:translateX(-100%);
    transition:transform .22s ease;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,.2);
  }
  .drawer.on{transform:translateX(0);}
  .drawer h2{
    margin:0;padding:15px 16px 11px;font-size:.92rem;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .drawer h2 button{border:none;background:transparent;color:var(--sub);font-size:1.3rem;cursor:pointer;}
  .yearlist{padding:8px;}
  .yearbtn{
    display:block;width:100%;text-align:left;border:1px solid var(--line);
    background:#fdfcfa;border-radius:10px;padding:10px 12px;margin-bottom:6px;
    cursor:pointer;color:var(--ink);
  }
  .yearbtn:hover{border-color:var(--accent);}
  .yearbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .yearbtn .yl{font-size:.86rem;font-weight:700;display:block;}
  .yearbtn .ys{font-size:.68rem;color:var(--sub);display:block;margin-top:2px;}
  .yearbtn.on .ys{color:#f3d9cd;}
  .drawer .note{font-size:.68rem;color:var(--sub);padding:6px 16px 20px;line-height:1.7;}

  .wrap{max-width:820px;margin:0 auto;padding:12px;}

  /* 問題番号のマス目 */
  .navwrap{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px;margin-bottom:12px;
  }
  .navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
  .navcell{
    aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:6px;
    font-size:.66rem;color:var(--sub);cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;
  }
  .navcell.done{background:#e9f1ea;border-color:#9dc4a6;color:#2f6b41;font-weight:700;}
  .navcell.flag{box-shadow:inset 0 -3px 0 var(--miss);}
  .navcell.cur{outline:2px solid var(--accent);outline-offset:1px;}
  .navcell.ok{background:#dff0e4;border-color:var(--good);color:#1e5c33;font-weight:700;}
  .navcell.ng{background:#fbe3e3;border-color:var(--bad);color:#8c2a2a;font-weight:700;}
  .progline{display:flex;justify-content:space-between;font-size:.7rem;color:var(--sub);margin-bottom:7px;}
  .progbar{height:6px;background:#eee7dc;border-radius:99px;overflow:hidden;margin-bottom:9px;}
  .progbar div{height:100%;background:var(--accent);width:0;transition:width .25s;}

  /* 問題カード */
  .qcard{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 16px 18px;
  }
  .qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .qnum{font-size:1.05rem;font-weight:800;}
  .qtag{
    font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;
    background:#efe9df;color:var(--sub);
  }
  .flagbtn{
    margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:5px 11px;font-size:.72rem;color:var(--sub);cursor:pointer;
  }
  .flagbtn.on{background:#fdf3e0;border-color:var(--miss);color:var(--miss);}
  .stem{font-size:.95rem;line-height:1.85;margin:0 0 16px;white-space:pre-wrap;}
  .ocrwarn{
    font-size:.7rem;color:#8a6d1f;background:#fdf7ec;border-left:3px solid var(--miss);
    padding:7px 10px;border-radius:6px;margin:0 0 12px;line-height:1.6;
  }
  .items{margin:0 0 16px;display:flex;flex-direction:column;gap:10px;}
  .item{display:flex;gap:9px;font-size:.93rem;line-height:1.8;}
  .item .im{
    flex:0 0 auto;width:1.8em;height:1.8em;border-radius:6px;
    background:#efe9df;color:#6b6055;font-weight:700;font-size:.82rem;
    display:flex;align-items:center;justify-content:center;margin-top:.15em;
  }
  .item .it{flex:1 1 auto;min-width:0;}
  .imgbox{margin-bottom:12px;}
  .imgbox img{width:100%;height:auto;display:block;margin-bottom:6px;border-radius:6px;}
  .imgbox.zoom{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px dashed var(--line);border-radius:8px;padding:4px;}
  .imgbox.zoom img{width:auto;max-width:none;}
  .zoombtn{
    border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:5px 11px;font-size:.72rem;color:var(--sub);cursor:pointer;margin-bottom:8px;
  }
  .zoombtn.on{background:#fdeee7;border-color:var(--accent);color:var(--accent);}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice{
    display:flex;gap:10px;text-align:left;width:100%;
    border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:12px 13px;cursor:pointer;color:var(--ink);
    font-size:.9rem;line-height:1.75;
  }
  .choice:hover{border-color:var(--accent);}
  .choice .cn{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:.8rem;font-weight:700;color:var(--sub);background:#fbf8f3;
  }
  .choice .ct{flex:1 1 auto;min-width:0;}
  .choice.sel{background:#fdeee7;border-color:var(--accent);}
  .choice.sel .cn{background:var(--accent);border-color:var(--accent);color:#fff;}
  .choice.correct{background:#e9f6ec;border-color:var(--good);}
  .choice.correct .cn{background:var(--good);border-color:var(--good);color:#fff;}
  .choice.wrong{background:#fbeaea;border-color:var(--bad);}
  .choice.wrong .cn{background:var(--bad);border-color:var(--bad);color:#fff;}
  .graded .choice{cursor:default;}
  .judge{margin-top:14px;padding:11px 13px;border-radius:9px;font-size:.85rem;font-weight:700;display:none;}
  .judge.show{display:block;}
  .judge.ok{background:#e9f6ec;color:#1e5c33;}
  .judge.ng{background:#fbeaea;color:#8c2a2a;}
  .checkbtn{
    margin-top:14px;width:100%;padding:12px;border-radius:10px;
    border:1px solid var(--accent);background:#fff;color:var(--accent);
    font-size:.88rem;font-weight:700;cursor:pointer;
  }
  .checkbtn:hover:not(:disabled){background:#fdeee7;}
  .checkbtn:disabled{border-color:var(--line);color:var(--sub);background:#faf8f5;cursor:not-allowed;}
  .checkbtn.done{border-color:var(--line);color:var(--sub);font-weight:600;}
  .srcline{margin-top:14px;font-size:.7rem;color:var(--sub);}
  .srcline a{color:var(--accent);}

  /* 下部の移動バー */
  .footbar{
    position:fixed;left:0;right:0;bottom:0;z-index:35;
    background:rgba(253,252,250,.97);border-top:1px solid var(--line);
    display:flex;gap:8px;padding:10px 12px;
    max-width:820px;margin:0 auto;
    box-shadow:0 -2px 10px rgba(0,0,0,.06);
  }
  .footbar button{
    flex:1 1 0;border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:12px;font-size:.85rem;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .footbar button:disabled{opacity:.4;cursor:not-allowed;}
  .footbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1.3 1 0;}

  /* 結果 */
  .result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px 22px;}
  .scorebig{text-align:center;padding:6px 0 14px;}
  .scorebig .n{font-size:3rem;font-weight:800;line-height:1;}
  .scorebig .d{font-size:1rem;color:var(--sub);}
  .verdict{display:inline-block;margin-top:10px;padding:6px 18px;border-radius:99px;font-size:.85rem;font-weight:700;}
  .verdict.pass{background:#dff0e4;color:#1e5c33;}
  .verdict.fail{background:#fbe3e3;color:#8c2a2a;}
  .grow{margin-bottom:11px;}
  .grow .gl{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px;}
  .gbar{height:9px;background:#eee7dc;border-radius:99px;overflow:hidden;}
  .gbar div{height:100%;border-radius:99px;}
  .resbtns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .resbtns button{
    flex:1 1 140px;border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:12px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .resbtns button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .hint{font-size:.72rem;color:var(--sub);line-height:1.8;margin-top:14px;}
  @media(max-width:600px){
    .stem{font-size:.92rem;}
    .choice{font-size:.87rem;}
  }
</style>
</head>
<body>
<header>
  <a class="homebtn" href="index.html" aria-label="トップページへ戻る" title="トップページへ戻る">🏠</a>
  <button class="burger" id="burger" aria-label="年度を選ぶ">☰</button>
  <div class="htitle"><b id="h-title">—</b><span id="h-sub"></span></div>
  <div class="hcount"><b id="h-done">0</b>/50</div>
</header>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer">
  <h2>年度を選ぶ<button id="drawerclose" aria-label="閉じる">×</button></h2>
  <div class="yearlist" id="yearlist"></div>
  <p class="note" id="drawernote"></p>
</nav>

<div class="wrap">
  <div class="navwrap">
    <div class="progline"><span id="prog-text">0 / 50 問 回答済み</span><span id="prog-flag"></span></div>
    <div class="progbar"><div id="progfill"></div></div>
    <div class="navgrid" id="navgrid"></div>
  </div>
  <div id="qhost"></div>
  <div id="resulthost"></div>
</div>

<div class="footbar" id="footbar">
  <button id="btn-prev">← 前の問題</button>
  <button id="btn-grade" class="primary">採点する</button>
  <button id="btn-next">次の問題 →</button>
</div>

<script>
const EXAMS = [
  {id:"R7", label:"令和7年度（2025）", file:"pdf/R7.pdf", pass:33, kind:"text",
   ans:[[3], [3], [3], [4], [4], [1], [1], [2], [1], [3], [3], [3], [3], [1], [4], [4], [2], [2], [2], [4], [4], [4], [1], [2], [1], [4], [1], [2], [2], [3], [4], [2], [3], [3], [1], [4], [4], [3], [4], [3], [1], [2], [4], [2], [4], [2], [3], [2], [1], [1]],
   qs:[{"stem": "所有者ＡがＢに甲土地を売却し、その後にＢがＣに甲土地を売却した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、この問において、Ｃは背信的悪意者ではないものとする。", "ch": ["甲土地の所有権登記がＡの名義のままであったとしても、Ｂは、Ｃに甲土地を売却した後は、Ａに対して自己に甲土地の所有権移転登記をするよう請求することはできない。", "Ｃは、甲土地の所有権移転登記を備えなければ、Ａに対して自己が所有者であることを主張することができない。", "ＡＢ間の売買契約が、ＢＣ間の売買契約締結よりも前にＡにより解除されていた場合、又は、ＢＣ間の売買契約締結後にＡにより解除された場合のいずれの場合であっても、Ｃは、甲土地の所有権移転登記を備えれば、Ａに対して自己の所有権を主張することができる。", "ＡＢ間の売買契約が、ＢＣ間の売買契約よりも前にＢの強迫を理由として取り消されていた場合、又は、ＢＣ間の売買契約締結後にＢの強迫を理由として取り消された場合のいずれの場合であっても、Ｃは、Ｂの強迫につき善意でかつ過失がなければ、Ａに対して自己の所有権を主張することができる。"], "page": 2}, {"stem": "個人であるＡが、①賃貸人Ｂと賃借人Ｃとの間の期間を 2 年とする居住用甲建物の賃貸借契約に基づくＣの一切の債務の連帯保証契約をＢと締結した場合、②売主Ｄと買主Ｅとの間の居住用乙建物の売買契約に基づく代金支払債務の保証契約をＤと締結した場合、に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["①の連帯保証契約は書面によってしなければ無効であるのに対し、②の保証契約は書面によらず、口頭で契約を締結しても有効である。", "①のＢがＡに対して連帯保証債務の履行を請求してきた場合には、ＡはまずＣに請求するように主張できるのに対し、②のＤがＡに対して保証債務の履行を請求してきた場合には、ＡはまずＥに請求するように主張することはできない。", "①の連帯保証契約は保証の限度額である極度額を定めなければ無効であるのに対し、②の保証契約は極度額を定める必要はない。", "①も②もＡが主たる債務者Ｃ及びＥの委託を受けて保証した場合において、Ａが債権者Ｂ及びＤに対して主たる債務の履行状況に関する情報を提供するよう請求したときは、①のＢは、これらの情報を、遅滞なく、Ａに提供しなければならないのに対し、②のＤは、守秘義務を理由にこれらの情報の提供を拒否することができる。"], "page": 2}, {"stem": "意思表示に関する次の記述のうち、民法の規定によれば、誤っているものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 3, "items": [{"m": "ア", "t": "表意者が真意でないことを知ってした意思表示は無効であるが、相手方がその意思表示が表意者の真意ではないことを知らなければ、知らないことにつき過失があっても、当該意思表示は有効となる。"}, {"m": "イ", "t": "相手方と通じてした虚偽の意思表示は無効であり、第三者がその虚偽表示につき善意であっても、過失があれば、当該第三者にその無効を対抗することができる。"}, {"m": "ウ", "t": "意思表示は、当該意思表示に対応する意思を欠く錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、無効であるが、その錯誤につき善意でかつ過失がない第三者には、その無効を対抗することができない。"}, {"m": "エ", "t": "詐欺による意思表示は取り消すことができるが、その詐欺につき善意でかつ過失がない取消し前の第三者には、その取消しを対抗することができない。"}]}, {"stem": "ＡがＢから弁済の期限の定めなく金 1,000 万円を借り入れる金銭消費貸借契約（以下この問において「本件契約」という。）における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["Ａは、本件契約におけるＡの債務を担保するために、Ａが所有する不動産に対し、Ｂのために、抵当権を設定することはできるが、質権を設定することはできない。", "Ａが本件契約に基づく債務の弁済を怠ったときに、ＢがＡから預かっている動産を占有している場合には、Ｂは当該動産の返還時期が到来しても弁済を受けるまでその動産に関して留置権を行使することができる。", "Ａが本件契約に基づく債務の弁済を怠った場合には、ＢはＡの総財産に対して先取特権を行使することができる。", "Ａが、期限が到来しているＢの悪意による不法行為に基づく金 1,000 万円の損害賠償請求債権をＢに対して有している場合、Ａは本件契約に基づく返還債務をＢに対する当該損害賠償請求債権で相殺することができる。"], "page": 3}, {"stem": "Ａの子がＢであり、Ｂの子がＣであり、ＣがＡの直系卑属である場合において、民法の規定によれば、次のアからエまでの記述のうち、Ａが死亡した際にＣがＢを代襲してＡの相続人となるときを全て掲げたものはどれか。", "ch": ["ア、エ", "イ、ウ", "ア、ウ、エ", "ア、イ、ウ"], "page": 4, "items": [{"m": "ア", "t": "Ａが死亡する以前にＢが死亡したとき"}, {"m": "イ", "t": "Ｂが相続に関するＡの遺言書を偽造して相続権を失ったとき"}, {"m": "ウ", "t": "ＢがＡによって相続人から廃除されて相続権を失ったとき"}, {"m": "エ", "t": "Ｂが相続放棄をしたとき"}]}, {"stem": "Ａが所有している甲土地についての物権変動に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["Ｂが甲土地をＡに無断でＣに売却し、その後、ＢがＡから甲土地を購入した場合、Ｃは、Ｂから甲土地を購入した時点に遡って甲土地の所有権を取得する。", "Ｄが甲土地につき、Ａに無断でＤへの虚偽の所有権の移転の登記をした上で、甲土地をＥに売却してその旨の登記をした場合において、その後、ＡがＦに甲土地を売却したときは、Ｆは、Ｅに対し、甲土地の所有権を主張することができる。", "Ｇが甲土地の所有権を時効取得した場合、Ｇはその後にＡを単独相続したＨに対して、登記を備えていなくても、甲土地の所有権を主張することができる。", "Ａが甲土地上の立木の所有権を留保して甲土地をＪに売却し、その後、ＪがＫに甲土地及びその上の立木を売却した場合には、Ａは、Ｋに対し、立木の所有権の留保につき登記又は明認方法を備えない限り、立木の所有権を主張することができない。"], "page": 4}, {"stem": "Ａは自己の所有する甲建物を事務所としてＢに賃貸し（以下この問において「本件契約」という。）、その後、本件契約の期間中に甲建物の屋根に雨漏りが生じたため、ＣがＢから甲建物の屋根の修理を請け負い、Ｃによる修理が完了した。この場合における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["ＢがＣに修理代金を支払わないまま無資力となり、賃料を滞納して本件契約が解除されたことにより甲建物はＡに明け渡された。この場合、ＣはＡに対して、事務管理に基づいて修理費用相当額の支払を求めることはできない。", "ＢがＣに修理代金を支払ったとしても、本件契約において、Ａの負担に属するとされる甲建物の屋根の修理費用について直ちに償還請求することができる旨の特約がない限り、契約終了時でなければ、ＢはＡに対して償還を求めることはできない。", "ＢがＣに修理代金を支払わない場合、Ｃは、Ｂが占有する甲建物につき、当然に不動産工事の先取特権を行使することができる。", "ＢがＣに修理代金を支払わないまま無資力となり、賃料を滞納して本件契約が解除されたことにより甲建物はＡに明け渡された。本件契約において、ＢがＡに権利金を支払わないことの代償として、甲建物の修理費用をＢの負担とする旨の特約が存し、当該屋根の修理費用と権利金が相応していたときであっても、ＣはＡに対して、不当利得に基づいて修理費用相当額の支払を求めることができる。"], "page": 5}, {"stem": "Ａ、Ｂ及びＣがそれぞれ 3 分の 1 の持分の割合で甲土地を共有している場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、甲土地を分割しない旨の契約は存在しないものとする。", "ch": ["甲土地につき無権利のＤが、自己への虚偽の所有権移転登記をした場合には、Ａは、単独で、Ｄに対し、その所有権移転登記の抹消を求めることができる。", "Ａが甲土地についての自己の持分を放棄した場合には、その持分は国庫に帰属する。", "Ａが死亡し、Ｅ及びＦが相続した場合には、Ｂ及びＣは、Ａの遺産についての遺産分割がされる前であっても、Ｅ及びＦに対して共有物分割の訴えを提起することができる。", "ＡがＢ及びＣに無断で甲土地を占有している場合であっても、Ｂは、Ａに対し、当然には自己に甲土地を明け渡すように求めることができない。"], "page": 5}, {"stem": "連帯債務者の一人について生じた次の事由のうち、民法の規定によれば、他の連帯債務者に対して効力が生じないものとして正しいものはどれか。なお、この問において、連帯債務者の一人について生じた事由が他の連帯債務者に対して効力が生じる旨の別段の意思表示はないものとする。", "ch": ["債権者がした連帯債務者の一人に対する履行の請求", "連帯債務者の一人と債権者との間の混同", "連帯債務者の一人が債権者に対して債権を有する場合において、その連帯債務者がした相殺の援用", "連帯債務者の一人と債権者との間の更改"], "page": 6}, {"stem": "Ａを売主、Ｂを買主とする甲土地の売買契約による甲土地の引渡し後に、目的物の品質に関して契約の内容に適合しない土壌汚染が見つかった場合の売主の担保の責任（以下この問において「契約不適合責任」という。）に基づく損害賠償に関する次の記述のうち、民法の規定、宅地建物取引業法の規定及び判例によれば、誤っているものはどれか。", "ch": ["Ｂは、甲土地の引渡しの日から 11 年が経過した時点で甲土地の土壌汚染を発見し、発見した時点から 1 年以内にＡに通知した。Ａが当該土壌汚染があることを重大な過失なく知らなかった場合、Ａが宅地建物取引業者であるか否かにかかわらず、Ｂは損害賠償を請求することはできない。", "甲土地の引渡しの日から 3 年以内に契約不適合の通知をしなければ売主は契約不適合責任を負わない旨の特約があり、Ｂが引渡しの日から 4 年が経過した時点で土壌汚染を発見して直ちにＡに通知した。Ａが当該土壌汚染があることを重大な過失なく知らなかった場合、Ａが宅地建物取引業者であるか否かにかかわらず、Ｂは損害賠償を請求することはできない。", "甲土地の引渡しの日から 1 年以内に契約不適合の通知をしなければ売主は契約不適合責任を負わない旨の特約があり、Ａは甲土地に土壌汚染があることを売買契約締結時点で知っていて告げていなかった。Ｂが引渡しの日から 3 年が経過した時点で当該土壌汚染を発見して直ちにＡに通知した場合、Ａが宅地建物取引業者であるか否かによって、Ｂが損害賠償を請求できるか否かの結論が異なる。", "売主は契約不適合責任を一切負わない旨の特約があり、Ｂは引渡しの日から 1 年が経過した時点で土壌汚染を発見して直ちにＡに通知した。Ａが当該土壌汚染があることを重大な過失なく知らなかった場合、Ａが宅地建物取引業者であるか否かによって、Ｂが損害賠償を請求できるか否かの結論が異なる。"], "page": 6}, {"stem": "ＡがＢとの間で、Ａ所有の甲土地につき建物の所有を目的として一時使用目的ではない賃貸借契約（以下この問において「本件契約」という。）を締結する場合に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。", "ch": ["甲土地にＢが賃借権の登記をしなくても、Ｂの配偶者であるＣを所有者として登記されている建物が甲土地上に存在する場合には、甲土地がＡからＤに売却されても、ＢはＤに対して甲土地に賃借権を有していることを主張できる。", "本件契約の存続期間が 50 年であり、契約の更新及び建物の築造による存続期間の延長がない旨を定める場合、一定期間地代を減額せず、その期間は地代の減額請求ができない旨の特約を有効に定めることができる。", "本件契約が専らＢの事業の用に供する建物の所有を目的とし、存続期間が 50 年である場合、契約の更新及び建物の築造による存続期間の延長がない旨、並びにＢが借地借家法第13 条の規定による建物の買取りの請求をしない旨の特約を書面で有効に定めることができる。", "本件契約が公正証書によって行われていれば、専らＢの居住の用に供する建物の所有を目的とし、存続期間を 20 年と定めていても、Ａは正当事由があれば、20 年が経過した時点で遅滞なく異議を述べて更新を拒絶することができる。"], "page": 7}, {"stem": "Ａを賃貸人、Ｂを賃借人とする甲建物の賃貸借契約（定期建物賃貸借契約及び一時使用目的の建物の賃貸借契約を除く。以下この問において「本件契約」という。）に関する次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか。", "ch": ["本件契約が期間の定めがないものである場合において、Ａ又はＢから相手方に対して解約の申入れをしたときは、当該申入れの日から 6 か月を経過することによって、本件契約は終了する。", "本件契約が期間を 2 年とするものである場合において、Ａ及びＢのいずれも期間の満了の1 年前から 6 か月前までの間に相手方に対して更新をしない旨の通知をしなかったときは、本件契約は、期間を 2 年として、従前の契約と同一の条件で更新されたものとみなされる。", "ＡＢ間において、造作買取請求権は行使しない旨の特約があった場合、この特約は有効である。", "本件契約が借地借家法第 39 条に規定する取壊し予定の建物の賃貸借であり、甲建物を取り壊すこととなる時に本件契約が終了する旨の特約を定める場合、本件契約は、公正証書によってしなければならない。"], "page": 7}, {"stem": "建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。", "ch": ["共用部分は、原則として区分所有者全員の共有に属するが、規約で別段の定めをすることを妨げず、管理者であっても、規約に特別の定めがあるときは、共用部分を所有することができる。", "共用部分の持分の割合について、各共有者の共用部分の持分は、規約で別段の定めをしない限り、その有する専有部分の床面積の割合による。", "集会の議事については、議長は、書面又は電磁的記録により、議事録を作成しなければならず、当該議事録には議事の経過の要領及びその結果を記載し、又は記録しなければならないとされているが、当該議事録が書面で作成されているときは、議長及び集会に出席した区分所有者全員がこれに署名しなければならない。", "区分所有者が、建物の保存に有害な行為その他建物の管理又は使用に関し区分所有者の共同の利益に反する行為をした場合又はその行為をするおそれがある場合には、他の区分所有者の全員又は管理組合法人は、区分所有者の共同の利益のため、その行為を停止し、その行為の結果を除去し、又はその行為を予防するため必要な措置を執ることを請求することができる。"], "page": 8}, {"stem": "不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。", "ch": ["登記官は、一筆の土地の一部が別の地目となったときであっても、職権でその土地の分筆の登記をすることができない。", "登記事項証明書の交付の請求は、請求情報を電子情報処理組織を使用して登記所に提供する方法によりすることができる。", "権利に関する登記の申請は、法令に別段の定めがある場合を除き、登記権利者及び登記義務者が共同してしなければならない。", "建物の合併の登記は、表題部所有者又は所有権の登記名義人以外の者は、申請することができない。"], "page": 8}, {"stem": "都市計画法に関する次の記述のうち、誤っているものはどれか。", "ch": ["風致地区は、都市の風致を維持するため定める地区であり、当該地区内における建築物の建築について、政令の定める基準に従い、地方公共団体の条例で、都市の風致を維持するため必要な規制をすることができる。", "特定街区は、市街地の整備改善を図るため街区の整備又は造成が行われる地区について、その街区内における建築物の容積率並びに建築物の高さの最高限度及び壁面の位置の制限を定める街区である。", "近隣商業地域は、近隣の住宅地の住民に対する日用品の供給を行うことを主たる内容とする商業その他の業務の利便を増進するため定める地域である。", "生産緑地地区は、農業の利便の増進を図りつつ、これと調和した低層住宅に係る良好な住居の環境を保護するため定める地区である。"], "page": 9}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["市街化調整区域のうち開発許可を受けた開発区域以外の区域において行う、学校教育法に規定する学校の新築については、都道府県知事の許可が不要である。", "開発行為とは、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更をいい、ゴルフコースの建設は開発行為にはあたらない。", "区域区分が定められていない都市計画区域において、商業施設の建築の用に供する目的で行う 4,000 m² の開発行為は都道府県知事の許可が不要である。", "自己の居住の用に供する住宅の建築を目的として行う開発行為以外の開発行為にあっては、原則として開発区域内に建築基準法に規定する災害危険区域内の土地を含んではならない。"], "page": 9}, {"stem": "建築基準法に関する次の記述のうち、誤っているものはどれか。", "ch": ["建築主は、建築確認が必要な建築物を建築しようとする場合は、当該建築物の計画を建築基準法令の規定に適合させるだけでなく、建築基準法令の規定以外の宅地造成及び特定盛土等規制法などの建築基準関係規定にも適合するものであることについて確認を受ける必要がある。", "建築主は、 2 階建ての木造住宅を新築しようとする場合は、当該工事に着手する前に、その計画が建築基準関係規定に適合するものであることについて、確認を受け、確認済証の交付を受ける措置が必要となるが、当該住宅の大規模の修繕をしようとする場合には、当該措置は不要である。", "延べ面積が 1,000 m² を超える木造建築物は、その外壁及び軒裏で延焼のおそれのある部分を防火構造としなければならない。", "高さ 1 m 以下の階段の部分には、手すりを設けなくてもよい。"], "page": 10}, {"stem": "次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["都市再生特別地区内においては、建築物の容積率、建蔽率及び建築面積は当該地区に関する都市計画において定められた内容に適合するものでなければならないが、その高さは法第56 条の高さの制限に関する規定に適合させる必要がある。", "2 階建てかつ床面積 1,000 m² の飲食店は、第一種低層住居専用地域、第二種低層住居専用地域、第一種中高層住居専用地域、工業専用地域及び田園住居地域に建築することができない。", "特定行政庁による認可を受けて公告された建築協定は、その後、当該協定の土地の所有者等の全員で合意したときに限り、その公告のあった日以後において当該建築協定区域内の土地の所有者等となった者に対しても効力が及ぶこととなる。", "建築物のエネルギー消費性能の向上のため必要な外壁等に関する工事を行う場合、公益性が高いことから特定行政庁の許可を受けることなく、法第 52 条の規定による容積率の限度を超えることができる。"], "page": 10}, {"stem": "宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市及び中核市にあってはその長をいうものとし、地方自治法に基づく施行時特例市に係る経過措置については考慮しないものとする。", "ch": ["工事主は、特定盛土等規制区域内において行われる特定盛土等又は土石の堆積に関する政令で定める規模の工事の許可の申請をするときは、あらかじめ、主務省令で定めるところにより、特定盛土等又は土石の堆積に関する工事の施行に係る土地の周辺地域の住民に対し、説明会の開催その他の当該特定盛土等又は土石の堆積に関する工事の内容を周知させるため必要な措置を講じなければならない。", "宅地造成等工事規制区域内の土地の工事主又は工事施行者は、宅地造成等に伴う災害が生じないよう、その土地を常時安全な状態に維持するように努めなければならない。", "都道府県知事は、宅地造成等工事規制区域内の土地について、宅地造成等に伴う災害の防止のために必要があると認める場合においては、その土地の所有者、管理者、占有者、工事主又は工事施行者に対して、擁壁等の設置等の必要な措置をとることを勧告することができる。", "宅地造成等工事規制区域内において行われる宅地造成等に関する工事の許可を受けた工事主は、当該許可に係る土地の見やすい場所に、主務省令で定めるところにより、氏名又は名称その他の主務省令で定める事項を記載した標識を掲げなければならない。"], "page": 11}, {"stem": "土地区画整理法に関する次の記述のうち、誤っているものはどれか。", "ch": ["個人施行者は、その者以外に換地計画に係る区域内の宅地を所有する者（当該宅地の所有権について施行者に対抗することができない者を除く。）がある場合においては、換地計画について認可を申請しようとするときは、これらの者の同意を得なければならない。", "国又は地方公共団体の所有する土地以外であって道路の用に供している土地については、土地区画整理事業の施行により当該道路に代わるべき道路が設置され、その結果、当該道路が廃止される場合等においては、換地計画において、当該土地について換地を定めないことができる。", "従前の宅地の所有者及びその宅地について使用収益権を有する者が、仮換地について使用又は収益を開始することができる日を別に定められたため、従前の宅地について使用し、又は収益することができなくなったことにより損失を受けた場合においては、施行者は、その損失を受けた者に対して、通常生ずべき損失を補償しなければならない。", "仮換地の指定があった日後、土地区画整理事業の施行による施行地区内の土地及び建物の変動に係る登記がされるまでの間は、登記の申請人が確定日付のある書類によりその指定前に登記原因が生じたことを証明した場合を除き、施行地区内の土地及び建物に関しては他の登記をすることができない。"], "page": 12}, {"stem": "農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、誤っているものはどれか。", "ch": ["市街化区域外にある農地の転用の申請に係る事業が住宅の用に供される土地の造成だけを目的としている場合、申請に係る農地の全てを住宅の用に供することが確実と認められないときには、法第 4 条第 1 項又は法第 5 条第 1 項の許可を受けることができない。", "仮設工作物を設置するため、市街化区域外にある農地の所有権を取得しようとする場合には、法第 5 条第 1 項の許可を受けることができない。", "農地の賃貸借は、その登記がなくても、農地の引渡しがあったときは、これをもってその後その農地について所有権を取得した第三者に対抗することができる。", "法人の代表者が、その法人の業務に関し、法第 4 条第 1 項又は法第 5 条第 1 項の規定に違反して農地の転用をした場合には、その代表者が罰せられるほか、その法人も 300 万円以下の罰金刑が科せられる。"], "page": 12}, {"stem": "国土利用計画法第 23 条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["市街化区域内においてＡが所有する面積 3,500 m² の土地について、Ｂが 2,000 m²、Ｃが1,500 m² とそれぞれ分割して購入した場合、Ｂ及びＣはともに事後届出を行わなければならない。", "都市計画区域外においてＤが所有する面積 12,000 m² の土地について、Ｅが担保権の実行による競売を通じて所有権を取得した場合、Ｅは事後届出を行わなければならない。", "Ｆが、自ら所有する市街化調整区域内の 7,000 m² の土地について、宅地建物取引業者Ｇと売買契約を締結した場合には、Ｇは契約を締結した日から 1 か月以内に事後届出を行う必要がある。", "市街化区域内に所在する一団の土地である甲土地（面積 1,200 m²） と乙土地（面積1,300 m²）について、甲土地については売買によって所有権を取得し、乙土地については対価の授受を伴わず賃借権の設定を受けたＨは、事後届出を行う必要はない。"], "page": 13}, {"stem": "土地の売買による所有権の移転登記等に係る登録免許税の税率の軽減措置に関する次の記述のうち、正しいものはどれか。", "ch": ["この税率の軽減措置は、地目が雑種地となっている土地の売買による所有権の移転登記についても適用される。", "この税率の軽減措置の適用対象となる土地は、その価額が 1,000 万円未満のものに限られる。", "この税率の軽減措置は、法人が土地の売買による所有権の移転登記を受ける場合には適用されない。", "この税率の軽減措置の適用対象となる土地は、その面積が 1,000 m² 未満のものに限られる。"], "page": 13}, {"stem": "固定資産税に関する次の記述のうち、正しいものはどれか。", "ch": ["住宅用地のうち小規模住宅用地（200 m² 以下）に対して課する固定資産税の課税標準は、当該小規模住宅用地に係る固定資産税の課税標準となるべき価格の 3 分の 1 の額である。", "市町村長は、納税義務者等の求めに応じ、法令で定めるところにより固定資産課税台帳を閲覧に供しなければならない。ただし、当該部分に記載されている住所が明らかにされることにより人の生命又は身体に危害を及ぼすおそれがある場合、当該住所を削除する等の措置を講じたもの又はその写しを閲覧に供することができる。", "市町村は、土地、家屋又は償却資産に対して課する固定資産税額が、土地にあっては 30万円、家屋にあっては 20 万円、償却資産にあっては 150 万円に満たない場合においては、原則として固定資産税を課することができない。", "固定資産税は、固定資産の所有者として、登記簿又は土地補充課税台帳若しくは家屋補充課税台帳に所有者として登記又は登録されている者に対して課されるため、所有者として登記又は登録されている個人が賦課期日前に死亡している場合、固定資産課税台帳に新たな所有者が登録されていなければ何人に対しても固定資産税を課することはできない。"], "page": 14}, {"stem": "不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。", "ch": ["価格形成要因のうち個別的要因とは、一般経済社会における不動産のあり方及びその価格の水準に影響を与える要因をいい、自然的要因、社会的要因、経済的要因及び行政的要因に大別される。", "収益還元法は、賃貸用不動産又は賃貸以外の事業の用に供する不動産の価格を求める場合に特に有効な手段であり、自用の不動産であっても賃貸を想定することにより適用される。", "原価法における減価修正の方法としては、耐用年数に基づく方法と、観察減価法の 2 つの方法があり、これらは併用するものとする。", "対象建築物に関する工事が完了していない場合でも、当該工事の完了を前提として鑑定評価を行うことがある。"], "page": 14}, {"stem": "宅地建物取引業者Ａ（消費税課税事業者）及び宅地建物取引業者Ｂ（消費税課税事業者）が受領した報酬に関するアからウの記述のうち、宅地建物取引業法の規定によれば、誤っているものを全て掲げたものは 1 から 4 のうちどれか。なお、代理、媒介に当たり、広告の依頼は行われていないものとする。", "ch": ["ア、イ", "イ、ウ", "ア、ウ", "ア、イ、ウ"], "page": 15, "items": [{"m": "ア", "t": "Ａが単独で貸主と借主の双方から店舗用建物の貸借の媒介の依頼を受け、 1 か月の借賃24 万円（消費税等相当額を含まない。）、権利金 1,400 万円（権利設定の対価として支払われるもので、返還されないものをいい、消費税等相当額を含まない。）の賃貸借契約を成立させ、依頼者の双方からそれぞれ 52 万 8,000 円を報酬として受領したことは、宅地建物取引業法に違反する。"}, {"m": "イ", "t": "現に長期間にわたって居住の用、事業の用その他の用途に供されておらず、かつ将来にわたり居住の用、事業の用その他の用途に供される見込みがない宅地（ 1 か月の借賃 5 万円。消費税等相当額を含まない。）について、Ａは貸主から代理を依頼され、Ｂは借主から代理を依頼され、賃貸借契約が成立したので、Ａは貸主から 4 万円を、Ｂは、代理の依頼を受けるに当たって、報酬が借賃の 1.1 か月分を超えることについて借主から承諾を得たうえで、借主から 7 万円を報酬として受領したことは、宅地建物取引業法に違反しない。"}, {"m": "ウ", "t": "Ａは売主から媒介の依頼を、Ｂは買主から媒介の依頼を、それぞれ受けて、代金 200 万円（消費税等相当額を含み、土地代金は 90 万円である。）の土地付建物の売買契約を成立させた場合に、依頼者と宅地建物取引業者との間であらかじめ報酬の額を定めていなかったときは、売主はＡに対して少なくとも 10 万 4,500 円、買主はＢに対して少なくとも 10 万 4,500円を支払わなければならない。"}]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第 35 条に規定する重要事項の説明及び重要事項説明書の交付に関する次の記述のうち、正しいものはどれか。ただし、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["宅地建物取引業者は、区分所有建物の売買の媒介を行う場合に、当該一棟の建物及びその敷地の管理が法人に委託されているときは、その委託を受けている法人の商号又は名称及び主たる事務所の所在地を説明しなければならない。", "宅地建物取引業者は、自身が売主となる場合に、重要事項説明書の交付に当たり、専任の宅地建物取引士をして当該書面に記名させなければならず、また、買主にも当該書面に記名させなければならない。", "宅地建物取引業者は、重要事項を説明する際には、宅地建物取引業者の事務所において行わなければならない。", "宅地建物取引業者は、自身が売主となる場合であっても、買主に対して、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を説明しなければならない。"], "page": 16}, {"stem": "宅地建物取引業者の業務に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "なし"], "page": 16, "items": [{"m": "ア", "t": "自ら売主として販売する宅地又は建物の広告に取引態様の別を明示しなかった場合は、罰則の対象とはならないが監督処分の対象となり、宅地又は建物の規模について著しく事実に相違する表示をした場合は、罰則の対象にも監督処分の対象にもなる。"}, {"m": "イ", "t": "自ら売主として土地付建物の売買契約を締結しようとする場合、当該土地上に建てようとする建物が建築確認申請前であっても、広告することはできるが、建築確認を受けるまで、契約を締結することはできない。"}, {"m": "ウ", "t": "宅地建物取引業者は、自ら売主として、宅地建物取引業者である買主との間で、自ら所有しない造成前の宅地の売買契約を締結するためには、法第 41 条の規定による手付金等の保全措置を講じ、かつ、売主である宅地建物取引業者が当該宅地を取得する契約を締結しなければならない。"}, {"m": "エ", "t": "宅地建物取引業者は、宅地の売買の専属専任媒介契約を締結した場合、当該媒介契約締結の日から 5 日以内（休業日を除く。）に、当該宅地について指定流通機構に所定の事項を登録しなければならない。"}]}, {"stem": "宅地建物取引業者Ａが宅地建物取引業法第 37 条の規定により交付すべき書面（以下この問において「37 条書面」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["Ａが媒介により事業用宅地の賃貸借契約を成立させた場合、37 条書面を交付しなければならないが、契約の当事者Ｂが宅地建物取引業者であるときは、交付する必要はない。", "Ａが自ら売主としてＣと既存の建物の売買契約を締結した場合、建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項を 37 条書面に記載しなければならない。", "ＡがＤを売主としＥを買主とする宅地の売買契約を媒介した場合、天災その他不可抗力による損害の負担に関する定めがないときは、定めがない旨を 37 条書面に記載しなければならない。", "Ａが自ら売主としてＦと建物の売買契約を締結した場合、代金についての金銭の貸借のあっせんに関する定めがある場合における当該あっせんに係る金銭の貸借が成立しないときの措置については、37 条書面に記載する必要はない。"], "page": 17}, {"stem": "いずれも宅地建物取引業者であるＡ社、Ｂ社及びＣ社（以下この問において「売主ら」という。）が、分譲マンションを共同で建築、販売することとなり、建築確認を受けた後、工事完了前にその一室を 5,000 万円で宅地建物取引業者ではない個人である買主に売却しようとする場合に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）に違反するものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 17, "items": [{"m": "ア", "t": "売主らは、共同する全社が各個に重要事項説明を実施すると、かえって買主を混乱させると考え、買主の了解を得た上で、Ａ社 1 社を幹事社とし、Ａ社の宅地建物取引士が単独で重要事項説明書に記名のうえ、買主に交付し説明を行った。"}, {"m": "イ", "t": "売主らは、Ａ社の事務所において買主から買受けの申込みを受け、売買契約を締結したが、売主らは当該売買契約には法第 37 条の 2 の規定に基づくいわゆるクーリング・オフの適用はないと判断し、クーリング・オフについて買主に告げる書面の交付は行わなかった。"}, {"m": "ウ", "t": "売主らは、当該物件については、重要事項説明の時点では共用部分に関する規約が案であるので、買主の了解を得た上で、契約締結後に決定した規約を交付することとし、重要事項説明書への記載は省略した。"}, {"m": "エ", "t": "売主らは買主から手付金 500 万円を受領することとしたが、手付金の保全措置を講じる必要はないと判断し、手付金保全措置の概要について重要事項説明書への記載は省略した。"}]}, {"stem": "次の記述のうち、宅地建物取引業法により禁止されている行為が含まれているものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 18, "items": [{"m": "ア", "t": "宅地建物取引士が、マンション販売の勧誘を電話で行うにあたり、まず、契約締結について勧誘する目的である旨を告げたうえで、自分の名前は名乗らず、自身の勤務する宅地建物取引業者の名称及び免許番号を伝えたうえで勧誘を行った。"}, {"m": "イ", "t": "宅地建物取引業者が、賃貸マンションの媒介で入居申込者から申込みを受け付けたところ、当該マンションのオーナーからの審査回答待ちとなった。その後、入居申込者が、申込みを撤回したい旨電話で伝えたところ、当該宅地建物取引業者の従業員から声を荒げ「撤回をするなら、とりあえず事務所まで来てくれないと困る」と怒鳴られ、面会を強要された。申込者はその言動に不安を覚えたため、事務所に赴いて、申込みの撤回を申し出たところ、申込みの撤回が了承された。"}, {"m": "ウ", "t": "宅地建物取引業者が、一時的にアルバイトを雇って、マンション販売の広告チラシの配布を行わせることとしたほか、契約書の作成業務も補助的に行わせるため、従業者証明書をその者に発行し、それらの業務を行わせた。ただし、そのアルバイトはマンション販売の広告チラシの配布の際には、従業者証明書を携帯していなかった。"}, {"m": "エ", "t": "マンションの販売の勧誘における説明において、宅地建物取引士は、日当たりのよいマンションの購入希望者に対して、「マンション南側の月極駐車場は出来たばかりであり、将来にわたりそこにマンションなどの高層の建物が建つ予定は全くない」と説明し、購入希望者から購入申込みを受け付けた。"}]}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではないＢとの間でマンション（代金 4,000 万円）の売買契約を締結した場合に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定に違反しないものはどれか。", "ch": ["Ａは、建築工事完了前のマンションの売買契約を締結する際にＢから手付金 200 万円を受領し、さらに建築工事中に 200 万円を中間金として受領した後、当該手付金と中間金について法第 41 条に定める保全措置を講じた。", "Ａは、建築工事完了後のマンションの売買契約を締結する際に、法第 41 条の 2 に定める保全措置を講じることなくＢから手付金 400 万円を受領した。", "Ａは、建築工事完了前のマンションの売買契約を締結する際にＢから手付金 500 万円を受領したが、Ｂに債務不履行がないにもかかわらず当該手付金 500 万円を返還して、契約を一方的に解除した。", "Ａは、建築工事完了後のマンションの売買契約を締結する際に、当事者の債務の不履行を理由とする契約の解除に伴う損害賠償の予定額を 1,000 万円とする特約を定めた。"], "page": 19}, {"stem": "宅地建物取引業者Ａが行う業務に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはいくつあるか。なお、この問において「37 条書面」とは、同法第 37 条の規定により交付すべき書面をいうものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 19, "items": [{"m": "ア", "t": "建物の賃貸借の媒介をするＡは、当該建物の引渡しの時期について、重要事項説明書に記載して説明する必要はないが、37 条書面には記載しなければならない。"}, {"m": "イ", "t": "Ａは、自ら売主として建物を売却する場合、重要事項説明書に記載しなければならない契約の解除に関する事項については、契約に定めがなくても 37 条書面に全て記載しなければならない。"}, {"m": "ウ", "t": "Ａは、売主を代理して、抵当権が登記されている建物を売却する場合、買主に交付する37 条書面だけでなく、売主に交付する 37 条書面についても、当該抵当権の内容を記載しなければならない。"}, {"m": "エ", "t": "建物の賃貸借の媒介をするＡは、37 条書面を交付するに当たり、宅地建物取引士をして、その内容を説明させなければならない。"}]}, {"stem": "宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 20, "items": [{"m": "ア", "t": "Ａ社の政令で定める使用人Ｂは、刑法第 234 条（威力業務妨害）の罪により、懲役 2 年、執行猶予 2 年の刑に処せられた後、Ａ社を退任し、新たにＣ社の政令で定める使用人に就任した。Ｂの執行猶予期間が満了していない場合に、Ｃ社が免許を申請しても、免許を受けることができない。"}, {"m": "イ", "t": "Ｄ社は、不正の手段により免許を取得したことによる免許の取消処分に係る聴聞の期日及び場所が公示された日から当該処分がなされるまでの間に、宅地建物取引業法第 11 条の規定による廃業の届出をした。その廃業に相当の理由がなかった場合、当該公示の日の 40 日前にＤ社の取締役を退任したＥは、当該届出から 5 年経過しなければ、免許を申請しても免許を受けることができない。"}, {"m": "ウ", "t": "営業に関し成年者と同一の行為能力を有しない未成年者であるＦの法定代理人であるＧが、刑法第 206 条（現場助勢）の罪により罰金の刑に処せられていた場合、その刑の執行が終わった日から 5 年を経過していなくても、Ｆは免許を申請すれば免許を受けることができる。"}, {"m": "エ", "t": "Ｈ社の政令で定める使用人Ｊは、裁判所へＪ自身の破産申し立てを行った後、Ｈ社を退任し、裁判所から破産手続の開始決定を受けるまでの間に、新たにＫ社の政令で定める使用人に就任した。その後、Ｊが復権を得た場合、その日から 5 年を経過しなくても、Ｋ社が免許を申請すれば、免許を受けることができる。"}]}, {"stem": "宅地建物取引業者Ａ（甲県知事免許）の営業保証金に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、Ａは宅地建物取引業保証協会の社員ではないものとする。", "ch": ["免許の有効期間満了の際、Ａが営業保証金を取り戻そうとする場合には、供託した営業保証金につき還付を受ける権利を有する者に対し、 6 か月を下らない一定期間内に申し出るべき旨を官報に公告しなければならない。", "Ａが営業保証金を供託する場合において、金銭と有価証券を併用して供託することができるが、従たる事務所を設置したときの営業保証金については、金銭のみをもって供託しなければならない。", "Ａは、事業の開始後新たに乙県に従たる事務所を設置したときは、従たる事務所の最寄りの供託所に営業保証金を供託し、その供託物受入の記載のある供託書の写しを添付して、その旨を甲県知事に届け出なければならない。", "Ａの設置した支店においてＡと宅地建物取引業に関する取引をした者は、その取引により生じた債権に関し、500 万円を限度としてその債権の弁済を受ける権利を有する。"], "page": 21}, {"stem": "宅地建物取引業者Ａの業務に関する次の記述のうち、宅地建物取引業法の規定によれば、禁止されているものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 21, "items": [{"m": "ア", "t": "Ａの従業者は、電話によりＢに投資用マンションの購入の勧誘を行った際、Ｂから「Ａから購入する意思は一切無いので、今後電話を含め勧誘はしないでほしい。」と告げられたが、その翌日、Ｂに対し、再度の勧誘を行った。"}, {"m": "イ", "t": "建物の購入希望者から「契約の締結についてしばらく考えさせてほしい。」という申し出があったので、Ａの従業者は、他に買い手がいないにもかかわらず、「他に買い手がいるので、今日中しか契約の締結はできない。」と当該購入希望者に告げた。"}, {"m": "ウ", "t": "Ａの従業者は、建物の購入希望者に対して、長時間にわたり契約の締結をするための勧誘を行い、当該購入希望者を困惑させた。"}, {"m": "エ", "t": "建物の売買を媒介しているＡの従業者は、手持ち資金がない購入希望者に対して「手付金は当社が貸し付けるので後から返してくれれば構わない。」と告げて、契約の締結を誘引したが、契約には至らなかった。"}]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第 35 条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["建物の貸借の媒介を行う場合、当該建物が都市計画法の準防火地域内にあり、建築基準法第 61 条第 1 項に基づく建物の構造に係る制限があるときは、その概要を説明しなければならない。", "マンションの分譲を行う場合、建物の区分所有等に関する法律第 2 条第 3 項に規定する専用部分の用途その他の利用の制限に関する規約の定めが案の段階であるときは、説明する必要はない。", "建物の貸借の媒介を行う場合、借賃以外に授受される金銭の額、授受の目的及び保管方法を説明しなければならない。", "鉄筋コンクリート造の既存の共同住宅の販売を行う場合、宅地建物取引業法第 34 条の 2第 1 項第 4 号に規定する建物状況調査を 1 年 6 か月前に実施したときは、建物状況調査を実施したこと、その結果の概要について説明しなくてはならない。"], "page": 22}, {"stem": "宅地建物取引業者Ａが行う業務に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 22, "items": [{"m": "ア", "t": "Ａは、宅地又は建物の売買に関する広告をする際に取引態様の別を明示した場合、当該広告を見た者から売買に関する注文を受けたときは、改めて取引態様の別を明示する必要はない。"}, {"m": "イ", "t": "Ａは、宅地の売買に関する広告をするに当たり、当該宅地の形質について、実際のものよりも著しく優良であると人を誤認させる表示をした場合、当該宅地に関する注文がなく、売買が成立しなかったときであっても、監督処分及び罰則の対象となる。"}, {"m": "ウ", "t": "Ａは、複数の区画がある宅地の売買について、数回に分けて広告をする予定でいる場合、最初に行う広告に取引態様の別を明示すれば足り、それ以降は明示する必要はない。"}, {"m": "エ", "t": "Ａは、建物の貸借の媒介において、依頼者の依頼によらない広告をした場合、国土交通大臣の定める報酬限度額となる媒介報酬のほか、当該広告の料金に相当する額を受領できる。"}]}, {"stem": "宅地建物取引業者Ａが、ＢからＢ所有の中古住宅の売却について媒介の依頼を受けた場合における次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["ＡがＢとの間で専属専任媒介契約を締結し、Ｂから「売り出し中であることを秘密にしておきたいので指定流通機構への登録はしないでほしい」旨の申出があった場合、Ａは、そのことを理由に登録をしなかったとしても法に違反しない。", "Ａは、Ｂとの間で有効期間を 1 か月とする専属専任媒介契約を締結する際、「Ｂが媒介契約を更新する旨を申し出ない場合は、有効期間満了により自動更新するものとする」旨の特約は有効である。", "ＡがＢと一般媒介契約を締結したときは、法第 34 条の 2 第 1 項の規定に基づき交付すべき書面に、宅地建物取引士をして記名させなければならない。", "ＡがＢとの間で専属専任媒介契約を締結した場合、Ａは、当該中古住宅の取引の申込みの受付に関する状況を指定流通機構に登録しなければならない。"], "page": 23}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者Ｂの媒介により、宅地建物取引業者ではない買主Ｃとの間で宅地の売買契約を締結した場合、宅地建物取引業法第37 条の 2 の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "なし"], "page": 23, "items": [{"m": "ア", "t": "Ｃは、Ｂの事務所で買受けの申込みを行い、その 3 日後に、Ｃの自宅近くの喫茶店で売買契約を締結した場合、クーリング・オフによる契約の解除はできない。"}, {"m": "イ", "t": "ＡとＣの間で、クーリング・オフによる契約の解除に関し、Ｃは契約の解除の書面をクーリング・オフの告知の日から起算して 8 日以内にＡに到達させなければ契約を解除することができない旨の特約を定めた場合、当該特約は無効である。"}, {"m": "ウ", "t": "Ｃは、Ｂからの提案によりＣの自宅で買受けの申込みを行ったが、クーリング・オフについては告げられず、その 10 日後に、Ａの事務所で売買契約を締結した場合、クーリング・オフによる契約の解除はできない。"}, {"m": "エ", "t": "クーリング・オフについてＣに告げる書面には、Ａの商号又は名称及び住所並びに免許証番号を記載しなければならないが、Ｂの商号又は名称及び住所並びに免許証番号の記載は必要ない。"}]}, {"stem": "宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者Ａ（甲県知事免許）が免許を受けてから 1 年以内に事業を開始しないときは、甲県知事は免許を取り消さなければならない。", "宅地建物取引業者Ｂ（甲県知事免許）が株主総会の決議により解散した場合、Ｂを代表する役員であった者は、その旨を当該解散の日から 60 日以内に甲県知事に届け出なければならない。", "宅地建物取引業者ではないＣが甲県に本店を、乙県に支店をそれぞれ有する場合で、乙県の支店のみで新たに宅地建物取引業を営もうとするときは、Ｃは乙県知事の免許を受けなければならない。", "宅地建物取引業者Ｄ（甲県知事免許）は、甲県の事務所を廃止し、乙県内で新たに事務所を設置して宅地建物取引業を営もうとする場合、甲県知事へ廃業の届出を行うとともに、乙県知事への免許換えの申請を行わなければならない。"], "page": 24}, {"stem": "宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、この問において、宅地建物取引士は、事務の禁止の処分を受けていないものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 24, "items": [{"m": "ア", "t": "二つ以上の都道府県において宅地建物取引士資格試験に合格した者は、当該試験を行った都道府県のうち試験日が遅い都道府県知事の登録以外を受けることができない。"}, {"m": "イ", "t": "宅地建物取引士は、その登録している勤務先の名称に変更があった場合、登録を受けている都道府県知事に、変更の登録の申請とあわせて、宅地建物取引士証の書換え交付を申請しなければならない。"}, {"m": "ウ", "t": "宅地建物取引士は、宅地建物取引士証が効力を失ったときは、速やかに、宅地建物取引士証をその交付を受けた都道府県知事に返納しなければならない。"}, {"m": "エ", "t": "宅地建物取引士は、登録を受けている都道府県知事の管轄する都道府県以外の都道府県に所在する宅地建物取引業者の事務所の業務に従事しているときは、登録の移転の申請をすることができる。"}]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第 35 条に規定する重要事項の説明に関する次の記述のうち、正しいものはいくつあるか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 25, "items": [{"m": "ア", "t": "自らを委託者とする宅地又は建物に係る信託の受益権の売主となる場合、相手方に金融商品取引法第 2 条第 10 項に規定する目論見書を交付し、宅地建物取引業法第 35 条第 3 項の規定に基づき説明すべき事項のすべてが当該目論見書に記載されているときは、重要事項説明書の交付及び説明を省略することができる。"}, {"m": "イ", "t": "建物の貸借の媒介を行う場合、当該建物が建築工事の完了前のものであるときは、その完了時における当該建物の主要構造部、内装及び外装の構造又は仕上げ並びに設備の設置及び構造について説明しなければならない。"}, {"m": "ウ", "t": "建物の貸借の媒介を行う場合、敷金その他いかなる名義をもって授受されるかを問わず、契約終了時において精算することとされている金銭の精算に関する事項を説明しなければならない。"}, {"m": "エ", "t": "宅地の売買の媒介を行う場合、当該宅地が津波防災地域づくりに関する法律第 21 条第 1項により指定された津波防護施設区域内にあるときは、同法第 23 条第 1 項の規定による制限の概要について説明しなければならない。"}]}, {"stem": "宅地建物取引業者は、犯罪による収益の移転防止に関する法律第 2 条第 2 項の特定事業者に該当するが、宅地建物取引業者Ａの行為に関する次の記述のうち、同法に違反するものはどれか。", "ch": ["Ａは、土地付建物の売買を行うに際して、当該売買契約の相手方である買主が自然人であったので、氏名、住居、生年月日、取引を行う目的及び職業について、確認した。", "Ａは、価額が 5,000 万円の土地付建物の売買を行ったとき、直ちに、一定の方法により、当該売買契約の相手方である買主の確認記録を検索するための事項、当該取引の期日及び内容その他の事項に関する記録を作成して保存していたが、当該取引の行われた日から 5 年経過したので、当年度末に当該記録を廃棄した。", "Ａは、土地付建物の売買契約の相手方である買主から収受した代金について犯罪により得た収益であるとの疑いがあったので、速やかに、所定の事項を行政庁に届け出た。", "Ａは、取引時確認、取引記録等の保存、疑わしい取引の届出等の措置を的確に行うため、顧客と実際に接する営業担当者に対する教育訓練を実施した。"], "page": 26}, {"stem": "特定住宅瑕疵担保責任の履行の確保等に関する法律に基づく住宅販売瑕か疵し担保保証金（以下この問において「保証金」という。）の供託又は住宅販売瑕か疵し担保責任保険契約（以下この問において「保険契約」という。）の締結に関する次の記述のうち、正しいものはどれか。", "ch": ["宅地建物取引業者は、基準日から 3 週間を経過する日までの間において、当該基準日前15 年間に自ら売主となる売買契約に基づき宅地建物取引業者ではない買主に引き渡した新築住宅（保険契約に係る新築住宅を除く。）について、保証金の供託をしていなければならない。", "宅地建物取引業者は、自ら売主となる売買契約に基づき新築住宅を引き渡す場合だけでなく、新築住宅の売買の媒介をする場合においても、保証金の供託又は保険契約の締結をしなければならない。", "保険契約を締結している宅地建物取引業者は、新築住宅を引き渡した時から 10 年間、構造耐力上主要な部分の瑕か疵しによって生じた損害についてのみ当該保険契約に係る保険金を請求することができる。", "保険契約を締結している宅地建物取引業者及び当該業者が売主となっている新築住宅の買主は、指定住宅紛争処理機関に特別住宅紛争処理の申請をすることにより、当該新築住宅の売買契約に関する宅地建物取引業者と買主との間の紛争について、あっせん、調停又は仲裁を受けることができる。"], "page": 26}, {"stem": "独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["機構は、災害により住宅が滅失した場合におけるその住宅に代わるべき住宅の建設又は購入に係る貸付金について、一定の元金返済の据置期間を設けることができる。", "機構は、証券化支援事業（買取型）において、債務者又は債務者の親族が居住する住宅のみならず、賃貸住宅の建設又は購入に必要な資金の貸付けに係る金融機関の貸付債権についても譲受けの対象としている。", "機構は、高齢者が自ら居住する住宅に対して行うバリアフリー工事に係る貸付けについて、貸付金の償還を高齢者の死亡時に一括して行うという制度を設けている。", "機構は、市街地の土地の合理的な利用に寄与する一定の建築物の建設に必要な資金の貸付けを業務として行っている。"], "page": 27}, {"stem": "宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。", "ch": ["団地（一団の宅地又は建物をいう。）と駅との間の道路距離は、取引する区画のうち駅から最も近い区画（マンション及びアパートにあっては、駅から最も近い建物の出入口）を起点として算出した数値又は駅から最も遠い区画（マンション及びアパートにあっては、駅から最も遠い建物の出入口）を起点として算出した数値のいずれかを表示しなければならない。", "新築分譲マンションを販売するに当たり、住戸により管理費の額が異なる場合であって、その全ての住宅の管理費を表示することが困難であるときは、最高額のみで表示することができる。", "物件の近くに新設される予定の駅等又はバスの停留所については、当該路線の運行主体が公表していれば、現に利用できるものではなくても新設予定時期を明示して表示することができる。", "道路距離 80 m につき 1 分間を要するものとして、賃貸物件から最寄りの駅までの徒歩による所要時間を算出したところ 15 分 50 秒であった。この場合、当該所要時間を 15 分と表示してよい。"], "page": 27}, {"stem": "次の記述のうち、正しいものはどれか。", "ch": ["年次別法人企業統計調査（令和 5 年度。令和 6 年 9 月公表）によれば、令和 5 年度における不動産業の営業利益は 7 兆円を超えているが、前年度に比べ減少した。", "建築着工統計調査報告（令和 6 年計。令和 7 年 1 月公表）によれば、令和 6 年の新設住宅着工戸数は、持家、分譲住宅のいずれにおいても前年に比べ減少した。", "令和 7 年地価公示（令和 7 年 3 月公表）によれば、令和 6 年 1 月以降の 1 年間の地価変動率は、三大都市圏平均では住宅地、商業地ともに上昇となったものの、地方圏平均では住宅地、商業地ともに下落となった。", "令和 7 年版土地白書（令和 7 年 5 月公表）によれば、土地取引について、売買による所有権の移転登記の件数でその動向を見ると、令和 6 年の全国の土地取引件数は 200 万件を超えており、前年に比べ大きく増加した。"], "page": 28}, {"stem": "土地に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["川沿いの低地に堆積している川が運んだ土砂は、重い構造物を支持できる。", "砂州や砂丘には、粒径のそろった砂が堆積しており、地下水位が浅い箇所では、液状化しやすくなる。", "丘陵地は、山地ほど斜面の勾配がきつくなく、山地に比べ斜面崩壊は生じ難いといえる。", "台地は低地より古い時代に形成された地盤であり、一般に構造物を支持できる強度を有している。"], "page": 28}, {"stem": "建物の構造と材料に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["鋼材の素材の鋼は、鉄や炭素などの成分を含んでおり、炭素量が多いものほど、軟質で強度が小さい。", "鋼材は、熱に弱く、さびやすいので、耐火や防錆せいの処理を施す必要がある。", "鋼材は、強度が高く、粘りがあり、比較的小さな断面部材で荷重に耐えることができる。", "鋼材の素材の鋼の密度は、木材やコンクリートに比べて大きい。令和 7 年度問題受験番号―受験者氏名"], "page": 28}]},

   ans:[[1], [4], [3], [4], [2], [4], [1], [1], [2], [4], [3], [3], [1], [3], [4], [1], [2], [2], [3], [2], [1], [4], [2], [2], [3], [3], [4], [2], [4], [4], [1], [3], [3], [3], [2], [4], [3], [4], [4], [2], [1], [2], [4], [1], [2], [1], [4], [1], [2], [3]],
   qs:[{"stem": "法律行為に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["営業を許された未成年者が、その営業に関する意思表示をした時に意思能力を有しなかった場合は、その法律行為は無効である。", "公の秩序に反する法律行為であっても、当事者が納得して合意した場合には、その法律行為は有効である。", "詐欺による意思表示は取り消すことによって初めから無効であったとみなされるのに対し、強迫による意思表示は取り消すまでもなく無効である。", "他人が所有している土地を目的物にした売買契約は無効であるが、当該他人がその売買契約を追認した場合にはその売買契約は有効となる。"], "page": 3}, {"stem": "委任契約・準委任契約に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["売主が、売買契約の付随義務として、買主に対して、マンション専有部分内の防火戸の操作方法につき説明義務を負う場合、業務において密接な関係にある売主から委託を受け、売主と一体となって当該マンションの販売に関する一切の事務を行っていた宅地建物取引業者も、買主に対して、防火戸の操作方法について説明する信義則上の義務を負うことがある。", "受任者は、委任者の許諾を得たとき、又はやむを得ない事由があるときでなければ、復受任者を選任することができない。", "委任契約で本人が死亡しても代理権が消滅しない旨を合意して代理人に代理権を与えた場合、本人が死亡しても代理権は消滅しない。", "委任は、当事者の一方が仕事を完成することを相手方に約し、相手方がその仕事の結果に対しその報酬を支払うことを約さなければ、その効力を生じない。"], "page": 3}, {"stem": "甲土地につき、Ａ、Ｂ、Ｃ、Ｄの 4 人がそれぞれ 4 分の 1 の共有持分を有していて、Ａ、Ｂ、ＣのいずれもＤの所在を知ることができない場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、Ｄの共有持分は、相続財産には属していないものとする。", "ch": ["甲土地に、その形状又は効用の著しい変更を伴う変更を加える場合には、共有者の過半数の同意が必要であり、本件ではＡ、Ｂ、Ｃ 3 人の同意が必要となる。", "甲土地の所有 権の登記名義人となっている者が所有者ではないＥである場合、持分に基づいてＥに対して登記の抹消を求めるためには、所在が判明しているＡ、Ｂ、Ｃのうち 2 人の同意が必要である。", "Ａ、Ｂ、Ｃ 3 人の同意があれば、甲土地を資材置場として賃借したいＦとの間で期間を 3年とする賃貸借契約を締結することができる。", "Ａが裁判所に請求して、裁判所がＤの持分をＡに取得させる旨の決定をした場合、Ｄは、その決定から 3 年以内に限り、Ａが取得したＤの共有持分の時価相当額をＡに対して支払うよう請求することができる。"], "page": 4}, {"stem": "Ａを売主、Ｂを買主として甲土地の売買契約（以下この問において「本件契約」という。）が締結された直後にＡが死亡し、ＣがＡを単独相続した場合における次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["売買代金を受領したＣが甲土地の引渡しを拒絶する意思を明確に表示したとしても、Ｂは、Ｃに対して相当の期間を定めた催告をしなければ、本件契約を解除することができない。", "Ｂが期日までに売買代金を支払わない場合であっても、本件契約の解除権はＡの一身に専属した権利であるため、Ｃは本件契約を解除することはできない。", "Ｂは、売買代金が支払い済みだったとしても、甲土地の所有権登記を備えなければ、Ｃに対して甲土地の引渡しを請求することはできない。", "本件契約が、Ａの詐欺により締結されたものである場合、ＢはＣに対して、本件契約の取消しを主張することができる。"], "page": 4}, {"stem": "履行遅滞に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["不法行為の加害者は、不法行為に基づく損害賠償債務について、履行の請求を受けた時から遅滞の責任を負う。", "善意の受益者は、その不当利得返還債務について、履行の請求を受けた時から遅滞の責任を負う。", "請負人の報酬債権に対して、注文者がこれと同時履行の関係にある目的物の瑕か疵し修補に代わる損害賠償債権を自働債権とする相殺の意思表示をした場合、注文者は、請負人に対する相殺後の報酬残債務について、当該残債務の履行の請求を受けた時から遅滞の責任を負う。", "債務の履行について不確定期限があるときは、債務者は、その期限の到来したことを知った後に履行の請求を受けた時から遅滞の責任を負う。"], "page": 5}, {"stem": "Ａの所有する甲土地にＢを地上権者とする地上権（以下この問において「本件地上権」という。）が設定され、その旨の登記がされた後に、甲土地にＣを抵当権者とする抵当権が設定され、その旨の登記がされた場合における次の記述のうち、民法の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "なし"], "page": 5, "items": [{"m": "ア", "t": "ＢがＡとの売買契約に基づき、甲土地の所有権を取得したときは、本件地上権は消滅する。"}, {"m": "イ", "t": "Ａが死亡してＢがＡを単独相続し、甲土地の所有権を取得したときは、本件地上権は消滅する。"}, {"m": "ウ", "t": "ＢがＡとの代物弁済契約に基づき、甲土地の所有権を取得したときは、本件地上権は消滅する。"}, {"m": "エ", "t": "ＢがＡとの贈与契約に基づき、甲土地の所有権を取得したときは、本件地上権は消滅する。"}]}, {"stem": "Ａを貸主、Ｂを借主として甲建物の賃貸借契約（以下この問において「本件契約」という。）が締結され、Ｂが甲建物の引渡しを受けた場合における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["ＣがＢに対し甲建物をＡから買受けたとの虚偽の話をしたので、これを信じたＢが甲建物の占有を任意にＣに移転した場合、ＡはＣに対して、占有回収の訴えにより甲建物の返還を請求することはできない。", "Ｂが、Ａの甲建物への立ち入りを建物入り口を閉ざして拒んだときは、Ａは甲建物の間接占有が侵奪されたものとして、Ｂに対して、占有回収の訴えにより甲建物の返還を請求することができる。", "Ｂが死亡して、ＤがＢを単独相続した場合、Ｄは相続開始を知るまでは、Ｂによる甲建物の占有を承継しない。", "ＡとＢのいずれもが死亡した場合、本件契約は当然に終了する。"], "page": 6}, {"stem": "次の記述のうち、民法の条文として規定されていないものはどれか。", "ch": ["隔地者間の契約は、承諾の通知を発した時に成立する。", "無効な行為に基づく債務の履行として給付を受けた者は、相手方を原状に復させる義務を負う。", "代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者がした行為とみなす。", "未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、単に権利を得、又は義務を免れる法律行為については、この限りでない。"], "page": 6}, {"stem": "承諾に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["第三者が債務者との間で、債務者の債務につき免責的債務引受契約をする場合、債権者の承諾は不要である。", "第三者が債務者との間で、債務者の債務につき併存的債務引受契約をした場合、債権者が第三者に承諾をした時点で、その効力が生ずる。", "第三者が債権者との間で、債務者の債務につき併存的債務引受契約をした場合、債務者が第三者に承諾をした時点で、その効力が生ずる。", "賃借人が賃貸借契約の目的物を第三者に転貸する場合、賃貸人の承諾は不要である。"], "page": 7}, {"stem": "売買契約の目的物が品質に関して契約の内容に適合しない場合において、当該契約不適合が売主及び買主のいずれの責めにも帰することができない事由によるものであるとき、履行の追完請求権、代金の減額請求権、損害賠償請求権及び契約の解除権のうち、民法の規定によれば、買主が行使することができない権利のみを掲げたものとして正しいものは次の記述のうちどれか。なお、上記帰責性以外の点について、権利の行使を妨げる事情はないものとする。", "ch": ["履行の追完請求権、損害賠償請求権、契約の解除権", "代金の減額請求権、損害賠償請求権、契約の解除権", "履行の追完請求権、代金の減額請求権", "損害賠償請求権"], "page": 7}, {"stem": "建物の所有を目的とする土地の賃貸借契約（一時使用目的の借地契約を除く。）に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。", "ch": ["専ら事業の用に供する建物（居住の用に供するものを除く。）の所有を目的とし、存続期間を 20 年として借地権を設定する場合、建物買取請求権の規定は適用されず、また、その契約は、公正証書による等書面によってしなければならない。", "居住の用に供する建物の所有を目的として借地権を設定する場合において、借地権を消滅させる目的で、その設定後 30 年を経過した日に借地権の目的である土地の上の建物を借地権設定者に相当の対価で譲渡する旨の特約を定めても、この特約は無効である。", "借地権を設定する場合において、存続期間を定めなかったときは、その期間は 30 年となる。", "当事者が借地権の設定後に最初に借地契約を更新する場合において、存続期間を定めなかったときは、その期間は更新の日から 10 年となる。"], "page": 8}, {"stem": "賃貸人Ａと賃借人Ｂとが、居住目的で期間を 3 年として、借地借家法第 38 条の定期建物賃貸借契約（以下この問において「契約①」という。）を締結した場合と、定期建物賃貸借契約でも一時使用目的の賃貸借契約でもない普通建物賃貸借契約（以下この問において「契約②」という。）を締結した場合とに関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。", "ch": ["Ｂが建物の引渡しを受けた後にＡが建物をＣに売却して建物所有者がＣに変わった場合、Ｂは、契約①の場合ではＣに対して賃借人であることを主張できるが、契約②の場合ではＣに対して賃借人であることを主張できない。", "契約期間中は賃料の改定を行わない旨の特約を契約において定めていても、契約期間中に賃料が不相当になったと考えるに至ったＢは、契約①の場合も契約②の場合も、借地借家法第 32 条に基づく賃料減額請求をすることができる。", "Ｂが契約期間中に相続人なしで死亡した場合において、婚姻はしていないが事実上夫婦と同様の関係にあった同居者Ｄがあるときは、契約①の場合も契約②の場合も、Ａに反対の意思表示をしないＤは、建物の賃貸借契約に関し、Ｂの権利義務を承継する。", "契約①の場合、公正証書によって契約をするときに限り契約の更新がないことを有効に定めることができ、契約②の場合、書面で契約し、かつ、Ａに正当な理由がない限り、Ａは契約の更新を拒絶することができなくなる。"], "page": 8}, {"stem": "建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。", "ch": ["各共有者の共用部分の持分は、規約に別段の定めがない限り、共有者数で等分することとされている。", "規約及び集会の決議は、区分所有者の特定承継人に対しても、その効力を生ずる。", "管理者は、集会において、毎年 1 回一定の時期に、その事務に関する報告をしなければならない。", "集会の招集の通知は、区分所有者が管理者に対して通知を受けるべき場所を通知しなかったときは区分所有者の所有する専有部分が所在する場所にあててすれば足りる。この場合には、集会の招集の通知は、通常それが到達すべき時に到達したものとみなされる。"], "page": 9}, {"stem": "不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。", "ch": ["買戻しの特約に関する登記がされている場合において、契約の日から 10 年を経過したときは、登記権利者は、単独で当該登記の抹消を申請することができる。", "不動産の収用による所有権の移転の登記は、起業者が単独で申請することができる。", "相続人ではない者に対する遺贈による所有権の移転の登記は、登記権利者が単独で申請することができる。", "登記名義人の住所についての変更の登記は、登記名義人が単独で申請することができる。"], "page": 9}, {"stem": "都市計画法に関する次の記述のうち、誤っているものはどれか。", "ch": ["都市計画区域外においても、特に必要があるときは、都市施設に関する都市計画を定めることができる。", "準都市計画区域については、用途地域が定められている土地の区域であっても、市街地開発事業に関する都市計画を定めることができない。", "用途地域の一つである準住居地域は、道路の沿道としての地域の特性にふさわしい業務の利便の増進を図りつつ、これと調和した住居の環境を保護するために定める地域である。", "地区計画は、用途地域が定められている土地の区域についてのみ都市計画に定められるものであり、また、地区計画に関する都市計画を定めるに当たっては、地区整備計画を都市計画に定めなければならない。"], "page": 9}, {"stem": "都市計画法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["市街化区域内において行う、医療法に規定する病院を建築するための 1,000 m² の開発行為については、法第 29 条に基づく都道府県知事の許可を得る必要がある。", "市街化区域内において行う、開発行為を伴わない建築物の建築で、当該建築物の床面積が1,000 m² 以上のものについては、法第 29 条に基づく都道府県知事の許可を得る必要がある。", "市街化調整区域内において行う、都市計画事業の施行のための開発行為については、法第29 条に基づく都道府県知事の許可を得る必要がある。", "法第 29 条に基づく許可を受けた者は、当該許可に係る土地についての一定の事項を開発登録簿に登録しなければならない。"], "page": 10}, {"stem": "建築基準法に関する次の記述のうち、誤っているものはどれか。なお、建築副主事の確認にあっては、建築基準法に定める大規模建築物以外の建築物に限るものとする。", "ch": ["高さ 25 m の建築物には、周囲の状況によって安全上支障がない場合を除き、有効に避雷設備を設けなければならない。", "特定行政庁は、建築基準法の規定に違反した建築物（国、都道府県又は建築主事を置く市町村の建築物を除く。）の所有者に対して、緊急の必要があり、仮に当該建築物の使用禁止又は使用制限の命令をする場合であっても、意見書の提出先等を記載した通知書の交付等の手続をとらなければならない。", "防火地域内に存在する共同住宅（その用途に供する部分の床面積の合計が 300 m²）を増築する場合、その増築に係る部分の床面積の合計が 10 m² 以内であっても、建築主事、建築副主事又は指定確認検査機関の確認を受ける必要がある。", "劇場の用途に供する建築物を映画館（その用途に供する部分の床面積の合計が 500 m²）に用途変更する場合、建築主事、建築副主事又は指定確認検査機関の確認を受ける必要はない。"], "page": 10}, {"stem": "次の記述のうち、建築基準法の規定によれば、正しいものはどれか。", "ch": ["客席部分の床面積の合計が 300 m² の映画館については、第二種住居地域内において建築することはできないが、準住居地域内においては建築することができる。", "特定用途誘導地区内において、都市計画で建築物の高さの最高限度が定められていたとしても、特定行政庁が用途上又は構造上やむを得ないと認めて許可したものについては、当該最高限度を超えてよい。", "計画しようとする建築物の天空率が、道路斜線制限、隣地斜線制限又は北側斜線制限に適合する建築物の天空率未満であれば、これらの制限は適用されない。", "都市計画で建蔽率の限度が 80 ％ に指定されている区域かつ防火地域内にある耐火建築物について、建蔽率の限度を超えるためには、特定行政庁による許可を得る必要がある。"], "page": 11}, {"stem": "宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市及び中核市にあってはその長をいうものとし、地方自治法に基づく施行時特例市に係る経過措置については考慮しないものとする。", "ch": ["都道府県知事は、基礎調査のために他人の占有する土地に立ち入って測量又は調査を行う必要があるときは、その必要の限度において、当該土地に、自ら立ち入り、又はその命じた者若しくは委任した者に立ち入らせることができ、当該土地の占有者は、正当な理由がない限り、その立入りを拒み、又は妨げてはならない。", "都道府県知事は、宅地造成等工事規制区域内の土地について、宅地造成等に伴う災害を防止するために必要があると認める場合には、その土地の所有者に対して、擁壁等の設置等の措置をとることを勧告することができる。", "工事主は、宅地造成等工事規制区域において行われる宅地造成等に関する工事について、工事着手後 2 週間以内に、宅地造成等に関する工事の施行に係る土地の周辺地域の住民に対し、説明会の開催その他の当該宅地造成等に関する工事の内容を周知させるため必要な措置を講じなければならない。", "特定盛土等規制区域内において行われる特定盛土等又は土石の堆積に関する工事については、工事主は、当該工事に着手する日の 30 日前までに、主務省令で定めるところにより、当該工事の計画を都道府県知事に届け出なければならない。ただし、特定盛土等又は土石の堆積に伴う災害の発生のおそれがないと認められるものとして政令で定める工事については、この限りでない。"], "page": 11}, {"stem": "土地区画整理法に関する次の記述のうち、誤っているものはどれか。なお、この問において、同法第 136 条の 3 による大都市等の特例及び条例で定める事務処理の特例は考慮しないものとする。", "ch": ["仮換地が指定された場合においては、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地の指定の効力発生の日から換地処分の公告がある日まで、仮換地又は仮換地について仮に使用し、若しくは収益することができる権利の目的となるべき宅地若しくはその部分について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができる。", "市町村施行の土地区画整理事業において、市町村は、換地処分をした場合においては、その旨を公告しなければならない。", "換地計画において定められた保留地は、換地処分の公告があった日の翌日において、施行者が取得する。", "施行者は、仮換地を指定した場合において、特別の事情があるときは、その仮換地について使用又は収益を開始することができる日を仮換地の指定の効力発生の日と別に定めることができる。"], "page": 12}, {"stem": "農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、誤っているものはどれか。", "ch": ["法第 3 条第 1 項の許可があったときは所有権が移転する旨の停止条件付売買契約を原因とする所有権移転の仮登記の申請を行う場合にも、農業委員会の許可が必要である。", "法第 5 条第 1 項の許可申請書の提出において、法ではその申請に係る権利の設定又は移転に関し民事調停法により調停が成立した場合など一定の場合を除き、当事者は連署した申請書を提出しなければならないとされている。", "法では、農地の賃貸借で期間の定めがあるものについては、一定の場合を除き、期間満了の 1 年前から 6 か月前までの間に更新拒絶の通知をしないと従前の賃貸借と同一の条件で更に賃貸借したものとみなされる。", "法では、農地の賃貸借の当事者は、当該賃貸借の合意による解約が民事調停法による農事調停によって行われる場合など一定の場合を除き、知事の許可を受けなければ、当該賃貸借について、解除、解約の申入れ、合意解約、更新拒絶の通知をしてはならないとされている。"], "page": 12}, {"stem": "国土利用計画法（以下この問において「法」という。）第 23 条の届出（以下この問において「事後届出」という。）及び法第 27 条の 7 の監視区域内の届出（以下この問において「事前届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。", "ch": ["Ａが所有する市街化区域以外の都市計画区域内の 4,000 m² の土地について、宅地建物取引業者Ｂが地上権の設定を受ける契約を締結した場合、Ｂは事後届出を行わなければならない。", "宅地建物取引業者Ｃが所有する市街化区域内の 3,000 m² の土地と宅地建物取引業者Ｄが所有する都市計画区域外に所在する 12,000 m² の土地を金銭の授受を伴わずに交換する契約を締結した場合、Ｃ及びＤはともに事後届出を行う必要はない。", "事前届出又は事後届出が必要な土地について、売買契約を締結したにもかかわらず所定の期間内に当該届出をしなかった者は都道府県知事からの勧告を受けることがあるが、罰則の適用を受けることはない。", "監視区域に指定された市街化区域内に所在する土地 2,500 m² について売買契約を締結しようとする当事者は、契約締結の少なくとも 6 週間前までに事前届出を行わなければならない。"], "page": 13}, {"stem": "住宅借入金等を有する場合の所得税額の特別控除（以下この問において「住宅ローン控除」という。）に関する次の記述のうち、正しいものはどれか。なお、以下の居住用家屋は、令和 5 年に建築基準法第 6 条第 1 項の確認（建築確認）を受けたものとする。", "ch": ["令和 6 年中に居住用家屋を居住の用に供した場合において、その前年において居住用財産を譲渡した場合の軽減税率の特例の適用を受けているときであっても、令和 6 年分以後の所得税について住宅ローン控除の適用を受けることができる。", "令和 6 年中に居住用家屋を居住の用に供した場合において、その前年において居住用財産の買換え等の場合の譲渡損失の損益通算の適用を受けているときであっても、令和 6 年分以後の所得税について住宅ローン控除の適用を受けることができる。", "令和 5 年中に居住用家屋の敷地の用に供するための土地を取得した場合において、令和 6年中に居住用家屋を新築して居住の用に供したときは、令和 5 年分の所得税について住宅ローン控除の適用を受けることができる。", "令和 6 年中に居住用家屋を居住の用に供した場合において、その居住用家屋の取得に係る住宅借入金等の償還期間等が契約において 3 年とされているときは、令和 6 年以後 3 年間の所得税について住宅ローン控除の適用を受けることができる。"], "page": 13}, {"stem": "不動産取得税に関する次の記述のうち、正しいものはどれか。", "ch": ["不動産取得税の課税標準は、不動産を取得した時における当該不動産の売買価格であるから、固定資産税の課税標準である固定資産の評価額とは異なるものである。", "不動産取得税の課税標準となるべき額が、土地の取得にあっては 10 万円、家屋の取得のうち建築に係るものにあっては 1 戸につき 23 万円、その他のものにあっては 1 戸につき 12万円に満たない場合においては、不動産取得税が課されない。", "不動産取得税は、不動産の取得に対して課される税であるので、法人の合併により不動産を取得した場合においても、不動産取得税が課される。", "令和 6 年 4 月に個人が取得した住宅及び住宅用地に係る不動産取得税の税率は 3 ％ であるが、住宅以外の家屋及び土地に係る不動産取得税の税率は 4 ％ である。"], "page": 14}, {"stem": "不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。", "ch": ["同一需給圏とは、一般に対象不動産と代替関係が成立して、その価格の形成について相互に影響を及ぼすような関係にある他の不動産の存する圏域をいう。", "対象不動産について、依頼目的に応じ対象不動産に係る価格形成要因のうち地域要因又は個別的要因について想定上の条件を設定する場合がある。", "不動産の価格は、その不動産の効用が最高度に発揮される可能性に最も富む使用を前提として把握される価格を標準として形成されるが、これを適合の原則という。", "収益還元法は、対象不動産が将来生み出すであろうと期待される純収益の現在価値の総和を求めることにより対象不動産の試算価格を求める手法であり、賃貸用不動産又は賃貸以外の事業の用に供する不動産の価格を求める場合に特に有効である。"], "page": 14}, {"stem": "宅地建物取引業法第 35 条に規定する重要事項の説明に関する次の記述のうち、正しいものはいくつあるか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 15, "items": [{"m": "ア", "t": "ガス配管設備等に関して、住宅の売買後においても宅地内のガスの配管設備等の所有権が家庭用プロパンガス販売会社にあるものとする場合には、その旨を説明しなければならない。"}, {"m": "イ", "t": "重要事項の説明を行う宅地建物取引士は専任の宅地建物取引士でなくてもよいが、書面に記名する宅地建物取引士は専任の宅地建物取引士でなければならない。"}, {"m": "ウ", "t": "区分所有建物である事務所ビルの一室の売買の媒介を行う場合、当該 1 棟の建物及びその敷地の管理が委託されているときは、その委託を受けている者の氏名（法人にあっては、その商号又は名称）及び住所（法人にあっては、その主たる事務所の所在地）を説明しなければならない。"}, {"m": "エ", "t": "区分所有建物である中古マンションの一室の売買の媒介を行う場合、当該 1 棟の建物の計画的な維持修繕のための費用の積立てを行う旨の規約の定めがあるときは、その内容及び既に積み立てられている額について説明しなければならない。"}]}, {"stem": "宅地建物取引業者Ａに関する次の記述のうち、正しいものはどれか。なお、Ａは宅地建物取引業保証協会の社員ではないものとする。", "ch": ["Ａが主たる事務所を移転したことにより、その最寄りの供託所が変更した場合において、金銭のみをもって営業保証金を供託しているときは、遅滞なく営業保証金を移転後の主たる事務所の最寄りの供託所に新たに供託しなければならない。", "Ａの従業員が運転する車両で現地案内を受けた者が、Ａの従業員の過失による交通事故でケガをした場合に取得する損害賠償請求権は、Ａが供託した営業保証金の還付の対象債権となる。", "Ａは、金銭と有価証券を併用して供託することができ、有価証券のみで供託する場合の当該有価証券の価額は、国債証券の場合はその額面金額の 100 分の 90、地方債証券の場合はその額面金額の 100 分の 80 である。", "Ａは甲県内にある主たる事務所とは別に、乙県内に新たに従たる事務所を設置したときは、営業保証金を主たる事務所の最寄りの供託所に供託しなければならない。"], "page": 15}, {"stem": "宅地建物取引業者Ａ（消費税課税事業者）及び宅地建物取引業者Ｂ（消費税免税事業者）が受領した報酬に関するアからウの記述のうち、宅地建物取引業法の規定に違反しないものの組合せは 1 から 4 のうちどれか。なお、代理、媒介に当たり、広告の依頼は行われていないものとする。", "ch": ["ア、イ", "イ、ウ", "ア、ウ", "ア、イ、ウ"], "page": 16, "items": [{"m": "ア", "t": "居住用建物（ 1 か月の借賃 12 万円。消費税等相当額を含まない。）について、Ａは貸主から代理を依頼され、Ｂは借主から媒介を依頼され、Ａは貸主から 6.7 万円、Ｂは借主から6.5 万円を報酬として受領した。なお、Ｂは、媒介の依頼を受けるに当たって、報酬について借主から特段の承諾を得ていない。"}, {"m": "イ", "t": "Ｂは、事業用建物について、貸主と借主双方から媒介を依頼され、借賃 1 か月分 10 万円（消費税等相当額を含まない。）、権利金 90 万円（権利設定の対価として支払われる金銭であって返還されないもので、消費税等相当額を含まない。）の賃貸借契約を成立させ、貸主と借主からそれぞれ 5 万円を報酬として受領した。"}, {"m": "ウ", "t": "Ａは、土地付建物について、売主と買主双方から媒介を依頼され、代金 3,500 万円（消費税等相当額を含み、土地代金は 2,400 万円である。）の売買契約を成立させ、売主と買主からそれぞれ 110 万円を報酬として受領したほか、売主の特別の依頼に基づき行った遠隔地への現地調査に要した実費の費用について、売主が事前に負担を承諾していたので、売主から9 万円を受領した。"}]}, {"stem": "宅地建物取引士に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引士資格試験に合格した者は、宅地又は建物の取引に関する実務の経験期間が2 年に満たない場合であっても、試験に合格した日から 1 年以内に登録を受けようとするときには、都道府県知事が指定する講習を受講することにより、宅地建物取引士の登録を受けることができる。", "宅地建物取引士証は、更新を受けることなくその有効期間が経過した場合、その効力を失うが、当該宅地建物取引士証を都道府県知事に返納する必要はない。", "宅地建物取引士は、他人に自己の名義の使用を許し、当該他人がその名義で宅地建物取引士である旨の表示をしたときは、法第 68 条の規定に基づく処分の対象となるが、当該他人が宅地建物取引士の登録を受けた者であるときはこの限りでない。", "宅地建物取引業者は、その事務所唯一の専任の宅地建物取引士が宅地建物取引士証の有効期間の経過により効力を失い宅地建物取引士でなくなったときは、 2 週間以内に法第 31 条の3第1 項の規定に適合させるため必要な措置を執らなければならない。"], "page": 17}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではない個人Ｂとの間で宅地の売買契約を締結し、手付金を支払ったＢが、宅地建物取引業法第 37 条の 2 の規定に基づくいわゆるクーリング・オフにより、当該売買契約を契約締結の日の翌日に解除しようとしている。この場合に関する次の記述のうち、誤っているものはどれか。", "ch": ["Ａがクーリング・オフについて告げるときに交付すべき書面には、Ａの商号又は名称及び住所並びに免許証番号の記載は必要であるが、Ａの宅地建物取引士の記名は必要ない。", "Ｂが、自らの申出により、Ｂの勤務する会社の事務所において、宅地の買受けの申込み及びＡとの売買契約の締結をした場合、Ｂは、クーリング・オフによる当該売買契約の解除を行うことができない。", "Ｂが、自らの申出により、喫茶店において、宅地の買受けの申込み及びＡとの売買契約の締結をした場合、Ｂは、クーリング・オフによる当該売買契約の解除を行うことができる。", "Ｂは、自らの申出により、Ｂが融資を受ける銀行（宅地建物取引業者ではない。）において、宅地の買受けの申込み及びＡとの売買契約の締結をした場合、クーリング・オフによる当該売買契約の解除を行うことができない。"], "page": 17}, {"stem": "次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["国土交通大臣又は都道府県知事は、その免許を受けた宅地建物取引業者が法第 65 条第 1項の規定による指示に従わない場合、その業務の全部又は一部の停止を命ずることができ、業務の停止の処分に違反した場合、免許を取り消さなければならない。", "国土交通大臣又は都道府県知事は、その免許を受けた宅地建物取引業者の事務所の所在地を確知できないときは、その事実を公告し、その公告の日から 2 週間を経過しても当該宅地建物取引業者から申出がないときは、免許を取り消すことができる。", "国土交通大臣又は都道府県知事は、法第 66 条の規定による免許の取消しの処分をしようとするときは、聴聞を行わなければならないが、当該聴聞は、公開することが相当と認められる場合を除き、公開されない。", "国土交通大臣又は都道府県知事は、法第 66 条の規定による免許の取消しの処分をしたときはその旨を公告しなければならないが、法第 65 条第 2 項の規定による業務の停止の処分をしたときはその旨の公告はしなくともよい。"], "page": 18}, {"stem": "宅地建物取引業者Ａが、ＢからＢ所有の中古住宅の売却の依頼を受け、Ｂと専任媒介契約（専属専任媒介契約ではないものとする。）を締結した。この場合における次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["Ａは当該中古住宅の売買契約が成立しても、当該中古住宅の引渡しが完了していなければ、売買契約が成立した旨を指定流通機構に通知する必要はない。", "Ｂが宅地建物取引業者である場合は、当該契約が国土交通大臣が定める標準媒介契約約款に基づくものであるか否かの別を、法第 34 条の2第1 項に規定する書面に記載する必要はない。", "Ａに対して当該中古住宅について買受けの申込みがなかった場合でも、ＡはＢに対して、当該契約に係る業務の処理状況を 2 週間に 1 回以上報告しなければならないが、その報告は必ずしも書面で行う必要はない。", "Ｂが当該中古住宅について、法第 34 条の 2 第 1 項第 4 号に規定する建物状況調査を実施する者のあっせんを希望しなかった場合は、Ａは同項に規定する書面に同調査を実施する者のあっせんに関する事項を記載する必要はない。"], "page": 18}, {"stem": "宅地建物取引業者がその業務に関して行う広告に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、誤っているものはどれか。", "ch": ["宅地の販売に関する広告をインターネットで行った場合において、当該宅地の売買契約が成立した後も継続して広告を掲載していた場合、当該広告を掲載し続けることは法第 32 条の規定に違反する。", "建物の所有者と賃貸借契約を締結し、当該建物を自らが貸主となって貸借（転貸）するための広告をする場合においては、自らが契約の当事者となって貸借を成立させる旨を当該広告に明示しなくても、法第 34 条の規定に違反しない。", "造成工事に必要とされる法令に基づく許可等の処分があった宅地について、工事完了前に当該宅地の販売に関する広告をするときは、法令に基づく許可等の処分があったことを明示すれば、取引態様の別について明示する必要はない。", "複数の区画がある分譲地の売買について、数回に分けて広告をする場合は、最初に行う広告だけではなく、次回以降の広告の都度取引態様の別を明示しなければならない。"], "page": 19}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではない個人Ｂとの間で、土地付建物を 4,000 万円で売却する売買契約（所有権の登記は当該土地付建物の引渡し時に行うものとする。）を締結する場合における宅地建物取引業法（以下この問において「法」という。）第 41 条又は第 41 条の 2 の規定に基づく手付金等の保全措置（以下この問において「保全措置」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["Ａが、保全措置を講じずにＢから手付金 100 万円を受領する場合、その旨を、法第 35 条の規定に基づく重要事項説明書に記載する必要があるが、法第 37 条の規定により交付する書面に記載する必要はない。", "当該建物が建築工事の完了後の建物である場合、ＡがＢから手付金 100 万円を受領する際には保全措置は不要であるが、その後、当該土地付建物を引き渡す前に中間金 400 万円を受領するためには、手付金 100 万円と合わせて保全措置を講じた後でなければ、その中間金を受領することができない。", "当該建物が建築工事の完了前の建物である場合において、Ａは、保全措置を講じずに、Ｂから手付金 300 万円を受領することができる。", "当該土地付建物の引渡し前に、ＢはＡに対して 2,000 万円を中間金として支払う契約になっていたが、Ａがその中間金について保全措置を講じていないときは、Ｂはこの中間金の支払いを拒むことができる。"], "page": 19}, {"stem": "宅地建物取引業者Ａが宅地建物取引業法第 37 条の規定により交付すべき書面（以下この問において「37 条書面」という。）に記載すべき事項を電磁的方法により提供すること（以下この問において「37 条書面の電磁的方法による提供」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["Ａが自ら売主として締結する宅地の売買契約において、37 条書面の電磁的方法による提供を行う場合、当該契約の相手方に対し、あらかじめ、電磁的方法による提供に用いる電磁的方法の種類及び内容を宅地建物取引士に説明させなければならない。", "Ａが媒介業者として関与する建物賃貸借契約において、37 条書面の電磁的方法による提供を行う場合、その方法は 37 条書面の交付に係る宅地建物取引士が明示されるものでなければならない。", "Ａが自ら売主として締結する宅地の売買契約において、契約の相手方から 37 条書面の電磁的方法による提供を行うことについて書面により承諾を得た場合は、その後に当該契約の相手方から書面で電磁的方法による提供を受けない旨の申出があったときでも、37 条書面の電磁的方法による提供をすることができる。", "Ａが媒介業者として関与する宅地の売買契約において、37 条書面の電磁的方法による提供を行う場合であっても、提供後速やかに 37 条書面を交付しなければならない。"], "page": 20}, {"stem": "営業保証金及び宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。", "ch": ["宅地建物取引業者で保証協会に加入しようとする者は、その加入しようとする日までに、政令で定める額の弁済業務保証金分担金を当該保証協会に納付しなければならない。", "保証協会の社員と宅地建物取引業に関し取引をした者（宅地建物取引業者に該当する者を除く。）は、その取引により生じた債権に関し、当該社員が社員ではないとしたならばその者が供託すべき営業保証金の額に相当する額の範囲内で弁済を受ける権利を有する。", "宅地建物取引業者は、保証協会の社員の地位を失ったときは、保証協会が弁済業務保証金の還付請求権者に対し、一定期間内に宅地建物取引業法第 64 条の8第2 項の規定による認証を受けるため申し出るべき旨の公告をした後でなければ、弁済業務保証金分担金の返還を受けることができない。", "宅地建物取引業者は、一部の事務所を廃止し営業保証金を取り戻そうとする場合には、供託した営業保証金につき還付を請求する権利を有する者に対し、公告をすることなく営業保証金を取り戻すことができる。"], "page": 20}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第 35 条に規定する重要事項説明に関する次の記述のうち、正しいものはいくつあるか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 21, "items": [{"m": "ア", "t": "建物の貸借の媒介を行う場合、水防法施行規則第 11 条第 1 号の規定により市町村の長が提供する水害ハザードマップに当該建物の位置が含まれているときは、その所在地を示して説明しなければならない。"}, {"m": "イ", "t": "既存住宅の売買を行う場合、宅地建物取引業法第 34 条の 2 第 1 項第 4 号に規定する建物状況調査の実施後、 1 年を経過していないものについては、建物状況調査の実施の有無、実施している場合の結果の概要について説明しなければならない。"}, {"m": "ウ", "t": "宅地の売買を行う場合、宅地の造成に関する工事の完了前のものであるときは、完了時における当該宅地に接する道路の構造及び幅員を説明しなければならない。"}, {"m": "エ", "t": "建物の貸借の媒介を行う場合、私道に関する負担の有無や内容を事前に調査し、説明しなければならない。"}]}, {"stem": "宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者Ａが、免許の更新の申請をした場合において、従前の免許の有効期間の満了の日までに、その申請について処分がなされないときは、従前の免許は、有効期間の満了後その効力を失う。", "宅地建物取引業者Ｂが宅地建物取引業者Ｃに自己の名義をもって宅地建物取引業を営ませる行為は、Ｂが名義の使用を書面で指示している場合であれば、宅地建物取引業法に違反しない。", "宅地建物取引業者Ｄ（甲県知事免許）は、国土交通大臣に免許換えの申請をし、その免許を受けなければ、乙県所在の宅地の売買の媒介をすることはできない。", "宅地建物取引業者Ｅ（丙県知事免許）の免許の更新に当たって、丙県知事は宅地建物取引業法第 3 条の 2 に基づき条件を付すことができ、Ｅが免許の更新に当たって付された条件に違反したときは、丙県知事はＥの免許を取り消すことができる。"], "page": 21}, {"stem": "宅地建物取引業法第 50 条第 2 項の届出をすべき場所に関する次の記述のうち、誤っているものはどれか。なお、これらの場所では、宅地若しくは建物の売買若しくは交換の契約（予約を含む。）若しくは宅地若しくは建物の売買、交換若しくは貸借の代理若しくは媒介の契約を締結し、又はこれらの契約の申込みを受けるものとする。", "ch": ["届出をすべき場所として、継続的に業務を行うことができる施設を有する場合で事務所以外のものが定められているが、当該場所には 1 名以上の成年者である専任の宅地建物取引士を置かなければならない。", "届出をすべき場所として、宅地建物取引業者が 10 区画以上の一団の宅地又は 10 戸以上の一団の建物の分譲（以下この問において「一団の宅地建物の分譲」という。）をする場合に設置する案内所が定められているが、当該案内所が土地に定着する建物内に設けられる場合、クーリング・オフ制度の適用が除外される。", "届出をすべき場所として、他の宅地建物取引業者が行う一団の宅地建物の分譲の代理又は媒介をする場合に設置する案内所が定められており、この場合は、代理又は媒介を行う宅地建物取引業者が届出をするが、売主業者自身も当該案内所で売買契約の申込みを受ける場合は、売主業者も届出をする。", "届出をすべき場所として、宅地建物取引業者が業務に関し展示会その他これに類する催しを実施する場所が定められているが、その催しを開始する 10 日前までに、実施場所を管轄する都道府県知事に届け出なければならず、免許を受けた国土交通大臣又は都道府県知事に届け出る必要はない。"], "page": 22}, {"stem": "宅地建物取引業者が媒介により既存建物の貸借の契約を成立させた場合、宅地建物取引業法第 37 条の規定により当該貸借の契約当事者に対して交付すべき書面に必ず記載しなければならない事項の組合せとして正しいものは次の 1 から 4 のうちどれか。", "ch": ["ア、イ", "イ、ウ", "ウ、エ", "ア、エ"], "page": 23, "items": [{"m": "ア", "t": "当該建物に係る租税その他の公課の負担"}, {"m": "イ", "t": "敷金や共益費など借賃以外の金銭の授受に関する定めがあるときは、その額並びに当該金銭の授受の時期及び目的"}, {"m": "ウ", "t": "損害賠償額の予定又は違約金に関する定めがあるときは、その内容"}, {"m": "エ", "t": "建物の構造耐力上主要な部分又は雨水の侵入を防止する部分として国土交通省令で定めるものの状況"}]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第 35 条に規定する重要事項の説明に関する次の記述のうち、正しいものはいくつあるか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["一つ", "二つ", "三つ", "なし"], "page": 23, "items": [{"m": "ア", "t": "中古マンションの一室の売買の媒介を行う場合、抵当権が設定されていても、契約日までにその登記が抹消される予定であるときは、当該抵当権の内容について説明しなくてもよい。"}, {"m": "イ", "t": "宅地の貸借の媒介を行う場合、借地権の存続期間を 50 年とする賃貸借契約において、当該契約終了時における当該宅地の上の建物の取壊しに関する事項を定めようとするときは、その内容を説明しなければならない。"}, {"m": "ウ", "t": "建物の貸借の媒介を行う場合、当該建物が住宅の品質確保の促進等に関する法律第 5 条第1 項に規定する住宅性能評価を受けた新築住宅であるときは、その旨を説明しなければならない。"}, {"m": "エ", "t": "宅地の売買の媒介を行う場合、当該宅地が急傾斜地の崩壊による災害の防止に関する法律第 3 条の規定に基づく急傾斜地崩壊危険区域内にあることは説明しなければならないが、当該区域内における行為の制限の概要については説明しなくてもよい。"}]}, {"stem": "次の記述のうち、宅地建物取引業法の規定及び「宅地建物取引業者による人の死の告知に関するガイドライン」によれば、誤っているものはどれか。", "ch": ["宅地建物取引業者は、宅地建物取引業に係る契約の締結の勧誘をするに際し、宅地建物取引業者の相手方等に対し、利益を生ずることが確実であると誤解させるべき断定的判断を提供する行為をしてはならない。", "宅地建物取引業者は、宅地又は建物の売買の契約の締結の勧誘をするに際し、宅地建物取引業者の相手方等に対し、宅地又は建物の引渡しの時期について故意に不実のことを告げた場合であっても、契約が成立したときに宅地建物取引業法第 37 条の規定により交付すべき書面に当該事項を正確に記載すればよい。", "「宅地建物取引業者による人の死の告知に関するガイドライン」によれば、売買取引の対象となる居住用不動産において、自然死や日常生活の中での不慮の死が発生した場合であっても、過去に人が死亡し、長期間にわたって人知れず放置されたこと等に伴ういわゆる特殊清掃や大規模リフォーム等が行われていなければ、宅地建物取引業者は、原則として、買主に対してこれを告げなくてもよい。", "「宅地建物取引業者による人の死の告知に関するガイドライン」によれば、賃貸借取引の対象となる居住用不動産において、自然死や日常生活の中での不慮の死以外の死が発生した場合であっても、特段の事情がない限り、当該死が発覚してから概ね 3 年間を経過した後は、宅地建物取引業者は、原則として、借主に対してこれを告げなくてもよい。"], "page": 24}, {"stem": "宅地建物取引士の登録及び宅地建物取引士証に関する次の記述のうち、誤っているものはどれか。", "ch": ["宅地建物取引士の登録を受けている者は、宅地建物取引士証の交付を受けていない場合でも、その住所に変更があれば、登録を受けている都道府県知事に変更の登録を申請しなければならない。", "宅地建物取引士は、宅地建物取引士の信用又は品位を害するような行為をしてはならず、この行為には宅地建物取引士としての職務に必ずしも直接関係しない行為や私的な行為も含まれる。", "宅地建物取引士は、取引の関係者から請求があったときは、宅地建物取引士証を提示しなければならないが、その際、個人情報保護の観点から宅地建物取引士証の住所欄にシールを貼った上で提示することが認められている。", "宅地建物取引士証に記載される宅地建物取引士の氏名については現姓を用いなければならず、旧姓を併記することは認められていない。"], "page": 24}, {"stem": "宅地建物取引業者Ａが宅地建物取引業法第 37 条の規定により交付すべき書面（以下この問において「37 条書面」という。）に関する次の記述のうち、宅地建物取引業法の規定に違反しないものはどれか。", "ch": ["Ａは、建築工事完了前の建物の売買契約を媒介したときに、37 条書面に記載する当該建物を特定するために必要な表示について、宅地建物取引業法第 35 条の規定に基づく重要事項の説明において使用した図書を交付することによって行った。", "Ａは、貸主Ｂと借主Ｃとの間で締結された建物の賃貸借契約を媒介したときに、借賃の額、支払時期及び支払方法について定められていたが、ＢとＣの承諾を得たので、37 条書面に記載しなかった。", "Ａは、宅地建物取引業者Ｄと宅地建物取引業者Ｅとの間で締結された宅地の売買契約を媒介したときに、37 条書面に当該宅地の引渡しの時期を記載しなかった。", "Ａが建物の売買契約を買主として締結した場合に、売主Ｆに承諾を得たので、37 条書面をＦに交付しなかった。"], "page": 25}, {"stem": "特定住宅瑕疵担保責任の履行の確保等に関する法律に基づく住宅販売瑕か疵し担保保証金（以下この問において「保証金」という。）の供託又は住宅販売瑕か疵し担保責任保険契約（以下この問において「保険契約」という。）の締結に関する次の記述のうち、正しいものはどれか。", "ch": ["自ら売主として宅地建物取引業者ではない買主に引き渡した新築住宅の戸数が、基準日前10 年間に 10 戸あるが、当該基準日前 1 年間は 0 戸である場合、当該売主である宅地建物取引業者は、当該基準日に係る保証金の供託又は保険契約の締結の状況について届出を行う必要はない。", "自ら売主として新築住宅を宅地建物取引業者ではない買主に引き渡した宅地建物取引業者は、基準日に係る保証金の供託及び保険契約の締結の状況について届出をしなければ、当該基準日の翌日から起算して 50 日を経過した日以後においては、新たに自ら売主となる新築住宅の売買契約を締結してはならない。", "保険契約は、新築住宅の引渡し時から有効でなければならないが、買主が当該住宅の引渡し時から 10 年以内に当該住宅を転売した場合、当該保険契約は解除される。", "自ら売主として宅地建物取引業者ではない買主に新築住宅を引き渡した宅地建物取引業者が、保証金を供託する場合、当該住宅の床面積が 25 m² 以下であるときは、新築住宅の合計戸数の算定に当たって、 3 戸をもって 1 戸と数えることになる。"], "page": 25}, {"stem": "独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["証券化支援業務（買取型）において、機構による譲受けの対象となる住宅の購入に必要な資金の貸付けに係る金融機関の貸付債権には、当該住宅の購入に付随する当該住宅の改良に必要な資金は含まれない。", "機構は、地震に対する安全性の向上を主たる目的とする住宅の改良に必要な資金の貸付けを業務として行っている。", "機構は、民間金融機関による住宅資金の供給を支援するため、民間金融機関が貸し付けた住宅ローンについて、住宅融資保険を引き受けている。", "機構は、住宅のエネルギー消費性能（建築物のエネルギー消費性能の向上等に関する法律第 2 条第 1 項第 2 号に規定するエネルギー消費性能をいう。）の向上を主たる目的とする住宅の改良に必要な資金の貸付けを業務として行っている。"], "page": 26}, {"stem": "宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。", "ch": ["新築分譲住宅の予告広告（価格が確定していないため、直ちに取引することができない物件について、取引開始時期をあらかじめ告知する広告）を新聞折込チラシを用いて行った場合は、本広告を新聞折込チラシ以外の媒体を用いて行ってはならない。", "土地取引において、当該土地上に廃屋が存在するとき、実際の土地を見れば廃屋が存在することは明らかであるため、廃屋が存在する旨を明示する必要はない。", "交通の利便性について、電車、バス等の交通機関の所要時間を表示する場合は、朝の通勤ラッシュ時の所要時間ではなく、平常時の所要時間を明示しなければならない。", "居住の用に供されたことはないが建築後 1 年以上経過した一戸建て住宅について、新築である旨を表示することはできない。"], "page": 26}, {"stem": "次の記述のうち、正しいものはどれか。", "ch": ["令和 6 年地価公示（令和6年3 月公表）によれば、令和5年1 月以降の 1 年間の地価の動向は、三大都市圏・地方圏ともに、全用途平均・住宅地・商業地のいずれも 3 年連続で上昇した。", "令和 4 年度宅地建物取引業法の施行状況調査（令和 5 年 10 月公表）によれば、令和 5 年3 月末における宅地建物取引士の総登録者数は、200 万人を超えている。", "令和 5 年住宅・土地統計調査住宅数概数集計（速報集計）結果（令和6年4 月公表）によれば、令和 5 年 10 月 1 日現在における賃貸・売却用及び二次的住宅（別荘など）を除く空き家は、900 万戸に達している。", "建築着工統計（令和 6 年 1 月公表）によれば、令和 5 年の新設住宅着工戸数は 90 万戸を超え、 3 年連続で増加した。"], "page": 27}, {"stem": "土地に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["30 度以上の角度をなす斜面を背後に控える宅地は、崖面への保護対策を講じるか、擁壁を設けるなどの必要がある。", "高さ 2 m 以下の擁壁であれば、水抜き孔を有しなくても、地震による被害が生じることはない。", "重力式擁壁は、擁壁の自重により、背面からの土圧に抵抗するコンクリート構造物である。", "工場跡地や埋立地などでは、重金属や揮発性有機化合物などによる土壌汚染が問題となることがある。"], "page": 27}, {"stem": "建物の構造に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["ラーメン構造は、柱を鉛直方向、梁はりを水平方向に配置し、接合部を強く固めた構造である。", "ブレース構造は、柱や梁はりなどで構成された四角形の対角線上に部材を入れた構造である。", "ブレース構造は、骨組全てに用いることが多く、ラーメン構造など他の構造と併用することはない。", "壁式構造は、板状の壁と床を箱形に組み、建物とする構造で、原則として、柱や梁はりは用いない。受　験　番　号―受 験 者 氏 名令和 6 年度問題"], "page": 27}]},
