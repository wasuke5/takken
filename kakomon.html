   qs:[{"stem": "次の記述のうち、民法の条文に規定されているものはどれか。", "ch": ["利息を生ずべき債権について別段の意思表示がないときは、その利率は、年3％とする旨", "賃貸人は、賃借人が賃貸借に基づく金銭債務を履行しないときは、敷金をその債務の弁済に充てることができる旨", "免責的債務引受は、債権者と引受人となる者との契約によってすることができる旨", "契約により当事者の一方が第三者に対してある給付をすることを約したときは、その第三者は、債務者に対して直接にその給付を請求する権利を有する旨"], "page": 2, "img": ["q01_0.jpg"]}, {"stem": "制限行為能力者に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["古着の仕入販売に関する営業を許された未成年者は、成年者と同一の行為能力を有するので、法定代理人の同意を得ないで、自己が居住するために建物を第三者から購入したとしても、その法定代理人は当該売買契約を取り消すことができない。", "被保佐人が、不動産を売却する場合には、保佐人の同意が必要であるが、贈与の申し出を拒絶する場合には、保佐人の同意は不要である。", "成年後見人が、成年被後見人に代わって、成年被後見人が居住している建物を売却する際、後見監督人がいる場合には、後見監督人の許可があれば足り、家庭裁判所の許可は不要である。", "被補助人が、補助人の同意を得なければならない行為について、同意を得ていないにもかかわらず、詐術を用いて相手方に補助人の同意を得たと信じさせていたときは、被補助人は当該行為を取り消すことができない。"], "page": 2, "img": ["q02_0.jpg"]}, {"stem": "ＡがＡ所有の甲土地をＢに売却した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["Ａが甲土地をＢに売却する前にＣにも売却していた場合、Ｃは所有権移転登記を備えていなくても、Ｂに対して甲土地の所有権を主張することができる。", "ＡがＢの詐欺を理由に甲土地の売却の意思表示を取り消しても、取消しより前にＢが甲土地をＤに売却し、Ｄが所有権移転登記を備えた場合には、ＤがＢの詐欺の事実を知っていたか否かにかかわらず、ＡはＤに対して甲土地の所有権を主張することができない。", "Ａから甲土地を購入したＢは、所有権移転登記を備えていなかった。Ｅがこれに乗じてＢに高値で売りつけて利益を得る目的でＡから甲土地を購入し所有権移転登記を備えた場合、ＥはＢに対して甲土地の所有権を主張することができない。", "ＡＢ間の売買契約が、Ｂの意思表示の動機に錯誤があって締結されたものである場合、Ｂが所有権移転登記を備えていても、ＡはＢの錯誤を理由にＡＢ間の売買契約を取り消すことができる。"], "page": 3, "img": ["q03_0.jpg"]}, {"stem": "Ａは、Ａ所有の甲土地にＢから借り入れた3,000万円の担保として抵当権を設定した。この場合における次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["Ａが甲土地に抵当権を設定した当時、甲土地上にＡ所有の建物があり、当該建物をＡがＣに売却した後、Ｂの抵当権が実行されてＤが甲土地を競落した場合、ＤはＣに対して、甲土地の明渡しを求めることはできない。", "甲土地上の建物が火災によって焼失してしまったが、当該建物に火災保険が付されていた場合、Ｂは、甲土地の抵当権に基づき、この火災保険契約に基づく損害保険金を請求することができる。", "ＡがＥから500万円を借り入れ、これを担保するために甲土地にＥを抵当権者とする第2順位の抵当権を設定した場合、ＢとＥが抵当権の順位を変更することに合意すれば、Ａの同意がなくても、甲土地の抵当権の順位を変更することができる。", "Ｂの抵当権設定後、Ａが第三者であるＦに甲土地を売却した場合、ＦはＢに対して、民法第383条所定の書面を送付して抵当権の消滅を請求することができる。"], "page": 3, "img": ["q04_0.jpg"]}, {"stem": "Ａが、Ｂに対する債権をＣに譲渡した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["ＡのＢに対する債権に譲渡禁止の特約があり、Ｃがその特約の存在を知りながら債権の譲渡を受けていれば、Ｃからさらに債権の譲渡を受けた転得者Ｄがその特約の存在を知らなかったことにつき重大な過失がない場合でも、ＢはＤに対して特約の存在を対抗することができる。", "ＡがＢに債権譲渡の通知を発送し、その通知がＢに到達していなかった場合には、Ｂが異議をとどめない承諾をしても、ＢはＣに対して当該債権に係る債務の弁済を拒否することができる。", "ＡのＢに対する債権に譲渡禁止の特約がなく、Ｃに譲渡された時点ではまだ発生していない将来の取引に関する債権であった場合、その取引の種類、金額、期間などにより当該債権が特定されていたときは、特段の事情がない限り、ＡからＣへの債権譲渡は有効である。", "Ａに対し弁済期が到来した貸金債権を有していたＢは、Ａから債権譲渡の通知を受けるまでに、異議をとどめない承諾をせず、相殺の意思表示もしていなかった。その後、Ｂは、Ｃから支払請求を受けた際に、Ａに対する貸金債権との相殺の意思表示をしたとしても、Ｃに対抗することはできない。"], "page": 4, "img": ["q05_0.jpg"]}, {"stem": "Ａを売主、Ｂを買主とする甲土地の売買契約（以下この問において「本件契約」という。）が締結された場合の売主の担保責任に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["Ｂが、甲土地がＣの所有物であることを知りながら本件契約を締結した場合、Ａが甲土地の所有権を取得してＢに移転することができないときは、ＢはＡに対して、損害賠償を請求することができない。", "Ｂが、甲土地がＣの所有物であることを知りながら本件契約を締結した場合、Ａが甲土地の所有権を取得してＢに移転することができないときは、Ｂは、本件契約を解除することができる。", "Ｂが、Ａ所有の甲土地が抵当権の目的となっていることを知りながら本件契約を締結した場合、当該抵当権の実行によってＢが甲土地の所有権を失い損害を受けたとしても、ＢはＡに対して、損害賠償を請求することができない。", "Ｂが、Ａ所有の甲土地が抵当権の目的となっていることを知りながら本件契約を締結した場合、当該抵当権の実行によってＢが甲土地の所有権を失ったときは、Ｂは、本件契約を解除することができる。"], "page": 4, "img": ["q06_0.jpg"]}, {"stem": "ＡがＢから賃借する甲建物に、運送会社Ｃに雇用されているＤが居眠り運転するトラックが突っ込んで甲建物の一部が損壊した場合（以下「本件事故」という。）に関する次の記述のうち、民法の規定及び判例によれば、正しいものはいくつあるか。なお、ＤはＣの業務として運転をしていたものとする。", "ch": ["一つ", "二つ", "三つ", "なし"], "items": [{"m": "ア", "t": "ＡはＢに対し、甲建物の滅失した部分の割合に応じ、賃料の減額を請求することができる。"}, {"m": "イ", "t": "Ａは、甲建物の残りの部分だけでは賃借した目的を達することができない場合、Ｂとの賃貸借契約を解除することができる。"}, {"m": "ウ", "t": "Ｃは、使用者責任に基づき、Ｂに対して本件事故から生じた損害を賠償した場合、Ｄに対して求償することができるが、その範囲が信義則上相当と認められる限度に制限される場合がある。"}], "page": 5, "img": ["q07_0.jpg"]}, {"stem": "ＡがＢに甲建物を月額10万円で賃貸し、ＢがＡの承諾を得て甲建物をＣに適法に月額15万円で転貸している場合における次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["Ａは、Ｂの賃料の不払いを理由に甲建物の賃貸借契約を解除するには、Ｃに対して、賃料支払の催告をして甲建物の賃料を支払う機会を与えなければならない。", "ＢがＡに対して甲建物の賃料を支払期日になっても支払わない場合、ＡはＣに対して、賃料10万円をＡに直接支払うよう請求することができる。", "ＡがＢの債務不履行を理由に甲建物の賃貸借契約を解除した場合、ＣのＢに対する賃料の不払いがなくても、ＡはＣに対して、甲建物の明渡しを求めることができる。", "ＡがＢとの間で甲建物の賃貸借契約を合意解除した場合、ＡはＣに対して、Ｂとの合意解除に基づいて、当然には甲建物の明渡しを求めることができない。"], "page": 5, "img": ["q08_0.jpg"]}, {"stem": "次の1から4までの記述のうち、民法の規定及び下記判決文によれば、誤っているものはどれか。\n\n（判決文）\n契約の一方当事者が、当該契約の締結に先立ち、信義則上の説明義務に違反して、当該契約を締結するか否かに関する判断に影響を及ぼすべき情報を相手方に提供しなかった場合には、上記一方当事者は、相手方が当該契約を締結したことにより被った損害につき、不法行為による賠償責任を負うことがあるのは格別、当該契約上の債務の不履行による賠償責任を負うことはないというべきである。（中略）上記のような場合の損害賠償請求権は不法行為により発生したものである（略）。", "ch": ["信義則上の説明義務に違反して、当該契約を締結するか否かに関する判断に影響を及ぼすべき情報を買主に提供しなかった売主に対する買主の損害賠償請求権は、買主が損害及び加害者を知った時から3年間行使しないときは、時効により消滅する。", "信義則上の説明義務に違反して、当該契約を締結するか否かに関する判断に影響を及ぼすべき情報を買主に提供しなかった売主に対する買主の損害賠償請求権は、損害を被っていることを買主が知らない場合でも、売買契約から10年間行使しないときは、時効により消滅する。", "買主に対して債権を有している売主は、信義則上の説明義務に違反して、当該契約を締結するか否かに関する判断に影響を及ぼすべき情報を買主に提供しなかった売主に対する買主の損害賠償請求権を受働債権とする相殺をもって、買主に対抗することができない。", "売主が信義則上の説明義務に違反して、当該契約を締結するか否かに関する判断に影響を及ぼすべき情報を買主に提供しなかった場合、買主は、売主に対して、この説明義務違反を理由に、売買契約上の債務不履行責任を追及することはできない。"], "page": 6, "img": ["q09_0.jpg"]}, {"stem": "甲建物を所有するＡが死亡し、相続人がそれぞれＡの子であるＢ及びＣの2名である場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["Ｂが甲建物を不法占拠するＤに対し明渡しを求めたとしても、Ｂは単純承認をしたものとはみなされない。", "Ｃが甲建物の賃借人Ｅに対し相続財産である未払賃料の支払いを求め、これを収受領得したときは、Ｃは単純承認をしたものとみなされる。", "Ｃが単純承認をしたときは、Ｂは限定承認をすることができない。", "Ｂが自己のために相続の開始があったことを知らない場合であっても、相続の開始から3か月が経過したときは、Ｂは単純承認をしたものとみなされる。"], "page": 7, "img": ["q10_0.jpg"]}, {"stem": "Ａが居住用の甲建物を所有する目的で、期間30年と定めてＢから乙土地を賃借した場合に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。なお、Ａは借地権登記を備えていないものとする。", "ch": ["Ａが甲建物を所有していても、建物保存登記をＡの子Ｃ名義で備えている場合には、Ｂから乙土地を購入して所有権移転登記を備えたＤに対して、Ａは借地権を対抗することができない。", "Ａが甲建物を所有していても、登記上の建物の所在地番、床面積等が少しでも実際のものと相違している場合には、建物の同一性が否定されるようなものでなくても、Ｂから乙土地を購入して所有権移転登記を備えたＥに対して、Ａは借地権を対抗することができない。", "ＡＢ間の賃貸借契約を公正証書で行えば、当該契約の更新がなく期間満了により終了し、終了時にはＡが甲建物を収去すべき旨を有効に規定することができる。", "Ａが地代を支払わなかったことを理由としてＢが乙土地の賃貸借契約を解除した場合、契約に特段の定めがないときは、Ｂは甲建物を時価で買い取らなければならない。"], "page": 7, "img": ["q11_0.jpg"]}, {"stem": "ＡはＢと、Ｂ所有の甲建物につき、居住を目的として、期間3年、賃料月額20万円と定めて賃貸借契約（以下この問において「本件契約」という。）を締結した。この場合における次の記述のうち、借地借家法の規定及び判例によれば、誤っているものはどれか。", "ch": ["ＡもＢも相手方に対し、本件契約の期間満了前に何らの通知もしなかった場合、従前の契約と同一の条件で契約を更新したものとみなされるが、その期間は定めがないものとなる。", "ＢがＡに対し、本件契約の解約を申し入れる場合、甲建物の明渡しの条件として、一定額以上の財産上の給付を申し出たときは、Ｂの解約の申入れに正当事由があるとみなされる。", "甲建物の適法な転借人であるＣが、Ｂの同意を得て甲建物に造作を付加した場合、期間満了により本件契約が終了するときは、ＣはＢに対してその造作を時価で買い取るよう請求することができる。", "本件契約が借地借家法第38条の定期建物賃貸借で、契約の更新がない旨を定めた場合でも、ＢはＡに対し、同条所定の通知期間内に、期間満了により本件契約が終了する旨の通知をしなければ、期間3年での終了をＡに対抗することができない。"], "page": 8, "img": ["q12_0.jpg"]}, {"stem": "建物の区分所有等に関する法律に関する次の記述のうち、正しいものはどれか。", "ch": ["管理者は、集会において、毎年2回一定の時期に、その事務に関する報告をしなければならない。", "管理者は、規約に特別の定めがあるときは、共用部分を所有することができる。", "管理者は、自然人であるか法人であるかを問わないが、区分所有者でなければならない。", "各共有者の共用部分の持分は、規約で別段の定めをしない限り、共有者数で等分することとされている。"], "page": 8, "img": ["q13_0.jpg"]}, {"stem": "不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。", "ch": ["新築した建物又は区分建物以外の表題登記がない建物の所有権を取得した者は、その所有権の取得の日から1月以内に、所有権の保存の登記を申請しなければならない。", "登記することができる権利には、抵当権及び賃借権が含まれる。", "建物が滅失したときは、表題部所有者又は所有権の登記名義人は、その滅失の日から1月以内に、当該建物の滅失の登記を申請しなければならない。", "区分建物の所有権の保存の登記は、表題部所有者から所有権を取得した者も、申請することができる。"], "page": 9, "img": ["q14_0.jpg"]}, {"stem": "国土利用計画法第23条に規定する届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["市街化区域内の土地（面積2,500㎡）を購入する契約を締結した者は、その契約を締結した日から起算して3週間以内に事後届出を行わなければならない。", "Ａが所有する監視区域内の土地（面積10,000㎡）をＢが購入する契約を締結した場合、Ａ及びＢは事後届出を行わなければならない。", "都市計画区域外に所在し、一団の土地である甲土地（面積6,000㎡）と乙土地（面積5,000㎡）を購入する契約を締結した者は、事後届出を行わなければならない。", "市街化区域内の甲土地（面積3,000㎡）を購入する契約を締結した者が、その契約締結の1月後に甲土地と一団の土地である乙土地（面積4,000㎡）を購入することとしている場合においては、甲土地の事後届出は、乙土地の契約締結後に乙土地の事後届出と併せて行うことができる。"], "page": 9, "img": ["q15_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。", "ch": ["市街地開発事業等予定区域に係る市街地開発事業又は都市施設に関する都市計画には、施行予定者をも定めなければならない。", "準都市計画区域については、都市計画に準防火地域を定めることができる。", "高度利用地区は、用途地域内において市街地の環境を維持し、又は土地利用の増進を図るため、建築物の高さの最高限度又は最低限度を定める地区である。", "地区計画については、都市計画に、地区計画の種類、名称、位置、区域及び面積並びに建築物の建ぺい率及び容積率の最高限度を定めなければならない。"], "page": 9, "img": ["q16_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["開発許可を受けた者は、開発行為に関する工事を廃止するときは、都道府県知事の許可を受けなければならない。", "二以上の都府県にまたがる開発行為は、国土交通大臣の許可を受けなければならない。", "開発許可を受けた者から当該開発区域内の土地の所有権を取得した者は、都道府県知事の承認を受けることなく、当該開発許可を受けた者が有していた当該開発許可に基づく地位を承継することができる。", "都道府県知事は、用途地域の定められていない土地の区域における開発行為について開発許可をする場合において必要があると認めるときは、当該開発区域内の土地について、建築物の敷地、構造及び設備に関する制限を定めることができる。"], "page": 10, "img": ["q17_0.jpg"]}, {"stem": "建築基準法に関する次の記述のうち、正しいものはどれか。", "ch": ["防火地域にある建築物で、外壁が耐火構造のものについては、その外壁を隣地境界線に接して設けることができる。", "高さ30mの建築物には、原則として非常用の昇降機を設けなければならない。", "準防火地域内においては、延べ面積が2,000㎡の共同住宅は準耐火建築物としなければならない。", "延べ面積が1,000㎡を超える耐火建築物は、防火上有効な構造の防火壁によって有効に区画し、かつ、各区画の床面積の合計をそれぞれ1,000㎡以内としなければならない。"], "page": 10, "img": ["q18_0.jpg"]}, {"stem": "建築基準法に関する次の記述のうち、誤っているものはどれか。", "ch": ["特定行政庁が許可した場合、第一種低層住居専用地域内においても飲食店を建築することができる。", "前面道路の幅員による容積率制限は、前面道路の幅員が12m以上ある場合は適用されない。", "公園内にある建築物で特定行政庁が安全上、防火上及び衛生上支障がないと認めて許可したものについては、建ぺい率の制限は適用されない。", "第一種住居地域内における建築物の外壁又はこれに代わる柱の面から敷地境界線までの距離は、当該地域に関する都市計画においてその限度が定められた場合には、当該限度以上でなければならない。"], "page": 10, "img": ["q19_0.jpg"]}, {"stem": "宅地造成等規制法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["宅地造成工事規制区域外に盛土によって造成された一団の造成宅地の区域において、造成された盛土の高さが5m未満の場合は、都道府県知事は、当該区域を造成宅地防災区域として指定することができない。", "宅地造成工事規制区域内において、切土又は盛土をする土地の面積が600㎡である場合、その土地における排水施設は、政令で定める資格を有する者によって設計される必要はない。", "宅地造成工事規制区域内の宅地において、高さが2mを超える擁壁を除却する工事を行おうとする者は、一定の場合を除き、その工事に着手する日の14日前までにその旨を都道府県知事に届け出なければならない。", "宅地造成工事規制区域内において、宅地以外の土地を宅地に転用した者は、一定の場合を除き、その転用した日から14日以内にその旨を都道府県知事に届け出なければならない。"], "page": 11, "img": ["q20_0.jpg"]}, {"stem": "土地区画整理法に関する次の記述のうち、誤っているものはどれか。", "ch": ["施行者は、換地処分を行う前において、換地計画に基づき換地処分を行うため必要がある場合においては、施行地区内の宅地について仮換地を指定することができる。", "仮換地が指定された場合においては、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地の指定の効力発生の日から換地処分の公告がある日まで、仮換地について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができる。", "施行者は、仮換地を指定した場合において、特別の事情があるときは、その仮換地について使用又は収益を開始することができる日を仮換地の指定の効力発生日と別に定めることができる。", "土地区画整理組合の設立の認可の公告があった日後、換地処分の公告がある日までは、施行地区内において、土地区画整理事業の施行の障害となるおそれがある土地の形質の変更を行おうとする者は、当該土地区画整理組合の許可を受けなければならない。"], "page": 11, "img": ["q21_0.jpg"]}, {"stem": "農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["相続により農地を取得する場合は、法第3条第1項の許可を要しないが、相続人に該当しない者に対する特定遺贈により農地を取得する場合も、同項の許可を受ける必要はない。", "法第2条第3項の農地所有適格法人の要件を満たしていない株式会社は、耕作目的で農地を借り入れることはできない。", "法第3条第1項又は法第5条第1項の許可が必要な農地の売買について、これらの許可を受けずに売買契約を締結しても、その所有権の移転の効力は生じない。", "農業者が、市街化調整区域内の耕作しておらず遊休化している自己の農地を、自己の住宅用地に転用する場合、あらかじめ農業委員会へ届出をすれば、法第4条第1項の許可を受ける必要がない。"], "page": 12, "img": ["q22_0.jpg"]}, {"stem": "印紙税に関する次の記述のうち、正しいものはどれか。", "ch": ["印紙税の課税文書である不動産譲渡契約書を作成したが、印紙税を納付せず、その事実が税務調査により判明した場合は、納付しなかった印紙税額と納付しなかった印紙税額の10％に相当する金額の合計額が過怠税として徴収される。", "「Ａの所有する甲土地（価額3,000万円）とＢの所有する乙土地（価額3,500万円）を交換する」旨の土地交換契約書を作成した場合、印紙税の課税標準となる当該契約書の記載金額は3,500万円である。", "「Ａの所有する甲土地（価額3,000万円）をＢに贈与する」旨の贈与契約書を作成した場合、印紙税の課税標準となる当該契約書の記載金額は、3,000万円である。", "売上代金に係る金銭の受取書（領収書）は記載された受取金額が3万円未満の場合、印紙税が課されないことから、不動産売買の仲介手数料として、現金48,600円（消費税及び地方消費税を含む。）を受け取り、それを受領した旨の領収書を作成した場合、受取金額に応じた印紙税が課される。"], "page": 12, "img": ["q23_0.jpg"]}, {"stem": "不動産取得税に関する次の記述のうち、正しいものはどれか。", "ch": ["家屋が新築された日から3年を経過して、なお、当該家屋について最初の使用又は譲渡が行われない場合においては、当該家屋が新築された日から3年を経過した日において家屋の取得がなされたものとみなし、当該家屋の所有者を取得者とみなして、これに対して不動産取得税を課する。", "不動産取得税は、不動産の取得に対して課される税であるので、法人の合併により不動産を取得した場合にも、不動産取得税は課される。", "平成28年4月に取得した床面積240㎡である新築住宅に係る不動産取得税の課税標準の算定については、当該新築住宅の価格から1,200万円が控除される。", "平成28年4月に個人が取得した住宅及び住宅用地に係る不動産取得税の税率は3％であるが、住宅用以外の家屋及びその土地に係る不動産取得税の税率は4％である。"], "page": 13, "img": ["q24_0.jpg"]}, {"stem": "不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、正しいものはどれか。", "ch": ["不動産の鑑定評価によって求める価格は、基本的には正常価格であるが、市場性を有しない不動産については、鑑定評価の依頼目的及び条件に応じて限定価格、特定価格又は特殊価格を求める場合がある。", "同一需給圏とは、一般に対象不動産と代替関係が成立して、その価格の形成について相互に影響を及ぼすような関係にある他の不動産の存する圏域をいうが、不動産の種類、性格及び規模に応じた需要者の選好性によって、その地域的範囲は狭められる場合もあれば、広域的に形成される場合もある。", "鑑定評価の各手法の適用に当たって必要とされる取引事例等については、取引等の事情が正常なものと認められるものから選択すべきであり、売り急ぎ、買い進み等の特殊な事情が存在する事例を用いてはならない。", "収益還元法は、対象不動産が将来生み出すであろうと期待される純収益の現在価値の総和を求めることにより対象不動産の試算価格を求める手法であるが、市場における土地の取引価格の上昇が著しいときは、その価格と収益価格との乖離が増大するものであるため、この手法の適用は避けるべきである。"], "page": 13, "img": ["q25_0.jpg"]}, {"stem": "宅地建物取引業者Ａ（甲県知事免許）に対する監督処分に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["Ａは、自らが売主となった分譲マンションの売買において、法第35条に規定する重要事項の説明を行わなかった。この場合、Ａは、甲県知事から業務停止を命じられることがある。", "Ａは、乙県内で宅地建物取引業に関する業務において、著しく不当な行為を行った。この場合、乙県知事は、Ａに対し、業務停止を命ずることはできない。", "Ａは、甲県知事から指示処分を受けたが、その指示処分に従わなかった。この場合、甲県知事は、Ａに対し、1年を超える期間を定めて、業務停止を命ずることができる。", "Ａは、自ら所有している物件について、直接賃借人Ｂと賃貸借契約を締結するに当たり、法第35条に規定する重要事項の説明を行わなかった。この場合、Ａは、甲県知事から業務停止を命じられることがある。"], "page": 14, "img": ["q26_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、ＢからＢ所有の宅地の売却に係る媒介を依頼された場合における次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。なお、この問において一般媒介契約とは、専任媒介契約でない媒介契約をいう。", "ch": ["ＡがＢと一般媒介契約を締結した場合、当該一般媒介契約が国土交通大臣が定める標準媒介契約約款に基づくものであるか否かの別を、法第34条の2第1項に規定する書面に記載する必要はない。", "ＡがＢと専任媒介契約を締結した場合、当該宅地の売買契約が成立しても、当該宅地の引渡しが完了していなければ、売買契約が成立した旨を指定流通機構に通知する必要はない。", "ＡがＢと一般媒介契約を締結した場合、当該宅地の売買の媒介を担当するＡの宅地建物取引士は、法第34条の2第1項に規定する書面に記名押印する必要はない。", "Ａは、Ｂとの間で締結した媒介契約が一般媒介契約であるか、専任媒介契約であるかを問わず、法第34条の2第1項に規定する書面に売買すべき価額を記載する必要はない。"], "page": 14, "img": ["q27_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者でないＢとの間でマンション（代金4,000万円）の売買契約を締結した場合に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定に違反するものの組合せはどれか。", "ch": ["ア、ウ", "イ、ウ", "ア、イ、エ", "ア、ウ、エ"], "items": [{"m": "ア", "t": "Ａは、建築工事完了前のマンションの売買契約を締結する際に、Ｂから手付金200万円を受領し、さらに建築工事中に200万円を中間金として受領した後、当該手付金と中間金について法第41条に定める保全措置を講じた。"}, {"m": "イ", "t": "Ａは、建築工事完了後のマンションの売買契約を締結する際に、法第41条の2に定める保全措置を講じることなくＢから手付金400万円を受領した。"}, {"m": "ウ", "t": "Ａは、建築工事完了前のマンションの売買契約を締結する際に、Ｂから手付金500万円を受領したが、Ｂに当該手付金500万円を償還して、契約を一方的に解除した。"}, {"m": "エ", "t": "Ａは、建築工事完了後のマンションの売買契約を締結する際に、当事者の債務の不履行を理由とする契約の解除に伴う損害賠償の予定額を1,000万円とする特約を定めた。"}], "page": 15, "img": ["q28_0.jpg"]}, {"stem": "宅地建物取引業者Ａの業務に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定に違反するものの組合せはどれか。", "ch": ["ア、イ", "ア、ウ", "ア、イ、エ", "イ、ウ、エ"], "items": [{"m": "ア", "t": "Ａは、マンションを分譲するに際して案内所を設置したが、売買契約の締結をせず、かつ、契約の申込みの受付も行わない案内所であったので、当該案内所に法第50条第1項に規定する標識を掲示しなかった。"}, {"m": "イ", "t": "Ａは、建物の売買の媒介に際し、買主に対して手付の貸付けを行う旨を告げて契約の締結を勧誘したが、売買は成立しなかった。"}, {"m": "ウ", "t": "Ａは、法第49条の規定によりその事務所ごとに備えるべきこととされている業務に関する帳簿について、取引関係者から閲覧の請求を受けたが、閲覧に供さなかった。"}, {"m": "エ", "t": "Ａは、自ら売主となるマンションの割賦販売の契約について、宅地建物取引業者でない買主から賦払金が支払期日までに支払われなかったので、直ちに賦払金の支払の遅延を理由として契約を解除した。"}], "page": 15, "img": ["q29_0.jpg"]}, {"stem": "宅地建物取引業法第35条に規定する重要事項の説明及び同法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["宅地建物取引業者は、建物の貸借の媒介における重要事項の説明において、借賃の額並びにその支払の時期及び方法について説明するとともに、37条書面に記載しなければならない。", "宅地建物取引士は、重要事項の説明をする際に、相手方から求められない場合は、宅地建物取引士証を提示しなくてもよい。", "宅地建物取引業者は、37条書面を交付する際に、相手方の同意があった場合は、書面に代えて、電磁的記録で交付することができる。", "宅地建物取引業者は、宅地建物取引士をして37条書面に記名押印させなければならないが、当該書面の交付は宅地建物取引士でない従業者に行わせることができる。"], "page": 16, "img": ["q30_0.jpg"]}, {"stem": "宅地建物取引業保証協会（以下この問において「保証協会」という。）の社員である宅地建物取引業者に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["保証協会に加入することは宅地建物取引業者の任意であり、一の保証協会の社員となった後に、宅地建物取引業に関し取引をした者の保護を目的として、重ねて他の保証協会の社員となることができる。", "保証協会に加入している宅地建物取引業者（甲県知事免許）は、甲県の区域内に新たに支店を設置した場合、その設置した日から1月以内に当該保証協会に追加の弁済業務保証金分担金を納付しないときは、社員の地位を失う。", "保証協会から還付充当金の納付の通知を受けた社員は、その通知を受けた日から2週間以内に、その通知された額の還付充当金を主たる事務所の最寄りの供託所に供託しなければならない。", "150万円の弁済業務保証金分担金を保証協会に納付して当該保証協会の社員となった者と宅地建物取引業に関し取引をした者は、その取引により生じた債権に関し、2,500万円を限度として、当該保証協会が供託した弁済業務保証金から弁済を受ける権利を有する。"], "page": 16, "img": ["q31_0.jpg"]}, {"stem": "宅地建物取引業者Ａ（甲県知事免許）がその業務に関して広告を行った場合における次の記述のうち、宅地建物取引業法の規定に違反しないものはどれか。", "ch": ["Ａは、宅地の造成に当たり、工事に必要とされる許可等の処分があった宅地について、当該処分があったことを明示して、工事完了前に、当該宅地の販売に関する広告を行った。", "Ａは、自ら売主として新築マンションを分譲するに当たり、建築基準法第6条第1項の確認の申請中であったため、「建築確認申請済」と明示して、当該建物の販売に関する広告を行い、建築確認を受けた後に売買契約を締結した。", "Ａは、中古の建物の売買において、当該建物の所有者Ｂから媒介の依頼を受け、取引態様の別を明示せずに自社ホームページに広告を掲載したが、広告を見た者からの問い合わせはなく、契約成立には至らなかった。", "Ａは、甲県知事から業務の全部の停止を命じられ、その停止の期間中に未完成の土地付建物の販売に関する広告を行ったが、当該土地付建物の売買の契約は当該期間の経過後に締結した。"], "page": 17, "img": ["q32_0.jpg"]}, {"stem": "宅地建物取引業者が売買等の媒介に関して受けることができる報酬についての次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "なし"], "items": [{"m": "ア", "t": "宅地建物取引業者が媒介する物件の売買について、売主があらかじめ受取額を定め、実際の売却額との差額を当該宅地建物取引業者が受け取る場合は、媒介に係る報酬の限度額の適用を受けない。"}, {"m": "イ", "t": "宅地建物取引業者は、媒介に係る報酬の限度額の他に、依頼者の依頼によらない通常の広告の料金に相当する額を報酬に合算して、依頼者から受け取ることができる。"}, {"m": "ウ", "t": "居住用の建物の貸借の媒介に係る報酬の額は、借賃の1月分の1.08倍に相当する額以内であるが、権利金の授受がある場合は、当該権利金の額を売買に係る代金の額とみなして算定することができる。"}], "page": 17, "img": ["q33_0.jpg"]}, {"stem": "宅地建物取引業法（以下この問において「法」という。）第47条及び第47条の2に規定されている業務に関する禁止事項に関する次の記述のうち、誤っているものはどれか。なお、Ａは宅地建物取引業者である。", "ch": ["Ａが、賃貸アパートの媒介に当たり、入居申込者が無収入であることを知っており、入居申込書の収入欄に「年収700万円」とあるのは虚偽の記載であることを認識したまま、その事実を告げずに貸主に提出した行為は法に違反する。", "Ａが、分譲マンションの購入を勧誘するに際し、うわさをもとに「3年後には間違いなく徒歩5分の距離に新しく私鉄の駅ができる」と告げた場合、そのような計画はなかったとしても、故意にだましたわけではないので法には違反しない。", "Ａは、建売住宅の売買の相手方である買主から手付放棄による契約の解除の通知を受けたとしても、すでに所有権の移転登記を行い引渡しも済んでいる場合は、そのことを理由に当該契約の解除を拒むことができる。", "Ａが、宅地の売買契約締結の勧誘に当たり、相手方が手付金の手持ちがないため契約締結を迷っていることを知り、手付金の分割払いを持ちかけたことは、契約締結に至らなかったとしても法に違反する。"], "page": 18, "img": ["q34_0.jpg"]}, {"stem": "宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["個人である宅地建物取引業者Ａ（甲県知事免許）が、免許の更新の申請を怠り、その有効期間が満了した場合、Ａは、遅滞なく、甲県知事に免許証を返納しなければならない。", "法人である宅地建物取引業者Ｂ（乙県知事免許）が、乙県知事から業務の停止を命じられた場合、Ｂは、免許の更新の申請を行っても、その業務の停止の期間中は免許の更新を受けることができない。", "法人である宅地建物取引業者Ｃ（国土交通大臣免許）について破産手続開始の決定があった場合、その日から30日以内に、Ｃを代表する役員Ｄは、その旨を主たる事務所の所在地を管轄する都道府県知事を経由して国土交通大臣に届け出なければならない。", "個人である宅地建物取引業者Ｅ（丙県知事免許）が死亡した場合、Ｅの一般承継人Ｆがその旨を丙県知事に届け出た後であっても、Ｆは、Ｅが生前締結した売買契約に基づく取引を結了する目的の範囲内においては、なお宅地建物取引業者とみなされる。"], "page": 18, "img": ["q35_0.jpg"]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "区分所有権の目的である建物の売買の媒介を行う場合、当該建物が借地借家法第22条に規定する定期借地権の設定された土地の上に存するときは、当該定期借地権が登記されたものであるか否かにかかわらず、当該定期借地権の内容について説明しなければならない。"}, {"m": "イ", "t": "宅地の貸借の媒介を行う場合、当該宅地が流通業務市街地の整備に関する法律第4条に規定する流通業務地区にあるときは、同法第5条第1項の規定による制限の概要について説明しなければならない。"}, {"m": "ウ", "t": "建物の売買の媒介を行う場合、当該建物の売買代金の額並びにその支払の時期及び方法について説明する義務はないが、売買代金以外に授受される金銭があるときは、当該金銭の額及び授受の目的について説明しなければならない。"}, {"m": "エ", "t": "建物の貸借の媒介を行う場合、当該建物が建築工事の完了前であるときは、必要に応じ当該建物に係る図面を交付した上で、当該建築工事の完了時における当該建物の主要構造部、内装及び外装の構造又は仕上げ並びに設備の設置及び構造について説明しなければならない。"}], "page": 19, "img": ["q36_0.jpg"]}, {"stem": "宅地建物取引業法（以下この問において「法」という。）の規定に関する次の記述のうち、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "宅地建物取引業者Ａ（甲県知事免許）が乙県内に新たに支店を設置して宅地建物取引業を営んでいる場合において、免許換えの申請を怠っていることが判明したときは、Ａは、甲県知事から業務停止の処分を受けることがある。"}, {"m": "イ", "t": "宅地建物取引業者Ｂが自ら売主として宅地の売買契約を成立させた後、当該宅地の引渡しの前に免許の有効期間が満了したときは、Ｂは、当該契約に基づく取引を結了する目的の範囲内においては、宅地建物取引業者として当該取引に係る業務を行うことができる。"}, {"m": "ウ", "t": "Ｃが免許の申請前5年以内に宅地建物取引業に関し不 const GROUPS = [
  {name:'権利関係',     from:1,  to:14, color:'var(--ken)'},
  {name:'法令上の制限', from:15, to:22, color:'var(--hou)'},
  {name:'税・その他',   from:23, to:25, color:'var(--zei)'},
  {name:'宅建業法',     from:26, to:45, color:'var(--gyo)'},
  {name:'5点免除科目',  from:46, to:50, color:'var(--men)'},
];
function groupOf(n){ return GROUPS.find(g => n >= g.from && n <= g.to); }

const KEY = 'takken_kakomon_v2';

let store = {};
let exam  = null;
let cur   = 1;
let mode  = 'quiz';        // quiz | result
let zoomOn = false;        // スキャン年度の画像を拡大表示するか
let scanOn = false;        // 書き起こし年度で原文スキャンも並べて出すか

function loadStore(){
  try{ store = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ store = {}; }
}
function saveStore(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
}
function st(id){
  if(!store[id]) store[id] = {ans:{}, flags:{}, checked:{}, graded:false, last:1};
  const s = store[id];
  if(!s.ans) s.ans = {};
  if(!s.flags) s.flags = {};
  if(!s.checked) s.checked = {};      // その問だけ答え合わせ済みか
  return s;
}
function accepted(n){ return exam.ans[n-1]; }

/* ============================================================
   ドロワー
   ============================================================ */
function buildYearList(){
  const box = document.getElementById('yearlist');
  box.innerHTML = '';
  EXAMS.forEach(e=>{
    const s = st(e.id);
    const done = Object.keys(s.ans).length;
    const b = document.createElement('button');
    b.className = 'yearbtn' + (exam && exam.id===e.id ? ' on' : '');
    let sub;
    if(s.graded)  sub = '採点済み ' + scoreOf(e).total + '点 / 50';
    else if(done) sub = '解答中 ' + done + '/50問';
    else          sub = '未着手（合格基準 ' + e.pass + '点）';
    b.innerHTML = '<span class="yl">' + e.label + '</span><span class="ys">' + sub + '</span>';
    b.onclick = ()=>{ selectExam(e.id); closeDrawer(); };
    box.appendChild(b);
  });
  document.getElementById('drawernote').innerHTML =
    '問題文は不動産適正取引推進機構（RETIO）が公開している公式PDFから取り込んでいます。'
  + '令和5〜7年度は文字データ、令和4年度以前は公式PDFがスキャン画像のため'
  + '画像のまま表示しています（書き起こしによる誤りが混ざらないようにするためです）。<br>'
  + '正解番号も同じ公式PDFの正解番号表から取り込んでいます'
  + '（令和3年10月分のみ外部の複数ソースで照合）。';
}
function openDrawer(){
  buildYearList();
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}

  const host = document.getElementById('qhost');

  const q = exam.qs[cur-1];
  const g = groupOf(cur);
  const picked = s.ans[cur];
  const revealed = s.graded || !!s.checked[cur];   // 全体採点済み or この問だけ答え合わせ済み

  host.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'qcard' + (revealed ? ' graded' : '');

  const meta = document.createElement('div');
  meta.className = 'qmeta';
  meta.innerHTML = '<span class="qnum">問 ' + cur + '</span>'
                 + '<span class="qtag" style="color:' + g.color + '">' + g.name + '</span>';
  const flag = document.createElement('button');
  flag.className = 'flagbtn' + (s.flags[cur] ? ' on' : '');
  flag.textContent = s.flags[cur] ? '△ 見直す' : '△ 見直し';
  flag.onclick = ()=>{
    if(s.flags[cur]) delete s.flags[cur]; else s.flags[cur] = 1;
    saveStore(); renderQuestion(); renderNav();
  };
  meta.appendChild(flag);
  card.appendChild(meta);

  if(exam.kind === 'text'){
    const stem = document.createElement('p');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);
    if(q.items && q.items.length){
      const box = document.createElement('div');
      box.className = 'items';
      q.items.forEach(it=>{
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = '<span class="im">' + it.m + '</span>'
                      + '<span class="it">' + escapeHtml(it.t) + '</span>';
        box.appendChild(row);
      });
      card.appendChild(box);
    }
    // 公式PDFがスキャン画像だった年度は、書き起こしの原文も出せるようにしておく
    if(q.img && q.img.length){
      const sb = document.createElement('button');
      sb.className = 'zoombtn' + (scanOn ? ' on' : '');
      sb.textContent = scanOn ? '原文スキャンを閉じる' : '原文スキャンで確かめる';
      sb.onclick = ()=>{
        scanOn = !scanOn;
        try{ localStorage.setItem(KEY + '_scan', scanOn ? '1' : ''); }catch(e){}
        renderQuestion();
      };
      card.appendChild(sb);
      if(scanOn){
        const box = document.createElement('div');
        box.className = 'imgbox';
        q.img.forEach(f=>{
          const im = document.createElement('img');
          im.src = 'q/' + exam.id + '/' + f;
          im.alt = '問' + cur + ' の原文';
          im.loading = 'lazy';
          box.appendChild(im);
        });
        card.appendChild(box);
      }
    }
  }else{
    // スキャン年度：公式PDFの該当箇所をそのまま表示
    const zb = document.createElement('button');
    zb.className = 'zoombtn' + (zoomOn ? ' on' : '');
    zb.textContent = zoomOn ? '拡大中（横スクロール）｜画面に合わせる' : '⤢ 文字を大きく';
    zb.onclick = ()=>{
      zoomOn = !zoomOn;
      try{ localStorage.setItem(KEY + '_zoom', zoomOn ? '1' : ''); }catch(e){}
      renderQuestion();
    };
    card.appendChild(zb);
    const box = document.createElement('div');
    box.className = 'imgbox' + (zoomOn ? ' zoom' : '');
    q.img.forEach(f=>{
      const im = document.createElement('img');
      im.src = 'q/' + exam.id + '/' + f;
      im.alt = '問' + cur;
      im.loading = 'lazy';
      box.appendChild(im);
    });
    card.appendChild(box);
  }

  const cbox = document.createElement('div');
  cbox.className = 'choices';
  for(let v=1; v<=4; v++){
    const b = document.createElement('button');
    b.className = 'choice';
    let cls = '';
    if(revealed){
      const acc = accepted(cur);
      if(acc.length === 4)                  cls = (picked === v) ? ' correct' : '';   // 全員正解
      else if(acc.includes(v))              cls = ' correct';
      else if(picked === v)                 cls = ' wrong';
    }else if(picked === v){
      cls = ' sel';
    }
    b.className = 'choice' + cls;
    const label = (exam.kind === 'text')
      ? '<span class="ct">' + escapeHtml(q.ch[v-1]) + '</span>'
      : '';
    b.innerHTML = '<span class="cn">' + v + '</span>' + label;
    b.onclick = ()=>choose(v);
    cbox.appendChild(b);
  }
  card.appendChild(cbox);

  if(revealed){
    const acc = accepted(cur);
    const ok = picked && acc.includes(picked);
    const j = document.createElement('div');
    j.className = 'judge show ' + (ok ? 'ok' : 'ng');
    let msg;
    if(acc.length === 4)      msg = 'この問題は正解のない問題として、全員正解の扱いです。';
    else if(acc.length === 2) msg = (ok?'正解！':'不正解。') + ' 正解は ' + acc.join(' と ') + '（どちらも正解）';
    else                      msg = (ok?'正解！':'不正解。') + ' 正解は ' + acc[0];
    if(!picked) msg = '未回答でした。正解は ' + acc.join(' または ');
    j.textContent = msg;
    card.appendChild(j);
  }

  if(!s.graded){
    const cb = document.createElement('button');
    cb.className = 'checkbtn' + (revealed ? ' done' : '');
    if(revealed){
      cb.textContent = 'この問題をもう一度解く';
      cb.onclick = uncheckOne;
    }else{
      cb.textContent = picked ? '答え合わせ' : '答えを選ぶと確認できます';
      cb.disabled = !picked;
      cb.onclick = checkOne;
    }
    card.appendChild(cb);
  }

  const src = document.createElement('div');
  src.className = 'srcline';
  src.innerHTML = '出典：' + exam.label + ' 公式問題 '
    + '<a href="' + exam.file + '#page=' + q.page + '" target="_blank" rel="noopener">PDFの該当ページを開く ↗</a>';
  card.appendChild(src);

  host.appendChild(card);

  document.getElementById('btn-prev').disabled = (cur === 1);
  document.getElementById('btn-next').disabled = (cur === 50);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function choose(v){
  const s = st(exam.id);
  if(s.graded || s.checked[cur]) return;
  if(s.ans[cur] === v) delete s.ans[cur];      // もう一度押すと取り消し
  else s.ans[cur] = v;
  saveStore();
  renderQuestion();
  renderNav();
}

/* この問だけ答え合わせする */
function checkOne(){
  const s = st(exam.id);
  if(s.graded || s.checked[cur] || !s.ans[cur]) return;
  s.checked[cur] = 1;
  saveStore();
  renderQuestion();
  renderNav();
}
function uncheckOne(){
  const s = st(exam.id);
  delete s.checked[cur];
  saveStore();
  renderQuestion();
  renderNav();
}

function goto(n){
  cur = Math.min(Math.max(n, 1), 50);
  st(exam.id).last = cur;
  saveStore();
  renderQuestion();
  renderNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============================================================
   1〜50のマス目
   ============================================================ */
function buildNav(){
  const box = document.getElementById('navgrid');
  box.innerHTML = '';
  for(let n=1; n<=50; n++){
    const b = document.createElement('button');
    b.className = 'navcell';
    b.textContent = n;
    b.id = 'nav' + n;
    b.onclick = ()=>{ if(mode==='result') backToQuiz(); goto(n); };
    box.appendChild(b);
  }
}

function renderNav(){
  const s = st(exam.id);
  const done = Object.keys(s.ans).length;
  const flags = Object.keys(s.flags).length;
  document.getElementById('h-done').textContent = done;
  document.getElementById('prog-text').textContent = done + ' / 50 問 回答済み';
  document.getElementById('prog-flag').textContent = flags ? ('見直し ' + flags + ' 問') : '';
  document.getElementById('progfill').style.width = (done/50*100) + '%';
  document.getElementById('btn-grade').textContent = s.graded ? '結果を見る' : '採点する';

  for(let n=1; n<=50; n++){
    const c = document.getElementById('nav'+n);
    const picked = s.ans[n];
    let cls = 'navcell';
    if(s.graded || s.checked[n]){
      cls += (picked && accepted(n).includes(picked)) ? ' ok' : ' ng';
    }else if(picked){
      cls += ' done';
    }
    if(s.flags[n]) cls += ' flag';
    if(n === cur && mode === 'quiz') cls += ' cur';
    c.className = cls;
  }
}

/* ============================================================
   採点
   ============================================================ */
function scoreOf(e){
  const s = st(e.id);
  const per = {};
  GROUPS.forEach(g => per[g.name] = {ok:0, n:g.to-g.from+1});
  let total = 0;
  const wrong = [];
  for(let n=1; n<=50; n++){
    const picked = s.ans[n];
    const ok = picked && e.ans[n-1].includes(picked);
    if(ok){ total++; per[groupOf(n).name].ok++; }
    else wrong.push(n);
  }
  return {total, per, wrong};
}

function grade(){
  const s = st(exam.id);
  if(!s.graded){
    const done = Object.keys(s.ans).length;
    if(done < 50 && !confirm('未回答が ' + (50-done) + ' 問あります。このまま採点しますか？')) return;
    s.graded = true;
    saveStore();
  }
  showResult();
}

function showResult(){
  mode = 'result';
  const r = scoreOf(exam);
  const pass = r.total >= exam.pass;
  const host = document.getElementById('resulthost');
  document.getElementById('qhost').style.display = 'none';

  let html = '<div class="result"><div class="scorebig">'
    + '<div><span class="n" style="color:' + (pass?'var(--good)':'var(--bad)') + '">' + r.total + '</span>'
    + '<span class="d"> / 50点</span></div>'
    + '<div class="verdict ' + (pass?'pass':'fail') + '">'
    + (pass ? '合格ライン到達' : 'あと ' + (exam.pass - r.total) + ' 点') + '</div>'
    + '<div style="font-size:.75rem;color:var(--sub);margin-top:8px">'
    + exam.label + '　合格基準点 ' + exam.pass + '点</div></div>';

  GROUPS.forEach(g=>{
    const p = r.per[g.name];
    const pct = Math.round(p.ok / p.n * 100);
    html += '<div class="grow"><div class="gl"><span>' + g.name + '</span>'
         +  '<b>' + p.ok + ' / ' + p.n + '（' + pct + '%）</b></div>'
         +  '<div class="gbar"><div style="width:' + pct + '%;background:' + g.color + '"></div></div></div>';
  });

  if(r.wrong.length){
    html += '<div style="margin-top:16px;font-size:.8rem;font-weight:700">'
         +  '間違えた問題（タップでその問題へ）</div><div class="navgrid" style="margin-top:8px">';
    r.wrong.forEach(n=>{
      html += '<button class="navcell ng" onclick="jumpFromResult(' + n + ')">' + n + '</button>';
    });
    html += '</div>';
  }

  const special = [];
  exam.ans.forEach((a,i)=>{
    if(a.length === 4)      special.push('問' + (i+1) + ' は正解のない問題として全員正解の扱い');
    else if(a.length === 2) special.push('問' + (i+1) + ' は ' + a.join(' と ') + ' のどちらも正解');
  });
  if(special.length) html += '<p class="hint">※ ' + special.join('／') + '（公式の扱いに合わせています）</p>';

  html += '<div class="resbtns">'
       +  '<button class="primary" onclick="reviewWrong()">間違いを見直す</button>'
       +  '<button onclick="backToQuiz()">問題に戻る</button>'
       +  '<button onclick="resetExam()">やり直す</button>'
       +  '<button onclick="openDrawer()">別の年度</button>'
       +  '</div></div>';

  host.innerHTML = html;
  renderNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

function backToQuiz(){
  mode = 'quiz';
  document.getElementById('resulthost').innerHTML = '';
  document.getElementById('qhost').style.display = '';
  renderQuestion();
  renderNav();
}
function jumpFromResult(n){ backToQuiz(); goto(n); }
function reviewWrong(){
  const w = scoreOf(exam).wrong;
  backToQuiz();
  goto(w.length ? w[0] : 1);
}
function resetExam(){
  if(!confirm(exam.label + ' の解答を消してやり直します。よろしいですか？')) return;
  store[exam.id] = {ans:{}, flags:{}, checked:{}, graded:false, last:1};
  saveStore();
  backToQuiz();
  goto(1);
}

/* ============================================================
   年度の選択
   ============================================================ */
function selectExam(id){
  exam = EXAMS.find(e=>e.id===id);
  const s = st(exam.id);
  cur = s.last || 1;
  mode = 'quiz';
  localStorage.setItem(KEY + '_last', id);
  document.getElementById('h-title').textContent = exam.label;
  document.getElementById('h-sub').textContent =
    '全50問・合格基準 ' + exam.pass + '点'
    + (exam.kind === 'image' ? '（公式PDFの画像で出題）' : '');
  document.getElementById('resulthost').innerHTML = '';
  document.getElementById('qhost').style.display = '';
  renderQuestion();
  renderNav();
  if(s.graded) showResult();
}

/* ============================================================
   初期化
   ============================================================ */
loadStore();
try{ zoomOn = !!localStorage.getItem(KEY + '_zoom'); }catch(e){}
try{ scanOn = !!localStorage.getItem(KEY + '_scan'); }catch(e){}
buildNav();
document.getElementById('burger').onclick      = openDrawer;
document.getElementById('scrim').onclick       = closeDrawer;
document.getElementById('drawerclose').onclick = closeDrawer;
document.getElementById('btn-prev').onclick    = ()=>goto(cur-1);
document.getElementById('btn-next').onclick    = ()=>goto(cur+1);
document.getElementById('btn-grade').onclick   = ()=>{ if(mode==='result') backToQuiz(); else grade(); };

document.addEventListener('keydown', e=>{
  if(mode !== 'quiz') return;
  if(e.key === 'ArrowLeft')  goto(cur-1);
  if(e.key === 'ArrowRight') goto(cur+1);
  if('1234'.includes(e.key)) choose(Number(e.key));
  if(e.key === 'Enter')      checkOne();
});

const last = localStorage.getItem(KEY + '_last');
selectExam(EXAMS.find(e=>e.id===last) ? last : EXAMS[0].id);

</script>
