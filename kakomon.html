   qs:[{"stem": "次の1から4までの記述のうち、民法の規定、判例及び下記判決文によれば、正しいものはどれか。\n\n（判決文）\n私力の行使は、原則として法の禁止するところであるが、法律に定める手続によつたのでは、権利に対する違法な侵害に対抗して現状を維持することが不可能又は著しく困難であると認められる緊急やむを得ない特別の事情が存する場合においてのみ、その必要の限度を超えない範囲内で、例外的に許されるものと解することを妨げない。", "ch": ["権利に対する違法な侵害に対抗して法律に定める手続によらずに自力救済することは、その必要の限度を超えない範囲内であれば、事情のいかんにかかわらず許される。", "建物賃貸借契約終了後に当該建物内に家財などの残置物がある場合には、賃貸人の権利に対する違法な侵害であり、賃貸人は賃借人の同意の有無にかかわらず、原則として裁判を行わずに当該残置物を建物内から撤去することができる。", "建物賃貸借契約の賃借人が賃料を1年分以上滞納した場合には、賃貸人の権利を著しく侵害するため、原則として裁判を行わずに、賃貸人は賃借人の同意なく当該建物の鍵とシリンダーを交換して建物内に入れないようにすることができる。", "裁判を行っていては権利に対する違法な侵害に対抗して現状を維持することが不可能又は著しく困難であると認められる緊急やむを得ない特別の事情が存する場合には、その必要の限度を超えない範囲内で例外的に私力の行使が許される。"], "page": 3, "img": ["q01_0.jpg"]}, {"stem": "相隣関係に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。", "ch": ["土地の所有者は、隣地の所有者と共同の費用で、境界標を設けることができる。", "隣接する土地の境界線上に設けた障壁は、相隣者の共有に属するものと推定される。", "高地の所有者は、その高地が浸水した場合にこれを乾かすためであっても、公の水流又は下水道に至るまで、低地に水を通過させることはできない。", "土地の所有者が直接に雨水を隣地に注ぐ構造の屋根を設けた場合、隣地所有者は、その所有権に基づいて妨害排除又は予防の請求をすることができる。"], "page": 3, "img": ["q02_0.jpg"]}, {"stem": "成年後見人が、成年被後見人を代理して行う次に掲げる法律行為のうち、民法の規定によれば、家庭裁判所の許可を得なければ代理して行うことができないものはどれか。", "ch": ["成年被後見人が所有する乗用車の第三者への売却", "成年被後見人が所有する成年被後見人の居住の用に供する建物への第三者の抵当権の設定", "成年被後見人が所有するオフィスビルへの第三者の抵当権の設定", "成年被後見人が所有する倉庫についての第三者との賃貸借契約の解除"], "page": 4, "img": ["q03_0.jpg"]}, {"stem": "いずれも宅地建物取引業者ではない売主Ａと買主Ｂとの間で令和3年7月1日に締結した売買契約に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["ＢがＡに対して手付を交付した場合、Ａは、目的物を引き渡すまではいつでも、手付の倍額を現実に提供して売買契約を解除することができる。", "売買契約の締結と同時に、Ａが目的物を買い戻すことができる旨の特約をする場合、買戻しについての期間の合意をしなければ、買戻しの特約自体が無効となる。", "Ｂが購入した目的物が第三者Ｃの所有物であり、Ａが売買契約締結時点でそのことを知らなかった場合には、Ａは損害を賠償せずに売買契約を解除することができる。", "目的物の引渡しの時点で目的物が品質に関して契約の内容に適合しないことをＡが知っていた場合には、当該不適合に関する請求権が消滅時効にかかっていない限り、ＢはＡの担保責任を追及することができる。"], "page": 4, "img": ["q04_0.jpg"]}, {"stem": "ＡがＢの代理人として行った行為に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、いずれの行為もＢの追認はないものとし、令和3年7月1日以降になされたものとする。", "ch": ["ＡがＢの代理人として第三者の利益を図る目的で代理権の範囲内の行為をした場合、相手方Ｃがその目的を知っていたとしても、ＡＣ間の法律行為の効果はＢに帰属する。", "ＢがＡに代理権を与えていないにもかかわらず代理権を与えた旨をＣに表示し、Ａが当該代理権の範囲内の行為をした場合、ＣがＡに代理権がないことを知っていたとしても、Ｂはその責任を負わなければならない。", "ＡがＢから何ら代理権を与えられていないにもかかわらずＢの代理人と詐称してＣとの間で法律行為をし、ＣがＡにＢの代理権があると信じた場合であっても、原則としてその法律行為の効果はＢに帰属しない。", "ＢがＡに与えた代理権が消滅した後にＡが行った代理権の範囲内の行為について、相手方Ｃが過失によって代理権消滅の事実を知らなかった場合でも、Ｂはその責任を負わなければならない。"], "page": 5, "img": ["q05_0.jpg"]}, {"stem": "不動産に関する物権変動の対抗要件に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["不動産の所有権がＡからＢ、ＢからＣ、ＣからＤと転々譲渡された場合、Ａは、Ｄと対抗関係にある第三者に該当する。", "土地の賃借人として当該土地上に登記ある建物を所有する者は、当該土地の所有権を新たに取得した者と対抗関係にある第三者に該当する。", "第三者のなした登記後に時効が完成して不動産の所有権を取得した者は、当該第三者に対して、登記を備えなくても、時効取得をもって対抗することができる。", "共同相続財産につき、相続人の一人から相続財産に属する不動産につき所有権の全部の譲渡を受けて移転登記を備えた第三者に対して、他の共同相続人は、自己の持分を登記なくして対抗することができる。"], "page": 5, "img": ["q06_0.jpg"]}, {"stem": "令和3年7月1日になされた遺言に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。", "ch": ["自筆証書によって遺言をする場合、遺言者は、その全文、日付及び氏名を自書して押印しなければならないが、これに添付する相続財産の目録については、遺言者が毎葉に署名押印すれば、自書でないものも認められる。", "公正証書遺言の作成には、証人2人以上の立会いが必要であるが、推定相続人は、未成年者でなくとも、証人となることができない。", "船舶が遭難した場合、当該船舶中にいて死亡の危急に迫った者は、証人2人以上の立会いがあれば、口頭で遺言をすることができる。", "遺贈義務者が、遺贈の義務を履行するため、受遺者に対し、相当の期間を定めて遺贈の承認をすべき旨の催告をした場合、受遺者がその期間内に意思表示をしないときは、遺贈を放棄したものとみなされる。"], "page": 6, "img": ["q07_0.jpg"]}, {"stem": "ＡはＢに対して、Ａが所有する甲土地を1,000万円で売却したい旨の申込みを郵便で令和3年7月1日に発信した（以下この問において「本件申込み」という。）が、本件申込みがＢに到達する前にＡが死亡した場合における次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["Ｂが承諾の通知を発する前に、ＢがＡの死亡を知ったとしても、本件申込みは効力を失わない。", "Ａが、本件申込みにおいて、自己が死亡した場合には申込みの効力を失う旨の意思表示をしていたときには、ＢがＡの死亡を知らないとしても本件申込みは効力を失う。", "本件申込みが効力を失わない場合、本件申込みに承諾をなすべき期間及び撤回をする権利についての記載がなかったときは、Ａの相続人は、本件申込みをいつでも撤回することができる。", "本件申込みが効力を失わない場合、Ｂが承諾の意思表示を発信した時点で甲土地の売買契約が成立する。"], "page": 6, "img": ["q08_0.jpg"]}, {"stem": "ＡがＢに対してＡ所有の甲建物を令和3年7月1日に①売却した場合と②賃貸した場合についての次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["①と②の契約が解除された場合、①ではＢは甲建物を使用収益した利益をＡに償還する必要があるのに対し、②では将来に向かって解除の効力が生じるのでＡは解除までの期間の賃料をＢに返還する必要はない。", "①ではＢはＡの承諾を得ずにＣに甲建物を賃貸することができ、②ではＢはＡの承諾を得なければ甲建物をＣに転貸することはできない。", "甲建物をＤが不法占拠している場合、①ではＢは甲建物の所有権移転登記を備えていなければ所有権をＤに対抗できず、②ではＢは甲建物につき賃借権の登記を備えていれば賃借権をＤに対抗することができる。", "①と②の契約締結後、甲建物の引渡し前に、甲建物がＥの放火で全焼した場合、①ではＢはＡに対する売買代金の支払を拒むことができ、②ではＢとＡとの間の賃貸借契約は終了する。"], "page": 7, "img": ["q09_0.jpg"]}, {"stem": "Ａは、Ｂからの借入金の担保として、Ａ所有の甲建物に第一順位の抵当権（以下この問において「本件抵当権」という。）を設定し、その登記を行った。ＡＣ間にＣを賃借人とする甲建物の一時使用目的ではない賃貸借契約がある場合に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。", "ch": ["本件抵当権設定登記後にＡＣ間の賃貸借契約が締結され、ＡのＢに対する借入金の返済が債務不履行となった場合、Ｂは抵当権に基づき、ＡがＣに対して有している賃料債権を差し押さえることができる。", "Ｃが本件抵当権設定登記より前に賃貸借契約に基づき甲建物の引渡しを受けていたとしても、ＡＣ間の賃貸借契約の期間を定めていない場合には、Ｃの賃借権は甲建物の競売による買受人に対抗することができない。", "本件抵当権設定登記後にＡＣ間で賃貸借契約を締結し、その後抵当権に基づく競売手続による買受けがなされた場合、買受けから賃貸借契約の期間満了までの期間が1年であったときは、Ｃは甲建物の競売における買受人に対し、期間満了までは甲建物を引き渡す必要はない。", "Ｃが本件抵当権設定登記より前に賃貸借契約に基づき甲建物の引渡しを受けていたとしても、Ｃは、甲建物の競売による買受人に対し、買受人の買受けの時から1年を経過した時点で甲建物を買受人に引き渡さなければならない。"], "page": 7, "img": ["q10_0.jpg"]}, {"stem": "次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。", "ch": ["借地権の存続期間を契約で30年と定めた場合には、当事者が借地契約を更新する際、その期間を更新の日から30年以下に定めることはできない。", "借地権の存続期間が満了する場合、借地権者が契約の更新を請求したとき、その土地上に建物が存在する限り、借地権設定者は異議を述べることができない。", "借地権者が借地上の建物にのみ登記をしている場合、当該借地権を第三者に対抗することができるのは、当該建物の敷地の表示として記載されている土地のみである。", "借地権設定者は、弁済期の到来した最後の3年分の地代等について、借地権者がその土地において所有する建物の上に先取特権を有する。"], "page": 8, "img": ["q11_0.jpg"]}, {"stem": "賃貸人Ａと賃借人Ｂとの間で令和3年7月1日に締結した一時使用目的ではない建物賃貸借契約（以下この問において「本件契約」という。）の終了に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。", "ch": ["本件契約に期間を2年とする旨の定めがあり、ＡもＢも更新拒絶の通知をしなかったために本件契約が借地借家法に基づき更新される場合、更新後の期間について特段の合意がなければ、更新後の契約期間は2年となる。", "本件契約において期間の定めがない場合、借地借家法第28条に定める正当事由を備えてＡが解約の申入れをしたときには、解約の申入れをした日から6月を経過した日に、本件契約は終了する。", "建物の転貸借がされている場合において、本件契約がＢ（転貸人）の債務不履行によって解除されて終了するときは、Ａが転借人に本件契約の終了を通知した日から6月を経過することによって、転貸借契約は終了する。", "Ｂが Ａの同意を得て建物に付加した造作がある場合であっても、本件契約終了時にＡに対して借地借家法第33条の規定に基づく造作買取請求権を行使することはできない、という特約は無効である。"], "page": 8, "img": ["q12_0.jpg"]}, {"stem": "建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。", "ch": ["区分所有者以外の者であって区分所有者の承諾を得て専有部分を占有する者は、会議の目的たる事項につき利害関係を有する場合には、集会に出席して議決権を行使することはできないが、意見を述べることはできる。", "最初に建物の専有部分の全部を所有する者は、公正証書により、共用部分（数個の専有部分に通ずる廊下又は階段室その他構造上区分所有者の全員又はその一部の共用に供されるべき建物の部分）の規約を設定することができる。", "共用部分は、区分所有者全員の共有に属するが、規約に特別の定めがあるときは、管理者を共用部分の所有者と定めることもできる。", "管理組合法人を設立する場合は、理事を置かなければならず、理事が数人ある場合において、規約に別段の定めがないときは、管理組合法人の事務は、理事の過半数で決する。"], "page": 9, "img": ["q13_0.jpg"]}, {"stem": "不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。", "ch": ["表題登記がない土地の所有権を取得した者は、その所有権の取得の日から1月以内に、表題登記を申請しなければならない。", "共用部分である旨の登記がある建物について、合併の登記をすることができる。", "登記官は、表示に関する登記について申請があった場合において、必要があると認めるときは、当該不動産の表示に関する事項を調査することができる。", "区分建物である建物を新築した場合において、その所有者について相続その他の一般承継があったときは、相続人その他の一般承継人も、被承継人を表題部所有者とする当該建物についての表題登記を申請することができる。"], "page": 9, "img": ["q14_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。", "ch": ["近隣商業地域は、主として商業その他の業務の利便の増進を図りつつ、これと調和した住居の環境を保護するため定める地域とする。", "準工業地域は、主として環境の悪化をもたらすおそれのない工業の利便の増進を図りつつ、これと調和した住居の環境を保護するため定める地域とする。", "第一種低層住居専用地域については、都市計画に特定用途制限地域を定めることができる場合がある。", "第一種住居地域については、都市計画に高層住居誘導地区を定めることができる場合がある。"], "page": 10, "img": ["q15_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、誤っているものはどれか。ただし、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["開発許可を受けようとする者は、開発行為に関する工事の請負人又は請負契約によらないで自らその工事を施行する者を記載した申請書を都道府県知事に提出しなければならない。", "開発許可を受けた者は、開発行為に関する国土交通省令で定める軽微な変更をしたときは、遅滞なく、その旨を都道府県知事に届け出なければならない。", "開発許可を受けた者は、開発行為に関する工事の廃止をしようとするときは、都道府県知事の許可を受けなければならない。", "開発行為に同意していない土地の所有者は、当該開発行為に関する工事完了の公告前に、当該開発許可を受けた開発区域内において、その権利の行使として自己の土地に建築物を建築することができる。"], "page": 10, "img": ["q16_0.jpg"]}, {"stem": "建築基準法に関する次の記述のうち、誤っているものはどれか。", "ch": ["4階建ての建築物の避難階以外の階を劇場の用途に供し、当該階に客席を有する場合には、当該階から避難階又は地上に通ずる2以上の直通階段を設けなければならない。", "床面積の合計が500㎡の映画館の用途に供する建築物を演芸場に用途変更する場合、建築主事又は指定確認検査機関の確認を受ける必要はない。", "換気設備を設けていない居室には、換気のための窓その他の開口部を設け、その換気に有効な部分の面積は、その居室の床面積に対して10分の1以上としなければならない。", "延べ面積が800㎡の百貨店の階段の部分には、排煙設備を設けなくてもよい。"], "page": 11, "img": ["q17_0.jpg"]}, {"stem": "次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["法第68条の9第1項の規定に基づく条例の制定の際、現に建築物が立ち並んでいる道は、法上の道路とみなされる。", "都市計画により、容積率の限度が10分の50とされている準工業地域内において、建築物の高さは、前面道路の反対側の境界線からの水平距離が35m以下の範囲内においては、当該部分から前面道路の反対側の境界線までの水平距離に、1.5を乗じて得た値以下でなければならない。", "第一種住居地域においては、畜舎で、その用途に供する部分の床面積が4,000㎡のものを建築することができる。", "建築物の敷地が、法第53条第1項の規定に基づく建築物の建蔽率に関する制限を受ける地域又は区域の二以上にわたる場合においては、当該建築物の敷地の過半の属する地域又は区域における建蔽率に関する制限が、当該建築物に対して適用される。"], "page": 11, "img": ["q18_0.jpg"]}, {"stem": "宅地造成等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["宅地造成工事規制区域外において行われる宅地造成に関する工事について、造成主は、工事に着手する前に都道府県知事に届け出なければならない。", "都道府県知事は、宅地造成工事規制区域内における宅地の所有者、管理者又は占有者に対して、当該宅地又は当該宅地において行われている工事の状況について報告を求めることができる。", "宅地造成工事規制区域内において宅地造成に関する工事を行う場合、宅地造成に伴う災害を防止するために行う高さ5mを超える擁壁に係る工事については、政令で定める資格を有する者の設計によらなければならない。", "都道府県知事は、偽りその他不正な手段によって宅地造成工事規制区域内において行われる宅地造成に関する工事の許可を受けた者に対して、その許可を取り消すことができる。"], "page": 12, "img": ["q19_0.jpg"]}, {"stem": "土地区画整理法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["土地区画整理組合が施行する土地区画整理事業に係る施行地区内の宅地について借地権のみを有する者は、その土地区画整理組合の組合員とはならない。", "法において、「公共施設」とは、道路、公園、広場、河川その他政令で定める公共の用に供する施設をいう。", "施行者は、換地処分の公告があった場合においては、直ちに、その旨を換地計画に係る区域を管轄する登記所に通知しなければならない。", "市町村が施行する土地区画整理事業では、事業ごとに、市町村に土地区画整理審議会が設置され、換地計画、仮換地の指定及び減価補償金の交付に関する事項について法に定める権限を行使する。"], "page": 12, "img": ["q20_0.jpg"]}, {"stem": "農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["自己所有の農地に住宅を建設する資金を借り入れるため、当該農地に抵当権の設定をする場合には、法第3条第1項の許可を受ける必要がある。", "農地の賃貸借の解除については、農地の所有者が、賃借人に対して一方的に解約の申入れを行う場合には、法第18条第1項の許可を受ける必要がない。", "登記簿の地目が宅地となっている場合には、現況が農地であっても法の規制の対象とはならない。", "市街化区域内の自己所有の農地を駐車場に転用するため、あらかじめ農業委員会に届け出た場合には、法第4条第1項の許可を受ける必要がない。"], "page": 13, "img": ["q21_0.jpg"]}, {"stem": "国土利用計画法（以下この問において「法」という。）第23条の届出（以下この問において「事後届出」という。）及び法第29条の届出に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。", "ch": ["個人Ａが所有する都市計画区域外の12,000㎡の土地に、個人Ｂが地上権の設定を受ける契約を締結した場合、Ｂは一定の場合を除き事後届出を行う必要がある。", "法第28条に基づく遊休土地に係る通知を受けた者は、その通知があった日から起算して1月以内に、その通知に係る遊休土地の利用又は処分に関する計画を、都道府県知事に届け出なければならない。", "市街化調整区域において、宅地建物取引業者Ｃが所有する面積5,000㎡の土地について、宅地建物取引業者Ｄが一定の計画に従って、2,000㎡と3,000㎡に分割して順次購入した場合、Ｄは事後届出を行う必要はない。", "都道府県知事は、事後届出があった場合において、土地の利用目的に係る必要な勧告を行うことができ、その勧告を受けた者がその勧告に従わないときは、その旨及びその内容を公表しなければならない。"], "page": 13, "img": ["q22_0.jpg"]}, {"stem": "住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置に関する次の記述のうち、正しいものはどれか。", "ch": ["この税率の軽減措置の適用対象となる住宅用家屋は、床面積が100㎡以上で、その住宅用家屋を取得した個人の居住の用に供されるものに限られる。", "この税率の軽減措置の適用対象となる住宅用家屋は、売買又は競落により取得したものに限られる。", "この税率の軽減措置は、一定の要件を満たせばその住宅用家屋の敷地の用に供されている土地の所有権の移転登記についても適用される。", "この税率の軽減措置の適用を受けるためには、登記の申請書に、一定の要件を満たす住宅用家屋であることの都道府県知事の証明書を添付しなければならない。"], "page": 14, "img": ["q23_0.jpg"]}, {"stem": "固定資産税に関する次の記述のうち、正しいものはどれか。", "ch": ["市町村長は、固定資産課税台帳に登録された価格等に重大な錯誤があることを発見した場合においては、直ちに決定された価格等を修正して、これを固定資産課税台帳に登録しなければならない。", "固定資産税の納税義務者は、その納付すべき当該年度の固定資産課税に係る固定資産について、固定資産課税台帳に登録された価格について不服があるときは、公示の日から納税通知書の交付を受けた日後1月を経過するまでの間において、文書をもって、固定資産評価審査委員会に審査の申出をすることができる。", "年度の途中において家屋の売買が行われた場合、売主と買主は、当該年度の固定資産税を、固定資産課税台帳に所有者として登録されている日数で按分して納付しなければならない。", "住宅用地のうち小規模住宅用地に対して課する固定資産税の課税標準は、当該小規模住宅用地に係る固定資産税の課税標準となるべき価格の3分の1の額である。"], "page": 14, "img": ["q24_0.jpg"]}, {"stem": "地価公示法に関する次の記述のうち、誤っているものはどれか。", "ch": ["地価公示法の目的は、都市及びその周辺の地域等において、標準地を選定し、その正常な価格を公示することにより、一般の土地の取引価格に対して指標を与え、及び公共の利益となる事業の用に供する土地に対する適正な補償金の額の算定等に資し、もって適正な地価の形成に寄与することである。", "不動産鑑定士は、公示区域内の土地について鑑定評価を行う場合において、当該土地の正常な価格を求めるときは、公示価格と実際の取引価格を規準としなければならない。", "不動産鑑定士は、土地鑑定委員会の求めに応じて標準地の鑑定評価を行うに当たっては、近傍類地の取引価格から算定される推定の価格、近傍類地の地代等から算定される推定の価格及び同等の効用を有する土地の造成に要する推定の費用の額を勘案しなければならない。", "関係市町村の長は、土地鑑定委員会が公示した事項のうち、当該市町村が属する都道府県に存する標準地に係る部分を記載した書面等を、当該市町村の事務所において一般の閲覧に供しなければならない。"], "page": 15, "img": ["q25_0.jpg"]}, {"stem": "宅地建物取引業者が宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["宅地建物取引業者は、その媒介により建物の売買の契約を成立させた場合において、当該建物の引渡しの時期又は移転登記の申請の時期のいずれかを37条書面に記載し、当該契約の各当事者に交付しなければならない。", "宅地建物取引業者は、その媒介により建物の貸借の契約を成立させた場合において、当該建物が既存の建物であるときは、建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項を37条書面に記載し、当該契約の各当事者に交付しなければならない。", "宅地建物取引業者は、その媒介により建物の貸借の契約を成立させた場合において、借賃以外の金銭の授受に関する定めがあるときは、その額や当該金銭の授受の時期だけでなく、当該金銭の授受の目的についても37条書面に記載し、当該契約の各当事者に交付しなければならない。", "宅地建物取引業者は、37条書面を交付するに当たり、宅地建物取引士をして、その書面に記名押印の上、その内容を説明させなければならない。"], "page": 15, "img": ["q26_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではないＢとの間で建物の売買契約を締結する場合における次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["ＡＢ間で建物の売買契約を締結する場合において、当事者の債務の不履行を理由とする契約の解除に伴う損害賠償の額についての特約を、代金の額の10分の2を超えて定めた場合、当該特約は全体として無効となる。", "ＡＢ間で建築工事完了前の建物の売買契約を締結する場合において、ＡがＢから保全措置が必要となる額の手付金を受領する場合、Ａは、事前に、国土交通大臣が指定する指定保管機関と手付金等寄託契約を締結し、かつ、当該契約を証する書面を買主に交付した後でなければ、Ｂからその手付金を受領することができない。", "ＡＢ間で建物の売買契約を締結する場合において、Ａは、あらかじめＢの承諾を書面で得た場合に限り、売買代金の額の10分の2を超える額の手付を受領することができる。", "ＡＢ間で建築工事完了前の建物の売買契約を締結する場合において、売買代金の10分の2の額を手付金として定めた場合、Ａが手付金の保全措置を講じていないときは、Ｂは手付金の支払を拒否することができる。"], "page": 16, "img": ["q27_0.jpg"]}, {"stem": "宅地建物取引業者Ａ（甲県知事免許）に関する監督処分及び罰則に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "Ａが、不正の手段により甲県知事から免許を受けたとき、甲県知事はＡに対して当該免許を取り消さなければならない。"}, {"m": "イ", "t": "Ａが、法第3条の2第1項の規定により付された条件に違反したときは、甲県知事はＡの免許を取り消さなければならない。"}, {"m": "ウ", "t": "Ａが、事務所の公衆の見やすい場所に国土交通大臣が定めた報酬の額を掲示しなかった場合、Ａは甲県知事から指示処分を受けることはあるが、罰則の適用を受けることはない。"}, {"m": "エ", "t": "Ａの従業者名簿の作成に当たり、法第48条第3項の規定により記載しなければならない事項についてＡの従業者Ｂが虚偽の記載をした場合、Ｂは罰則の適用を受けることはあるが、Ａは罰則の適用を受けることはない。"}], "page": 16, "img": ["q28_0.jpg"]}, {"stem": "次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。", "ch": ["宅地建物取引業の免許の有効期間は5年であり、免許の更新の申請は、有効期間満了の日の90日前から30日前までの間に行わなければならない。", "宅地建物取引業者から免許の更新の申請があった場合において、有効期間の満了の日までにその申請について処分がなされないときは、従前の免許は、有効期間の満了後もその処分がなされるまでの間は、なお効力を有する。", "個人である宅地建物取引業者Ａ（甲県知事免許）が死亡した場合、Ａの相続人は、Ａの死亡の日から30日以内に、その旨を甲県知事に届け出なければならない。", "法人である宅地建物取引業者Ｂ（乙県知事免許）が合併により消滅した場合、Ｂを代表する役員であった者は、その日から30日以内に、その旨を乙県知事に届け出なければならない。"], "page": 17, "img": ["q29_0.jpg"]}, {"stem": "宅地建物取引業者Ａがその業務に関して行う広告に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["Ａは、中古の建物の売買において、当該建物の所有者から媒介の依頼を受け、取引態様の別を明示せずに広告を掲載したものの、広告を見た者からの問合せはなく、契約成立には至らなかった場合には、当該広告は法第34条の規定に違反するものではない。", "Ａは、自ら売主として、建築基準法第6条第1項の確認の申請中である新築の分譲マンションについて「建築確認申請済」と明示した上で広告を行った。当該広告は、建築確認を終えたものと誤認させるものではないため、法第33条の規定に違反するものではない。", "Ａは、顧客を集めるために売る意思のない条件の良い物件を広告し、実際は他の物件を販売しようとしたが注文がなく、売買が成立しなかった場合であっても、監督処分の対象となる。", "Ａは、免許を受けた都道府県知事から宅地建物取引業の免許の取消しを受けたものの、当該免許の取消し前に建物の売買の広告をしていた場合、当該建物の売買契約を締結する目的の範囲内においては、なお宅地建物取引業者とみなされる。"], "page": 17, "img": ["q30_0.jpg"]}, {"stem": "宅地建物取引業者Ａ（消費税課税事業者）が貸主Ｂから建物の貸借の代理の依頼を受け、宅地建物取引業者Ｃ（消費税課税事業者）が借主Ｄから媒介の依頼を受け、ＢとＤとの間で賃貸借契約を成立させた場合における次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはいくつあるか。なお、1か月分の借賃は8万円とし、借賃及び権利金（権利設定の対価として支払われる金銭であって返還されないものをいう。）には、消費税等相当額を含まないものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "建物を住居として貸借する場合、Ｃは、媒介の依頼を受けるに当たってＤから承諾を得ているときを除き、44,000円を超える報酬をＤから受領することはできない。"}, {"m": "イ", "t": "建物を店舗として貸借する場合、ＡがＢから受領する報酬とＣがＤから受領する報酬の合計額は88,000円を超えてはならない。"}, {"m": "ウ", "t": "建物を店舗として貸借する場合、200万円の権利金の授受があるときは、Ａ及びＣが受領できる報酬の額の合計は、110,000円を超えてはならない。"}, {"m": "エ", "t": "Ａは、Ｂから媒介報酬の限度額まで受領する他に、Ｂの依頼によらない通常の広告の料金に相当する額を別途受領することができる。"}], "page": 18, "img": ["q31_0.jpg"]}, {"stem": "宅地建物取引業法第35条の2に規定する供託所等に関する説明についての次の記述のうち、正しいものはどれか。なお、特に断りのない限り、宅地建物取引業者の相手方は宅地建物取引業者ではないものとする。", "ch": ["宅地建物取引業者は、宅地建物取引業者の相手方に対して供託所等の説明を行う際に書面を交付することは要求されていないが、重要事項説明書に記載して説明することが望ましい。", "宅地建物取引業者は、宅地建物取引業者が取引の相手方の場合においても、供託所等に係る説明をしなければならない。", "宅地建物取引業者は、売買、交換又は貸借の契約に際し、契約成立後、速やかに供託所等に係る説明をしなければならない。", "宅地建物取引業者は、自らが宅地建物取引業保証協会の社員である場合、営業保証金を供託した主たる事務所の最寄りの供託所及び所在地の説明をしなければならない。"], "page": 18, "img": ["q32_0.jpg"]}, {"stem": "宅地建物取引業者Ａは、ＢからＢ所有の宅地の売却について媒介の依頼を受けた。この場合における次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、この問において「専任媒介契約」とは、専属専任媒介契約ではない専任媒介契約をいう。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "ＡがＢとの間で専任媒介契約を締結した場合、ＡはＢに対して、当該専任媒介契約に係る業務の処理状況を1週間に1回以上報告しなければならない。"}, {"m": "イ", "t": "ＡがＢとの間で専任媒介契約を締結した場合、Ｂの要望により当該宅地を指定流通機構に登録しない旨の特約をしているときを除き、Ａは、当該専任媒介契約締結日から7日以内（休業日数を含まない。）に、指定流通機構に当該宅地の所在等を登録しなければならない。"}, {"m": "ウ", "t": "ＡがＢとの間で一般媒介契約を締結した場合、ＡはＢに対して、遅滞なく、宅地建物取引業法第34条の2第1項の規定に基づく書面を交付しなければならない。"}, {"m": "エ", "t": "ＡがＢとの間で一般媒介契約を締結した場合、ＡがＢに対し当該宅地の価額又は評価額について意見を述べるときは、その根拠を明らかにしなければならないが、根拠の明示は口頭でも書面を用いてもよい。"}], "page": 19, "img": ["q33_0.jpg"]}, {"stem": "宅地、建物に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地とは、建物の敷地に供せられる土地をいい、道路、公園、河川、広場及び水路に供せられているものは宅地には当たらない。", "建物の一部の売買の代理を業として行う行為は、宅地建物取引業に当たらない。", "建物とは、土地に定着する工作物のうち、屋根及び柱若しくは壁を有するものをいうが、学校、病院、官公庁施設等の公共的な施設は建物には当たらない。", "宅地とは、現に建物の敷地に供せられている土地をいい、その地目、現況によって宅地に当たるか否かを判断する。"], "page": 19, "img": ["q34_0.jpg"]}, {"stem": "宅地建物取引業者が宅地及び建物の売買の媒介を行う場合における宅地建物取引業法第35条に規定する重要事項の説明及び重要事項説明書の交付に関する次の記述のうち、正しいものはどれか。", "ch": ["宅地建物取引士は、テレビ会議等のＩＴを活用して重要事項の説明を行うときは、相手方の承諾があれば宅地建物取引士証の提示を省略することができる。", "宅地建物取引業者は、その媒介により売買契約が成立したときは、当該契約の各当事者に、遅滞なく、重要事項説明書を交付しなければならない。", "宅地建物取引業者は、重要事項説明書の交付に当たり、専任の宅地建物取引士をして当該書面に記名押印させるとともに、売買契約の各当事者にも当該書面に記名押印させなければならない。", "宅地建物取引業者は、買主が宅地建物取引業者であっても、重要事項説明書を交付しなければならない。"], "page": 20, "img": ["q35_0.jpg"]}, {"stem": "宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["法人である宅地建物取引業者Ａ（甲県知事免許）について破産手続開始の決定があった場合、その日から30日以内に、Ａを代表する役員Ｂは、その旨を、甲県知事に届け出なければならない。", "宅地建物取引業者Ｃ（乙県知事免許）が国土交通大臣に免許換えの申請を行っているときは、Ｃは、取引の相手方に対し、重要事項説明書及び宅地建物取引業法第37条の規定により交付すべき書面を交付することができない。", "宅地建物取引業者Ｄ（丙県知事免許）が、免許の更新の申請を怠り、その有効期間が満了した場合、Ｄは、遅滞なく、丙県知事に免許証を返納しなければならない。", "宅地建物取引業者Ｅ（丁県知事免許）が引き続いて1年以上事業を休止したときは、丁県知事は免許を取り消さなければならない。"], "page": 20, "img": ["q36_0.jpg"]}, {"stem": "宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、この問において「登録」とは、宅地建物取引士の登録をいうものとする。", "ch": ["甲県知事の登録を受けている宅地建物取引士は、乙県に主たる事務所を置く宅地建物取引業者の専任の宅地建物取引士となる場合、乙県知事に登録の移転を申請しなければならない。", "宅地建物取引士の氏名等が登載されている宅地建物取引士資格登録簿は一般の閲覧に供されることとはされていないが、専任の宅地建物取引士は、その氏名が宅地建物取引業者名簿に登載され、当該名簿が一般の閲覧に供される。", "宅地建物取引士が、刑法第204条（傷害）の罪により罰金の刑に処せられ、登録が消除された場合、当該登録が消除された日から5年を経過するまでは、新たな登録を受けることができない。", "未成年者は、宅地建物取引業に係る営業に関し成年者と同一の行為能力を有していたとしても、成年に達するまでは登録を受けることができない。"], "page": 21, "img": ["q37_0.jpg"]}, {"stem": "次の記述のうち、宅地建物取引業法の規定に違反しないものの組合せとして、正しいものはどれか。なお、この問において「建築確認」とは、建築基準法第6条第1項の確認をいうものとする。", "ch": ["ア、イ", "ア、エ", "イ、ウ", "ウ、エ"], "items": [{"m": "ア", "t": "宅地建物取引業者Ａは、建築確認の済んでいない建築工事完了前の賃貸住宅の貸主Ｂから当該住宅の貸借の媒介を依頼され、取引態様を媒介と明示して募集広告を行った。"}, {"m": "イ", "t": "宅地建物取引業者Ｃは、建築確認の済んでいない建築工事完了前の賃貸住宅の貸主Ｄから当該住宅の貸借の代理を依頼され、代理人として借主Ｅとの間で当該住宅の賃貸借契約を締結した。"}, {"m": "ウ", "t": "宅地建物取引業者Ｆは、自己の所有に属しない宅地について、自ら売主として、宅地建物取引業者Ｇと売買契約の予約を締結した。"}, {"m": "エ", "t": "宅地建物取引業者Ｈは、農地の所有者Ｉと建物の敷地に供するため農地法第5条の許可を条件とする売買契約を締結したので、自ら売主として宅地建物取引業者ではない個人ＪとＩ所有の農地の売買契約を締結した。"}], "page": 21, "img": ["q38_0.jpg"]}, {"stem": "宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。", "ch": ["保証協会は、その名称、住所又は事務所の所在地を変更しようとするときは、あらかじめ、その旨を国土交通大臣に届け出なければならない。", "保証協会は、新たに社員が加入したときは、直ちに、その旨を当該社員である宅地建物取引業者が免許を受けた国土交通大臣又は都道府県知事に報告しなければならない。", "宅地建物取引業者で保証協会に加入しようとする者は、その加入した日から1週間以内に、政令で定める額の弁済業務保証金分担金を当該保証協会に納付しなければならない。", "保証協会の社員は、自らが取り扱った宅地建物取引業に係る取引の相手方から当該取引に関する苦情について解決の申出が保証協会にあり、保証協会から説明を求められたときは、正当な理由がある場合でなければ、これを拒んではならない。"], "page": 22, "img": ["q39_0.jpg"]}, {"stem": "宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）についての宅地建物取引業者Ａの義務に関する次の記述のうち、正しいものはどれか。", "ch": ["Ａは、自ら売主として、宅地建物取引業者Ｂの媒介により、Ｃと宅地の売買契約を締結した。Ｂが宅地建物取引士をして37条書面に記名押印させている場合、Ａは宅地建物取引士をして当該書面に記名押印させる必要はない。", "Ａは、Ｄを売主とし Ｅを買主とする宅地の売買契約を媒介した。当該売買契約に、当該宅地が種類又は品質に関して契約の内容に適合しない場合においてその不適合を担保すべき責任に関する特約があるときは、Ａは、当該特約について記載した37条書面をＤ及びＥに交付しなければならない。", "Ａは、自ら買主として、Ｆと宅地の売買契約を締結した。この場合、Ｆに対して37条書面を交付する必要はない。", "Ａは、自ら貸主として、Ｇと事業用建物の定期賃貸借契約を締結した。この場合において、借賃の支払方法についての定めがあるときは、Ａはその内容を37条書面に記載しなければならず、Ｇに対して当該書面を交付しなければならない。"], "page": 22, "img": ["q40_0.jpg"]}, {"stem": "宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。", "ch": ["宅地建物取引業者Ａは、一団の宅地建物の分譲をするため設置した案内所には、契約を締結することなく、かつ、契約の申込みを受けることがないときでも、1名以上の専任の宅地建物取引士を置かなければならない。", "宅地建物取引業者Ｂは、その主たる事務所に従事する唯一の専任の宅地建物取引士が退職したときは、2週間以内に、宅地建物取引業法第31条の3第1項の規定に適合させるため必要な措置を執らなければならない。", "宅地建物取引業者Ｃが、20戸の一団の分譲建物の売買契約の申込みのみを受ける案内所甲を設置した場合、売買契約の締結は事務所乙で行うとしても、甲にも専任の宅地建物取引士を置かなければならない。", "法人である宅地建物取引業者Ｄ社の従業者であり、宅地建物取引業に係る営業に関し成年者と同一の行為能力を有する20歳未満の婚姻歴のない宅地建物取引士Ｅは、Ｄ社の役員であるときを除き、Ｄ社の専任の宅地建物取引士となることができない。"], "page": 23, "img": ["q41_0.jpg"]}, {"stem": "宅地建物取引業者が媒介により既存建物の貸借の契約を成立させた場合に関する次の記述のうち、宅地建物取引業法第37条の規定により当該貸借の契約当事者に対して交付すべき書面に記載しなければならない事項はいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "借賃以外の金銭の授受に関する定めがあるときは、その額並びに当該金銭の授受の時期及び目的"}, {"m": "イ", "t": "設計図書、点検記録その他の建物の建築及び維持保全の状況に関する書面で、国土交通省令で定めるものの保存の状況"}, {"m": "ウ", "t": "契約の解除に関する定めがあるときは、その内容"}, {"m": "エ", "t": "天災その他不可抗力による損害の負担に関する定めがあるときは、その内容"}], "page": 23, "img": ["q42_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではない法人Ｂ又は宅地建物取引業者ではない個人Ｃをそれぞれ買主とする土地付建物の売買契約を締結する場合において、宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、誤っているものはどれか。なお、この問において、買主は本件売買契約に係る代金の全部を支払ってはおらず、かつ、土地付建物の引渡しを受けていないものとする。", "ch": ["Ｂは、Ａの仮設テント張りの案内所で買受けの申込みをし、その8日後にＡの事務所で契約を締結したが、その際クーリング・オフについて書面の交付を受けずに告げられた。この場合、クーリング・オフについて告げられた日から8日後には、Ｂはクーリング・オフによる契約の解除をすることができない。", "Ｂは、Ａの仮設テント張りの案内所で買受けの申込みをし、その3日後にＡの事務所でクーリング・オフについて書面の交付を受け、告げられた上で契約を締結した。この書面の中で、クーリング・オフによる契約の解除ができる期間を14日間としていた場合、Ｂは、その書面を交付された日から12日後であっても契約の解除をすることができる。", "Ｃは、Ａの仮設テント張りの案内所で買受けの申込みをし、その3日後にＡの事務所でクーリング・オフについて書面の交付を受け、告げられた上で契約を締結した。Ｃは、その書面を受け取った日から起算して8日目に、Ａに対しクーリング・オフによる契約の解除を行う旨の文書を送付し、その2日後にＡに到達した。この場合、Ａは契約の解除を拒むことができない。", "Ｃは、Ａの事務所で買受けの申込みをし、その翌日、喫茶店で契約を締結したが、Ａはクーリング・オフについて告げる書面をＣに交付しなかった。この場合、Ｃはクーリング・オフによる契約の解除をすることができない。"], "page": 24, "img": ["q43_0.jpg"]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明についての次の記述のうち、正しいものはいくつあるか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["一つ", "二つ", "三つ", "なし"], "items": [{"m": "ア", "t": "賃貸借契約において、取引対象となる宅地又は建物が、水防法施行規則第11条第1項の規定により市町村（特別区を含む。）の長が提供する図面に当該宅地又は建物の位置が表示されている場合には、当該図面における当該宅地又は建物の所在地を説明しなければならない。"}, {"m": "イ", "t": "賃貸借契約において、対象となる建物が既存の住宅であるときは、法第34条の2第1項第4号に規定する建物状況調査を実施しているかどうか、及びこれを実施している場合におけるその結果の概要を説明しなければならない。"}, {"m": "ウ", "t": "建物の売買において、その建物の種類又は品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任の履行に関し保証保険契約の締結などの措置を講ずるかどうか、また、講ずる場合はその措置の概要を説明しなければならない。"}], "page": 25, "img": ["q44_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として宅地建物取引業者ではない買主Ｂに新築住宅を販売する場合における次の記述のうち、特定住宅瑕疵担保責任の履行の確保等に関する法律の規定によれば、正しいものはどれか。", "ch": ["Ａは、Ｂの承諾を得た場合には、Ｂに引き渡した新築住宅について、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行わなくてもよい。", "Ａは、基準日に係る住宅販売瑕疵担保保証金の供託及び住宅販売瑕疵担保責任保険契約の締結の状況について届出をしなければ、当該基準日の翌日から起算して1月を経過した日以後においては、新たに自ら売主となる新築住宅の売買契約を締結することができない。", "Ａが住宅販売瑕疵担保責任保険契約を締結する場合、保険金額は2,000万円以上でなければならないが、Ｂの承諾を得た場合には、保険金額を500万円以上の任意の額とすることができる。", "Ａが住宅販売瑕疵担保責任保険契約を締結した場合、住宅の構造耐力上主要な部分又は雨水の浸入を防止する部分の瑕疵があり、Ａが相当の期間を経過してもなお特定住宅販売瑕疵担保責任を履行しないときは、Ｂは住宅販売瑕疵担保責任保険契約の有効期間内であれば、その瑕疵によって生じた損害について保険金を請求することができる。"], "page": 25, "img": ["q45_0.jpg"]}, {"stem": "独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["機構は、子どもを育成する家庭又は高齢者の家庭に適した良好な居住性能及び居住環境を有する賃貸住宅の建設に必要な資金の貸付けを業務として行っていない。", "機構は、災害により住宅が滅失した場合において、それに代わるべき建築物の建設又は購入に必要な資金の貸付けを業務として行っている。", "機構が証券化支援事業（買取型）により譲り受ける貸付債権は、自ら居住する住宅又は自ら居住する住宅以外の親族の居住の用に供する住宅を建設し、又は購入する者に対する貸付けに係るものでなければならない。", "機構は、マンション管理組合や区分所有者に対するマンション共用部分の改良に必要な資金の貸付けを業務として行っている。"], "page": 26, "img": ["q46_0.jpg"]}, {"stem": "宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。", "ch": ["新築分譲マンションの販売広告において、近隣のデパート、スーパーマーケット、商店等の商業施設は、将来確実に利用できる施設であっても、現に利用できるものでなければ表示することができない。", "有名な旧跡から直線距離で1,100mの地点に所在する新築分譲マンションの名称に当該旧跡の名称を用いることができる。", "土地の販売価格については、1区画当たりの価格並びに1㎡当たりの価格及び1区画当たりの土地面積のいずれも表示しなければならない。", "新築分譲マンションの修繕積立金が住戸により異なる場合、広告スペースの関係で全ての住戸の修繕積立金を示すことが困難であっても、修繕積立金について全住戸の平均額で表示することはできない。"], "page": 26, "img": ["q47_0.jpg"]}, {"stem": "次の記述のうち、正しいものはどれか。", "ch": ["令和3年版国土交通白書（令和3年6月公表）によれば、宅地建物取引業者数は、令和元年度末において10万業者を下回っている。", "令和3年地価公示（令和3年3月公表）によれば、令和2年1月以降の1年間の地価の変動を見ると、全国平均の用途別では、住宅地、商業地及び工業地のいずれの用途も下落に転じた。", "令和3年版土地白書（令和3年6月公表）によれば、令和元年における我が国の国土面積は約3,780万haであり、このうち住宅地、工業用地等の宅地は約197万haとなっており、宅地及び農地の合計面積は、森林の面積を超えている。", "建築着工統計（令和3年1月公表）によれば、令和2年1月から令和2年12月までのマンション着工戸数は、「三大都市圏計」及び「その他の地域」のいずれにおいても前年を下回っている。"], "page": 27, "img": ["q48_0.jpg"]}, {"stem": "土地に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["沿岸地域における地震時の津波を免れるためには、巨大な防波堤が必要であるが、それには限度があり、完全に津波の襲来を防ぐことはできない。", "一般に凝灰岩、頁岩、花崗岩（風化してマサ土化したもの）は、崩壊しにくい。", "低地は、大部分が水田や宅地として利用され、大都市の大部分もここに立地している。", "平地に乏しい都市の周辺では、住宅地が丘陵や山麓に広がり、土砂崩壊等の災害を引き起こす例も多い。"], "page": 27, "img": ["q49_0.jpg"]}, {"stem": "建物の構造に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["組積式構造は、耐震性は劣るものの、熱、音などを遮断する性能が優れている。", "組積式構造を耐震的な構造にするためには、大きな開口部を造ることを避け、壁厚を大きくする必要がある。", "補強コンクリートブロック造は、壁式構造の一種であり、コンクリートブロック造を鉄筋コンクリートで耐震的に補強改良したものである。", "補強コンクリートブロック造は、壁量を多く必要とはせず、住宅等の小規模の建物には使用されていない。"], "page": 27, "img": ["q50_0.jpg"]}]},

   ans:[[1], [4], [2], [3], [1], [3], [2], [2], [3], [2], [4], [3], [4], [1], [4], [2], [1], [3], [3], [2], [1], [1], [3], [4], [4], [3], [2], [3], [3], [4], [1], [1], [1], [4], [3], [4], [1], [4], [2], [2], [3], [1, 4], [2], [4], [2], [2], [1], [3], [4], [3]],
   qs:[{"stem": "Ａが購入した甲土地が他の土地に囲まれて公道に通じない土地であった場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["甲土地が共有物の分割によって公道に通じない土地となっていた場合には、Ａは公道に至るために他の分割者の所有地を、償金を支払うことなく通行することができる。", "Ａは公道に至るため甲土地を囲んでいる土地を通行する権利を有するところ、Ａが自動車を所有していても、自動車による通行権が認められることはない。", "Ａが、甲土地を囲んでいる土地の一部である乙土地を公道に出るための通路にする目的で賃借した後、甲土地をＢに売却した場合には、乙土地の賃借権は甲土地の所有権に従たるものとして甲土地の所有権とともにＢに移転する。", "Ｃが甲土地を囲む土地の所有権を時効により取得した場合には、ＡはＣが時効取得した土地を公道に至るために通行することができなくなる。"], "page": 3, "img": ["q01_0.jpg"]}, {"stem": "令和2年7月1日に下記ケース①及びケース②の保証契約を締結した場合に関する次の1から4までの記述のうち、民法の規定によれば、正しいものはどれか。\n\n（ケース①）個人Ａが金融機関Ｂから事業資金として1,000万円を借り入れ、ＣがＢとの間で当該債務に係る保証契約を締結した場合\n（ケース②）個人Ａが建物所有者Ｄと居住目的の建物賃貸借契約を締結し、ＥがＤとの間で当該賃貸借契約に基づくＡの一切の債務に係る保証契約を締結した場合", "ch": ["ケース①の保証契約は、口頭による合意でも有効であるが、ケース②の保証契約は、書面でしなければ効力を生じない。", "ケース①の保証契約は、Ｃが個人でも法人でも極度額を定める必要はないが、ケース②の保証契約は、Ｅが個人でも法人でも極度額を定めなければ効力を生じない。", "ケース①及びケース②の保証契約がいずれも連帯保証契約である場合、ＢがＣに債務の履行を請求したときはＣは催告の抗弁を主張することができるが、ＤがＥに債務の履行を請求したときはＥは催告の抗弁を主張することができない。", "保証人が保証契約締結の日前1箇月以内に公正証書で保証債務を履行する意思を表示していない場合、ケース①のＣがＡの事業に関与しない個人であるときはケース①の保証契約は効力を生じないが、ケース②の保証契約は有効である。"], "page": 3, "img": ["q02_0.jpg"]}, {"stem": "次の1から4までの契約に関する記述のうち、民法の規定及び下記判決文によれば、誤っているものはどれか。なお、これらの契約は令和2年4月1日以降に締結されたものとする。\n\n（判決文）\n法律が債務の不履行による契約の解除を認める趣意は、契約の要素をなす債務の履行がないために、該契約をなした目的を達することができない場合を救済するためであり、当事者が契約をなした主たる目的の達成に必須的でない附随的義務の履行を怠ったに過ぎないような場合には、特段の事情の存しない限り、相手方は当該契約を解除することができないものと解するのが相当である。", "ch": ["土地の売買契約において、売主が負担した当該土地の税金相当額を買主が償還する付随的義務が定められ、買主が売買代金を支払っただけで税金相当額を償還しなかった場合、特段の事情がない限り、売主は当該売買契約の解除をすることができない。", "債務者が債務を履行しない場合であっても、債務不履行について債務者の責めに帰すべき事由がないときは付随的義務の不履行となり、特段の事情がない限り、債権者は契約の解除をすることができない。", "債務不履行に対して債権者が相当の期間を定めて履行を催告してその期間内に履行がなされない場合であっても、催告期間が経過した時における債務不履行がその契約及び取引上の社会通念に照らして軽微であるときは、債権者は契約の解除をすることができない。", "債務者が債務を履行しない場合であって、債務者がその債務の全部の履行を拒絶する意思を明確に表示したときは、債権者は、相当の期間を定めてその履行を催告することなく、直ちに契約の解除をすることができる。"], "page": 4, "img": ["q03_0.jpg"]}, {"stem": "建物の賃貸借契約が期間満了により終了した場合における次の記述のうち、民法の規定によれば、正しいものはどれか。なお、賃貸借契約は、令和2年7月1日付けで締結され、原状回復義務について特段の合意はないものとする。", "ch": ["賃借人は、賃借物を受け取った後にこれに生じた損傷がある場合、通常の使用及び収益によって生じた損耗も含めてその損傷を原状に復する義務を負う。", "賃借人は、賃借物を受け取った後にこれに生じた損傷がある場合、賃借人の帰責事由の有無にかかわらず、その損傷を原状に復する義務を負う。", "賃借人から敷金の返還請求を受けた賃貸人は、賃貸物の返還を受けるまでは、これを拒むことができる。", "賃借人は、未払賃料債務がある場合、賃貸人に対し、敷金をその債務の弁済に充てるよう請求することができる。"], "page": 5, "img": ["q04_0.jpg"]}, {"stem": "ＡとＢとの間で令和2年7月1日に締結された委任契約において、委任者Ａが受任者Ｂに対して報酬を支払うこととされていた場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["Ａの責めに帰すべき事由によって履行の途中で委任が終了した場合、Ｂは報酬全額をＡに対して請求することができるが、自己の債務を免れたことによって得た利益をＡに償還しなければならない。", "Ｂは、契約の本旨に従い、自己の財産に対するのと同一の注意をもって委任事務を処理しなければならない。", "Ｂの責めに帰すべき事由によって履行の途中で委任が終了した場合、ＢはＡに対して報酬を請求することができない。", "Ｂが死亡した場合、Ｂの相続人は、急迫の事情の有無にかかわらず、受任者の地位を承継して委任事務を処理しなければならない。"], "page": 5, "img": ["q05_0.jpg"]}, {"stem": "ＡとＢとの間で令和2年7月1日に締結された売買契約に関する次の記述のうち、民法の規定によれば、売買契約締結後、ＡがＢに対し、錯誤による取消しができるものはどれか。", "ch": ["Ａは、自己所有の自動車を100万円で売却するつもりであったが、重大な過失によりＢに対し「10万円で売却する」と言ってしまい、Ｂが過失なく「Ａは本当に10万円で売るつもりだ」と信じて購入を申し込み、ＡＢ間に売買契約が成立した場合", "Ａは、自己所有の時価100万円の壺を10万円程度であると思い込み、Ｂに対し「手元にお金がないので、10万円で売却したい」と言ったところ、ＢはＡの言葉を信じ「それなら10万円で購入する」と言って、ＡＢ間に売買契約が成立した場合", "Ａは、自己所有の時価100万円の名匠の絵画を贋作だと思い込み、Ｂに対し「贋作であるので、10万円で売却する」と言ったところ、Ｂも同様に贋作だと思い込み「贋作なら10万円で購入する」と言って、ＡＢ間に売買契約が成立した場合", "Ａは、自己所有の腕時計を100万円で外国人Ｂに売却する際、当日の正しい為替レート（1ドル100円）を重大な過失により1ドル125円で計算して「8,000ドルで売却する」と言ってしまい、Ａの錯誤について過失なく知らなかったＢが「8,000ドルなら買いたい」と言って、ＡＢ間に売買契約が成立した場合"], "page": 6, "img": ["q06_0.jpg"]}, {"stem": "保証に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、保証契約は令和2年4月1日以降に締結されたものとする。", "ch": ["特定物売買における売主の保証人は、特に反対の意思表示がない限り、売主の債務不履行により契約が解除された場合には、原状回復義務である既払代金の返還義務についても保証する責任がある。", "主たる債務の目的が保証契約の締結後に加重されたときは、保証人の負担も加重され、主たる債務者が時効の利益を放棄すれば、その効力は連帯保証人に及ぶ。", "委託を受けた保証人が主たる債務の弁済期前に債務の弁済をしたが、主たる債務者が当該保証人からの求償に対して、当該弁済日以前に相殺の原因を有していたことを主張するときは、保証人は、債権者に対し、その相殺によって消滅すべきであった債務の履行を請求することができる。", "委託を受けた保証人は、履行の請求を受けた場合だけでなく、履行の請求を受けずに自発的に債務の消滅行為をする場合であっても、あらかじめ主たる債務者に通知をしなければ、同人に対する求償が制限されることがある。"], "page": 6, "img": ["q07_0.jpg"]}, {"stem": "相続（令和2年7月1日に相続の開始があったもの）に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。", "ch": ["相続回復の請求権は、相続人又はその法定代理人が相続権を侵害された事実を知った時から5年間行使しないときは、時効によって消滅する。", "被相続人の子が相続開始以前に死亡したときは、その者の子がこれを代襲して相続人となるが、さらに代襲者も死亡していたときは、代襲者の子が相続人となることはない。", "被相続人に相続人となる子及びその代襲相続人がおらず、被相続人の直系尊属が相続人となる場合には、被相続人の兄弟姉妹が相続人となることはない。", "被相続人の兄弟姉妹が相続人となるべき場合であっても、相続開始以前に兄弟姉妹及びその子がいずれも死亡していたときは、その者の子（兄弟姉妹の孫）が相続人となることはない。"], "page": 7, "img": ["q08_0.jpg"]}, {"stem": "Ａがその所有する甲建物について、Ｂとの間で、①Ａを売主、Ｂを買主とする売買契約を締結した場合と、②Ａを贈与者、Ｂを受贈者とする負担付贈与契約を締結した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、これらの契約は、令和2年7月1日に締結され、担保責任に関する特約はないものとする。", "ch": ["①の契約において、Ｂが手付を交付し、履行期の到来後に代金支払の準備をしてＡに履行の催告をした場合、Ａは、手付の倍額を現実に提供して契約の解除をすることができる。", "②の契約が書面によらずになされた場合、Ａは、甲建物の引渡し及び所有権移転登記の両方が終わるまでは、書面によらないことを理由に契約の解除をすることができる。", "②の契約については、Ａは、その負担の限度において、売主と同じく担保責任を負う。", "①の契約については、Ｂの債務不履行を理由としてＡに解除権が発生する場合があるが、②の契約については、Ｂの負担の不履行を理由としてＡに解除権が発生することはない。"], "page": 7, "img": ["q09_0.jpg"]}, {"stem": "Ａが甲土地を所有している場合の時効に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["Ｂが甲土地を所有の意思をもって平穏かつ公然に17年間占有した後、ＣがＢを相続し甲土地を所有の意思をもって平穏かつ公然に3年間占有した場合、Ｃは甲土地の所有権を時効取得することができる。", "Ｄが、所有者と称するＥから、Ｅが無権利者であることについて善意無過失で甲土地を買い受け、所有の意思をもって平穏かつ公然に3年間占有した後、甲土地がＡの所有であることに気付いた場合、そのままさらに7年間甲土地の占有を継続したとしても、Ｄは、甲土地の所有権を時効取得することはできない。", "Ｄが、所有者と称するＥから、Ｅが無権利者であることについて善意無過失で甲土地を買い受け、所有の意思をもって平穏かつ公然に3年間占有した後、甲土地がＡの所有であることを知っているＦに売却し、Ｆが所有の意思をもって平穏かつ公然に甲土地を7年間占有した場合、Ｆは甲土地の所有権を時効取得することができる。", "Ａが甲土地を使用しないで20年以上放置していたとしても、Ａの有する甲土地の所有権が消滅時効にかかることはない。"], "page": 8, "img": ["q10_0.jpg"]}, {"stem": "Ａ所有の甲土地につき、令和2年7月1日にＢとの間で居住の用に供する建物の所有を目的として存続期間30年の約定で賃貸借契約（以下この問において「本件契約」という。）が締結された場合に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。", "ch": ["Ｂは、借地権の登記をしていなくても、甲土地の引渡しを受けていれば、甲土地を令和2年7月2日に購入したＣに対して借地権を主張することができる。", "本件契約で「一定期間は借賃の額の増減を行わない」旨を定めた場合には、甲土地の借賃が近傍類似の土地の借賃と比較して不相当となったときであっても、当該期間中は、ＡもＢも借賃の増減を請求することができない。", "本件契約で「Ｂの債務不履行により賃貸借契約が解除された場合には、ＢはＡに対して建物買取請求権を行使することができない」旨を定めても、この合意は無効となる。", "ＡとＢとが期間満了に当たり本件契約を最初に更新する場合、更新後の存続期間を15年と定めても、20年となる。"], "page": 8, "img": ["q11_0.jpg"]}, {"stem": "ＡとＢとの間でＡ所有の甲建物をＢに対して、居住の用を目的として、期間2年、賃料月額10万円で賃貸する旨の賃貸借契約（以下この問において「本件契約」という。）を締結し、Ｂが甲建物の引渡しを受けた場合に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、誤っているものはどれか。", "ch": ["ＡがＣに甲建物を売却した場合、Ｂは、それまでに契約期間中の賃料全額をＡに前払いしていたことを、Ｃに対抗することができる。", "本件契約が借地借家法第38条の定期建物賃貸借契約であって、賃料改定に関する特約がない場合、経済事情の変動により賃料が不相当となったときは、ＡはＢに対し、賃料増額請求をすることができる。", "本件契約が借地借家法第38条の定期建物賃貸借契約である場合、Ａは、転勤、療養、親族の介護その他のやむを得ない事情があれば、Ｂに対し、解約を申し入れ、申入れの日から1月を経過することによって、本件契約を終了させることができる。", "本件契約が借地借家法第38条の定期建物賃貸借契約であって、造作買取請求に関する特約がない場合、期間満了で本件契約が終了するときに、Ｂは、Ａの同意を得て甲建物に付加した造作について買取請求をすることができる。"], "page": 9, "img": ["q12_0.jpg"]}, {"stem": "建物の区分所有等に関する法律に関する次の記述のうち、正しいものはどれか。", "ch": ["共用部分の変更（その形状又は効用の著しい変更を伴わないものを除く。）は、区分所有者及び議決権の各4分の3以上の多数による集会の決議で決するが、この区分所有者の定数は、規約で2分の1以上の多数まで減ずることができる。", "共用部分の管理に係る費用については、規約に別段の定めがない限り、共有者で等分する。", "共用部分の保存行為をするには、規約に別段の定めがない限り、集会の決議で決する必要があり、各共有者ですることはできない。", "一部共用部分は、これを共用すべき区分所有者の共有に属するが、規約で別段の定めをすることにより、区分所有者全員の共有に属するとすることもできる。"], "page": 9, "img": ["q13_0.jpg"]}, {"stem": "不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、正しいものはどれか。", "ch": ["敷地権付き区分建物の表題部所有者から所有権を取得した者は、当該敷地権の登記名義人の承諾を得なければ、当該区分建物に係る所有権の保存の登記を申請することができない。", "所有権に関する仮登記に基づく本登記は、登記上の利害関係を有する第三者がある場合であっても、その承諾を得ることなく、申請することができる。", "債権者Ａが債務者Ｂに代位して所有権の登記名義人ＣからＢへの所有権の移転の登記を申請した場合において、当該登記を完了したときは、登記官は、Ａに対し、当該登記に係る登記識別情報を通知しなければならない。", "配偶者居住権は、登記することができる権利に含まれない。"], "page": 10, "img": ["q14_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。", "ch": ["地区計画については、都市計画に、地区施設及び地区整備計画を定めるよう努めるものとされている。", "都市計画事業の認可の告示があった後に当該認可に係る事業地内の土地建物等を有償で譲り渡そうとする者は、施行者の許可を受けなければならない。", "第二種住居地域は、中高層住宅に係る良好な住居の環境を保護するため定める地域とされている。", "市街化調整区域における地区計画は、市街化区域における市街化の状況等を勘案して、地区計画の区域の周辺における市街化を促進することがない等当該都市計画区域における計画的な市街化を図る上で支障がないように定めることとされている。"], "page": 10, "img": ["q15_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["開発許可を申請しようとする者は、あらかじめ、開発行為又は開発行為に関する工事により設置される公共施設を管理することとなる者と協議しなければならない。", "都市計画事業の施行として行う建築物の新築であっても、市街化調整区域のうち開発許可を受けた開発区域以外の区域内においては、都道府県知事の許可を受けなければ、建築物の新築をすることができない。", "開発許可を受けた開発行為により公共施設が設置されたときは、その公共施設は、工事完了の公告の日の翌日において、原則としてその公共施設の存する市町村の管理に属するものとされている。", "開発許可を受けた者から当該開発区域内の土地の所有権を取得した者は、都道府県知事の承認を受けて、当該開発許可を受けた者が有していた当該開発許可に基づく地位を承継することができる。"], "page": 11, "img": ["q16_0.jpg"]}, {"stem": "建築基準法に関する次の記述のうち、正しいものはどれか。", "ch": ["階数が2で延べ面積が200㎡の鉄骨造の共同住宅の大規模の修繕をしようとする場合、建築主は、当該工事に着手する前に、確認済証の交付を受けなければならない。", "居室の天井の高さは、一室で天井の高さの異なる部分がある場合、室の床面から天井の最も低い部分までの高さを2.1m以上としなければならない。", "延べ面積が1,000㎡を超える準耐火建築物は、防火上有効な構造の防火壁又は防火床によって有効に区画し、かつ、各区画の床面積の合計をそれぞれ1,000㎡以内としなければならない。", "高さ30mの建築物には、非常用の昇降機を設けなければならない。"], "page": 11, "img": ["q17_0.jpg"]}, {"stem": "建築基準法に関する次の記述のうち、正しいものはどれか。", "ch": ["公衆便所及び巡査派出所については、特定行政庁の許可を得ないで、道路に突き出して建築することができる。", "近隣商業地域内において、客席の部分の床面積の合計が200㎡以上の映画館は建築することができない。", "建築物の容積率の算定の基礎となる延べ面積には、老人ホームの共用の廊下又は階段の用に供する部分の床面積は、算入しないものとされている。", "日影による中高層の建築物の高さの制限に係る日影時間の測定は、夏至日の真太陽時の午前8時から午後4時までの間について行われる。"], "page": 12, "img": ["q18_0.jpg"]}, {"stem": "宅地造成等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["土地の占有者又は所有者は、都道府県知事又はその命じた者若しくは委任した者が、宅地造成工事規制区域の指定のために当該土地に立ち入って測量又は調査を行う場合、正当な理由がない限り、立入りを拒み、又は妨げてはならない。", "宅地を宅地以外の土地にするために行う土地の形質の変更は、宅地造成に該当しない。", "宅地造成工事規制区域内において、宅地以外の土地を宅地に転用する者は、宅地造成に関する工事を行わない場合でも、都道府県知事の許可を受けなければならない。", "宅地造成に関する工事の許可を受けた者が、工事施行者を変更する場合には、遅滞なくその旨を都道府県知事に届け出ればよく、改めて許可を受ける必要はない。"], "page": 12, "img": ["q19_0.jpg"]}, {"stem": "土地区画整理組合（以下この問において「組合」という。）に関する次の記述のうち、土地区画整理法の規定によれば、正しいものはどれか。", "ch": ["組合の設立認可を申請しようとする者は、施行地区となるべき区域内の宅地について借地権を有するすべての者の3分の2以上の同意を得なければならないが、未登記の借地権を有する者の同意を得る必要はない。", "組合の総会の会議は、定款に特別な定めがある場合を除くほか、組合員の半数以上が出席しなければ開くことができない。", "組合が賦課金を徴収する場合、賦課金の額は、組合員が施行地区内に有する宅地又は借地の地積等にかかわらず一律に定めなければならない。", "組合の施行する土地区画整理事業に参加することを希望する者のうち、当該土地区画整理事業に参加するのに必要な資力及び信用を有する者であって定款で定められたものは、参加組合員として組合員となる。"], "page": 13, "img": ["q20_0.jpg"]}, {"stem": "農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["法第3条第1項の許可が必要な農地の売買については、この許可を受けずに売買契約を締結しても所有権移転の効力は生じない。", "市街化区域内の自己の農地を駐車場に転用する場合には、農地転用した後に農業委員会に届け出ればよい。", "相続により農地を取得することとなった場合には、法第3条第1項の許可を受ける必要がある。", "農地に抵当権を設定する場合には、法第3条第1項の許可を受ける必要がある。"], "page": 13, "img": ["q21_0.jpg"]}, {"stem": "国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["Ａが所有する市街化区域内の1,500㎡の土地をＢが購入した場合には、Ｂは事後届出を行う必要はないが、Ｃが所有する市街化調整区域内の6,000㎡の土地についてＤと売買に係る予約契約を締結した場合には、Ｄは事後届出を行う必要がある。", "Ｅが所有する市街化区域内の2,000㎡の土地をＦが購入した場合、Ｆは当該土地の所有権移転登記を完了した日から起算して2週間以内に事後届出を行う必要がある。", "Ｇが所有する都市計画区域外の15,000㎡の土地をＨに贈与した場合、Ｈは事後届出を行う必要がある。", "Ｉが所有する都市計画区域外の10,000㎡の土地とＪが所有する市街化調整区域内の10,000㎡の土地を交換した場合、Ｉ及びＪは事後届出を行う必要はない。"], "page": 14, "img": ["q22_0.jpg"]}, {"stem": "印紙税に関する次の記述のうち、正しいものはどれか。", "ch": ["「建物の電気工事に係る請負代金は1,100万円（うち消費税額及び地方消費税額100万円）とする」旨を記載した工事請負契約書について、印紙税の課税標準となる当該契約書の記載金額は1,100万円である。", "「Ａの所有する土地（価額5,000万円）とＢの所有する土地（価額4,000万円）とを交換する」旨の土地交換契約書を作成した場合、印紙税の課税標準となる当該契約書の記載金額は4,000万円である。", "国を売主、株式会社Ｃを買主とする土地の売買契約において、共同で売買契約書を2通作成し、国とＣ社がそれぞれ1通ずつ保存することとした場合、Ｃ社が保存する契約書には印紙税は課されない。", "「契約期間は10年間、賃料は月額10万円、権利金の額は100万円とする」旨が記載された土地の賃貸借契約書は、記載金額1,300万円の土地の賃借権の設定に関する契約書として印紙税が課される。"], "page": 14, "img": ["q23_0.jpg"]}, {"stem": "不動産取得税に関する次の記述のうち、正しいものはどれか。", "ch": ["令和2年4月に個人が取得した住宅及び住宅用地に係る不動産取得税の税率は3％であるが、住宅用以外の土地に係る不動産取得税の税率は4％である。", "一定の面積に満たない土地の取得に対しては、狭小な不動産の取得者に対する税負担の排除の観点から、不動産取得税を課することができない。", "不動産取得税は、不動産の取得に対して課される税であるので、家屋を改築したことにより、当該家屋の価格が増加したとしても、不動産取得税は課されない。", "共有物の分割による不動産の取得については、当該不動産の取得者の分割前の当該共有物に係る持分の割合を超えない部分の取得であれば、不動産取得税は課されない。"], "page": 15, "img": ["q24_0.jpg"]}, {"stem": "不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。", "ch": ["不動産の価格は、その不動産の効用が最高度に発揮される可能性に最も富む使用を前提として把握される価格を標準として形成されるが、不動産についての現実の使用方法は当該不動産が十分な効用を発揮していない場合があることに留意すべきである。", "対象建築物に関する工事が完了していない場合でも、当該工事の完了を前提として鑑定評価を行うことがある。", "特殊価格とは、一般的に市場性を有しない不動産について、その利用現況等を前提とした不動産の経済価値を適正に表示する価格をいい、例としては、文化財の指定を受けた建造物について、その保存等に主眼をおいた鑑定評価を行う場合において求められる価格があげられる。", "原価法は、対象不動産が建物及びその敷地である場合において、再調達原価の把握及び減価修正を適切に行うことができるときに有効な手法であるが、対象不動産が土地のみである場合には、この手法を適用することはできない。"], "page": 15, "img": ["q25_0.jpg"]}, {"stem": "宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者Ａ社（甲県知事免許）が宅地建物取引業者ではないＢ社との合併により消滅した場合には、Ｂ社は、Ａ社が消滅した日から30日以内にＡ社を合併した旨を甲県知事に届け出れば、Ａ社が受けていた免許を承継することができる。", "信託業法第3条の免許を受けた信託会社が宅地建物取引業を営もうとする場合には、国土交通大臣の免許を受けなければならない。", "個人Ｃが、転売目的で競売により取得した宅地を多数の区画に分割し、宅地建物取引業者Ｄに販売代理を依頼して、不特定多数の者に分譲する事業を行おうとする場合には、免許を受けなければならない。", "宅地建物取引業者Ｅ（乙県知事免許）は、乙県内に2以上の事務所を設置してその事業を営もうとする場合には、国土交通大臣に免許換えの申請をしなければならない。"], "page": 16, "img": ["q26_0.jpg"]}, {"stem": "宅地建物取引業者がその業務に関して行う広告に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "建物の売却について代理を依頼されて広告を行う場合、取引態様として、代理であることを明示しなければならないが、その後、当該物件の購入の注文を受けたときは、広告を行った時点と取引態様に変更がない場合を除き、遅滞なく、その注文者に対し取引態様を明らかにしなければならない。"}, {"m": "イ", "t": "広告をするに当たり、実際のものよりも著しく優良又は有利であると人を誤認させるような表示をしてはならないが、誤認させる方法には限定がなく、宅地又は建物に係る現在又は将来の利用の制限の一部を表示しないことにより誤認させることも禁止されている。"}, {"m": "ウ", "t": "複数の区画がある宅地の売買について、数回に分けて広告をする場合は、広告の都度取引態様の別を明示しなければならない。"}, {"m": "エ", "t": "宅地の造成又は建物の建築に関する工事の完了前においては、当該工事に必要な都市計画法に基づく開発許可、建築基準法に基づく建築確認その他法令に基づく許可等の申請をした後でなければ、当該工事に係る宅地又は建物の売買その他の業務に関する広告をしてはならない。"}], "page": 16, "img": ["q27_0.jpg"]}, {"stem": "宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引士資格試験に合格した者は、合格した日から10年以内に登録の申請をしなければ、その合格は無効となる。", "宅地建物取引士証の有効期間の更新の申請は、有効期間満了の90日前から30日前までにする必要がある。", "宅地建物取引士は、重要事項の説明をするときは説明の相手方からの請求の有無にかかわらず宅地建物取引士証を提示しなければならず、また、取引の関係者から請求があったときにも宅地建物取引士証を提示しなければならない。", "甲県知事の登録を受けている宅地建物取引士が、乙県知事に登録の移転を申請するときは、乙県知事が指定する講習を受講しなければならない。"], "page": 17, "img": ["q28_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、ＢからＢ所有の住宅の売却の媒介を依頼された場合における次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "Ａは、Ｂとの間で専任媒介契約を締結し、所定の事項を指定流通機構に登録したときは、その登録を証する書面を遅滞なくＢに引き渡さなければならない。"}, {"m": "イ", "t": "Ａは、Ｂとの間で媒介契約を締結したときは、当該契約が国土交通大臣が定める標準媒介契約約款に基づくものであるか否かの別を、法第34条の2第1項の規定に基づき交付すべき書面に記載しなければならない。"}, {"m": "ウ", "t": "Ａは、Ｂとの間で専任媒介契約を締結するときは、Ｂの要望に基づく場合を除き、当該契約の有効期間について、有効期間満了時に自動的に更新する旨の特約をすることはできない。"}, {"m": "エ", "t": "Ａは、Ｂとの間で専属専任媒介契約を締結したときは、Ｂに対し、当該契約に係る業務の処理状況を1週間に1回以上報告しなければならない。"}], "page": 17, "img": ["q29_0.jpg"]}, {"stem": "宅地建物取引業者Ａ及び宅地建物取引業者Ｂ（ともに消費税課税事業者）が受領する報酬に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、借賃には消費税等相当額を含まないものとする。", "ch": ["Ａは売主から代理の依頼を、Ｂは買主から媒介の依頼を、それぞれ受けて、代金5,000万円の宅地の売買契約を成立させた場合、Ａは売主から343万2,000円、Ｂは買主から171万6,000円、合計で514万8,000円の報酬を受けることができる。", "Ａが単独で行う居住用建物の貸借の媒介に関して、Ａが依頼者の一方から受けることができる報酬の上限額は、当該媒介の依頼者から報酬請求時までに承諾を得ている場合には、借賃の1.1か月分である。", "Ａが単独で貸主と借主の双方から店舗用建物の貸借の媒介の依頼を受け、1か月の借賃25万円、権利金330万円（権利設定の対価として支払われるもので、返還されないものをいい、消費税等相当額を含む。）の賃貸借契約を成立させた場合、Ａが依頼者の一方から受けることができる報酬の上限額は、30万8,000円である。", "Ａが単独で行う事務所用建物の貸借の媒介に関し、Ａが受ける報酬の合計額が借賃の1.1か月分以内であれば、Ａは依頼者の双方からどのような割合で報酬を受けてもよく、また、依頼者の一方のみから報酬を受けることもできる。"], "page": 18, "img": ["q30_0.jpg"]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["建物の売買の媒介だけでなく建物の貸借の媒介を行う場合においても、損害賠償額の予定又は違約金に関する事項について、説明しなければならない。", "建物の売買の媒介を行う場合、当該建物について、石綿の使用の有無の調査の結果が記録されているか照会を行ったにもかかわらず、その存在の有無が分からないときは、宅地建物取引業者自らが石綿の使用の有無の調査を実施し、その結果を説明しなければならない。", "建物の売買の媒介を行う場合、当該建物が既存の住宅であるときは、建物状況調査を実施しているかどうかを説明しなければならないが、実施している場合その結果の概要を説明する必要はない。", "区分所有建物の売買の媒介を行う場合、建物の区分所有等に関する法律第2条第3項に規定する専有部分の用途その他の利用の制限に関する規約の定めがあるときは、その内容を説明しなければならないが、区分所有建物の貸借の媒介を行う場合は、説明しなくてよい。"], "page": 18, "img": ["q31_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではないＢとの間で建物の売買契約を締結する場合における次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["ＡＢ間の建物の売買契約において、Ｂが当該契約の履行に着手した後においては、Ａは、契約の締結に際してＢから受領した手付金の倍額をＢに現実に提供したとしても、契約を解除することはできない。", "ＡＢ間の建物の売買契約における「法第37条の2の規定に基づくクーリング・オフによる契約の解除の際に、当該契約の締結に際しＡがＢから受領した手付金は返還しない」旨の特約は有効である。", "ＡＢ間の建物の割賦販売の契約において、Ｂからの賦払金が当初設定していた支払期日までに支払われなかった場合、Ａは直ちに賦払金の支払の遅滞を理由として当該契約を解除することができる。", "ＡＢ間で工事の完了前に当該工事に係る建物（代金5,000万円）の売買契約を締結する場合、Ａは、法第41条に定める手付金等の保全措置を講じた後でなければ、Ｂから200万円の手付金を受領してはならない。"], "page": 19, "img": ["q32_0.jpg"]}, {"stem": "宅地建物取引業者Ａが宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["Ａが媒介により建物の貸借の契約を成立させたときは、37条書面に借賃の額並びにその支払の時期及び方法を記載しなければならず、また、当該書面を契約の各当事者に交付しなければならない。", "Ａが媒介により宅地の貸借の契約を成立させた場合において、当該宅地の引渡しの時期について重要事項説明書に記載して説明を行ったときは、その内容を37条書面に記載する必要はない。", "Ａが自ら売主として宅地建物取引業者である買主と建物の売買契約を締結した場合、37条書面に宅地建物取引士をして記名押印させる必要はない。", "Ａが自ら売主として宅地の売買契約を締結した場合、代金についての金銭の貸借のあっせんに関する定めがある場合における当該あっせんに係る金銭の貸借が成立しないときの措置については、37条書面に記載する必要はない。"], "page": 19, "img": ["q33_0.jpg"]}, {"stem": "宅地建物取引士の登録（以下この問において「登録」という。）及び宅地建物取引士証に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["甲県で宅地建物取引士資格試験に合格した後1年以上登録の申請をしていなかった者が宅地建物取引業者（乙県知事免許）に勤務することとなったときは、乙県知事あてに登録の申請をしなければならない。", "登録を受けている者は、住所に変更があっても、登録を受けている都道府県知事に変更の登録を申請する必要はない。", "宅地建物取引士は、従事先として登録している宅地建物取引業者の事務所の所在地に変更があったときは、登録を受けている都道府県知事に変更の登録を申請しなければならない。", "丙県知事の登録を受けている宅地建物取引士が、丁県知事への登録の移転の申請とともに宅地建物取引士証の交付の申請をした場合は、丁県知事から、移転前の宅地建物取引士証の有効期間が経過するまでの期間を有効期間とする新たな宅地建物取引士証が交付される。"], "page": 20, "img": ["q34_0.jpg"]}, {"stem": "宅地建物取引業者Ａ（甲県知事免許）の営業保証金に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["Ａから建設工事を請け負った建設業者は、Ａに対する請負代金債権について、営業継続中のＡが供託している営業保証金から弁済を受ける権利を有する。", "Ａが甲県内に新たに支店を設置したときは、本店の最寄りの供託所に政令で定める額の営業保証金を供託すれば、当該支店での事業を開始することができる。", "Ａは、営業保証金の還付により、営業保証金の額が政令で定める額に不足することとなったときは、甲県知事から不足額を供託すべき旨の通知書の送付を受けた日から2週間以内にその不足額を供託しなければならない。", "Ａが甲県内に本店及び2つの支店を設置して宅地建物取引業を営もうとする場合、供託すべき営業保証金の合計額は1,200万円である。"], "page": 20, "img": ["q35_0.jpg"]}, {"stem": "宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["保証協会の社員との宅地建物取引業に関する取引により生じた債権を有する者は、当該社員が納付した弁済業務保証金分担金の額に相当する額の範囲内で弁済を受ける権利を有する。", "保証協会の社員と宅地建物取引業に関し取引をした者が、その取引により生じた債権に関し、弁済業務保証金について弁済を受ける権利を実行するときは、当該保証協会の認証を受けるとともに、当該保証協会に対し還付請求をしなければならない。", "保証協会は、弁済業務保証金の還付があったときは、当該還付に係る社員又は社員であった者に対し、当該還付額に相当する額の還付充当金をその主たる事務所の最寄りの供託所に供託すべきことを通知しなければならない。", "保証協会は、弁済業務保証金の還付があったときは、当該還付額に相当する額の弁済業務保証金を供託しなければならない。"], "page": 21, "img": ["q36_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として宅地の売買契約を締結した場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、この問において「37条書面」とは、同法第37条の規定に基づき交付すべき書面をいうものとする。", "ch": ["一つ", "二つ", "三つ", "なし"], "items": [{"m": "ア", "t": "Ａは、専任の宅地建物取引士をして、37条書面の内容を当該契約の買主に説明させなければならない。"}, {"m": "イ", "t": "Ａは、供託所等に関する事項を37条書面に記載しなければならない。"}, {"m": "ウ", "t": "Ａは、買主が宅地建物取引業者であっても、37条書面を遅滞なく交付しなければならない。"}, {"m": "エ", "t": "Ａは、買主が宅地建物取引業者であるときは、当該宅地の引渡しの時期及び移転登記の申請の時期を37条書面に記載しなくてもよい。"}], "page": 21, "img": ["q37_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、ＢからＢ所有の甲住宅の売却に係る媒介の依頼を受けて締結する一般媒介契約に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["Ａは、法第34条の2第1項の規定に基づき交付すべき書面に、宅地建物取引士をして記名押印させなければならない。", "Ａは、甲住宅の価額について意見を述べる場合、Ｂに対してその根拠を口頭ではなく書面で明示しなければならない。", "Ａは、当該媒介契約を締結した場合、指定流通機構に甲住宅の所在等を登録しなければならない。", "Ａは、媒介契約の有効期間及び解除に関する事項を、法第34条の2第1項の規定に基づき交付すべき書面に記載しなければならない。"], "page": 22, "img": ["q38_0.jpg"]}, {"stem": "次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者は、従業者名簿の閲覧の請求があったときは、取引の関係者か否かを問わず、請求した者の閲覧に供しなければならない。", "宅地建物取引業者は、その業務に従事させる者に従業者証明書を携帯させなければならず、その者が宅地建物取引士であり、宅地建物取引士証を携帯していても、従業者証明書を携帯させなければならない。", "宅地建物取引業者は、その事務所ごとに従業者名簿を備えなければならないが、退職した従業者に関する事項は、個人情報保護の観点から従業者名簿から消去しなければならない。", "宅地建物取引業者は、その業務に従事させる者に従業者証明書を携帯させなければならないが、その者が非常勤の役員や単に一時的に事務の補助をする者である場合には携帯させなくてもよい。"], "page": 22, "img": ["q39_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではないＢとの間で宅地の売買契約を締結した場合における、宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、Ｂがクーリング・オフにより契約の解除を行うことができるものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "Ｂが喫茶店で当該宅地の買受けの申込みをした場合において、Ｂが、Ａからクーリング・オフについて書面で告げられた日の翌日から起算して8日目にクーリング・オフによる契約の解除の書面を発送し、10日目にＡに到達したとき。"}, {"m": "イ", "t": "Ｂが喫茶店で当該宅地の買受けの申込みをした場合において、クーリング・オフによる契約の解除ができる期間内に、Ａが契約の履行に着手したとき。"}, {"m": "ウ", "t": "Ｂが喫茶店で当該宅地の買受けの申込みをした場合において、ＡとＢとの間でクーリング・オフによる契約の解除をしない旨の合意をしたとき。"}, {"m": "エ", "t": "Ａの事務所ではないがＡが継続的に業務を行うことができる施設があり宅地建物取引業法第31条の3第1項の規定により専任の宅地建物取引士が置かれている場所で、Ｂが買受けの申込みをし、2日後に喫茶店で売買契約を締結したとき。"}], "page": 23, "img": ["q40_0.jpg"]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。", "ch": ["重要事項説明書には、代表者の記名押印があれば宅地建物取引士の記名押印は必要がない。", "重要事項説明書に記名押印する宅地建物取引士は専任の宅地建物取引士でなければならないが、実際に重要事項の説明を行う者は専任の宅地建物取引士でなくてもよい。", "宅地建物取引士証を亡失した宅地建物取引士は、その再交付を申請していても、宅地建物取引士証の再交付を受けるまでは重要事項の説明を行うことができない。", "重要事項の説明は、宅地建物取引業者の事務所において行わなければならない。"], "page": 23, "img": ["q41_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として締結する売買契約に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）及び民法の規定によれば、誤っているものはどれか。", "ch": ["Ａが宅地建物取引業者ではないＢとの間で締結する宅地の売買契約において、当該宅地の種類又は品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任を負う期間をＢがその不適合を知った時から2年とする特約を定めた場合、この特約は有効である。", "Ａが宅地建物取引業者ではないＣとの間で建築工事の完了前に締結する建物（代金5,000万円）の売買契約においては、Ａは、手付金200万円を受領した後、法第41条に定める手付金等の保全措置を講じなければ、当該建物の引渡し前に中間金300万円を受領することができない。", "Ａが宅地建物取引業者Ｄとの間で造成工事の完了後に締結する宅地（代金3,000万円）の売買契約においては、Ａは、法第41条の2に定める手付金等の保全措置を講じないで、当該宅地の引渡し前に手付金800万円を受領することができる。", "Ａが宅地建物取引業者ではないＥとの間で締結する建物の売買契約において、Ａは当該建物の種類又は品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任を一切負わないとする特約を定めた場合、この特約は無効となり、Ａが当該責任を負う期間は当該建物の引渡日から2年となる。"], "page": 24, "img": ["q42_0.jpg"]}, {"stem": "宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["免許を受けようとするＡ社の取締役が刑法第204条（傷害）の罪により懲役1年執行猶予2年の刑に処せられた場合、刑の執行猶予の言渡しを取り消されることなく猶予期間を満了し、その日から5年を経過しなければ、Ａ社は免許を受けることができない。", "宅地建物取引業者である個人Ｂが死亡した場合、その相続人Ｃは、Ｂが締結した契約に基づく取引を結了する目的の範囲内において宅地建物取引業者とみなされ、Ｂが売主として締結していた売買契約の目的物を買主に引き渡すことができる。", "宅地建物取引業者Ｄ社について破産手続開始の決定があった場合、Ｄ社を代表する役員は廃業を届け出なければならない。また、廃業が届け出られた日にかかわらず、破産手続開始の決定の日をもって免許の効力が失われる。", "免許を受けようとするＥ社の取締役について、破産手続開始の決定があった場合、復権を得た日から5年を経過しなければ、Ｅ社は免許を受けることができない。"], "page": 24, "img": ["q43_0.jpg"]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、誤っているものはどれか。なお、特に断りのない限り、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["昭和55年に新築の工事に着手し完成した建物の売買の媒介を行う場合、当該建物が地方公共団体による耐震診断を受けたものであるときは、その内容を説明しなければならない。", "貸借の媒介を行う場合、敷金その他いかなる名義をもって授受されるかを問わず、契約終了時において精算することとされている金銭の精算に関する事項を説明しなければならない。", "自らを委託者とする宅地又は建物に係る信託の受益権の売主となる場合、取引の相手方が宅地建物取引業者であっても、重要事項説明書を交付して説明をしなければならない。", "区分所有建物の売買の媒介を行う場合、一棟の建物の計画的な維持修繕のための費用の積立てを行う旨の規約の定めがあるときは、その内容を説明しなければならないが、既に積み立てられている額について説明する必要はない。"], "page": 25, "img": ["q44_0.jpg"]}, {"stem": "宅地建物取引業者Ａ（甲県知事免許）が、自ら売主として宅地建物取引業者ではない買主Ｂに新築住宅を販売する場合における次の記述のうち、特定住宅瑕疵担保責任の履行の確保等に関する法律の規定によれば、正しいものはどれか。", "ch": ["Ａが媒介を依頼した宅地建物取引業者又はＢが住宅販売瑕疵担保責任保険契約の締結をしていれば、Ａは住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う必要はない。", "Ａが住宅販売瑕疵担保保証金の供託をし、その額が、基準日において、販売新築住宅の合計戸数を基礎として算定する基準額を超えることとなった場合、甲県知事の承認を受けた上で、その超過額を取り戻すことができる。", "新築住宅をＢに引き渡したＡは、基準日ごとに基準日から50日以内に、当該基準日に係る住宅販売瑕疵担保保証金の供託及び住宅販売瑕疵担保責任保険契約の締結の状況について、甲県知事に届け出なければならない。", "Ｂが宅地建物取引業者である場合であっても、Ａは、Ｂに引き渡した新築住宅について、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負う。"], "page": 25, "img": ["q45_0.jpg"]}, {"stem": "独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["機構は、証券化支援事業（買取型）において、金融機関から買い取った住宅ローン債権を担保としてＭＢＳ（資産担保証券）を発行している。", "機構は、災害により住宅が滅失した場合におけるその住宅に代わるべき住宅の建設又は購入に係る貸付金については、元金据置期間を設けることができない。", "機構は、証券化支援事業（買取型）において、賃貸住宅の建設又は購入に必要な資金の貸付けに係る金融機関の貸付債権については譲受けの対象としていない。", "機構は、貸付けを受けた者とあらかじめ契約を締結して、その者が死亡した場合に支払われる生命保険の保険金を当該貸付けに係る債務の弁済に充当する団体信用生命保険を業務として行っている。"], "page": 26, "img": ["q46_0.jpg"]}, {"stem": "宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。", "ch": ["路地状部分（敷地延長部分）のみで道路に接する土地であって、その路地状部分の面積が当該土地面積のおおむね30％以上を占める場合には、路地状部分を含む旨及び路地状部分の割合又は面積を明示しなければならない。", "新築住宅を販売するに当たり、当該物件から最寄駅まで実際に歩いたときの所要時間が15分であれば、物件から最寄駅までの道路距離にかかわらず、広告中に「最寄駅まで徒歩15分」と表示することができる。", "新築分譲住宅を販売するに当たり、予告広告である旨及び契約又は予約の申込みには応じられない旨を明瞭に表示すれば、当該物件が建築確認を受けていなくても広告表示をすることができる。", "新築分譲マンションを販売するに当たり、住戸により管理費の額が異なる場合であって、すべての住戸の管理費を示すことが広告スペースの関係で困難なときは、全住戸の管理費の平均額を表示すればよい。"], "page": 26, "img": ["q47_0.jpg"]}, {"stem": "次の記述のうち、正しいものはどれか。", "ch": ["令和2年地価公示（令和2年3月公表）によれば、平成31年1月以降の1年間の地価変動は、全国平均では、住宅地については下落であったが、商業地については上昇であった。", "令和2年版土地白書（令和2年6月公表）によれば、土地取引について、売買による所有権の移転登記の件数でその動向をみると、令和元年の全国の土地取引件数は約131万件となり、前年に比べて大きく増加した。", "建築着工統計（令和2年1月公表）によれば、平成31年1月から令和元年12月までの持家及び分譲住宅の新設住宅着工戸数は前年に比べて増加したが、貸家の新設住宅着工戸数は減少した。", "平成30年度法人企業統計調査（令和元年9月公表）によれば、不動産業の売上高経常利益率は、平成26年度から平成30年度までの5年間は、いずれも5％以下となっている。"], "page": 27, "img": ["q48_0.jpg"]}, {"stem": "土地に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["都市の中小河川の氾濫の原因の一つは、急速な都市化、宅地化に伴い、降雨時に雨水が短時間に大量に流れ込むようになったことである。", "中小河川に係る防災の観点から、宅地選定に当たっては、その地点だけでなく、周辺の地形と防災施設に十分注意することが必要である。", "地盤の液状化については、宅地の地盤条件について調べるとともに、過去の地形についても古地図などで確認することが必要である。", "地形や地質的な条件については、宅地に適しているか調査する必要があるが、周辺住民の意見は聴かなくてよい。"], "page": 27, "img": ["q49_0.jpg"]}, {"stem": "建築物の構造に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["建物の構成は、大きく基礎構造と上部構造からなっており、基礎構造は地業と基礎盤から構成されている。", "基礎の種類には、基礎の底面が建物を支持する地盤に直接接する直接基礎と、建物を支持する地盤が深い場合に使用する杭基礎（杭地業）がある。", "直接基礎の種類には、形状により、柱の下に設ける独立基礎、壁体等の下に設けるべた基礎、建物の底部全体に設ける布基礎（連続基礎）等がある。", "上部構造は、重力、風力、地震力等の荷重に耐える役目を負う主要構造と、屋根、壁、床等の仕上げ部分等から構成されている。"], "page": 27, "img": ["q50_0.jpg"]}]},

   ans:[[3], [1], [4], [2], [2], [1], [2], [3], [1], [4], [4], [3], [3], [2], [2], [2], [1], [4], [1], [3], [3], [4], [1], [3], [1], [2], [3], [1], [3], [2], [3], [4], [4], [4], [3], [3], [1], [1], [1], [4], [2], [1], [4], [2], [4], [4], [2], [2], [3], [3]],
   qs:[{"stem": "不法行為（令和2年4月1日以降に行われたもの）に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["建物の建築に携わる設計者や施工者は、建物としての基本的な安全性が欠ける建物を設計し又は建築した場合、設計契約や建築請負契約の当事者に対しても、また、契約関係にない当該建物の居住者に対しても損害賠償責任を負うことがある。", "被用者が使用者の事業の執行について第三者に損害を与え、第三者に対してその損害を賠償した場合には、被用者は、損害の公平な分担という見地から相当と認められる額について、使用者に対して求償することができる。", "責任能力がない認知症患者が線路内に立ち入り、列車に衝突して旅客鉄道事業者に損害を与えた場合、当該責任無能力者と同居する配偶者は、法定の監督義務者として損害賠償責任を負う。", "人の生命又は身体を害する不法行為による損害賠償請求権は、被害者又はその法定代理人が損害及び加害者を知った時から5年間行使しない場合、時効によって消滅する。"], "page": 2, "img": ["q01_0.jpg"]}, {"stem": "ＡがＢに対して、Ａ所有の甲土地を売却する代理権を令和2年7月1日に授与した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["Ｂが自己又は第三者の利益を図る目的で、Ａの代理人として甲土地をＤに売却した場合、Ｄがその目的を知り、又は知ることができたときは、Ｂの代理行為は無権代理とみなされる。", "ＢがＣの代理人も引き受け、ＡＣ双方の代理人として甲土地に係るＡＣ間の売買契約を締結した場合、Ａに損害が発生しなければ、Ｂの代理行為は無権代理とはみなされない。", "ＡがＢに授与した代理権が消滅した後、ＢがＡの代理人と称して、甲土地をＥに売却した場合、ＡがＥに対して甲土地を引き渡す責任を負うことはない。", "Ｂが、Ａから代理権を授与されていないＡ所有の乙土地の売却につき、Ａの代理人としてＦと売買契約を締結した場合、ＡがＦに対して追認の意思表示をすれば、Ｂの代理行為は追認の時からＡに対して効力を生ずる。"], "page": 2, "img": ["q02_0.jpg"]}, {"stem": "親族に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["姻族関係は、離婚した場合及び夫婦の一方が死亡した場合、当然に終了する。", "離婚に当たり、相手方に有責不法の行為がなければ、他の一方は、相手方に対して財産の分与を請求することができない。", "未成年者に対して親権を行う者がないときは、家庭裁判所は、検察官の請求によって、親族の中から未成年後見人を選任する。", "夫婦間で婚姻の届出前に別段の契約をしなかった場合、夫婦のいずれに属するか明らかでない財産は、その共有に属するものと推定される。"], "page": 3, "img": ["q03_0.jpg"]}, {"stem": "債務不履行に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、債務は令和2年4月1日以降に生じたものとする。", "ch": ["債務の履行について不確定期限があるときは、債務者は、その期限が到来したことを知らなくても、期限到来後に履行の請求を受けた時から遅滞の責任を負う。", "債務の目的が特定物の引渡しである場合、債権者が目的物の引渡しを受けることを理由なく拒否したため、その後の履行の費用が増加したときは、その増加額について、債権者と債務者はそれぞれ半額ずつ負担しなければならない。", "債務者がその債務について遅滞の責任を負っている間に、当事者双方の責めに帰することができない事由によってその債務の履行が不能となったときは、その履行不能は債務者の責めに帰すべき事由によるものとみなされる。", "契約に基づく債務の履行が契約の成立時に不能であったとしても、その不能が債務者の責めに帰することができない事由によるものでない限り、債権者は、履行不能によって生じた損害について、債務不履行による損害の賠償を請求することができる。"], "page": 3, "img": ["q04_0.jpg"]}, {"stem": "時効に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、時効の対象となる債権の発生原因は、令和2年4月1日以降に生じたものとする。", "ch": ["消滅時効の援用権者である「当事者」とは、権利の消滅について正当な利益を有する者であり、債務者のほか、保証人、物上保証人、第三取得者も含まれる。", "裁判上の請求をした場合、裁判が終了するまでの間は時効が完成しないが、当該請求を途中で取り下げて権利が確定することなく当該請求が終了した場合には、その終了した時から新たに時効の進行が始まる。", "権利の承認があったときは、その時から新たに時効の進行が始まるが、権利の承認をするには、相手方の権利についての処分につき行為能力の制限を受けていないことを要しない。", "夫婦の一方が他方に対して有する権利については、婚姻の解消の時から6箇月を経過するまでの間は、時効が完成しない。"], "page": 4, "img": ["q05_0.jpg"]}, {"stem": "ＡはＢにＡ所有の甲建物を令和2年7月1日に賃貸し、ＢはＡの承諾を得てＣに適法に甲建物を転貸し、Ｃが甲建物に居住している場合における次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["Ａは、Ｂとの間の賃貸借契約を合意解除した場合、解除の当時Ｂの債務不履行による解除権を有していたとしても、合意解除したことをもってＣに対抗することはできない。", "Ｃの用法違反によって甲建物に損害が生じた場合、ＡはＢに対して、甲建物の返還を受けた時から1年以内に損害賠償を請求しなければならない。", "ＡがＤに甲建物を売却した場合、ＡＤ間で特段の合意をしない限り、賃貸人の地位はＤに移転する。", "ＢがＡに約定の賃料を支払わない場合、Ｃは、Ｂの債務の範囲を限度として、Ａに対して転貸借に基づく債務を直接履行する義務を負い、Ｂに賃料を前払いしたことをもってＡに対抗することはできない。"], "page": 4, "img": ["q06_0.jpg"]}, {"stem": "Ａを売主、Ｂを買主として、令和2年7月1日に甲土地の売買契約（以下この問において「本件契約」という。）が締結された場合における次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["甲土地の実際の面積が本件契約の売買代金の基礎とした面積より少なかった場合、Ｂはそのことを知った時から2年以内にその旨をＡに通知しなければ、代金の減額を請求することができない。", "ＡがＢに甲土地の引渡しをすることができなかった場合、その不履行がＡの責めに帰することができない事由によるものであるときを除き、ＢはＡに対して、損害賠償の請求をすることができる。", "Ｂが売買契約で定めた売買代金の支払期日までに代金を支払わなかった場合、売買契約に特段の定めがない限り、ＡはＢに対して、年5％の割合による遅延損害金を請求することができる。", "本件契約が、Ａの重大な過失による錯誤に基づくものであり、その錯誤が重要なものであるときは、Ａは本件契約の無効を主張することができる。"], "page": 5, "img": ["q07_0.jpg"]}, {"stem": "1億2,000万円の財産を有するＡが死亡した場合の法定相続分についての次の記述のうち、民法の規定によれば、正しいものの組み合わせはどれか。", "ch": ["ア、ウ", "ア、エ", "イ、ウ", "イ、エ"], "items": [{"m": "ア", "t": "Ａの長男の子Ｂ及びＣ、Ａの次男の子Ｄのみが相続人になる場合の法定相続分は、それぞれ4,000万円である。"}, {"m": "イ", "t": "Ａの長男の子Ｂ及びＣ、Ａの次男の子Ｄのみが相続人になる場合の法定相続分は、Ｂ及びＣがそれぞれ3,000万円、Ｄが6,000万円である。"}, {"m": "ウ", "t": "Ａの父方の祖父母Ｅ及びＦ、Ａの母方の祖母Ｇのみが相続人になる場合の法定相続分は、それぞれ4,000万円である。"}, {"m": "エ", "t": "Ａの父方の祖父母Ｅ及びＦ、Ａの母方の祖母Ｇのみが相続人になる場合の法定相続分は、Ｅ及びＦがそれぞれ3,000万円、Ｇが6,000万円である。"}], "page": 5, "img": ["q08_0.jpg"]}, {"stem": "地役権に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。", "ch": ["地役権は、継続的に行使されるもの、又は外形上認識することができるものに限り、時効取得することができる。", "地役権者は、設定行為で定めた目的に従い、承役地を要役地の便益に供する権利を有する。", "設定行為又は設定後の契約により、承役地の所有者が自己の費用で地役権の行使のために工作物を設け、又はその修繕をする義務を負担したときは、承役地の所有者の特定承継人もその義務を負担する。", "要役地の所有権とともに地役権を取得した者が、所有権の取得を承役地の所有者に対抗し得るときは、地役権の取得についても承役地の所有者に対抗することができる。"], "page": 6, "img": ["q09_0.jpg"]}, {"stem": "不動産の共有に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。", "ch": ["共有物の各共有者の持分が不明な場合、持分は平等と推定される。", "各共有者は、他の共有者の同意を得なければ、共有物に変更を加えることができない。", "共有物の保存行為については、各共有者が単独ですることができる。", "共有者の一人が死亡して相続人がないときは、その持分は国庫に帰属する。"], "page": 6, "img": ["q10_0.jpg"]}, {"stem": "次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。", "ch": ["借地権者が借地権の登記をしておらず、当該土地上に所有権の登記がされている建物を所有しているときは、これをもって借地権を第三者に対抗することができるが、建物の表示の登記によっては対抗することができない。", "借地権者が登記ある建物を火災で滅失したとしても、建物が滅失した日から2年以内に新たな建物を築造すれば、2年を経過した後においても、これをもって借地権を第三者に対抗することができる。", "土地の賃借人が登記ある建物を所有している場合であっても、その賃借人から当該土地建物を賃借した転借人が対抗力を備えていなければ、当該転借人は転借権を第三者に対抗することができない。", "借地権者が所有する数棟の建物が一筆の土地上にある場合は、そのうちの一棟について登記があれば、借地権の対抗力が当該土地全部に及ぶ。"], "page": 6, "img": ["q11_0.jpg"]}, {"stem": "賃貸人Ａと賃借人Ｂとの間で令和2年7月1日に締結した居住用建物の賃貸借契約に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、誤っているものはどれか。", "ch": ["当該建物の修繕が必要である場合において、ＢがＡに修繕が必要である旨を通知したにもかかわらずＡが相当の期間内に必要な修繕をしないときは、Ｂは自ら修繕をすることができる。", "ＢがＡに無断でＣに当該建物を転貸した場合であっても、Ａに対する背信行為と認めるに足りない特段の事情があるときは、Ａは賃貸借契約を解除することができない。", "賃貸借契約に期間を定め、賃貸借契約を書面によって行った場合には、ＡがＢに対しあらかじめ契約の更新がない旨を説明していれば、賃貸借契約は期間満了により終了する。", "Ｂが相続人なしに死亡した場合、Ｂと婚姻の届出をしていないが事実上夫婦と同様の関係にあった同居者Ｄは、Ｂが相続人なしに死亡したことを知った後1月以内にＡに反対の意思表示をしない限り、賃借人としてのＢの権利義務を承継する。"], "page": 7, "img": ["q12_0.jpg"]}, {"stem": "建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。", "ch": ["規約の保管場所は、建物内の見やすい場所に掲示しなければならない。", "管理者は、規約に特別の定めがあるときは、共用部分を所有することができる。", "規約及び集会の決議は、区分所有者の特定承継人に対しては、その効力を生じない。", "区分所有者は、規約に別段の定めがない限り集会の決議によって、管理者を解任することができる。"], "page": 7, "img": ["q13_0.jpg"]}, {"stem": "不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。", "ch": ["表題部所有者が表示に関する登記の申請人となることができる場合において、当該表題部所有者について相続があったときは、その相続人は、当該表示に関する登記を申請することができる。", "所有権の登記以外の権利に関する登記がある土地については、分筆の登記をすることができない。", "区分建物が属する一棟の建物が新築された場合における当該区分建物についての表題登記の申請は、当該新築された一棟の建物についての表題登記の申請と併せてしなければならない。", "登記の申請書の閲覧は、請求人が利害関係を有する部分に限り、することができる。"], "page": 8, "img": ["q14_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。", "ch": ["市街化区域及び区域区分が定められていない都市計画区域については、少なくとも道路、病院及び下水道を定めるものとされている。", "市街化調整区域内においては、都市計画に、市街地開発事業を定めることができないこととされている。", "都市計画区域は、市町村が、市町村都市計画審議会の意見を聴くとともに、都道府県知事に協議し、その同意を得て指定する。", "準都市計画区域については、都市計画に、高度地区を定めることができないこととされている。"], "page": 8, "img": ["q15_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。ただし、許可を要する開発行為の面積については、条例による定めはないものとし、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["市街化調整区域において、非常災害のため必要な応急措置として8,000㎡の土地の区画形質の変更を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。", "市街化区域において、社会教育法に規定する公民館の建築の用に供する目的で行われる1,500㎡の土地の区画形質の変更を行おうとする者は、都道府県知事の許可を受けなくてよい。", "区域区分が定められていない都市計画区域において、店舗の建築の用に供する目的で行われる2,000㎡の土地の区画形質の変更を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。", "市街化調整区域において、自己の居住の用に供する住宅の建築の用に供する目的で行われる100㎡の土地の区画形質の変更を行おうとする者は、都道府県知事の許可を受けなくてよい。"], "page": 9, "img": ["q16_0.jpg"]}, {"stem": "建築基準法に関する次の記述のうち、誤っているものはどれか。", "ch": ["建築物が防火地域及び準防火地域にわたる場合においては、その全部について、敷地の属する面積が大きい方の地域内の建築物に関する規定を適用する。", "倉庫の用途に供する建築物で、その用途に供する3階以上の部分の床面積の合計が500㎡であるものは、耐火建築物としなければならない。", "高さ25mの建築物には、周囲の状況によって安全上支障がない場合を除き、有効に避雷設備を設けなければならない。", "高さ1m以下の階段の部分には、手すりを設けなくてもよい。"], "page": 9, "img": ["q17_0.jpg"]}, {"stem": "次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、誤っているものはどれか。", "ch": ["建築物の壁又はこれに代わる柱は、地盤面下の部分又は特定行政庁が建築審査会の同意を得て許可した歩廊の柱その他これに類するものを除き、壁面線を越えて建築してはならない。", "特別用途地区内においては、地方公共団体は、その地区の指定の目的のために必要と認める場合は、国土交通大臣の承認を得て、条例で、法第48条第1項から第13項までの規定による用途制限を緩和することができる。", "都市計画により建蔽率の限度が10分の8と定められている準工業地域においては、防火地域内にある耐火建築物については、法第53条第1項から第5項までの規定に基づく建蔽率に関する制限は適用されない。", "田園住居地域内の建築物に対しては、法第56条第1項第3号の規定（北側斜線制限）は適用されない。"], "page": 10, "img": ["q18_0.jpg"]}, {"stem": "宅地造成等規制法に関する次の記述のうち、誤っているものはどれか。", "ch": ["宅地造成工事規制区域は、宅地造成に伴い災害が生ずるおそれが大きい市街地又は市街地になろうとする土地の区域であって、宅地造成に関する工事につき規制を行う必要があるものについて、国土交通大臣が指定することができる。", "宅地造成工事規制区域内において宅地造成に関する工事を行う場合、宅地造成に伴う災害を防止するために行う高さが5mを超える擁壁の設置に係る工事については、政令で定める資格を有する者の設計によらなければならない。", "都道府県（地方自治法に基づく指定都市、中核市又は施行時特例市の区域にあっては、それぞれ指定都市、中核市又は施行時特例市）は、宅地造成工事規制区域の指定のために行う測量又は調査のため他人の占有する土地に立ち入ったことにより他人に損失を与えた場合においては、その損失を受けた者に対して、通常生ずべき損失を補償しなければならない。", "宅地造成等規制法第8条第1項本文の許可を受けた宅地造成に関する工事が完了した場合、造成主は、都道府県知事（地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長）の検査を受けなければならない。"], "page": 10, "img": ["q19_0.jpg"]}, {"stem": "土地区画整理法に関する次の記述のうち、正しいものはどれか。", "ch": ["市町村が施行する土地区画整理事業の施行後の宅地の価額の総額が土地区画整理事業の施行前の宅地の価額の総額より減少した場合においては、その差額に相当する金額を、従前の宅地に存する建築物について賃借権を有する者に対して支払わなければならない。", "施行者は、仮換地を指定した時に、清算金を徴収し、又は交付しなければならない。", "換地計画において換地を定める場合においては、換地及び従前の宅地の位置、地積、土質、水利、利用状況、環境等が照応するように定めなければならない。", "土地区画整理組合が施行する土地区画整理事業の換地計画においては、災害を防止し、及び衛生の向上を図るために宅地の地積の規模を適正にする特別な必要があると認められる場合は、その換地計画に係る区域内の地積が小である宅地について、過小宅地とならないように換地を定めることができる。"], "page": 11, "img": ["q20_0.jpg"]}, {"stem": "農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["山林を開墾し、農地として耕作している土地であっても、土地登記簿上の地目が山林であれば、法の適用を受ける農地に該当しない。", "親から子に対して、所有するすべての農地を一括して贈与する場合には、法第3条第1項の許可を受ける必要はない。", "耕作を目的として農業者が競売により農地を取得する場合であっても、法第3条第1項の許可を受ける必要がある。", "市街化区域以外の区域に存する4haを超える農地を転用する場合には、農林水産大臣の許可を受ける必要がある。"], "page": 11, "img": ["q21_0.jpg"]}, {"stem": "国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。", "ch": ["都道府県知事は、事後届出に係る土地の利用目的及び対価の額について、届出をした宅地建物取引業者に対し勧告することができ、都道府県知事から勧告を受けた当該業者が勧告に従わなかった場合、その旨及びその勧告の内容を公表することができる。", "事後届出が必要な土地売買等の契約により権利取得者となった者が事後届出を行わなかった場合、都道府県知事から当該届出を行うよう勧告されるが、罰則の適用はない。", "国が所有する市街化区域内の一団の土地である1,500㎡の土地と500㎡の土地を個人Ａが購入する契約を締結した場合、Ａは事後届出を行う必要がある。", "個人Ｂが所有する都市計画区域外の11,000㎡の土地について、個人ＣがＢとの間で対価を支払って地上権設定契約を締結した場合、Ｃは事後届出を行う必要がある。"], "page": 12, "img": ["q22_0.jpg"]}, {"stem": "住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置に関する次の記述のうち、正しいものはどれか。", "ch": ["この税率の軽減措置の適用を受けるためには、やむを得ない事情がある場合を除き、その住宅用家屋の取得後1年以内に所有権の移転登記を受けなければならない。", "この税率の軽減措置は、住宅用家屋を相続により取得した場合に受ける所有権の移転登記についても適用される。", "この税率の軽減措置に係る登録免許税の課税標準となる不動産の価額は、売買契約書に記載されたその住宅用家屋の実際の取引価格である。", "過去にこの税率の軽減措置の適用を受けたことがある者は、再度この措置の適用を受けることはできない。"], "page": 12, "img": ["q23_0.jpg"]}, {"stem": "固定資産税に関する次の記述のうち、正しいものはどれか。", "ch": ["固定資産税を既に全納した者が、年度の途中において土地の譲渡を行った場合には、その譲渡後の月数に応じて税額の還付を受けることができる。", "固定資産税の税率は、1.7％を超えることができない。", "固定資産税の納期は、4月、7月、12月及び2月中において、当該市町村の条例で定めることとされているが、特別の事情がある場合においては、これと異なる納期を定めることができる。", "200㎡以下の住宅用地に対して課する固定資産税の課税標準は、課税標準となるべき価格の2分の1の額とする特例措置が講じられている。"], "page": 13, "img": ["q24_0.jpg"]}, {"stem": "地価公示法に関する次の記述のうち、正しいものはどれか。", "ch": ["土地鑑定委員会は、その土地に地上権が存する場合であっても、標準地として選定することができる。", "土地鑑定委員会は、標準地について、2人以上の不動産鑑定士の鑑定評価を求めるものとし、当該2人以上の不動産鑑定士は、土地鑑定委員会に対し、鑑定評価書を連名で提出しなければならない。", "土地鑑定委員会は、標準地の正常な価格を判定したときは、標準地の単位面積当たりの価格のほか、当該標準地の価格の総額についても官報で公示しなければならない。", "土地収用法その他の法律によって土地を収用することができる事業を行う者は、標準地として選定されている土地を取得する場合において、当該土地の取得価格を定めるときは、公示価格と同額としなければならない。"], "page": 13, "img": ["q25_0.jpg"]}, {"stem": "次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者は、建物の売買に際し、買主に対して売買代金の貸借のあっせんをすることにより、契約の締結を誘引してはならない。", "宅地建物取引士は、自ら役員を務める宅地建物取引業者が宅地建物取引業に関し不正な行為をし、情状が特に重いことにより免許を取り消された場合、宅地建物取引士の登録を消除されることとなる。", "宅地建物取引業者は、建築工事完了前の賃貸住宅について、借主として貸借の契約を締結してはならない。", "宅地建物取引業者は、10区画以上の一団の宅地の分譲を行う案内所を設置し、当該案内所において売買の契約の締結をし、又は契約の申込みを受ける場合は、当該案内所にその業務に関する帳簿を備え付けなければならない。"], "page": 14, "img": ["q26_0.jpg"]}, {"stem": "宅地建物取引業者がその業務に関して行う広告に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["広告の表示が実際のものよりも著しく優良又は有利であると人を誤認させるようなものであっても、誤認による損害が実際に発生していなければ、監督処分の対象とならない。", "宅地建物取引業者は、建築確認申請中の建物について、建築確認申請中である旨を表示すれば、自ら売主として当該建物を販売する旨の広告をすることができる。", "宅地建物取引業者は、宅地の造成工事の完了前においては、当該造成工事に必要とされる許可等の処分があった後であれば、当該宅地の販売に関する広告をすることができる。", "テレビやインターネットを利用して行う広告は、新聞の折込チラシや配布用のチラシと異なり、規制の対象とならない。"], "page": 14, "img": ["q27_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、ＢからＢ所有の宅地の売却について媒介の依頼を受けた場合における次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、この問において「専任媒介契約」とは、専属専任媒介契約ではない専任媒介契約をいうものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "ＡがＢとの間で専任媒介契約を締結した場合、Ｂの要望により当該宅地を指定流通機構に登録しない旨の特約をしているときを除き、Ａは、当該契約締結日から7日以内（Ａの休業日を含まない。）に、当該宅地の所在等を指定流通機構に登録しなければならない。"}, {"m": "イ", "t": "ＡがＢとの間で専任媒介契約を締結した場合、ＡはＢに対して、当該契約に係る業務の処理状況を1週間に1回以上報告しなければならない。"}, {"m": "ウ", "t": "ＡがＢとの間で一般媒介契約を締結し、当該契約において、Ｂが他の宅地建物取引業者に重ねて依頼するときは当該他の宅地建物取引業者を明示する義務がある旨を定める場合、Ａは、Ｂが明示していない他の宅地建物取引業者の媒介又は代理によって売買の契約を成立させたときの措置を宅地建物取引業法第34条の2第1項の規定に基づき交付すべき書面に記載しなければならない。"}, {"m": "エ", "t": "ＡがＢとの間で一般媒介契約を締結した場合、ＡがＢに対し当該宅地の価額について意見を述べるときは、不動産鑑定士に評価を依頼して、その根拠を明らかにしなければならない。"}], "page": 15, "img": ["q28_0.jpg"]}, {"stem": "次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者（甲県知事免許）が、乙県内に新たに事務所を設置して宅地建物取引業を営むため、国土交通大臣に免許換えの申請を行い、その免許を受けたときは、国土交通大臣から、免許換え前の免許（甲県知事）の有効期間が経過するまでの期間を有効期間とする免許証の交付を受けることとなる。", "宅地建物取引士（甲県知事登録）が、乙県に所在する宅地建物取引業者の事務所の業務に従事することとなったため、乙県知事に登録の移転の申請とともに宅地建物取引士証の交付の申請をしたときは、乙県知事から、有効期間を5年とする宅地建物取引士証の交付を受けることとなる。", "宅地建物取引士（甲県知事登録）が、乙県に所在する建物の売買に関する取引において宅地建物取引士として行う事務に関し不正な行為をし、乙県知事により事務禁止処分を受けたときは、宅地建物取引士証を甲県知事に提出しなければならない。", "宅地建物取引業者（甲県知事免許）は、乙県内で一団の建物の分譲を行う案内所を設置し、当該案内所において建物の売買の契約を締結し、又は契約の申込みを受ける場合、国土交通大臣に免許換えの申請をしなければならない。"], "page": 16, "img": ["q29_0.jpg"]}, {"stem": "宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["本店と3つの支店を有する宅地建物取引業者が保証協会に加入しようとする場合、当該保証協会に、110万円の弁済業務保証金分担金を納付しなければならない。", "保証協会の社員又は社員であった者が、当該保証協会から、弁済業務保証金の還付額に相当する還付充当金を当該保証協会に納付すべき旨の通知を受けたときは、その通知を受けた日から2週間以内に、その通知された額の還付充当金を当該保証協会に納付しなければならない。", "保証協会に加入している宅地建物取引業者は、保証を手厚くするため、更に別の保証協会に加入することができる。", "保証協会の社員（甲県知事免許）と宅地建物取引業に関し取引をした者が、その取引により生じた債権に関し、当該保証協会が供託した弁済業務保証金について弁済を受ける権利を実行しようとするときは、弁済を受けることができる額について甲県知事の認証を受ける必要がある。"], "page": 16, "img": ["q30_0.jpg"]}, {"stem": "宅地建物取引業の免許に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者が、免許を受けてから1年以内に事業を開始せず免許が取り消され、その後5年を経過していない場合は、免許を受けることができない。", "免許を受けようとしている法人の政令で定める使用人が、破産手続開始の決定を受け、復権を得てから5年を経過していない場合、当該法人は免許を受けることができない。", "免許権者は、免許に条件を付することができ、免許の更新に当たっても条件を付することができる。", "宅地建物取引業者の役員の住所に変更があったときは、30日以内に免許権者に変更を届け出なければならない。"], "page": 17, "img": ["q31_0.jpg"]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはいくつあるか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "宅地の売買の媒介を行う場合、当該宅地が急傾斜地の崩壊による災害の防止に関する法律第3条第1項により指定された急傾斜地崩壊危険区域にあるときは、同法第7条第1項に基づく制限の概要を説明しなければならない。"}, {"m": "イ", "t": "建物の貸借の媒介を行う場合、当該建物が土砂災害警戒区域等における土砂災害防止対策の推進に関する法律第7条第1項により指定された土砂災害警戒区域内にあるときは、その旨を説明しなければならない。"}, {"m": "ウ", "t": "宅地の貸借の媒介を行う場合、文化財保護法第46条第1項及び第5項の規定による重要文化財の譲渡に関する制限について、その概要を説明する必要はない。"}, {"m": "エ", "t": "宅地の売買の媒介を行う場合、当該宅地が津波防災地域づくりに関する法律第21条第1項により指定された津波防護施設区域内にあるときは、同法第23条第1項に基づく制限の概要を説明しなければならない。"}], "page": 17, "img": ["q32_0.jpg"]}, {"stem": "宅地建物取引業法に規定する営業保証金に関する次の記述のうち、正しいものはどれか。", "ch": ["宅地建物取引業者は、事業の開始後、新たに従たる事務所を設置したときは、その従たる事務所の最寄りの供託所に政令で定める額の営業保証金を供託し、その旨を免許権者に届け出なければならない。", "宅地建物取引業者は、主たる事務所を移転したためその最寄りの供託所が変更した場合、国債証券をもって営業保証金を供託しているときは、遅滞なく、従前の主たる事務所の最寄りの供託所に対し、営業保証金の保管替えを請求しなければならない。", "宅地建物取引業者は、免許の有効期間満了に伴い営業保証金を取り戻す場合は、還付請求権者に対する公告をすることなく、営業保証金を取り戻すことができる。", "免許権者は、宅地建物取引業者が宅地建物取引業の免許を受けた日から3月以内に営業保証金を供託した旨の届出をしないときは、その届出をすべき旨の催告をしなければならず、その催告が到達した日から1月以内に届出がないときは、当該宅地建物取引業者の免許を取り消すことができる。"], "page": 18, "img": ["q33_0.jpg"]}, {"stem": "宅地建物取引業者（消費税課税事業者）が受けることができる報酬に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。", "ch": ["宅地建物取引業者が受けることのできる報酬は、依頼者が承諾していたとしても、国土交通大臣の定める報酬額の上限を超えてはならない。", "宅地建物取引業者は、その業務に関し、相手方に不当に高額の報酬を要求した場合、たとえ受領していなくても宅地建物取引業法違反となる。", "宅地建物取引業者が、事業用建物の貸借（権利金の授受はないものとする。）の媒介に関する報酬について、依頼者の双方から受けることのできる報酬の合計額は、借賃（消費税等相当額を含まない。）1か月分の1.1倍に相当する金額が上限であり、貸主と借主の負担の割合については特段の規制はない。", "宅地建物取引業者は、依頼者の依頼によらない広告の料金に相当する額を報酬額に合算する場合は、代理又は媒介に係る報酬の限度額を超える額の報酬を依頼者から受けることができる。"], "page": 18, "img": ["q34_0.jpg"]}, {"stem": "宅地建物取引業者Ａが行う媒介業務に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、この問において「37条書面」とは、同法第37条の規定により交付すべき書面をいうものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "Ａが建物の売買契約を成立させた場合においては、37条書面を買主に交付するに当たり、37条書面に記名押印した宅地建物取引士ではないＡの従業者が当該書面を交付することができる。"}, {"m": "イ", "t": "Ａが建物の賃貸借契約を成立させた場合においては、契約の当事者が宅地建物取引業者であっても、37条書面には、引渡しの時期及び賃借権設定登記の申請の時期を記載しなければならない。"}, {"m": "ウ", "t": "Ａが建物の売買契約を成立させた場合において、天災その他不可抗力による損害の負担に関する定めがあるときは、重要事項説明書にその旨記載していたとしても、その内容を37条書面に記載しなければならない。"}, {"m": "エ", "t": "Ａが事業用宅地の定期賃貸借契約を公正証書によって成立させた場合においては、公正証書とは別に37条書面を作成し交付するに当たり、契約の当事者が宅地建物取引業者であっても、宅地建物取引士をして37条書面に記名押印させなければならない。"}], "page": 19, "img": ["q35_0.jpg"]}, {"stem": "宅地建物取引業者の守秘義務に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者は、依頼者本人の承諾があった場合でも、秘密を他に漏らしてはならない。", "宅地建物取引業者が、宅地建物取引業を営まなくなった後は、その業務上取り扱ったことについて知り得た秘密を他に漏らしても、法に違反しない。", "宅地建物取引業者は、裁判の証人として、その取り扱った宅地建物取引に関して証言を求められた場合、秘密に係る事項を証言することができる。", "宅地建物取引業者は、調査の結果判明した法第35条第1項各号に掲げる事項であっても、売主が秘密にすることを希望した場合は、買主に対して説明しなくてもよい。"], "page": 19, "img": ["q36_0.jpg"]}, {"stem": "宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、同法の規定によれば、正しいものはどれか。", "ch": ["既存の建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項がない場合、確認した事項がない旨を37条書面に記載しなければならない。", "代金又は交換差金についての金銭の貸借のあっせんに関する定めがない場合、定めがない旨を37条書面に記載しなければならない。", "損害賠償額の予定又は違約金に関する定めがない場合、定めがない旨を37条書面に記載しなければならない。", "宅地又は建物に係る租税その他の公課の負担に関する定めがない場合、定めがない旨を37条書面に記載しなければならない。"], "page": 20, "img": ["q37_0.jpg"]}, {"stem": "宅地建物取引士に関する次の記述のうち、宅地建物取引業法及び民法の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "なし"], "items": [{"m": "ア", "t": "宅地建物取引業者は、事務所に置く唯一の専任の宅地建物取引士が退任した場合、その日から30日以内に新たな専任の宅地建物取引士を設置し、その設置の日から2週間以内に、専任の宅地建物取引士の変更があった旨を免許権者に届け出なければならない。"}, {"m": "イ", "t": "未成年者も、法定代理人の同意があれば、宅地建物取引業者の事務所に置かれる専任の宅地建物取引士となることができる。"}, {"m": "ウ", "t": "宅地建物取引士は、重要事項説明書を交付するに当たり、相手方が宅地建物取引業者である場合、相手方から宅地建物取引士証の提示を求められない限り、宅地建物取引士証を提示する必要はない。"}, {"m": "エ", "t": "成年被後見人又は被保佐人は、宅地建物取引士として都道府県知事の登録を受けることができない。"}], "page": 20, "img": ["q38_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として宅地建物取引業者ではない買主Ｂとの間で締結した宅地の売買契約について、Ｂが宅地建物取引業法第37条の2の規定に基づき、いわゆるクーリング・オフによる契約の解除をする場合における次の記述のうち、誤っているものはどれか。", "ch": ["Ｂは、Ａの仮設テント張りの案内所で買受けの申込みをし、2日後、Ａの事務所で契約を締結した上で代金全額を支払った。その5日後、Ｂが、宅地の引渡しを受ける前に当該契約について解除の書面を送付した場合、Ａは代金全額が支払われていることを理由に契約の解除を拒むことができる。", "Ｂは、自らの希望により自宅近くの喫茶店において買受けの申込みをし、売買契約を締結した。当該契約に係るクーリング・オフについては、その3日後にＡから書面で告げられた場合、Ｂは、当該契約の締結日から10日後であっても契約の解除をすることができる。", "Ｂは、Ａの仮設テント張りの案内所で買受けの申込みをし、Ａの事務所でクーリング・オフについて書面で告げられ、その日に契約を締結した。この書面の中で、クーリング・オフによる契約の解除ができる期間を14日間としていた場合、Ｂは、当該契約の締結日から10日後であっても契約の解除をすることができる。", "Ｂは、売買契約締結後に速やかに建物建築工事請負契約を締結したいと考え、自ら指定した宅地建物取引業者であるハウスメーカー（Ａから当該宅地の売却について代理又は媒介の依頼は受けていない。）の事務所で買受けの申込み及び売買契約の締結をし、その際、クーリング・オフについて書面で告げられた。その6日後、Ｂが当該契約について解除の書面を送付した場合、Ａは契約の解除を拒むことができない。"], "page": 21, "img": ["q39_0.jpg"]}, {"stem": "宅地建物取引業法（以下この問において「法」という。）に規定する業務に関する禁止事項についての次の記述のうち、正しいものはどれか。", "ch": ["宅地建物取引業者が、マンション販売の勧誘をするに際し、相手方から購入を希望しない旨の返事があった後に、当該勧誘を継続することは法に違反しない。", "宅地建物取引業者は、契約の相手方に対して資金不足を理由に手付の貸付けを行ったが、契約締結後償還された場合は法に違反しない。", "宅地建物取引業者は、契約の締結の勧誘をするに際し、理由の如何を問わず、相手方に対して当該契約を締結するかどうかを判断するために必要な時間を与えることを拒んではならない。", "宅地建物取引業者は、勧誘の相手方が金銭的に不安であることを述べたため、売買代金の額を引き下げて、契約の締結を勧誘したとしても、法に違反しない。"], "page": 22, "img": ["q40_0.jpg"]}, {"stem": "宅地建物取引業法第49条に規定する帳簿に関する次の記述のうち、正しいものはどれか。", "ch": ["宅地建物取引業者は、本店と複数の支店がある場合、支店には帳簿を備え付けず、本店に支店の分もまとめて備え付けておけばよい。", "宅地建物取引業者は、宅地建物取引業に関し取引のあったつど、その年月日、その取引に係る宅地又は建物の所在及び面積その他国土交通省令で定める事項を帳簿に記載しなければならない。", "宅地建物取引業者は、帳簿を各事業年度の末日をもって閉鎖するものとし、閉鎖後5年間当該帳簿を保存しなければならないが、自ら売主となり、又は売買の媒介をする新築住宅に係るものにあっては10年間保存しなければならない。", "宅地建物取引業者は、帳簿の記載事項を、事務所のパソコンのハードディスクに記録し、必要に応じ当該事務所においてパソコンやプリンターを用いて明確に紙面に表示する場合でも、当該記録をもって帳簿への記載に代えることができない。"], "page": 22, "img": ["q41_0.jpg"]}, {"stem": "宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、誤っているものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["地域における歴史的風致の維持及び向上に関する法律第12条第1項により指定された歴史的風致形成建造物である建物の売買の媒介を行う場合、その増築をするときは市町村長への届出が必要である旨を説明しなくてもよい。", "既存の建物の売買の媒介を行う場合、当該建物の建築確認済証がなくなっているときは、その旨を説明すればよい。", "区分所有建物の売買の媒介を行う場合、一棟の建物の維持修繕の実施状況が記録されているときは、その内容を説明しなければならない。", "建物の貸借の媒介を行う場合、台所、浴室、便所その他の当該建物の設備の整備の状況について、説明しなければならない。"], "page": 23, "img": ["q42_0.jpg"]}, {"stem": "宅地建物取引業法に規定する宅地建物取引士及びその登録（以下この問において「登録」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["登録を受けている者が精神の機能の障害により宅地建物取引士の事務を適正に行うに当たって必要な認知、判断及び意思疎通を適切に行うことができない者となった場合、本人がその旨を登録をしている都道府県知事に届け出ることはできない。", "甲県知事の登録を受けている宅地建物取引士が乙県知事に登録の移転の申請を行うとともに宅地建物取引士証の交付の申請を行う場合、交付の申請前6月以内に行われる乙県知事が指定した講習を受講しなければならない。", "宅地建物取引士が、事務禁止処分を受け、宅地建物取引士証をその交付を受けた都道府県知事に速やかに提出しなかったときは、50万円以下の罰金に処せられることがある。", "宅地建物取引士が、刑法第222条（脅迫）の罪により、罰金の刑に処せられ、登録が消除された場合、刑の執行を終わり又は執行を受けることがなくなった日から5年を経過するまでは、新たな登録を受けることができない。"], "page": 23, "img": ["q43_0.jpg"]}, {"stem": "宅地建物取引業法に関する次の記述のうち、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "宅地には、現に建物の敷地に供されている土地に限らず、将来的に建物の敷地に供する目的で取引の対象とされる土地も含まれる。"}, {"m": "イ", "t": "農地は、都市計画法に規定する用途地域内に存するものであっても、宅地には該当しない。"}, {"m": "ウ", "t": "建物の敷地に供せられる土地であれば、都市計画法に規定する用途地域外に存するものであっても、宅地に該当する。"}, {"m": "エ", "t": "道路、公園、河川等の公共施設の用に供せられている土地は、都市計画法に規定する用途地域内に存するものであれば宅地に該当する。"}], "page": 24, "img": ["q44_0.jpg"]}, {"stem": "宅地建物取引業者Ａが自ら売主として、宅地建物取引業者ではない買主Ｂに新築住宅を販売する場合における次の記述のうち、特定住宅瑕疵担保責任の履行の確保等に関する法律によれば、正しいものはどれか。", "ch": ["Ａが、住宅販売瑕疵担保保証金を供託する場合、当該住宅の床面積が100㎡以下であるときは、新築住宅の合計戸数の算定に当たって、2戸をもって1戸と数えることになる。", "Ａは、住宅瑕疵担保責任保険法人と住宅販売瑕疵担保責任保険契約の締結をした場合、Ｂが住宅の引渡しを受けた時から10年以内に当該住宅を転売したときは、住宅瑕疵担保責任保険法人にその旨を申し出て、当該保険契約の解除をしなければならない。", "Ａは、住宅販売瑕疵担保責任保険契約の締結をした場合、当該住宅を引き渡した時から10年間、当該住宅の構造耐力上主要な部分、雨水の浸入を防止する部分、給水設備又はガス設備の隠れた瑕疵によって生じた損害について保険金の支払を受けることができる。", "住宅販売瑕疵担保責任保険契約は、新築住宅を引き渡したＡが住宅瑕疵担保責任保険法人と締結する必要があり、Ｂが保険料を支払うものではない。"], "page": 24, "img": ["q45_0.jpg"]}, {"stem": "独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["機構は、地震に対する安全性の向上を主たる目的とする住宅の改良に必要な資金の貸付けを業務として行っている。", "証券化支援事業（買取型）における民間金融機関の住宅ローン金利は、金融機関によって異なる場合がある。", "機構は、高齢者が自ら居住する住宅に対して行うバリアフリー工事に係る貸付けについて、貸付金の償還を高齢者の死亡時に一括して行うという制度を設けている。", "証券化支援業務（買取型）において、機構による譲受けの対象となる住宅の購入に必要な資金の貸付けに係る金融機関の貸付債権には、当該住宅の購入に付随する改良に必要な資金は含まれない。"], "page": 25, "img": ["q46_0.jpg"]}, {"stem": "宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。", "ch": ["建築基準法第42条第2項の規定により道路とみなされる部分（セットバックを要する部分）を含む土地については、セットバックを要する旨及びその面積を必ず表示しなければならない。", "取引態様については、「売主」、「貸主」、「代理」又は「媒介（仲介）」の別を表示しなければならず、これらの用語以外の「直販」、「委託」等の用語による表示は、取引態様の表示とは認められない。", "インターネット上に掲載している賃貸物件について、掲載した後に契約済みとなり実際には取引できなくなっていたとしても、当該物件について消費者からの問合せがなく、故意に掲載を継続していたものでなければ、不当表示に問われることはない。", "新築分譲住宅を販売するに当たり、販売価格が確定していないため直ちに取引することができない場合、その取引開始時期をあらかじめ告知する予告広告を行うことはできない。"], "page": 25, "img": ["q47_0.jpg"]}, {"stem": "次の記述のうち、正しいものはどれか。", "ch": ["建築着工統計（令和2年1月公表）によれば、平成31年1月から令和元年12月までの新設住宅着工戸数は約90.5万戸となり、3年ぶりに増加に転じた。", "令和2年版国土交通白書（令和2年6月公表）によれば、平成31年3月末における宅地建物取引業者数は12万4,000を超えている。", "令和2年版土地白書（令和2年6月公表）によれば、平成30年の住宅地、工業用地等の宅地は約196万haあるが、前年に比べて大きく減少した。", "平成30年度法人企業統計調査（令和元年9月公表）によれば、不動産業について、平成30年度の売上高営業利益率及び売上高経常利益率は、いずれも10％以下となっている。"], "page": 26, "img": ["q48_0.jpg"]}, {"stem": "土地に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["山地は、地形がかなり急峻で、大部分が森林となっている。", "低地は、一般に洪水や地震などに対して弱く、防災的見地からは住宅地として好ましくない。", "埋立地は、一般に海面に対して数mの比高を持ち、干拓地に比べ自然災害に対して危険度が高い。", "台地は、一般に地盤が安定しており、低地に比べ自然災害に対して安全度が高い。"], "page": 26, "img": ["q49_0.jpg"]}, {"stem": "建築物の構造に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["基礎は、硬質の支持地盤に設置するとともに、上部構造とも堅固に緊結する必要がある。", "木造建物を耐震、耐風的な構造にするためには、できるだけ建物の形態を単純にすることが適切である。", "鉄骨造は、不燃構造であり、靭性が大きいことから、鋼材の防錆処理を行う必要はない。", "近年、コンクリートと鉄筋の強度が向上しており、鉄筋コンクリート造の超高層共同住宅建物もみられる。"], "page": 26, "img": ["q50_0.jpg"]}]},
