   ans:[[1], [1], [2], [4], [4], [3], [3], [3], [2], [3], [4], [3], [2], [2], [4], [1], [3], [1], [1], [4], [2], [1], [1], [4], [4], [3], [4], [3], [2], [1], [4], [4], [1], [3], [4], [3], [3], [2], [2], [4], [2], [3], [4], [1], [4], [2], [2], [1], [2], [3]],
   qs:[{"stem": "次の 1 から 4 までの記述のうち、民法の規定、判例及び下記判決文によれば、誤っているものはどれか。（判決文）遺産は、相続人が数人あるときは、相続開始から遺産分割までの間、共同相続人の共有に属するものであるから、この間に遺産である賃貸不動産を使用管理した結果生ずる金銭債権たる賃料債権は、遺産とは別個の財産というべきであって、各共同相続人がその相続分に応じて分割単独債権として確定的に取得するものと解するのが相当である。", "ch": ["遺産である不動産から、相続開始から遺産分割までの間に生じた賃料債権は、遺産である不動産が遺産分割によって複数の相続人のうちの一人に帰属することとなった場合、当該不動産が帰属することになった相続人が相続開始時にさかのぼって取得する。", "相続人が数人あるときは、相続財産は、その共有に属し、各共同相続人は、その相続分に応じて被相続人の権利義務を承継する。", "遺産分割の効力は、相続開始の時にさかのぼって生ずる。ただし、第三者の権利を害することはできない。", "遺産である不動産が遺産分割によって複数の相続人のうちの一人に帰属することとなった場合、当該不動産から遺産分割後に生じた賃料債権は、遺産分割によって当該不動産が帰属した相続人が取得する。"], "page": 3}, {"stem": "相隣関係に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["土地の所有者は、境界標の調査又は境界に関する測量等の一定の目的のために必要な範囲内で隣地を使用することができる場合であっても、住家については、その家の居住者の承諾がなければ、当該住家に立ち入ることはできない。", "土地の所有者は、隣地の竹木の枝が境界線を越える場合、その竹木の所有者にその枝を切除させることができるが、その枝を切除するよう催告したにもかかわらず相当の期間内に切除しなかったときであっても、自らその枝を切り取ることはできない。", "相隣者の一人は、相隣者間で共有する障壁の高さを増すときは、他方の相隣者の承諾を得なければならない。", "他の土地に囲まれて公道に通じない土地の所有者は、公道に出るためにその土地を囲んでいる他の土地を自由に選んで通行することができる。"], "page": 3}, {"stem": "Ａを注文者、Ｂを請負人として、Ａ所有の建物に対して独立性を有さずその構成部分となる増築部分の工事請負契約を締結し、Ｂは 3 か月間で増築工事を終了させた。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、この問において「契約不適合」とは品質に関して契約の内容に適合しないことをいい、当該請負契約には契約不適合責任に関する特約は定められていなかったものとする。", "ch": ["ＡがＢに請負代金を支払っていなくても、Ａは増築部分の所有権を取得する。", "Ｂが材料を提供して増築した部分に契約不適合がある場合、Ａは工事が終了した日から 1年以内にその旨をＢに通知しなければ、契約不適合を理由とした修補をＢに対して請求することはできない。", "Ｂが材料を提供して増築した部分に契約不適合があり、Ｂは不適合があることを知りながらそのことをＡに告げずに工事を終了し、Ａが工事終了日から 3 年後に契約不適合を知った場合、ＡはＢに対して、消滅時効が完成するまでは契約不適合を理由とした修補を請求することができる。", "増築した部分にＡが提供した材料の性質によって契約不適合が生じ、Ｂが材料が不適当であることを知らずに工事を終了した場合、ＡはＢに対して、Ａが提供した材料によって生じた契約不適合を理由とした修補を請求することはできない。"], "page": 4}, {"stem": "ＡがＢに対して貸金債権である甲債権を、ＢがＡに対して貸金債権である乙債権をそれぞれ有している場合において、民法の規定及び判例によれば、次のアからエまでの記述のうち、Ａが一方的な意思表示により甲債権と乙債権とを対当額にて相殺できないものを全て掲げたものは、次の 1 から 4 のうちどれか。なお、いずれの債権も相殺を禁止し又は制限する旨の意思表示はされていないものとする。", "ch": ["ア、イ、ウ", "イ、ウ", "ウ、エ", "エ"], "page": 4, "items": [{"m": "ア", "t": "弁済期の定めのない甲債権と、弁済期到来前に、ＡがＢに対して期限の利益を放棄する旨の意思表示をした乙債権"}, {"m": "イ", "t": "弁済期が到来している甲債権と、弁済期の定めのない乙債権"}, {"m": "ウ", "t": "弁済期の定めのない甲債権と、弁済期が到来している乙債権"}, {"m": "エ", "t": "弁済期が到来していない甲債権と、弁済期が到来している乙債権"}]}, {"stem": "従来の住所又は居所を去った者（以下この問において「不在者」という。）の財産の管理に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、この問において「管理人」とは、不在者の財産の管理人をいうものとする。", "ch": ["不在者が管理人を置かなかったときは、当該不在者の生死が 7 年間明らかでない場合に限り、家庭裁判所は、利害関係人又は検察官の請求により、その財産の管理について必要な処分を命ずることができる。", "不在者が管理人を置いた場合において、その不在者の生死が明らかでないときは、家庭裁判所は、利害関係人又は検察官から請求があったとしても管理人を改任することはできない。", "家庭裁判所により選任された管理人は、不在者を被告とする建物収去土地明渡請求を認容した第一審判決に対して控訴を提起するには、家庭裁判所の許可が必要である。", "家庭裁判所により選任された管理人は、保存行為として不在者の自宅を修理することができるほか、家庭裁判所の許可を得てこれを売却することができる。"], "page": 5}, {"stem": "Ａ所有の甲土地について、Ｂが所有の意思をもって平穏にかつ公然と時効取得に必要な期間占有を継続した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "なし"], "page": 5, "items": [{"m": "ア", "t": "ＡがＣに対して甲土地を売却し、Ｃが所有権移転登記を備えた後にＢの取得時効が完成した場合には、Ｂは登記を備えていなくても、甲土地の所有権の時効取得をＣに対抗することができる。"}, {"m": "イ", "t": "Ｂの取得時効が完成した後に、ＡがＤに対して甲土地を売却しＤが所有権移転登記を備え、Ｂが、Ｄの登記の日から所有の意思をもって平穏にかつ公然と時効取得に必要な期間占有を継続した場合、所有権移転登記を備えていなくても、甲土地の所有権の時効取得をＤに対抗することができる。"}, {"m": "ウ", "t": "Ｂの取得時効完成後、Ｂへの所有権移転登記がなされないままＥがＡを債務者として甲土地にＡから抵当権の設定を受けて抵当権設定登記をした場合において、Ｂがその後引き続き所有の意思をもって平穏にかつ公然と時効取得に必要な期間占有を継続した場合、特段の事情がない限り、再度の時効取得により、Ｂは甲土地の所有権を取得し、Ｅの抵当権は消滅する。"}]}, {"stem": "甲建物を所有するＡが死亡し、Ａの配偶者Ｂが甲建物の配偶者居住権を、Ａの子Ｃが甲建物の所有権をそれぞれ取得する旨の遺産分割協議が成立した場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["遺産分割協議において、Ｂの配偶者居住権の存続期間が定められなかった場合、配偶者居住権の存続期間は 20 年となる。", "Ｂが高齢となり、バリアフリーのマンションに転居するための資金が必要になった場合、Ｂは、Ｃの承諾を得ずに甲建物を第三者Ｄに賃貸することができる。", "Ｃには、Ｂに対し、配偶者居住権の設定の登記を備えさせる義務がある。", "Ｃは、甲建物の通常の必要費を負担しなければならない。"], "page": 6}, {"stem": "未成年者Ａが、法定代理人Ｂの同意を得ずに、Ｃから甲建物を買い受ける契約（以下この問において「本件売買契約」という。）を締結した場合における次の記述のうち、民法の規定によれば、正しいものはどれか。なお、Ａに処分を許された財産はなく、Ａは、営業を許されてはいないものとする。", "ch": ["ＡがＢの同意を得ずに制限行為能力を理由として本件売買契約を取り消した場合、Ｂは、自己が本件売買契約の取消しに同意していないことを理由に、Ａの当該取消しの意思表示を取り消すことができる。", "本件売買契約締結時にＡが未成年者であることにつきＣが善意無過失であった場合、Ｂは、Ａの制限行為能力を理由として、本件売買契約を取り消すことはできない。", "本件売買契約につき、取消しがなされないままＡが成年に達した場合、本件売買契約についてＢが反対していたとしても、自らが取消権を有すると知ったＡは、本件売買契約を追認することができ、追認後は本件売買契約を取り消すことはできなくなる。", "本件売買契約につき、Ｂが追認しないまま、Ａが成年に達する前にＢの同意を得ずに甲建物をＤに売却した場合、ＢがＤへの売却について追認していないときでも、Ａは制限行為能力を理由として、本件売買契約を取り消すことはできなくなる。"], "page": 6}, {"stem": "Ａを貸主、Ｂを借主として甲建物の賃貸借契約が令和 5年7月1 日に締結された場合の甲建物の修繕に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。", "ch": ["甲建物の修繕が必要であることを、Ａが知ったにもかかわらず、Ａが相当の期間内に必要な修繕をしないときは、Ｂは甲建物の修繕をすることができる。", "甲建物の修繕が必要である場合において、ＢがＡに修繕が必要である旨を通知したにもかかわらず、Ａが必要な修繕を直ちにしないときは、Ｂは甲建物の修繕をすることができる。", "Ｂの責めに帰すべき事由によって甲建物の修繕が必要となった場合は、Ａは甲建物を修繕する義務を負わない。", "甲建物の修繕が必要である場合において、急迫の事情があるときは、Ｂは甲建物の修繕をすることができる。"], "page": 7}, {"stem": "債務者Ａが所有する甲土地には、債権者Ｂが一番抵当権（債権額 1,000 万円）、債権者Ｃが二番抵当権（債権額 1,200 万円）、債権者Ｄが三番抵当権（債権額 2,000 万円）をそれぞれ有しているが、ＢがＤの利益のため、Ａの承諾を得て抵当権の順位を放棄した。甲土地の競売に基づく売却代金が 2,400 万円であった場合、Ｂの受ける配当額として、民法の規定によれば、正しいものはどれか。", "ch": ["0 円", "200 万円", "400 万円", "800 万円"], "page": 7}, {"stem": "ＡがＢとの間で、Ａ所有の甲土地につき建物所有目的で期間を 50 年とする賃貸借契約（以下この問において「本件契約」という。）を締結する場合に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。", "ch": ["本件契約に、当初の 10 年間は地代を減額しない旨の特約を定めた場合、その期間内は、ＢはＡに対して地代の減額請求をすることはできない。", "本件契約が甲土地上で専ら賃貸アパート事業用の建物を所有する目的である場合、契約の更新や建物の築造による存続期間の延長がない旨を定めるためには、公正証書で合意しなければならない。", "本件契約に建物買取請求権を排除する旨の特約が定められていない場合、本件契約が終了したときは、その終了事由のいかんにかかわらず、ＢはＡに対してＢが甲土地上に所有している建物を時価で買い取るべきことを請求することができる。", "本件契約がＢの居住のための建物を所有する目的であり契約の更新がない旨を定めていない契約であって、期間満了する場合において甲土地上に建物があり、Ｂが契約の更新を請求したとしても、Ａが遅滞なく異議を述べ、その異議に更新を拒絶する正当な事由があると認められる場合は、本件契約は更新されない。"], "page": 8}, {"stem": "令和 5 年 7 月 1 日に締結された建物の賃貸借契約（定期建物賃貸借契約及び一時使用目的の建物の賃貸借契約を除く。）に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。", "ch": ["期間を 1 年未満とする建物の賃貸借契約は、期間を 1 年とするものとみなされる。", "当事者間において、一定の期間は建物の賃料を減額しない旨の特約がある場合、現行賃料が不相当になったなどの事情が生じたとしても、この特約は有効である。", "賃借人が建物の引渡しを受けている場合において、当該建物の賃貸人が当該建物を譲渡するに当たり、当該建物の譲渡人及び譲受人が、賃貸人たる地位を譲渡人に留保する旨及び当該建物の譲受人が譲渡人に賃貸する旨の合意をしたときは、賃貸人たる地位は譲受人に移転しない。", "現行賃料が定められた時から一定の期間が経過していなければ、賃料増額請求は、認められない。"], "page": 8}, {"stem": "建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["集会においては、法で集会の決議につき特別の定数が定められている事項を除き、規約で別段の定めをすれば、あらかじめ通知した事項以外についても決議することができる。", "集会は、区分所有者の 4 分の 3 以上の同意があるときは、招集の手続を経ないで開くことができる。", "共用部分の保存行為は、規約に別段の定めがある場合を除いて、各共有者がすることができるため集会の決議を必要としない。", "一部共用部分に関する事項で区分所有者全員の利害に関係しないものについての区分所有者全員の規約は、当該一部共用部分を共用すべき区分所有者が 8 人である場合、 3 人が反対したときは変更することができない。"], "page": 9}, {"stem": "不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。", "ch": ["建物が滅失したときは、表題部所有者又は所有権の登記名義人は、その滅失の日から 1 か月以内に、当該建物の滅失の登記を申請しなければならない。", "何人も、理由の有無にかかわらず、登記官に対し、手数料を納付して、登記簿の附属書類である申請書を閲覧することができる。", "共有物分割禁止の定めに係る権利の変更の登記の申請は、当該権利の共有者である全ての登記名義人が共同してしなければならない。", "区分建物の所有権の保存の登記は、表題部所有者から所有権を取得した者も、申請することができる。"], "page": 9}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。", "ch": ["市街化調整区域は、土地利用を整序し、又は環境を保全するための措置を講ずることなく放置すれば、将来における一体の都市としての整備に支障が生じるおそれがある区域とされている。", "高度利用地区は、土地の合理的かつ健全な高度利用と都市機能の更新とを図るため、都市計画に、建築物の高さの最低限度を定める地区とされている。", "特定用途制限地域は、用途地域が定められている土地の区域内において、都市計画に、制限すべき特定の建築物等の用途の概要を定める地域とされている。", "地区計画は、用途地域が定められている土地の区域のほか、一定の場合には、用途地域が定められていない土地の区域にも定めることができる。"], "page": 10}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["開発許可を申請しようとする者は、あらかじめ、開発行為に関係がある公共施設の管理者と協議し、その同意を得なければならない。", "開発許可を受けた者は、当該許可を受ける際に申請書に記載した事項を変更しようとする場合においては、都道府県知事に届け出なければならないが、当該変更が国土交通省令で定める軽微な変更に当たるときは、届け出なくてよい。", "開発許可を受けた者は、当該開発行為に関する工事が完了し、都道府県知事から検査済証を交付されたときは、遅滞なく、当該工事が完了した旨を公告しなければならない。", "市街化調整区域のうち開発許可を受けた開発区域以外の区域内において、自己の居住用の住宅を新築しようとする全ての者は、当該建築が開発行為を伴わない場合であれば、都道府県知事の許可を受けなくてよい。"], "page": 10}, {"stem": "建築基準法に関する次の記述のうち、誤っているものはどれか。", "ch": ["地方公共団体は、条例で、津波、高潮、出水等による危険の著しい区域を災害危険区域として指定し、当該区域内における住居の用に供する建築物の建築を禁止することができる。", "3 階建て以上の建築物の避難階以外の階を、床面積の合計が 1,500 m² を超える物品販売業の店舗の売場とする場合には、当該階から避難階又は地上に通ずる 2 以上の直通階段を設けなければならない。", "建築物が防火地域及び準防火地域にわたる場合、その全部について準防火地域内の建築物に関する規定を適用する。", "石綿等をあらかじめ添加した建築材料は、石綿等を飛散又は発散させるおそれがないものとして国土交通大臣が定めたもの又は国土交通大臣の認定を受けたものを除き、使用してはならない。"], "page": 11}, {"stem": "次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["法第 53 条第 1 項及び第 2 項の建蔽率制限に係る規定の適用については、準防火地域内にある準耐火建築物であり、かつ、街区の角にある敷地又はこれに準ずる敷地で特定行政庁が指定するものの内にある建築物にあっては同条第 1 項各号に定める数値に 10 分の 2 を加えたものをもって当該各号に定める数値とする。", "建築物又は敷地を造成するための擁壁は、道路内に、又は道路に突き出して建築し、又は築造してはならず、地盤面下に設ける建築物においても同様である。", "地方公共団体は、その敷地が袋路状道路にのみ接する建築物であって、延べ面積が 150 m²を超えるものについては、一戸建ての住宅であっても、条例で、その敷地が接しなければならない道路の幅員、その敷地が道路に接する部分の長さその他その敷地又は建築物と道路との関係に関して必要な制限を付加することができる。", "冬至日において、法第 56 条の 2 第 1 項の規定による日影規制の対象区域内の土地に日影を生じさせるものであっても、対象区域外にある建築物であれば一律に、同項の規定は適用されない。"], "page": 11}, {"stem": "宅地造成等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["都道府県知事は、関係市町村長の意見を聴いて、宅地造成工事規制区域内で、宅地造成に伴う災害で相当数の居住者その他の者に危害を生ずるものの発生のおそれが大きい一団の造成宅地の区域であって、一定の基準に該当するものを、造成宅地防災区域として指定することができる。", "都道府県知事は、その地方の気候、風土又は地勢の特殊性により、宅地造成等規制法の規定のみによっては宅地造成に伴うがけ崩れ又は土砂の流出の防止の目的を達し難いと認める場合は、都道府県（地方自治法に基づく指定都市、中核市又は施行時特例市の区域にあっては、それぞれ指定都市、中核市又は施行時特例市）の規則で、宅地造成工事規制区域内において行われる宅地造成に関する工事の技術的基準を強化し、又は付加することができる。", "都道府県知事は、宅地造成工事規制区域内の宅地について、宅地造成に伴う災害を防止するために必要があると認める場合には、その宅地の所有者に対して、擁壁等の設置等の措置をとることを勧告することができる。", "宅地造成工事規制区域内の宅地において、雨水その他の地表水又は地下水を排除するための排水施設の除却工事を行おうとする場合は、一定の場合を除き、都道府県知事への届出が必要となる。"], "page": 12}, {"stem": "土地区画整理法に関する次の記述のうち、誤っているものはどれか。", "ch": ["換地計画において定められた清算金は、換地処分の公告があった日の翌日において確定する。", "現に施行されている土地区画整理事業の施行地区となっている区域については、その施行者の同意を得なければ、その施行者以外の者は、土地区画整理事業を施行することができない。", "施行者は、換地処分の公告があった場合において、施行地区内の土地及び建物について土地区画整理事業の施行により変動があったときは、遅滞なく、その変動に係る登記を申請し、又は嘱託しなければならない。", "土地区画整理組合は、仮換地を指定しようとする場合においては、あらかじめ、その指定について、土地区画整理審議会の同意を得なければならない。"], "page": 12}, {"stem": "農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、誤っているものはどれか。", "ch": ["相続により農地を取得する場合は、法第 3 条第 1 項の許可を要しないが、相続人に該当しない者が特定遺贈により農地を取得する場合は、同項の許可を受ける必要がある。", "自己の所有する面積 4 アールの農地を農作物の育成又は養畜の事業のための農業用施設に転用する場合は、法第 4 条第 1 項の許可を受ける必要はない。", "法第 3 条第 1 項又は法第 5 条第 1 項の許可が必要な農地の売買について、これらの許可を受けずに売買契約を締結しても、その所有権の移転の効力は生じない。", "社会福祉事業を行うことを目的として設立された法人（社会福祉法人）が、農地をその目的に係る業務の運営に必要な施設の用に供すると認められる場合、農地所有適格法人でなくても、農業委員会の許可を得て、農地の所有権を取得することができる。"], "page": 13}, {"stem": "土地を取得する場合における届出に関する次の記述のうち、正しいものはどれか。なお、この問において「事後届出」とは、国土利用計画法第 23 条の届出をいい、「重要土地等調査法」とは、重要施設周辺及び国境離島等における土地等の利用状況の調査及び利用の規制等に関する法律をいうものとする。", "ch": ["都市計画区域外において、国から一団の土地である 6,000 m² と 5,000 m² の土地を購入した者は、事後届出を行う必要はない。", "市街化区域を除く都市計画区域内において、Ａが所有する 7,000 m² の土地をＢが相続により取得した場合、Ｂは事後届出を行う必要がある。", "市街化区域において、Ｃが所有する 3,000 m² の土地をＤが購入する契約を締結した場合、Ｃ及びＤは事後届出を行わなければならない。", "重要土地等調査法の規定による特別注視区域内にある 100 m² の規模の土地に関する所有権又はその取得を目的とする権利の移転をする契約を締結する場合には、当事者は、一定の事項を、あらかじめ、内閣総理大臣に届け出なければならない。"], "page": 13}, {"stem": "印紙税に関する次の記述のうち、正しいものはどれか。なお、以下の契約書はいずれも書面により作成されたものとする。", "ch": ["売主Ａと買主Ｂが土地の譲渡契約書を 3 通作成し、Ａ、Ｂ及び仲介人Ｃがそれぞれ 1 通ずつ保存する場合、当該契約書 3 通には印紙税が課される。", "一の契約書に土地の譲渡契約（譲渡金額 5,000 万円）と建物の建築請負契約（請負金額6,000 万円）をそれぞれ区分して記載した場合、印紙税の課税標準となる当該契約書の記載金額は 1 億 1,000 万円である。", "「Ｄの所有する甲土地（時価 2,000 万円）をＥに贈与する」旨を記載した贈与契約書を作成した場合、印紙税の課税標準となる当該契約書の記載金額は、2,000 万円である。", "当初作成の「土地を 1 億円で譲渡する」旨を記載した土地譲渡契約書の契約金額を変更するために作成する契約書で、「当初の契約書の契約金額を 1,000 万円減額し、9,000 万円とする」旨を記載した変更契約書について、印紙税の課税標準となる当該変更契約書の記載金額は、1,000 万円である。"], "page": 14}, {"stem": "不動産取得税に関する次の記述のうち、正しいものはどれか。", "ch": ["不動産取得税の徴収については、特別徴収の方法によることができる。", "不動産取得税は、目的税である。", "不動産取得税は、不動産の取得に対し、当該不動産所在の市町村及び特別区において、当該不動産の取得者に課する。", "不動産取得税は、市町村及び特別区に対して、課することができない。"], "page": 14}, {"stem": "不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、正しいものはどれか。", "ch": ["原価法は、価格時点における対象不動産の収益価格を求め、この収益価格について減価修正を行って対象不動産の比準価格を求める手法である。", "原価法は、対象不動産が建物又は建物及びその敷地である場合には適用することができるが、対象不動産が土地のみである場合においては、いかなる場合も適用することができない。", "取引事例比較法における取引事例が、特殊事情のある事例である場合、その具体的な状況が判明し、事情補正できるものであっても採用することは許されない。", "取引事例比較法は、近隣地域若しくは同一需給圏内の類似地域等において対象不動産と類似の不動産の取引が行われている場合又は同一需給圏内の代替競争不動産の取引が行われている場合に有効である。"], "page": 15}, {"stem": "宅地建物取引業法第 37 条の規定により交付すべき書面に記載すべき事項を電磁的方法により提供すること（以下この問において「37 条書面の電磁的方法による提供」という。）に関する次の記述のうち、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 15, "items": [{"m": "ア", "t": "宅地建物取引業者が自ら売主として締結する売買契約において、当該契約の相手方から宅地建物取引業法施行令第 3 条の4第1 項に規定する承諾を得なければ、37 条書面の電磁的方法による提供をすることができない。"}, {"m": "イ", "t": "宅地建物取引業者が媒介業者として関与する売買契約について、宅地建物取引業法施行令第 3 条の 4 第 1 項に規定する承諾を取得するための通知の中に宅地建物取引士を明示しておけば、37 条書面の電磁的方法による提供において提供に係る宅地建物取引士を明示する必要はない。"}, {"m": "ウ", "t": "宅地建物取引業者が自ら売主として締結する売買契約において、37 条書面の電磁的方法による提供を行う場合、当該提供されたファイルへの記録を取引の相手方が出力することにより書面を作成できるものでなければならない。"}, {"m": "エ", "t": "宅地建物取引業者が媒介業者として関与する建物賃貸借契約について、37 条書面の電磁的方法による提供を行う場合、当該提供するファイルに記録された記載事項について、改変が行われていないかどうかを確認することができる措置を講じなければならない。"}]}, {"stem": "宅地建物取引業法第 34 条の 2 第 1 項第 4 号に規定する建物状況調査（以下この問において「建物状況調査」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["建物状況調査とは、建物の構造耐力上主要な部分又は雨水の浸入を防止する部分として国土交通省令で定めるものの状況の調査であって、経年変化その他の建物に生じる事象に関する知識及び能力を有する者として国土交通省令で定める者が実施するものをいう。", "宅地建物取引業者が建物状況調査を実施する者のあっせんを行う場合、建物状況調査を実施する者は建築士法第 2 条第 1 項に規定する建築士であって国土交通大臣が定める講習を修了した者でなければならない。", "既存住宅の売買の媒介を行う宅地建物取引業者が売主に対して建物状況調査を実施する者のあっせんを行った場合、宅地建物取引業者は売主から報酬とは別にあっせんに係る料金を受領することはできない。", "既存住宅の貸借の媒介を行う宅地建物取引業者は、宅地建物取引業法第 37 条の規定により交付すべき書面に建物の構造耐力上主要な部分等の状況について当事者の双方が確認した事項を記載しなければならない。"], "page": 16}, {"stem": "宅地建物取引業者Ａの業務に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定に違反するものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 16, "items": [{"m": "ア", "t": "Ａの従業員Ｂが、Ｃが所有する戸建住宅の買取りを目的とした訪問勧誘をＣに対して行ったところ、Ｃから「契約の意思がないので今後勧誘に来ないでほしい」と言われたことから、後日、Ａは、別の従業員Ｄに同じ目的で訪問勧誘を行わせて、当該勧誘を継続した。"}, {"m": "イ", "t": "Ａの従業員Ｅは、Ｆが所有する戸建住宅の買取りを目的とした電話勧誘をＦに対して行った際に、不実のことと認識しながら「今後 5 年以内にこの一帯は再開発されるので、急いで売却した方がよい。」と説明した。"}, {"m": "ウ", "t": "Ａの従業員Ｇは、Ｈが所有する戸建住宅の買取りを目的とした電話勧誘をＨに対して行おうと考え、23 時頃にＨの自宅に電話をかけ、勧誘を行い、Ｈの私生活の平穏を害し、Ｈを困惑させた。"}, {"m": "エ", "t": "Ａは、Ｊとの間でＪが所有する戸建住宅を買い取る売買契約を締結し、法第 37 条の規定に基づく書面をＪに交付したが、Ａの宅地建物取引士に、当該書面に記名のみさせ、押印させることを省略した。"}]}, {"stem": "宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者Ａ社の使用人であって、Ａ社の宅地建物取引業を行う支店の代表者であるものが、道路交通法の規定に違反したことにより懲役の刑に処せられたとしても、Ａ社の免許は取り消されることはない。", "宅地建物取引業者Ｂ社の取締役が、所得税法の規定に違反したことにより罰金の刑に処せられたとしても、Ｂ社の免許は取り消されることはない。", "宅地建物取引業者である個人Ｃが、宅地建物取引業法の規定に違反したことにより罰金の刑に処せられたとしても、Ｃの免許は取り消されることはない。", "宅地建物取引業者Ｄ社の非常勤の取締役が、刑法第 222 条（脅迫）の罪を犯したことにより罰金の刑に処せられたとしても、Ｄ社の免許は取り消されることはない。"], "page": 17}, {"stem": "宅地建物取引業者Ａ（甲県知事免許）の営業保証金に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、Ａは宅地建物取引業保証協会の社員ではないものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 17, "items": [{"m": "ア", "t": "Ａが免許を受けた日から 6 か月以内に甲県知事に営業保証金を供託した旨の届出を行わないとき、甲県知事はその届出をすべき旨の催告をしなければならず、当該催告が到達した日から 1 か月以内にＡが届出を行わないときは、その免許を取り消すことができる。"}, {"m": "イ", "t": "Ａは、営業保証金を供託したときは、その供託物受入れの記載のある供託書の写しを添付して、その旨を甲県知事に届け出なければならず、当該届出をした後でなければ、その事業を開始することができない。"}, {"m": "ウ", "t": "Ａは、営業保証金が還付され、甲県知事から営業保証金が政令で定める額に不足が生じた旨の通知を受け、その不足額を供託したときは、30 日以内に甲県知事にその旨を届け出なければならない。"}, {"m": "エ", "t": "Ａが免許失効に伴い営業保証金を取り戻す際、供託した営業保証金につき還付を受ける権利を有する者に対し、 3 か月を下らない一定期間内に申し出るべき旨を公告し、期間内にその申出がなかった場合でなければ、取り戻すことができない。"}]}, {"stem": "宅地建物取引業者がその業務に関して行う広告に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。なお、この問において「建築確認」とは、建築基準法第 6 条第 1 項の確認をいうものとする。", "ch": ["宅地又は建物の売買に関する注文を受けたときは、遅滞なくその注文をした者に対して取引態様の別を明らかにしなければならないが、当該注文者が事前に取引態様の別を明示した広告を見てから注文してきた場合においては、取引態様の別を遅滞なく明らかにする必要はない。", "既存の住宅に関する広告を行うときは、法第 34 条の 2 第 1 項第 4 号に規定する建物状況調査を実施しているかどうかを明示しなければならない。", "これから建築工事を行う予定である建築確認申請中の建物については、当該建物の売買の媒介に関する広告をしてはならないが、貸借の媒介に関する広告はすることができる。", "販売する宅地又は建物の広告に関し、著しく事実に相違する表示をした場合、監督処分の対象となるだけでなく、懲役若しくは罰金に処せられ、又はこれを併科されることもある。"], "page": 18}, {"stem": "宅地建物取引業者が行う届出に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。", "ch": ["宅地建物取引業者Ａ（甲県知事免許）が、新たに宅地建物取引業を営む支店を甲県内に設置した場合、Ａはその日から 30 日以内にその旨を甲県知事に届け出なければならない。", "宅地建物取引業者Ｂ（乙県知事免許）が、宅地建物取引業者ではないＣとの合併により消滅した場合、Ｂを代表する役員であった者は、その日から 30 日以内にその旨を乙県知事に届け出なければならない。", "宅地建物取引業者Ｄ（丙県知事免許）が、本店における専任の宅地建物取引士Ｅの退職に伴い、新たに専任の宅地建物取引士Ｆを本店に置いた場合、Ｄはその日から 30 日以内にその旨を丙県知事に届け出なければならない。", "宅地建物取引業者Ｇ（丁県知事免許）が、その業務に関し展示会を丁県内で実施する場合、展示会を実施する場所において売買契約の締結（予約を含む。）又は売買契約の申込みの受付を行うときは、Ｇは展示会での業務を開始する日の 5 日前までに展示会を実施する場所について丁県知事に届け出なければならない。"], "page": 18}, {"stem": "宅地建物取引業法第 35 条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。", "ch": ["甲宅地を所有する宅地建物取引業者Ａが、乙宅地を所有する宅地建物取引業者ではない個人Ｂと、甲宅地と乙宅地の交換契約を締結するに当たって、Ｂに対して、甲宅地に関する重要事項の説明を行う義務はあるが、乙宅地に関する重要事項の説明を行う義務はない。", "宅地の売買における当該宅地の引渡しの時期について、重要事項説明において説明しなければならない。", "宅地建物取引業者が売主となる宅地の売買に関し、売主が買主から受領しようとする金銭のうち、買主への所有権移転の登記以後に受領するものに対して、宅地建物取引業法施行規則第 16 条の 4 に定める保全措置を講ずるかどうかについて、重要事項説明書に記載する必要がある。", "重要事項説明書の電磁的方法による提供については、重要事項説明を受ける者から電磁的方法でよいと口頭で依頼があった場合、改めて電磁的方法で提供することについて承諾を得る必要はない。"], "page": 19}, {"stem": "宅地建物取引業者Ａ（消費税課税事業者）は貸主Ｂから建物の貸借の媒介の依頼を受け、宅地建物取引業者Ｃ（消費税課税事業者）は借主Ｄから建物の貸借の媒介の依頼を受け、ＢとＤとの間で、 1 か月分の借賃を 12 万円（消費税等相当額を含まない。）とする賃貸借契約（以下この問において「本件契約」という。）を成立させた場合における次の記述のうち、宅地建物取引業法の規定に違反するものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 19, "items": [{"m": "ア", "t": "本件契約が建物を住居として貸借する契約である場合に、Ｃは、媒介の依頼を受けるに当たってＤから承諾を得ないまま、132,000 円の報酬を受領した。"}, {"m": "イ", "t": "ＡはＢから事前に特別な広告の依頼があったので、依頼に基づく大手新聞掲載広告料金に相当する額をＢに請求し、受領した。"}, {"m": "ウ", "t": "ＣはＤに対し、賃貸借契約書の作成費を、Ｄから限度額まで受領した媒介報酬の他に請求して受領した。"}, {"m": "エ", "t": "本件契約が建物を事務所として貸借する契約である場合に、報酬として、ＡはＢから132,000 円を、ＣはＤから 132,000 円をそれぞれ受領した。"}]}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではない買主Ｂから宅地の買受けの申込みを受けた場合における宅地建物取引業法第 37 条の 2 の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、正しいものはどれか。", "ch": ["Ａは、仮設テント張りの案内所でＢから買受けの申込みを受けた際、以後の取引について、その取引に係る書類に関してＢから電磁的方法で提供をすることについての承諾を得た場合、クーリング・オフについて電磁的方法で告げることができる。", "Ａが、仮設テント張りの案内所でＢから買受けの申込みを受けた場合、Ｂは、クーリング・オフについて告げられた日から 8 日以内に電磁的方法により当該申込みの撤回を申し出れば、申込みの撤回を行うことができる。", "Ａが、Ａの事務所でＢから買受けの申込みを受けた場合、Ｂは、申込みの日から 8 日以内に電磁的方法により当該申込みの撤回を申し出れば、申込みの撤回を行うことができる。", "Ａが、売却の媒介を依頼している宅地建物取引業者Ｃの事務所でＢから買受けの申込みを受けた場合、Ｂは、申込みの日から 8 日以内に書面により当該申込みの撤回を申し出ても、申込みの撤回を行うことができない。"], "page": 20}, {"stem": "次の記述のうち、宅地建物取引業者Ａが行う業務に関して宅地建物取引業法の規定に違反するものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 20, "items": [{"m": "ア", "t": "建物の貸借の媒介に際して、賃借の申込みをした者がその撤回を申し出たので、Ａはかかった諸費用を差し引いて預り金を返還した。"}, {"m": "イ", "t": "Ａは、売主としてマンションの売買契約を締結するに際して、買主が手付として必要な額を今すぐには用意できないと申し出たので、手付金の分割払いを買主に提案した。"}, {"m": "ウ", "t": "Ａは取引のあったつど、その年月日やその取引に係る宅地又は建物の所在及び面積その他必要な記載事項を帳簿に漏らさず記載し、必要に応じて紙面にその内容を表示できる状態で、電子媒体により帳簿の保存を行っている。"}, {"m": "エ", "t": "Ａはアンケート調査を装ってその目的がマンションの売買の勧誘であることを告げずに個人宅を訪問し、マンションの売買の勧誘をした。"}]}, {"stem": "次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者は、非常勤役員には従業者であることを証する証明書を携帯させる必要はない。", "宅地建物取引業者は、その事務所ごとに従業者名簿を備えなければならないが、取引の関係者から閲覧の請求があった場合であっても、宅地建物取引業法第 45 条に規定する秘密を守る義務を理由に、閲覧を拒むことができる。", "宅地建物取引業者の従業者は、宅地の買受けの申込みをした者から請求があった場合には、その者が宅地建物取引業者であっても、その者に従業者であることを証する証明書を提示する必要がある。", "宅地建物取引業者は、従業者名簿を最終の記載をした日から 5 年間保存しなければならない。"], "page": 21}, {"stem": "次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 21, "items": [{"m": "ア", "t": "宅地建物取引業者Ａが、自ら所有する複数の建物について、複数人に対し、反復継続して賃貸する行為は、宅地建物取引業に該当しない。"}, {"m": "イ", "t": "宅地建物取引士とは、宅地建物取引士資格試験に合格し、都道府県知事の登録を受けた者をいう。"}, {"m": "ウ", "t": "建設業者Ｂが、建築請負工事の受注を目的として、業として宅地の売買の媒介を行う行為は、宅地建物取引業に該当しない。"}, {"m": "エ", "t": "宅地建物取引士は、宅地又は建物の取引に係る事務に必要な知識及び能力の維持向上に努めなければならない。"}]}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではない個人Ｂとの間で宅地の売買契約を締結する場合における手付金の保全措置に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、当該契約に係る手付金は保全措置が必要なものとする。", "ch": ["Ａは、Ｂから手付金を受領した後に、速やかに手付金の保全措置を講じなければならない。", "Ａは、手付金の保全措置を保証保険契約を締結することにより講ずる場合、保険期間は保証保険契約が成立した時から宅地建物取引業者が受領した手付金に係る宅地の引渡しまでの期間とすればよい。", "Ａは、手付金の保全措置を保証保険契約を締結することにより講ずる場合、保険事業者との間において保証保険契約を締結すればよく、保険証券をＢに交付する必要はない。", "Ａは、手付金の保全措置を保証委託契約を締結することにより講ずるときは、保証委託契約に基づいて銀行等が手付金の返還債務を連帯して保証することを約する書面のＢへの交付に代えて、Ｂの承諾を得ることなく電磁的方法により講ずることができる。"], "page": 22}, {"stem": "宅地建物取引業者Ａが、ＢからＢ所有の中古住宅の売却の依頼を受け、専任媒介契約（専属専任媒介契約ではないものとする。）を締結した場合に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["Ａは、当該中古住宅について購入の申込みがあったときは、遅滞なく、その旨をＢに報告しなければならないが、Ｂの希望条件を満たさない申込みだとＡが判断した場合については報告する必要はない。", "Ａは、法第 34 条の 2 第 1 項の規定に基づく書面の交付後、速やかに、Ｂに対し、法第 34条の 2 第 1 項第 4 号に規定する建物状況調査を実施する者のあっせんの有無について確認しなければならない。", "Ａは、当該中古住宅について法で規定されている事項を、契約締結の日から休業日数を含め 7 日以内に指定流通機構へ登録する義務がある。", "Ａは、Ｂが他の宅地建物取引業者の媒介又は代理によって売買の契約を成立させたときの措置を法第 34 条の2第1 項の規定に基づく書面に記載しなければならない。"], "page": 22}, {"stem": "次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["甲県知事は、宅地建物取引士に対して必要な報告を求めることができるが、その対象は、甲県知事登録の宅地建物取引士であって、適正な事務の遂行を確保するために必要な場合に限られる。", "宅地建物取引業者Ａ（甲県知事免許）で専任の宅地建物取引士として従事しているＢ（甲県知事登録）が、勤務実態のない宅地建物取引業者Ｃ（乙県知事免許）において、自らが専任の宅地建物取引士である旨の表示がされていることを許した場合には、乙県知事は、Ｂに対し、必要な指示をすることができる。", "宅地建物取引士が不正の手段により宅地建物取引士証の交付を受けた場合においては、その登録をしている都道府県知事は、情状が特に重いときは、当該宅地建物取引士の登録を消除することができる。", "都道府県知事は、宅地建物取引士に対して登録消除処分を行ったときは、適切な方法で公告しなければならない。"], "page": 23}, {"stem": "宅地建物取引業法第 35 条に規定する重要事項の説明に関する次の記述のうち、誤っているものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "page": 23, "items": [{"m": "ア", "t": "宅地建物取引士は、重要事項説明をする場合、取引の相手方から請求されなければ、宅地建物取引士証を相手方に提示する必要はない。"}, {"m": "イ", "t": "売主及び買主が宅地建物取引業者ではない場合、当該取引の媒介業者は、売主及び買主に重要事項説明書を交付し、説明を行わなければならない。"}, {"m": "ウ", "t": "宅地の売買について売主となる宅地建物取引業者は、買主が宅地建物取引業者である場合、重要事項説明書を交付しなければならないが、説明を省略することはできる。"}, {"m": "エ", "t": "宅地建物取引業者である売主は、宅地建物取引業者ではない買主に対して、重要事項として代金並びにその支払時期及び方法を説明しなければならない。"}]}, {"stem": "宅地建物取引業者Ａが媒介により宅地の売買契約を成立させた場合における宅地建物取引業法第 37 条の規定により交付すべき書面（以下この問において「37 条書面」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["Ａは、買主が宅地建物取引業者であるときは、37 条書面に移転登記の申請時期を記載しなくてもよい。", "Ａは、37 条書面を売買契約成立前に、各当事者に交付しなければならない。", "Ａは、37 条書面を作成したときは、専任の宅地建物取引士をして 37 条書面に記名させる必要がある。", "Ａは、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を 37条書面に記載しなければならない。"], "page": 24}, {"stem": "宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["保証協会の社員は、自らが取り扱った宅地建物取引業に係る取引の相手方から当該取引に関する苦情について解決の申出が保証協会にあり、保証協会から関係する資料の提出を求められたときは、正当な理由がある場合でなければ、これを拒んではならない。", "保証協会は、社員がその一部の事務所を廃止したことに伴って弁済業務保証金分担金を当該社員に返還しようとするときは、弁済業務保証金の還付請求権者に対し、一定期間内に認証を受けるため申し出るべき旨の公告を行わなければならない。", "保証協会は、宅地建物取引業者の相手方から、社員である宅地建物取引業者の取り扱った宅地建物取引業に係る取引に関する損害の還付請求を受けたときは、直ちに弁済業務保証金から返還しなければならない。", "保証協会は、手付金等保管事業について国土交通大臣の承認を受けた場合、社員が自ら売主となって行う宅地又は建物の売買で、宅地の造成又は建築に関する工事の完了前における買主からの手付金等の受領について、当該事業の対象とすることができる。"], "page": 24}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではない買主Ｂに新築住宅を販売する場合に関する次の記述のうち、特定住宅瑕疵担保責任の履行の確保等に関する法律の規定によれば、正しいものはどれか。", "ch": ["Ａが信託会社又は金融機関の信託業務の兼営等に関する法律第 1 条第 1 項の認可を受けた金融機関であって、宅地建物取引業を営むものである場合、住宅販売瑕か疵し担保保証金の供託又は住宅販売瑕か疵し担保責任保険契約の締結を行う義務を負わない。", "Ａは、住宅販売瑕か疵し担保保証金の供託をする場合、当該住宅の売買契約を締結するまでに、Ｂに対し供託所の所在地等について、必ず書面を交付して説明しなければならず、買主の承諾を得ても書面の交付に代えて電磁的方法により提供することはできない。", "Ａは、住宅販売瑕か疵し担保保証金の供託をする場合、当該住宅の最寄りの供託所へ住宅販売瑕か疵し担保保証金の供託をしなければならない。", "ＡＢ間の売買契約において、当該住宅の構造耐力上主要な部分に瑕か疵しがあってもＡが瑕か疵し担保責任を負わない旨の特約があった場合においても、Ａは住宅販売瑕か疵し担保保証金の供託又は住宅販売瑕か疵し担保責任保険契約の締結を行う義務を負う。"], "page": 25}, {"stem": "独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["機構は、子どもを育成する家庭又は高齢者の家庭（単身の世帯を含む。）に適した良好な居住性能及び居住環境を有する賃貸住宅の建設に必要な資金の貸付けを業務として行っている。", "機構は、証券化支援事業（買取型）において、新築住宅に対する貸付債権のみを買取りの対象としている。", "機構は、証券化支援事業（買取型）において、ＺＥＨ（ネット・ゼロ・エネルギーハウス）及び省エネルギー性、耐震性、バリアフリー性、耐久性・可変性に優れた住宅を取得する場合に、貸付金の利率を一定期間引き下げる制度を実施している。", "機構は、マンション管理組合や区分所有者に対するマンション共用部分の改良に必要な資金の貸付けを業務として行っている。"], "page": 26}, {"stem": "宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。", "ch": ["実際には取引する意思がない物件であっても実在するものであれば、当該物件を広告に掲載しても不当表示に問われることはない。", "直線距離で 50 m 以内に街道が存在する場合、物件名に当該街道の名称を用いることができる。", "物件の近隣に所在するスーパーマーケットを表示する場合は、物件からの自転車による所要時間を明示しておくことで、徒歩による所要時間を明示する必要がなくなる。", "一棟リノベーションマンションについては、一般消費者に対し、初めて購入の申込みの勧誘を行う場合であっても、「新発売」との表示を行うことはできない。"], "page": 26}, {"stem": "次の記述のうち、誤っているものはどれか。", "ch": ["令和 3 年度宅地建物取引業法の施行状況調査（令和4年9 月公表）によれば、令和4年3月末における宅地建物取引業者の全事業者数は 14 万業者を超え、 8 年連続で増加した。", "令和 5 年地価公示（令和5年3 月公表）によれば、令和4年1 月以降の 1 年間の地価について、地方圏平均では、全用途平均、住宅地、商業地のいずれも 2 年連続で上昇し、工業地は 6 年連続で上昇した。", "建築着工統計調査報告（令和 4 年計。令和5年1 月公表）によれば、令和 4 年の民間非居住建築物の着工床面積は、前年と比較すると、工場及び倉庫は増加したが、事務所及び店舗が減少したため、全体で減少となった。", "年次別法人企業統計調査（令和 3 年度。令和4年9 月公表）によれば、令和 3 年度における不動産業の売上高営業利益率は 11.1 ％ と 2 年連続で前年度と比べ上昇し、売上高経常利益率も 12.5 ％ と 2 年連続で前年度と比べ上昇した。"], "page": 27}, {"stem": "土地に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["自然堤防の後背湿地側の縁は、砂が緩く堆積していて、地下水位も浅いため、地震時に液状化被害が生じやすい地盤である。", "谷底低地に軟弱層が厚く堆積している所では、地震動が凝縮されて、震動が小さくなる。", "1923 年の関東地震の際には、東京の谷底低地で多くの水道管や建物が被害を受けた。", "大都市の近郊の丘陵地では、丘を削り谷部に盛土し造成宅地が造られたが、盛土造成に際しては、地下水位を下げるため排水施設を設け、締め固める等の必要がある。"], "page": 27}, {"stem": "建物の構造と材料に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["鉄筋コンクリート構造は、地震や風の力を受けても、躯く体の変形は比較的小さく、耐火性にも富んでいる。", "鉄筋コンクリート構造は、躯く体の断面が大きく、材料の質量が大きいので、建物の自重が大きくなる。", "鉄筋コンクリート構造では、鉄筋とコンクリートを一体化するには、断面が円形の棒鋼である丸鋼の方が表面に突起をつけた棒鋼である異形棒鋼より、優れている。", "鉄筋コンクリート構造は、コンクリートが固まって所定の強度が得られるまでに日数がかかり、現場での施工も多いので、工事期間が長くなる。受　験　番　号―受 験 者 氏 名令和 5 年度問題"], "page": 27}]},

   ans:[[3], [3], [4], [1], [2], [3], [4], [3], [1], [2], [3], [1], [1], [2], [3], [2], [3], [3], [4], [1], [4], [3], [3], [2], [2], [2], [1], [1], [3], [3], [1], [1], [2], [4], [4], [1], [2], [4], [4], [2], [2], [2], [2], [4], [3], [1], [4], [1, 2, 3, 4], [2], [4]],
   qs:[{"stem": "次の1から4までの記述のうち、民法の規定、判例及び下記判決文によれば、正しいものはどれか。\n\n（判決文）\n所有者甲から乙が不動産を買い受け、その登記が未了の間に、丙が当該不動産を甲から二重に買い受け、更に丙から転得者丁が買い受けて登記を完了した場合に、たとい丙が背信的悪意者に当たるとしても、丁は、乙に対する関係で丁自身が背信的悪意者と評価されるのでない限り、当該不動産の所有権取得をもって乙に対抗することができるものと解するのが相当である。", "ch": ["所有者ＡからＢが不動産を買い受け、その登記が未了の間に、Ｃが当該不動産をＡから二重に買い受けて登記を完了した場合、Ｃは、自らが背信的悪意者に該当するときであっても、当該不動産の所有権取得をもってＢに対抗することができる。", "所有者ＡからＢが不動産を買い受け、その登記が未了の間に、背信的悪意者ではないＣが当該不動産をＡから二重に買い受けた場合、先に買い受けたＢは登記が未了であっても当該不動産の所有権取得をもってＣに対抗することができる。", "所有者ＡからＢが不動産を買い受け、その登記が未了の間に、背信的悪意者であるＣが当該不動産をＡから二重に買い受け、更にＣから転得者Ｄが買い受けて登記を完了した場合、ＤもＢに対する関係で背信的悪意者に該当するときには、Ｄは当該不動産の所有権取得をもってＢに対抗することができない。", "所有者ＡからＢが不動産を買い受け、その登記が未了の間に、Ｃが当該不動産をＡから二重に買い受け登記を完了した場合、Ｃが背信的悪意者に該当しなくてもＢが登記未了であることにつき悪意であるときには、Ｃは当該不動産の所有権取得をもってＢに対抗することができない。"], "page": 3, "img": ["q01_0.jpg"]}, {"stem": "相続に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。", "ch": ["被相続人の生前においては、相続人は、家庭裁判所の許可を受けることにより、遺留分を放棄することができる。", "家庭裁判所への相続放棄の申述は、被相続人の生前には行うことができない。", "相続人が遺留分の放棄について家庭裁判所の許可を受けると、当該相続人は、被相続人の遺産を相続する権利を失う。", "相続人が被相続人の兄弟姉妹である場合、当該相続人には遺留分がない。"], "page": 3, "img": ["q02_0.jpg"]}, {"stem": "制限行為能力者に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["成年後見人は、後見監督人がいる場合には、後見監督人の同意を得なければ、成年被後見人の法律行為を取り消すことができない。", "相続の放棄は相手方のない単独行為であるから、成年後見人が成年被後見人に代わってこれを行っても、利益相反行為となることはない。", "成年後見人は成年被後見人の法定代理人である一方、保佐人は被保佐人の行為に対する同意権と取消権を有するが、代理権が付与されることはない。", "令和4年4月1日からは、成年年齢が18歳となったため、18歳の者は、年齢を理由とする後見人の欠格事由に該当しない。"], "page": 4, "img": ["q03_0.jpg"]}, {"stem": "Ａ所有の甲土地にＢのＣに対する債務を担保するためにＣの抵当権（以下この問において「本件抵当権」という。）が設定され、その旨の登記がなされた場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["Ａから甲土地を買い受けたＤが、Ｃの請求に応じてその代価を弁済したときは、本件抵当権はＤのために消滅する。", "Ｃに対抗することができない賃貸借により甲土地を競売手続の開始前から使用するＥは、甲土地の競売における買受人Ｆの買受けの時から6か月を経過するまでは、甲土地をＦに引き渡すことを要しない。", "本件抵当権設定登記後に、甲土地上に乙建物が築造された場合、Ｃが本件抵当権の実行として競売を申し立てるときには、甲土地とともに乙建物の競売も申し立てなければならない。", "ＢがＡから甲土地を買い受けた場合、Ｂは抵当不動産の第三取得者として、本件抵当権について、Ｃに対して抵当権消滅請求をすることができる。"], "page": 4, "img": ["q04_0.jpg"]}, {"stem": "期間の計算に関する次の記述のうち、民法の規定によれば、正しいものはどれか。なお、明記された日付は、日曜日、国民の祝日に関する法律に規定する休日その他の休日には当たらないものとする。", "ch": ["令和4年10月17日午前10時に、引渡日を契約締結日から1年後とする不動産の売買契約を締結した場合、令和5年10月16日が引渡日である。", "令和4年8月31日午前10時に、弁済期限を契約締結日から1か月後とする金銭消費貸借契約を締結した場合、令和4年9月30日の終了をもって弁済期限となる。", "期間の末日が日曜日、国民の祝日に関する法律に規定する休日その他の休日に当たるときは、その日に取引をしない慣習がある場合に限り、期間はその前日に満了する。", "令和4年5月30日午前10時に、代金の支払期限を契約締結日から1か月後とする動産の売買契約を締結した場合、令和4年7月1日の終了をもって支払期限となる。"], "page": 5, "img": ["q05_0.jpg"]}, {"stem": "Ａを貸主、Ｂを借主として、Ａ所有の甲土地につき、資材置場とする目的で期間を2年として、ＡＢ間で、①賃貸借契約を締結した場合と、②使用貸借契約を締結した場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["Ａは、甲土地をＢに引き渡す前であれば、①では口頭での契約の場合に限り自由に解除できるのに対し、②では書面で契約を締結している場合も自由に解除できる。", "Ｂは、①ではＡの承諾がなければ甲土地を適法に転貸することはできないが、②ではＡの承諾がなくても甲土地を適法に転貸することができる。", "Ｂは、①では期間内に解約する権利を留保しているときには期間内に解約の申入れをし解約することができ、②では期間内に解除する権利を留保していなくてもいつでも解除することができる。", "甲土地について契約の本旨に反するＢの使用によって生じた損害がある場合に、Ａが損害賠償を請求するときは、①では甲土地の返還を受けた時から5年以内に請求しなければならないのに対し、②では甲土地の返還を受けた時から1年以内に請求しなければならない。"], "page": 5, "img": ["q06_0.jpg"]}, {"stem": "不在者Ａが、家庭裁判所から失踪宣告を受けた。Ａを単独相続したＢは相続財産である甲土地をＣに売却（以下この問において「本件売買契約」という。）して登記も移転したが、その後、生存していたＡの請求によって当該失踪宣告が取り消された。本件売買契約当時に、Ａの生存について、（ア）Ｂが善意でＣが善意、（イ）Ｂが悪意でＣが善意、（ウ）Ｂが善意でＣが悪意、（エ）Ｂが悪意でＣが悪意、の4つの場合があり得るが、これらのうち、民法の規定及び判例によれば、Ｃが本件売買契約に基づき取得した甲土地の所有権をＡに対抗できる場合を全て掲げたものとして正しいものはどれか。", "ch": ["（ア）、（イ）、（ウ）", "（ア）、（イ）", "（ア）、（ウ）", "（ア）"], "page": 6, "img": ["q07_0.jpg"]}, {"stem": "ＡがＢ所有の甲土地を建物所有目的でなく利用するための権原が、①地上権である場合と②賃借権である場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、ＡもＢも対抗要件を備えているものとする。", "ch": ["①でも②でも、特約がなくても、ＢはＡに対して、甲土地の使用及び収益に必要な修繕をする義務を負う。", "ＣがＢに無断でＡから当該権原を譲り受け、甲土地を使用しているときは、①でも②でも、ＢはＣに対して、甲土地の明渡しを請求することができる。", "①では、Ａは当該権原を目的とする抵当権を設定することができるが、②では、Ａは当該権原を目的とする抵当権を設定することはできない。", "Ｄが甲土地を不法占拠してＡの土地利用を妨害している場合、①では、Ａは当該権原に基づく妨害排除請求権を行使してＤの妨害の排除を求めることができるが、②では、ＡはＤの妨害の排除を求めることはできない。"], "page": 6, "img": ["q08_0.jpg"]}, {"stem": "辞任に関する次の記述のうち、民法の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "委任によって代理権を授与された者は、報酬を受ける約束をしている場合であっても、いつでも委任契約を解除して代理権を消滅させて、代理人を辞することができる。"}, {"m": "イ", "t": "親権者は、やむを得ない事由があるときは、法務局に届出を行うことによって、親権を辞することができる。"}, {"m": "ウ", "t": "後見人は、正当な事由があるときは、後見監督人の許可を得て、その任務を辞することができる。"}, {"m": "エ", "t": "遺言執行者は、正当な事由があるときは、相続人の許可を得て、その任務を辞することができる。"}], "page": 7, "img": ["q09_0.jpg"]}, {"stem": "ＡはＢに対し、自己所有の甲土地を売却し、代金と引換えにＢに甲土地を引き渡したが、その後にＣに対しても甲土地を売却し、代金と引換えにＣに甲土地の所有権登記を移転した。この場合におけるＢによる甲土地の所有権の時効取得に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["Ｂが甲土地をＤに賃貸し、引き渡したときは、Ｂは甲土地の占有を失うので、甲土地の所有権を時効取得することはできない。", "Ｂが、時効の完成前に甲土地の占有をＥに奪われたとしても、Ｅに対して占有回収の訴えを提起して占有を回復した場合には、Ｅに占有を奪われていた期間も時効期間に算入される。", "Ｂが、甲土地の引渡しを受けた時点で所有の意思を有していたとしても、ＡＣ間の売買及びＣに対する登記の移転を知ったときは、その時点で所有の意思が認められなくなるので、Ｂは甲土地を時効により取得することはできない。", "Ｂが甲土地の所有権を時効取得した場合、Ｂは登記を備えなければ、その所有権を時効完成時において所有者であったＣに対抗することはできない。"], "page": 7, "img": ["q10_0.jpg"]}, {"stem": "建物の所有を目的とする土地の賃貸借契約（定期借地権及び一時使用目的の借地権となる契約を除く。）に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。", "ch": ["借地権の存続期間が満了する前に建物の滅失があった場合において、借地権者が借地権の残存期間を超えて存続すべき建物を築造したときは、その建物を築造することにつき借地権設定者の承諾がない場合でも、借地権の期間の延長の効果が生ずる。", "転借地権が設定されている場合において、転借地上の建物が滅失したときは、転借地権は消滅し、転借地権者（転借人）は建物を再築することができない。", "借地上の建物が滅失し、借地権設定者の承諾を得て借地権者が新たに建物を築造するに当たり、借地権設定者が存続期間満了の際における借地の返還確保の目的で、残存期間を超えて存続する建物を築造しない旨の特約を借地権者と結んだとしても、この特約は無効である。", "借地上の建物所有者が借地権設定者に建物買取請求権を適法に行使した場合、買取代金の支払があるまでは建物の引渡しを拒み得るとともに、これに基づく敷地の占有についても、賃料相当額を支払う必要はない。"], "page": 8, "img": ["q11_0.jpg"]}, {"stem": "Ａは、Ｂ所有の甲建物（床面積100㎡）につき、居住を目的として、期間2年、賃料月額10万円と定めた賃貸借契約（以下この問において「本件契約」という。）をＢと締結してその日に引渡しを受けた。この場合における次の記述のうち、民法及び借地借家法の規定並びに判例によれば、誤っているものはどれか。", "ch": ["ＢはＡに対して、本件契約締結前に、契約の更新がなく、期間の満了により賃貸借が終了する旨を記載した賃貸借契約書を交付して説明すれば、本件契約を借地借家法第38条に規定する定期建物賃貸借契約として締結することができる。", "本件契約が借地借家法第38条に規定する定期建物賃貸借契約であるか否かにかかわらず、Ａは、甲建物の引渡しを受けてから1年後に甲建物をＢから購入したＣに対して、賃借人であることを主張できる。", "本件契約が借地借家法第38条に規定する定期建物賃貸借契約である場合、Ａの中途解約を禁止する特約があっても、やむを得ない事情によって甲建物を自己の生活の本拠として使用することが困難になったときは、Ａは本件契約の解約の申入れをすることができる。", "ＡがＢに対して敷金を差し入れている場合、本件契約が期間満了で終了するに当たり、Ｂは甲建物の返還を受けるまでは、Ａに対して敷金を返還する必要はない。"], "page": 8, "img": ["q12_0.jpg"]}, {"stem": "建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["管理者は、規約により、その職務に関し、区分所有者のために、原告又は被告となったときは、その旨を各区分所有者に通知しなくてよい。", "管理者がないときは、区分所有者の5分の1以上で議決権の5分の1以上を有するものは、集会を招集することができる。ただし、この定数は、規約で減ずることができる。", "集会において、管理者の選任を行う場合、規約に別段の定めがない限り、区分所有者及び議決権の各過半数で決する。", "管理組合（法第3条に規定する区分所有者の団体をいう。）は、区分所有者及び議決権の各4分の3以上の多数による集会の決議で法人となる旨並びにその名称及び事務所を定め、かつ、その主たる事務所の所在地において登記をすることによって法人となる。"], "page": 9, "img": ["q13_0.jpg"]}, {"stem": "不動産の登記に関する次の記述のうち、誤っているものはどれか。", "ch": ["所有権の移転の登記の申請をする場合には、申請人は、法令に別段の定めがある場合を除き、その申請情報と併せて登記原因を証する情報を提供しなければならない。", "所有権の移転の登記の申請をする場合において、当該申請を登記の申請の代理を業とすることができる代理人によってするときは、登記識別情報を提供することができないことにつき正当な理由があるとみなされるため、登記義務者の登記識別情報を提供することを要しない。", "所有権の移転の登記の申請をする場合において、登記権利者が登記識別情報の通知を希望しない旨の申出をしたときは、当該登記に係る登記識別情報は通知されない。", "所有権の移転の登記の申請をする場合において、その登記が完了した際に交付される登記完了証を送付の方法により交付することを求めるときは、その旨及び送付先の住所を申請情報の内容としなければならない。"], "page": 9, "img": ["q14_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、誤っているものはどれか。", "ch": ["市街化区域については、都市計画に、少なくとも用途地域を定めるものとされている。", "準都市計画区域については、都市計画に、特別用途地区を定めることができる。", "高度地区については、都市計画に、建築物の容積率の最高限度又は最低限度を定めるものとされている。", "工業地域は、主として工業の利便を増進するため定める地域とされている。"], "page": 9, "img": ["q15_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["市街化区域内において、市街地再開発事業の施行として行う1haの開発行為を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。", "区域区分が定められていない都市計画区域内において、博物館法に規定する博物館の建築を目的とした8,000㎡の開発行為を行おうとする者は、都道府県知事の許可を受けなくてよい。", "自己の業務の用に供する施設の建築の用に供する目的で行う開発行為にあっては、開発区域内に土砂災害警戒区域等における土砂災害防止対策の推進に関する法律に規定する土砂災害警戒区域内の土地を含んではならない。", "市街化調整区域内における開発行為について、当該開発行為が開発区域の周辺における市街化を促進するおそれがあるかどうかにかかわらず、都道府県知事は、開発審査会の議を経て開発許可をすることができる。"], "page": 10, "img": ["q16_0.jpg"]}, {"stem": "建築基準法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["法の改正により、現に存する建築物が改正後の法の規定に適合しなくなった場合には、当該建築物は違反建築物となり、速やかに改正後の法の規定に適合させなければならない。", "延べ面積が500㎡を超える建築物について、大規模な修繕をしようとする場合、都市計画区域外であれば建築確認を受ける必要はない。", "地方公共団体は、条例で、建築物の敷地、構造又は建築設備に関して安全上、防火上又は衛生上必要な制限を附加することができる。", "地方公共団体が、条例で、津波、高潮、出水等による危険の著しい区域を災害危険区域として指定した場合には、災害危険区域内における住居の用に供する建築物の建築は一律に禁止されることとなる。"], "page": 10, "img": ["q17_0.jpg"]}, {"stem": "次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["第一種低層住居専用地域内においては、神社、寺院、教会を建築することはできない。", "その敷地内に一定の空地を有し、かつ、その敷地面積が一定規模以上である建築物で、特定行政庁が交通上、安全上、防火上及び衛生上支障がなく、かつ、その建蔽率、容積率及び各部分の高さについて総合的な配慮がなされていることにより市街地の環境の整備改善に資すると認めて許可したものの建蔽率、容積率又は各部分の高さは、その許可の範囲内において、関係規定による限度を超えるものとすることができる。", "法第3章の規定が適用されるに至った際、現に建築物が立ち並んでいる幅員1.8m未満の道で、あらかじめ、建築審査会の同意を得て特定行政庁が指定したものは、同章の規定における道路とみなされる。", "第一種住居地域内においては、建築物の高さは、10m又は12mのうち当該地域に関する都市計画において定められた建築物の高さの限度を超えてはならない。"], "page": 11, "img": ["q18_0.jpg"]}, {"stem": "宅地造成等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["宅地造成工事規制区域内において、雨水その他の地表水又は地下水を排除するための排水施設の除却工事を行おうとする場合は、一定の場合を除き、都道府県知事への届出が必要となる。", "宅地造成工事規制区域内において、森林を宅地にするために行う切土であって、高さ3mの崖を生ずることとなるものに関する工事については、造成主は、都市計画法第29条第1項又は第2項の許可を受けて行われる当該許可の内容に適合した工事を除き、工事に着手する前に、都道府県知事の許可を受けなければならない。", "宅地造成工事規制区域内で過去に宅地造成に関する工事が行われ、現在は造成主とは異なる者がその工事が行われた宅地を所有している場合において、当該宅地の所有者は宅地造成に伴う災害が生じないよう、その宅地を常時安全な状態に維持するよう努めなければならない。", "宅地造成工事規制区域外に盛土によって造成された一団の造成宅地の区域において、造成された盛土の高さが5m未満の場合は、都道府県知事は、当該区域を造成宅地防災区域として指定することができない。"], "page": 11, "img": ["q19_0.jpg"]}, {"stem": "次の記述のうち、土地区画整理法の規定及び判例によれば、誤っているものはどれか。", "ch": ["土地区画整理組合の設立の認可の公告があった日以後、換地処分の公告がある日までは、施行地区内において、土地区画整理事業の施行の障害となるおそれがある建築物の新築を行おうとする者は、土地区画整理組合の許可を受けなければならない。", "土地区画整理組合は、定款に別段の定めがある場合においては、換地計画に係る区域の全部について工事が完了する以前においても換地処分をすることができる。", "仮換地を指定したことにより、使用し、又は収益することができる者のなくなった従前の宅地については、当該宅地を使用し、又は収益することができる者のなくなった時から換地処分の公告がある日までは、施行者が当該宅地を管理する。", "清算金の徴収又は交付に関する権利義務は、換地処分の公告によって換地についての所有権が確定することと併せて、施行者と換地処分時点の換地所有者との間に確定的に発生するものであり、換地処分後に行われた当該換地の所有権の移転に伴い当然に移転する性質を有するものではない。"], "page": 12, "img": ["q20_0.jpg"]}, {"stem": "農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["農地の賃貸借及び使用貸借は、その登記がなくても農地の引渡しがあったときは、これをもってその後にその農地について所有権を取得した第三者に対抗することができる。", "法第2条第3項の農地所有適格法人の要件を満たしていない株式会社は、耕作目的で農地を借り入れることはできない。", "法第4条第1項、第5条第1項の違反について原状回復等の措置に係る命令の対象となる者（違反転用者等）には、当該規定に違反した者又はその一般承継人は含まれるが、当該違反に係る土地について工事を請け負った者は含まれない。", "法の適用については、土地の面積は、登記簿の地積によることとしているが、登記簿の地積が著しく事実と相違する場合及び登記簿の地積がない場合には、実測に基づき農業委員会が認定したところによる。"], "page": 12, "img": ["q21_0.jpg"]}, {"stem": "国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。", "ch": ["都市計画区域外において、Ａ市が所有する面積15,000㎡の土地を宅地建物取引業者Ｂが購入した場合、Ｂは事後届出を行わなければならない。", "事後届出において、土地売買等の契約に係る土地の土地に関する権利の移転又は設定の対価の額については届出事項ではない。", "市街化区域を除く都市計画区域内において、一団の土地である甲土地（Ｃ所有、面積3,500㎡）と乙土地（Ｄ所有、面積2,500㎡）を宅地建物取引業者Ｅが購入した場合、Ｅは事後届出を行わなければならない。", "都道府県知事は、土地利用審査会の意見を聴いて、事後届出をした者に対し、当該事後届出に係る土地の利用目的について必要な変更をすべきことを勧告することができ、勧告を受けた者がその勧告に従わない場合、その勧告に反する土地売買等の契約を取り消すことができる。"], "page": 13, "img": ["q22_0.jpg"]}, {"stem": "印紙税に関する次の記述のうち、正しいものはどれか。なお、以下の覚書又は契約書はいずれも書面により作成されたものとする。", "ch": ["土地を8,000万円で譲渡することを証した覚書を売主Ａと買主Ｂが作成した場合、本契約書を後日作成することを文書上で明らかにしていれば、当該覚書には印紙税が課されない。", "一の契約書に甲土地の譲渡契約（譲渡金額6,000万円）と、乙建物の譲渡契約（譲渡金額3,000万円）をそれぞれ区分して記載した場合、印紙税の課税標準となる当該契約書の記載金額は、6,000万円である。", "当初作成した土地の賃貸借契約書において「契約期間は5年とする」旨の記載がされていた契約期間を変更するために、「契約期間は10年とする」旨を記載した覚書を貸主Ｃと借主Ｄが作成した場合、当該覚書には印紙税が課されない。", "駐車場経営者Ｅと車両所有者Ｆが、Ｆの所有する車両を駐車場としての設備のある土地の特定の区画に駐車させる旨の賃貸借契約書を作成した場合、土地の賃借権の設定に関する契約書として印紙税が課される。"], "page": 13, "img": ["q23_0.jpg"]}, {"stem": "固定資産税に関する次の記述のうち、正しいものはどれか。", "ch": ["固定資産税の徴収については、特別徴収の方法によらなければならない。", "土地価格等縦覧帳簿及び家屋価格等縦覧帳簿の縦覧期間は、毎年4月1日から、4月20日又は当該年度の最初の納期限の日のいずれか遅い日以後の日までの間である。", "固定資産税の賦課期日は、市町村の条例で定めることとされている。", "固定資産税は、固定資産の所有者に課するのが原則であるが、固定資産が賃借されている場合は、当該固定資産の賃借権者に対して課される。"], "page": 14, "img": ["q24_0.jpg"]}, {"stem": "地価公示法に関する次の記述のうち、誤っているものはどれか。", "ch": ["土地鑑定委員会は、標準地の正常な価格を判定したときは、標準地の単位面積当たりの価格のほか、当該標準地の地積及び形状についても官報で公示しなければならない。", "正常な価格とは、土地について、自由な取引が行われるとした場合におけるその取引（一定の場合を除く。）において通常成立すると認められる価格をいい、当該土地に建物がある場合には、当該建物が存するものとして通常成立すると認められる価格をいう。", "公示区域内の土地について鑑定評価を行う場合において、当該土地の正常な価格を求めるときは、公示価格を規準とする必要があり、その際には、当該土地とこれに類似する利用価値を有すると認められる1又は2以上の標準地との位置、地積、環境等の土地の客観的価値に作用する諸要因についての比較を行い、その結果に基づき、当該標準地の公示価格と当該土地の価格との間に均衡を保たせる必要がある。", "公示区域とは、都市計画法第4条第2項に規定する都市計画区域その他の土地取引が相当程度見込まれるものとして国土交通省令で定める区域のうち、国土利用計画法第12条第1項の規定により指定された規制区域を除いた区域をいう。"], "page": 14, "img": ["q25_0.jpg"]}, {"stem": "宅地建物取引業法第3条第1項に規定する事務所（以下この問において「事務所」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["事務所とは、契約締結権限を有する者を置き、継続的に業務を行うことができる施設を有する場所を指すものであるが、商業登記簿に登載されていない営業所又は支店は事務所には該当しない。", "宅地建物取引業を営まず他の兼業業務のみを営んでいる支店は、事務所には該当しない。", "宅地建物取引業者は、主たる事務所については、免許証、標識及び国土交通大臣が定めた報酬の額を掲げ、従業者名簿及び帳簿を備え付ける義務を負う。", "宅地建物取引業者は、その事務所ごとに一定の数の成年者である専任の宅地建物取引士を置かなければならないが、既存の事務所がこれを満たさなくなった場合は、30日以内に必要な措置を執らなければならない。"], "page": 15, "img": ["q26_0.jpg"]}, {"stem": "宅地建物取引業者Ａ（消費税課税事業者）が受け取ることができる報酬についての次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["Ａが、Ｂから売買の媒介を依頼され、Ｂからの特別の依頼に基づき、遠隔地への現地調査を実施した。その際、当該調査に要する特別の費用について、Ｂが負担することを事前に承諾していたので、Ａは媒介報酬とは別に、当該調査に要した特別の費用相当額を受領することができる。", "Ａが、居住用建物について、貸主Ｂから貸借の媒介を依頼され、この媒介が使用貸借に係るものである場合は、当該建物の通常の借賃をもとに報酬の限度額が定まるが、その算定に当たっては、不動産鑑定業者の鑑定評価を求めなければならない。", "Ａが居住用建物の貸主Ｂ及び借主Ｃの双方から媒介の依頼を受けるに当たって、依頼者の一方から受けることのできる報酬の額は、借賃の1か月分の0.55倍に相当する金額以内である。ただし、媒介の依頼を受けるに当たって、依頼者から承諾を得ている場合はこの限りではなく、双方から受けることのできる報酬の合計額は借賃の1か月分の1.1倍に相当する金額を超えてもよい。", "Ａは、土地付建物について、売主Ｂから媒介を依頼され、代金300万円（消費税等相当額を含み、土地代金は80万円である。）で契約を成立させた。現地調査等の費用については、通常の売買の媒介に比べ5万円（消費税等相当額を含まない。）多く要する旨、Ｂに対して説明し、合意の上、媒介契約を締結した。この場合、ＡがＢから受領できる報酬の限度額は20万200円である。"], "page": 15, "img": ["q27_0.jpg"]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。", "ch": ["宅地建物取引業者が、宅地建物取引業者ではない個人から媒介業者の仲介なしに土地付建物を購入する場合、買主である宅地建物取引業者は重要事項説明書を作成しなくても宅地建物取引業法違反とはならない。", "宅地建物取引業者が、重要事項説明書を作成する際、調査不足のため、重要事項説明書に記載された内容が事実と異なるものとなったが、意図的に事実と異なる内容を記載したものではないため、宅地建物取引業法違反とはならない。", "宅地建物取引業者は、土地売買の媒介を行う場合、宅地建物取引業者ではない売主に対して契約が成立する前までの間に、宅地建物取引士をして重要事項説明書を交付して説明をさせなければならない。", "宅地又は建物の取引は権利関係や法令上の制限など取引条件に関する事項が複雑で多岐にわたるため、重要事項説明書は、宅地又は建物の取引の専門的知識を有する宅地建物取引士が作成しなければならない。"], "page": 16, "img": ["q28_0.jpg"]}, {"stem": "宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。", "ch": ["宅地建物取引士は、禁錮以上の刑に処せられた場合、刑に処せられた日から30日以内に、その旨を宅地建物取引士の登録を受けた都道府県知事に届け出なければならない。", "宅地建物取引士は、業務に関して事務禁止の処分を受けた場合、速やかに、宅地建物取引士証をその交付を受けた都道府県知事に提出しなければならず、これを怠った場合には罰則の適用を受けることがある。", "宅地建物取引士は、有効期間の満了日が到来する宅地建物取引士証を更新する場合、国土交通大臣が指定する講習を受講しなければならず、また、当該宅地建物取引士証の有効期間は5年である。", "宅地建物取引士は、宅地建物取引士の信用を害するような行為をしてはならず、信用を害するような行為には、宅地建物取引士の職務に必ずしも直接関係しない行為や私的な行為も含まれる。"], "page": 16, "img": ["q29_0.jpg"]}, {"stem": "次の記述のうち、宅地建物取引業法（以下この問において「法」という。）及び犯罪による収益の移転防止に関する法律の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "なし"], "items": [{"m": "ア", "t": "法第35条第2項の規定による割賦販売とは、代金の全部又は一部について、目的物の引渡し後6か月以上の期間にわたり、かつ、2回以上に分割して受領することを条件として販売することをいう。"}, {"m": "イ", "t": "犯罪による収益の移転防止に関する法律において、宅地建物取引業のうち、宅地若しくは建物の売買契約の締結又はその代理若しくは媒介が特定取引として規定されている。"}, {"m": "ウ", "t": "宅地建物取引業者は、その従業者に対し、その業務を適正に実施させるため、必要な教育を行うよう努めなければならないと法に定められている。"}, {"m": "エ", "t": "宅地建物取引業者の使用人その他の従業者は、正当な理由がある場合でなければ、宅地建物取引業の業務を補助したことについて知り得た秘密を他に漏らしてはならないと法に定められている。"}], "page": 17, "img": ["q30_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、ＢからＢ所有の土地付建物の売却について媒介の依頼を受けた場合における次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["Ａが、Ｂと一般媒介契約を締結した場合、ＡがＢに対し当該土地付建物の価額について意見を述べるために行った価額の査定に要した費用をＢに請求することはできない。", "Ａは、Ｂとの間で締結した媒介契約が一般媒介契約である場合には、専任媒介契約の場合とは異なり、法第34条の2第1項の規定に基づく書面に、売買すべき価額を記載する必要はない。", "Ａが、Ｂとの間で締結した専任媒介契約については、Ｂからの申出により更新することができ、その後の有効期間については、更新の時から3か月を超える内容に定めることができる。", "Ａが、当該土地付建物の購入の媒介をＣから依頼され、Ｃとの間で一般媒介契約を締結した場合、Ａは、買主であるＣに対しては、必ずしも法第34条の2第1項の規定に基づく書面を交付しなくともよい。"], "page": 17, "img": ["q31_0.jpg"]}, {"stem": "宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["宅地建物取引業者である売主Ａは、宅地建物取引業者であるＢの媒介により、宅地建物取引業者ではないＣと宅地の売買契約を令和4年4月1日に締結した。ＡとＢが共同で作成した37条書面にＢの宅地建物取引士の記名押印がなされていれば、Ａは37条書面にＡの宅地建物取引士をして記名押印をさせる必要はない。", "宅地建物取引士は、37条書面を交付する際、買主から請求があったときは、宅地建物取引士証を提示しなければならない。", "宅地建物取引業者である売主Ｄと宅地建物取引業者ではないＥとの建物の売買契約において、手付金の保全措置を講ずる場合、Ｄはその保全措置の概要を、重要事項説明書に記載し説明する必要があるが、37条書面には記載する必要はない。", "宅地建物取引業者である売主と宅地建物取引業者ではない個人との建物の売買において、建物の品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任について特約を定めたときは、37条書面にその内容を記載しなければならない。"], "page": 18, "img": ["q32_0.jpg"]}, {"stem": "宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "宅地建物取引士資格試験は未成年者でも受験することができるが、宅地建物取引士の登録は成年に達するまでいかなる場合にも受けることができない。"}, {"m": "イ", "t": "甲県知事登録の宅地建物取引士が、宅地建物取引業者（乙県知事免許）の専任の宅地建物取引士に就任するためには、宅地建物取引士の登録を乙県に移転しなければならない。"}, {"m": "ウ", "t": "丙県知事登録の宅地建物取引士が、事務の禁止の処分を受けた場合、丁県に所在する宅地建物取引業者の事務所の業務に従事しようとするときでも、その禁止の期間が満了するまで、宅地建物取引士の登録の移転を丁県知事に申請することができない。"}, {"m": "エ", "t": "戊県知事登録の宅地建物取引士が、己県へ登録の移転の申請とともに宅地建物取引士証の交付を申請した場合、己県知事が宅地建物取引士証を交付するときは、戊県で交付された宅地建物取引士証の有効期間が経過するまでの期間を有効期間とする宅地建物取引士証を交付しなければならない。"}], "page": 18, "img": ["q33_0.jpg"]}, {"stem": "宅地建物取引業者が建物の売買の媒介の際に行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、誤っているものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["当該建物が既存の建物であるときは、宅地建物取引業法第34条の2第1項第4号に規定する建物状況調査を過去1年以内に実施しているかどうか、及びこれを実施している場合におけるその結果の概要を説明しなければならない。", "当該建物が宅地造成等規制法の規定により指定された造成宅地防災区域内にあるときは、その旨を説明しなければならない。", "当該建物について、石綿の使用の有無の調査の結果が記録されているときは、その内容を説明しなければならない。", "当該建物（昭和56年5月31日以前に新築の工事に着手したもの）が指定確認検査機関、建築士、登録住宅性能評価機関又は地方公共団体による耐震診断を受けたものであるときは、その旨を説明しなければならない。"], "page": 19, "img": ["q34_0.jpg"]}, {"stem": "次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者の従業者である宅地建物取引士は、取引の関係者から事務所で従業者証明書の提示を求められたときは、この証明書に代えて従業者名簿又は宅地建物取引士証を提示することで足りる。", "宅地建物取引業者Ａが所有する甲建物を法人Ｂに売却するに当たり、Ｂが宅地建物取引業者であるか否かにかかわらず、ＡはＢに対し、宅地建物取引士をして、法第35条の規定に基づく書面を交付し説明をさせなければならない。", "法人Ｃが所有する乙建物の個人Ｄへの賃貸を宅地建物取引業者Ｅが媒介し、当該賃貸借契約が成立したときは、ＥはＤに対し、宅地建物取引士をして、法第35条の規定に基づく書面を交付し説明をさせなければならない。", "宅地建物取引業者Ｆが所有する丙宅地を法人Ｇに売却する契約を締結したとき、Ｇが宅地建物取引業者であるか否かにかかわらず、ＦはＧに対し、法第37条の規定に基づく書面を交付しなければならない。"], "page": 19, "img": ["q35_0.jpg"]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["建物の売買の媒介を行う場合、当該建物が既存の住宅であるときは当該建物の検査済証（宅地建物取引業法施行規則第16条の2の3第2号に定めるもの）の保存の状況について説明しなければならず、当該検査済証が存在しない場合はその旨を説明しなければならない。", "宅地の売買の媒介を行う場合、売買代金の額並びにその支払の時期及び方法について説明しなければならない。", "建物の貸借の媒介を行う場合、当該建物が、水防法施行規則第11条第1号の規定により市町村（特別区を含む。）の長が提供する図面にその位置が表示されている場合には、当該図面が存在していることを説明すれば足りる。", "自ら売主となって建物の売買契約を締結する場合、当該建物の引渡しの時期について説明しなければならない。"], "page": 20, "img": ["q36_0.jpg"]}, {"stem": "宅地建物取引業者Ａがその業務に関して行う広告に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "なし"], "items": [{"m": "ア", "t": "Ａが未完成の建売住宅を販売する場合、建築基準法第6条第1項に基づく確認を受けた後、同項の変更の確認の申請書を提出している期間においては、変更の確認を受ける予定であることを表示し、かつ、当初の確認内容を合わせて表示すれば、変更の確認の内容を広告することができる。"}, {"m": "イ", "t": "Ａが新築住宅の売買に関する広告をインターネットで行った場合、実際のものより著しく優良又は有利であると人を誤認させるような表示を行ったが、当該広告について問合せや申込みがなかったときは、法第32条に定める誇大広告等の禁止の規定に違反しない。"}, {"m": "ウ", "t": "Ａが一団の宅地の販売について、数回に分けて広告をするときは、そのたびごとに広告へ取引態様の別を明示しなければならず、当該広告を見た者から売買に関する注文を受けたときも、改めて取引態様の別を明示しなければならない。"}], "page": 20, "img": ["q37_0.jpg"]}, {"stem": "宅地建物取引業者が自ら売主となる宅地の売買契約について、買受けの申込みを喫茶店で行った場合における宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、正しいものはどれか。", "ch": ["買受けの申込みをした者が、売買契約締結後、当該宅地の引渡しを受けた場合、クーリング・オフによる当該売買契約の解除を行うことができない。", "買受けの申込みをした者が宅地建物取引業者であった場合、クーリング・オフについて告げられていなくても、申込みを行った日から起算して8日を経過するまでは、書面により買受けの申込みの撤回をすることができる。", "売主業者の申出により、買受けの申込みをした者の勤務先で売買契約を行った場合、クーリング・オフによる当該売買契約の解除を行うことはできない。", "クーリング・オフによる売買契約の解除がなされた場合において、宅地建物取引業者は、買受けの申込みをした者に対し、速やかに、当該売買契約の締結に際し受領した手付金その他の金銭を返還しなければならない。"], "page": 21, "img": ["q38_0.jpg"]}, {"stem": "宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["保証協会は、弁済業務保証金について弁済を受ける権利を有する者から認証申出書の提出があり、認証に係る事務を処理する場合には、各月ごとに、認証申出書に記載された取引が成立した時期の順序に従ってしなければならない。", "保証協会は、当該保証協会の社員から弁済業務保証金分担金の納付を受けたときは、その納付を受けた額に相当する額の弁済業務保証金を当該社員の主たる事務所の最寄りの供託所に供託しなければならない。", "保証協会の社員が弁済業務保証金分担金を納付した後に、新たに事務所を設置したときは、その日から2週間以内に保証協会に納付すべき弁済業務保証金分担金について、国債証券をもって充てることができる。", "宅地建物取引業者と宅地の売買契約を締結した買主（宅地建物取引業者ではない。）は、当該宅地建物取引業者が保証協会の社員となる前にその取引により生じた債権に関し、当該保証協会が供託した弁済業務保証金について弁済を受ける権利を有する。"], "page": 21, "img": ["q39_0.jpg"]}, {"stem": "建物の貸借の媒介を行う宅地建物取引業者が、その取引の相手方（宅地建物取引業者を除く。）に対して、次のアからエの発言に続けて宅地建物取引業法第35条の規定に基づく重要事項の説明を行った場合のうち、宅地建物取引業法の規定に違反しないものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "本日は重要事項の説明を行うためにお電話しました。お客様はＩＴ環境をお持ちでなく映像を見ることができないとのことですので、宅地建物取引士である私が記名押印した重要事項説明書は現在お住まいの住所に郵送いたしました。このお電話にて重要事項の説明をさせていただきますので、お手元でご覧いただきながらお聞き願います。"}, {"m": "イ", "t": "建物の貸主が宅地建物取引業者で、代表者が宅地建物取引士であり建物の事情に詳しいことから、その代表者が作成し、記名押印した重要事項説明書がこちらになります。当社の宅地建物取引士は同席しますが、説明は貸主の代表者が担当します。"}, {"m": "ウ", "t": "この物件の担当である弊社の宅地建物取引士が本日急用のため対応できなくなりましたが、せっかくお越しいただきましたので、重要事項説明書にある宅地建物取引士欄を訂正の上、宅地建物取引士である私が記名押印をし、代わりに説明をいたします。私の宅地建物取引士証をお見せします。"}, {"m": "エ", "t": "本日はお客様のご希望ですので、テレビ会議を用いて重要事項の説明を行います。当社の側の音声は聞こえていますでしょうか。十分に聞き取れたとのお返事、こちらにも聞こえました。では、説明を担当する私の宅地建物取引士証をお示ししますので、画面上でご確認をいただき、私の名前を読み上げていただけますでしょうか。そうです、読み方も間違いありません。それでは、双方音声・映像ともやりとりできる状況ですので、説明を始めます。事前にお送りした私が記名押印した重要事項説明書をお手元にご用意ください。"}], "page": 22, "img": ["q40_0.jpg"]}, {"stem": "営業保証金及び宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "宅地建物取引業者の代表者が、その業務に関し刑法第222条（脅迫）の罪により懲役の刑に処せられたことを理由に宅地建物取引業の免許を取り消された場合、当該宅地建物取引業者であった者は、当該刑の執行を終わった日から5年間は供託した営業保証金を取り戻すことができない。"}, {"m": "イ", "t": "営業保証金の還付により、営業保証金が政令で定める額に不足することとなったため、国土交通大臣又は都道府県知事から不足額を供託すべき旨の通知書の送付を受けた宅地建物取引業者は、その送付を受けた日から2週間以内にその不足額を供託しなければならない。"}, {"m": "ウ", "t": "保証協会の社員は、自らが取り扱った宅地建物取引業に係る取引の相手方から当該取引に関する苦情について解決の申出が保証協会にあり、保証協会から関係する資料の提出を求められたときは、正当な理由がある場合でなければ、これを拒んではならない。"}, {"m": "エ", "t": "保証協会の社員と宅地建物取引業に関し取引をした者は、その取引により生じた債権に関し、当該社員が納付した弁済業務保証金の額に相当する額の範囲内において弁済を受ける権利を有する。"}], "page": 23, "img": ["q41_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、ＢからＢ所有の宅地の売却を依頼され、Ｂと専属専任媒介契約（以下この問において「本件媒介契約」という。）を締結した場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["ＡはＢに対して、契約の相手方を探索するために行った措置など本件媒介契約に係る業務の処理状況を2週間に1回以上報告しなければならない。", "ＡがＢに対し当該宅地の価額又は評価額について意見を述べるときは、その根拠を明らかにしなければならないが、根拠の明示は口頭でも書面を用いてもどちらでもよい。", "本件媒介契約の有効期間について、あらかじめＢからの書面による申出があるときは、3か月を超える期間を定めることができる。", "Ａは所定の事項を指定流通機構に登録した場合、Ｂから引渡しの依頼がなければ、その登録を証する書面をＢに引き渡さなくてもよい。"], "page": 23, "img": ["q42_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として行う売買契約に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。なお、買主は宅地建物取引業者ではないものとする。", "ch": ["Ａが、宅地又は建物の売買契約に際して手付を受領した場合、その手付がいかなる性質のものであっても、Ａが契約の履行に着手するまでの間、買主はその手付を放棄して契約の解除をすることができる。", "Ａが、土地付建物の売買契約を締結する場合において、買主との間で、「売主は、売買物件の引渡しの日から1年間に限り当該物件の種類又は品質に関して契約の内容に適合しない場合におけるその不適合を担保する責任を負う」とする旨の特約を設けることができる。", "販売代金2,500万円の宅地について、Ａが売買契約の締結を行い、損害賠償の額の予定及び違約金の定めをする場合、その合計額を500万円と設定することができる。", "Ａが建物の割賦販売を行った場合、当該建物を買主に引き渡し、かつ、代金の額の10分の3を超える額の支払を受けた後は、担保の目的で当該建物を譲り受けてはならない。"], "page": 24, "img": ["q43_0.jpg"]}, {"stem": "宅地建物取引業法（以下この問において「法」という。）第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、宅地建物取引業者Ａが法の規定に違反するものはどれか。", "ch": ["Ａは、自ら売主として宅地建物取引業者ではないＢとの間で宅地の売買契約を締結した。この際、当該買主の代理として宅地建物取引業者Ｃが関与していたことから、37条書面をＢに加え、Ｃにも交付した。", "Ａは、その媒介により建物の貸借の契約を成立させ、37条書面を借主に交付するに当たり、37条書面に記名した宅地建物取引士が不在であったことから、宅地建物取引士ではないＡの従業員に書面を交付させた。", "Ａは、その媒介により借主Ｄと建物の貸借の契約を成立させた。この際、借賃以外の金銭の授受に関する定めがあるので、その額や当該金銭の授受の時期だけでなく、当該金銭の授受の目的についても37条書面に記載し、Ｄに交付した。", "Ａは、自ら売主として宅地建物取引業者Ｅの媒介により、宅地建物取引業者Ｆと宅地の売買契約を締結した。37条書面については、Ａ、Ｅ、Ｆの三者で内容を確認した上で各自作成し、交付せずにそれぞれ自ら作成した書類を保管した。"], "page": 24, "img": ["q44_0.jpg"]}, {"stem": "特定住宅瑕疵担保責任の履行の確保等に関する法律に基づく住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結に関する次の記述のうち、正しいものはどれか。", "ch": ["宅地建物取引業者は、自ら売主として宅地建物取引業者である買主との間で新築住宅の売買契約を締結し、その住宅を引き渡す場合、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負う。", "住宅販売瑕疵担保責任保険契約は、新築住宅の引渡し時から10年以上有効でなければならないが、当該新築住宅の買主の承諾があれば、当該保険契約に係る保険期間を5年間に短縮することができる。", "自ら売主として新築住宅を販売する宅地建物取引業者は、基準日から3週間を経過する日までの間において、当該基準日前10年間に自ら売主となる売買契約に基づき宅地建物取引業者ではない買主に引き渡した新築住宅（住宅販売瑕疵担保責任保険契約に係る新築住宅を除く。）について、住宅販売瑕疵担保保証金の供託をしていなければならない。", "宅地建物取引業者が住宅販売瑕疵担保保証金の供託をし、その額が、基準日において、販売新築住宅の合計戸数を基礎として算定する基準額を超えることとなった場合、宅地建物取引業法の免許を受けた国土交通大臣又は都道府県知事の承認がなくても、その超過額を取り戻すことができる。"], "page": 25, "img": ["q45_0.jpg"]}, {"stem": "独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["機構は、住宅の建設又は購入に必要な資金の貸付けに係る金融機関の貸付債権の譲受けを業務として行っているが、当該住宅の建設又は購入に付随する土地又は借地権の取得に必要な資金については、譲受けの対象としていない。", "機構は、団体信用生命保険業務において、貸付けを受けた者が死亡した場合のみならず、重度障害となった場合においても、支払われる生命保険の保険金を当該貸付けに係る債務の弁済に充当することができる。", "証券化支援事業（買取型）において、機構による譲受けの対象となる貸付債権の償還方法には、元利均等の方法であるものに加え、元金均等の方法であるものもある。", "機構は、証券化支援事業（買取型）において、ＭＢＳ（資産担保証券）を発行することにより、債券市場（投資家）から資金を調達している。"], "page": 26, "img": ["q46_0.jpg"]}, {"stem": "宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。", "ch": ["物件からスーパーマーケット等の商業施設までの徒歩所要時間は、道路距離80mにつき1分間を要するものとして算出し、1分未満の端数が生じたときは、端数を切り捨てて表示しなければならない。", "インターネット上に掲載した賃貸物件の広告について、掲載直前に契約済みとなっていたとしても、消費者からの問合せに対して既に契約済みであり取引できない旨を説明すれば、不当表示に問われることはない。", "マンションの管理費について、住戸により管理費の額が異なる場合において、その全ての住宅の管理費を示すことが困難であるときは、最高額のみを表示すればよい。", "建築条件付土地の取引の広告においては、当該条件の内容、当該条件が成就しなかったときの措置の内容だけでなく、そもそも当該取引の対象が土地であることも明らかにして表示しなければならない。"], "page": 26, "img": ["q47_0.jpg"]}, {"stem": "次の記述のうち、正しいものはどれか。", "ch": ["建築着工統計調査報告（令和3年計。令和4年1月公表）によれば、令和3年の新設住宅の着工戸数のうち、持家は前年比で増加したが、貸家及び分譲住宅は前年比で減少した。", "令和4年地価公示（令和4年3月公表）によれば、令和3年1月以降の1年間の住宅地の地価は、三大都市圏平均では下落したものの、それ以外の地方圏平均では上昇した。", "令和4年版土地白書（令和4年6月公表）によれば、令和3年の全国の土地取引件数は約133万件となり、土地取引件数の対前年比は令和元年以降減少が続いている。", "国土交通省の公表する不動産価格指数のうち、全国の商業用不動産総合の季節調整値は、2021年（令和3年）においては第1四半期から第4四半期まで連続で対前期比増となった。"], "page": 27, "img": ["q48_0.jpg"]}, {"stem": "土地に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["台地の上の浅い谷は、豪雨時には一時的に浸水することがあり、注意を要する。", "低地は、一般に洪水や地震などに対して強く、防災的見地から住宅地として好ましい。", "埋立地は、平均海面に対し4～5mの比高があり護岸が強固であれば、住宅地としても利用が可能である。", "国土交通省が運営するハザードマップポータルサイトでは、洪水、土砂災害、高潮、津波のリスク情報などを地図や写真に重ねて表示できる。"], "page": 27, "img": ["q49_0.jpg"]}, {"stem": "建築物の構造に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["木構造は、主要構造を木質系材料で構成するものであり、在来軸組構法での主要構造は、一般に軸組、小屋組、床組からなる。", "在来軸組構法の軸組は、通常、水平材である土台、桁、胴差と、垂直材の柱及び耐力壁からなる。", "小屋組は、屋根の骨組であり、小屋梁、小屋束、母屋、垂木等の部材を組み合わせた和小屋と、陸梁、束、方杖等の部材で形成するトラス構造の洋小屋がある。", "軸組に仕上げを施した壁には、真壁と大壁があり、真壁のみで構成する洋風構造と、大壁のみで構成する和風構造があるが、これらを併用する場合はない。"], "page": 27, "img": ["q50_0.jpg"]}]},

   ans:[[1], [2], [4], [1], [4], [2], [3], [1], [1], [2], [3], [2], [4], [3], [3], [2], [4], [2], [4], [3], [3], [4], [1], [1], [3], [2], [4], [4], [4], [2], [3], [1], [1], [2], [3], [1], [3], [4], [1], [3], [1], [2], [4], [2], [3], [1], [2], [3], [4], [3]],
   qs:[{"stem": "次の1から4までの記述のうち、民法の規定、判例及び下記判決文によれば、正しいものはどれか。\n\n（判決文）\n賃貸人は、特別の約定のないかぎり、賃借人から家屋明渡を受けた後に前記の敷金残額を返還すれば足りるものと解すべく、したがつて、家屋明渡債務と敷金返還債務とは同時履行の関係にたつものではないと解するのが相当であり、このことは、賃貸借の終了原因が解除（解約）による場合であつても異なるところはないと解すべきである。", "ch": ["賃借人の家屋明渡債務が賃貸人の敷金返還債務に対し先履行の関係に立つと解すべき場合、賃借人は賃貸人に対し敷金返還請求権をもって家屋につき留置権を取得する余地はない。", "賃貸借の終了に伴う賃借人の家屋明渡債務と賃貸人の敷金返還債務とは、1個の双務契約によって生じた対価的債務の関係にあるものといえる。", "賃貸借における敷金は、賃貸借の終了時点までに生じた債権を担保するものであって、賃貸人は、賃貸借終了後賃借人の家屋の明渡しまでに生じた債権を敷金から控除することはできない。", "賃貸借の終了に伴う賃借人の家屋明渡債務と賃貸人の敷金返還債務の間に同時履行の関係を肯定することは、家屋の明渡しまでに賃貸人が取得する一切の債権を担保することを目的とする敷金の性質にも適合する。"], "page": 3, "img": ["q01_0.jpg"]}, {"stem": "債務者Ａ、Ｂ、Ｃの3名が、令和3年7月1日に、内部的な負担部分の割合は等しいものとして合意した上で、債権者Ｄに対して300万円の連帯債務を負った場合に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。", "ch": ["ＤがＡに対して裁判上の請求を行ったとしても、特段の合意がなければ、ＢとＣがＤに対して負う債務の消滅時効の完成には影響しない。", "ＢがＤに対して300万円の債権を有している場合、Ｂが相殺を援用しない間に300万円の支払の請求を受けたＣは、ＢのＤに対する債権で相殺する旨の意思表示をすることができる。", "ＤがＣに対して債務を免除した場合でも、特段の合意がなければ、ＤはＡに対してもＢに対しても、弁済期が到来した300万円全額の支払を請求することができる。", "ＡとＤとの間に更改があったときは、300万円の債権は、全ての連帯債務者の利益のために消滅する。"], "page": 4, "img": ["q02_0.jpg"]}, {"stem": "個人として事業を営むＡが死亡した場合に関する次の記述のうち、民法の規定によれば、誤っているものはいくつあるか。なお、いずれの契約も令和3年7月1日付けで締結されたものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "ＡがＢとの間でＢ所有建物の清掃に関する準委任契約を締結していた場合、Ａの相続人は、Ｂとの間で特段の合意をしなくても、当該準委任契約に基づく清掃業務を行う義務を負う。"}, {"m": "イ", "t": "ＡがＡ所有の建物について賃借人Ｃとの間で賃貸借契約を締結している期間中にＡが死亡した場合、Ａの相続人は、Ｃに賃貸借契約を継続するか否かを相当の期間を定めて催告し、期間内に返答がなければ賃貸借契約をＡの死亡を理由に解除することができる。"}, {"m": "ウ", "t": "ＡがＡ所有の土地について買主Ｄとの間で売買契約を締結し、当該土地の引渡しと残代金決済の前にＡが死亡した場合、当該売買契約は原始的に履行が不能となって無効となる。"}, {"m": "エ", "t": "ＡがＥ所有の建物について貸主Ｅとの間で使用貸借契約を締結していた場合、Ａの相続人は、Ｅとの間で特段の合意をしなくても、当該使用貸借契約の借主の地位を相続して当該建物を使用することができる。"}], "page": 4, "img": ["q03_0.jpg"]}, {"stem": "被相続人Ａの配偶者Ｂが、Ａ所有の建物に相続開始の時に居住していたため、遺産分割協議によって配偶者居住権を取得した場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["遺産分割協議でＢの配偶者居住権の存続期間を20年と定めた場合、存続期間が満了した時点で配偶者居住権は消滅し、配偶者居住権の延長や更新はできない。", "Ｂは、配偶者居住権の存続期間内であれば、居住している建物の所有者の承諾を得ることなく、第三者に当該建物を賃貸することができる。", "配偶者居住権の存続期間中にＢが死亡した場合、Ｂの相続人ＣはＢの有していた配偶者居住権を相続する。", "Ｂが配偶者居住権に基づいて居住している建物が第三者Ｄに売却された場合、Ｂは、配偶者居住権の登記がなくてもＤに対抗することができる。"], "page": 5, "img": ["q04_0.jpg"]}, {"stem": "次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。", "ch": ["令和3年4月1日において18歳の者は成年であるので、その時点で、携帯電話サービスの契約や不動産の賃貸借契約を1人で締結することができる。", "養育費は、子供が未成熟であって経済的に自立することを期待することができない期間を対象として支払われるものであるから、子供が成年に達したときは、当然に養育費の支払義務が終了する。", "営業を許された未成年者が、その営業に関するか否かにかかわらず、第三者から法定代理人の同意なく負担付贈与を受けた場合には、法定代理人は当該行為を取り消すことができない。", "意思能力を有しないときに行った不動産の売買契約は、後見開始の審判を受けているか否かにかかわらず効力を有しない。"], "page": 5, "img": ["q05_0.jpg"]}, {"stem": "売買代金債権（以下この問において「債権」という。）の譲渡（令和3年7月1日に譲渡契約が行われたもの）に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。", "ch": ["譲渡制限の意思表示がされた債権が譲渡された場合、当該債権譲渡の効力は妨げられないが、債務者は、その債権の全額に相当する金銭を供託することができる。", "債権が譲渡された場合、その意思表示の時に債権が現に発生していないときは、譲受人は、その後に発生した債権を取得できない。", "譲渡制限の意思表示がされた債権の譲受人が、その意思表示がされていたことを知っていたときは、債務者は、その債務の履行を拒むことができ、かつ、譲渡人に対する弁済その他の債務を消滅させる事由をもって譲受人に対抗することができる。", "債権の譲渡は、譲渡人が債務者に通知し、又は債務者が承諾をしなければ、債務者その他の第三者に対抗することができず、その譲渡の通知又は承諾は、確定日付のある証書によってしなければ、債務者以外の第三者に対抗することができない。"], "page": 6, "img": ["q06_0.jpg"]}, {"stem": "Ａを売主、Ｂを買主として、Ａ所有の甲自動車を50万円で売却する契約（以下この問において「本件契約」という。）が令和3年7月1日に締結された場合に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。", "ch": ["Ｂが甲自動車の引渡しを受けたが、甲自動車のエンジンに契約の内容に適合しない欠陥があることが判明した場合、ＢはＡに対して、甲自動車の修理を請求することができる。", "Ｂが甲自動車の引渡しを受けたが、甲自動車に契約の内容に適合しない修理不能な損傷があることが判明した場合、ＢはＡに対して、売買代金の減額を請求することができる。", "Ｂが引渡しを受けた甲自動車が故障を起こしたときは、修理が可能か否かにかかわらず、ＢはＡに対して、修理を請求することなく、本件契約の解除をすることができる。", "甲自動車について、第三者ＣがＡ所有ではなくＣ所有の自動車であると主張しており、Ｂが所有権を取得できないおそれがある場合、Ａが相当の担保を供したときを除き、ＢはＡに対して、売買代金の支払を拒絶することができる。"], "page": 6, "img": ["q07_0.jpg"]}, {"stem": "Ａが1人で居住する甲建物の保存に瑕疵があったため、令和3年7月1日に甲建物の壁が崩れて通行人Ｂがケガをした場合（以下この問において「本件事故」という。）における次の記述のうち、民法の規定によれば、誤っているものはどれか。", "ch": ["Ａが甲建物をＣから賃借している場合、Ａは甲建物の保存の瑕疵による損害の発生の防止に必要な注意をしなかったとしても、Ｂに対して不法行為責任を負わない。", "Ａが甲建物を所有している場合、Ａは甲建物の保存の瑕疵による損害の発生の防止に必要な注意をしたとしても、Ｂに対して不法行為責任を負う。", "本件事故について、ＡのＢに対する不法行為責任が成立する場合、ＢのＡに対する損害賠償請求権は、Ｂ又はＢの法定代理人が損害又は加害者を知らないときでも、本件事故の時から20年間行使しないときには時効により消滅する。", "本件事故について、ＡのＢに対する不法行為責任が成立する場合、ＢのＡに対する損害賠償請求権は、Ｂ又はＢの法定代理人が損害及び加害者を知った時から5年間行使しないときには時効により消滅する。"], "page": 7, "img": ["q08_0.jpg"]}, {"stem": "Ａには死亡した夫Ｂとの間に子Ｃがおり、Ｄには離婚した前妻Ｅとの間に子Ｆ及び子Ｇがいる。Ｆの親権はＥが有し、Ｇの親権はＤが有している。ＡとＤが婚姻した後にＤが令和3年7月1日に死亡した場合における法定相続分として、民法の規定によれば、正しいものはどれか。", "ch": ["Ａが2分の1、Ｆが4分の1、Ｇが4分の1", "Ａが2分の1、Ｃが6分の1、Ｆが6分の1、Ｇが6分の1", "Ａが2分の1、Ｇが2分の1", "Ａが2分の1、Ｃが4分の1、Ｇが4分の1"], "page": 7, "img": ["q09_0.jpg"]}, {"stem": "ＡとＢとの間で、Ａを売主、Ｂを買主とする、等価値の美術品甲又は乙のいずれか選択によって定められる美術品の売買契約（以下この問において「本件契約」という。）が令和3年7月1日に締結された場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。", "ch": ["本件契約において、給付の目的を甲にするか乙にするかについて、第三者Ｃを選択権者とする合意がなされた場合、Ｃが選択をすることができないときは、選択権はＢに移転する。", "本件契約において、給付の目的を甲にするか乙にするかについて、Ａを選択権者とする合意がなされた後に、Ａの失火により甲が全焼したときは、給付の目的物は乙となる。", "本件契約において、給付の目的を甲にするか乙にするかについての選択権に関する特段の合意がない場合、Ｂが選択権者となる。", "本件契約において、給付の目的を甲にするか乙にするかについて、第三者Ｄを選択権者とする合意がなされた場合、Ｄが選択権を行使するときは、ＡとＢの両者に対して意思表示をしなければならない。"], "page": 8, "img": ["q10_0.jpg"]}, {"stem": "Ａは、所有している甲土地につき、Ｂとの間で建物所有を目的とする賃貸借契約（以下この問において「借地契約」という。）を締結する予定であるが、期間が満了した時点で、確実に借地契約が終了するようにしたい。この場合に関する次の記述のうち、借地借家法の規定によれば、誤っているものはどれか。", "ch": ["事業の用に供する建物を所有する目的とし、期間を60年と定める場合には、契約の更新や建物の築造による存続期間の延長がない旨を書面で合意すれば、公正証書で合意しなくても、その旨を借地契約に定めることができる。", "居住の用に供する建物を所有することを目的とする場合には、公正証書によって借地契約を締結するときであっても、期間を20年とし契約の更新や建物の築造による存続期間の延長がない旨を借地契約に定めることはできない。", "居住の用に供する建物を所有することを目的とする場合には、借地契約を書面で行えば、借地権を消滅させるため、借地権の設定から20年が経過した日に甲土地上の建物の所有権を相当の対価でＢからＡに移転する旨の特約を有効に定めることができる。", "借地契約がＢの臨時設備の設置その他一時使用のためになされることが明らかである場合には、期間を5年と定め、契約の更新や建物の築造による存続期間の延長がない旨を借地契約に定めることができる。"], "page": 8, "img": ["q11_0.jpg"]}, {"stem": "Ａを賃貸人、Ｂを賃借人とする甲建物の賃貸借契約（以下この問において「本件契約」という。）が令和3年7月1日に締結された場合に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。", "ch": ["本件契約について期間の定めをしなかった場合、ＡはＢに対して、いつでも解約の申入れをすることができ、本件契約は、解約の申入れの日から3月を経過することによって終了する。", "甲建物がＢに引き渡された後、甲建物の所有権がＡからＣに移転した場合、本件契約の敷金は、他に特段の合意がない限り、ＢのＡに対する未払賃料債務に充当され、残額がＣに承継される。", "甲建物が適法にＢからＤに転貸されている場合、ＡがＤに対して本件契約が期間満了によって終了する旨の通知をしたときは、建物の転貸借は、その通知がされた日から3月を経過することによって終了する。", "本件契約が借地借家法第38条の定期建物賃貸借契約で、期間を5年、契約の更新がない旨を定めた場合、Ａは、期間満了の1年前から6月前までの間に、Ｂに対し賃貸借が終了する旨の通知をしなければ、従前の契約と同一条件で契約を更新したものとみなされる。"], "page": 9, "img": ["q12_0.jpg"]}, {"stem": "建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["法又は規約により集会において決議をすべき場合において、区分所有者が1人でも反対するときは、集会を開催せずに書面によって決議をすることはできない。", "形状又は効用の著しい変更を伴う共用部分の変更については、区分所有者及び議決権の各4分の3以上の多数による集会の決議で決するものであるが、規約でこの区分所有者の定数を過半数まで減ずることができる。", "敷地利用権が数人で有する所有権その他の権利である場合には、規約に別段の定めがあるときを除いて、区分所有者は、その有する専有部分とその専有部分に係る敷地利用権とを分離して処分することができない。", "各共有者の共用部分の持分は、規約に別段の定めがある場合を除いて、その有する専有部分の床面積の割合によるが、この床面積は壁その他の区画の中心線で囲まれた部分の水平投影面積である。"], "page": 9, "img": ["q13_0.jpg"]}, {"stem": "不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、正しいものはどれか。", "ch": ["所有権の登記の抹消は、所有権の移転の登記がある場合においても、所有権の登記名義人が単独で申請することができる。", "登記の申請をする者の委任による代理人の権限は、本人の死亡によって消滅する。", "法人の合併による権利の移転の登記は、登記権利者が単独で申請することができる。", "信託の登記は、受託者が単独で申請することができない。"], "page": 10, "img": ["q14_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、誤っているものはどれか。", "ch": ["地区計画については、都市計画に、当該地区計画の目標を定めるよう努めるものとされている。", "地区計画については、都市計画に、区域の面積を定めるよう努めるものとされている。", "地区整備計画においては、市街化区域と市街化調整区域との区分の決定の有無を定めることができる。", "地区整備計画においては、建築物の建蔽率の最高限度を定めることができる。"], "page": 10, "img": ["q15_0.jpg"]}, {"stem": "都市計画法に関する次の記述のうち、正しいものはどれか。ただし、許可を要する開発行為の面積については、条例による定めはないものとし、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["市街化区域において、都市公園法に規定する公園施設である建築物の建築を目的とした5,000㎡の土地の区画形質の変更を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。", "首都圏整備法に規定する既成市街地内にある市街化区域において、住宅の建築を目的とした800㎡の土地の区画形質の変更を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。", "準都市計画区域において、商業施設の建築を目的とした2,000㎡の土地の区画形質の変更を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。", "区域区分が定められていない都市計画区域において、土地区画整理事業の施行として行う8,000㎡の土地の区画形質の変更を行おうとする者は、あらかじめ、都道府県知事の許可を受けなければならない。"], "page": 11, "img": ["q16_0.jpg"]}, {"stem": "建築基準法に関する次の記述のうち、正しいものはどれか。", "ch": ["居室の内装の仕上げには、ホルムアルデヒドを発散させる建築材料を使用することが認められていない。", "4階建ての共同住宅の敷地内には、避難階に設けた屋外への出口から道又は公園、広場その他の空地に通ずる幅員が2m以上の通路を設けなければならない。", "防火地域又は準防火地域内にある建築物で、外壁が防火構造であるものについては、その外壁を隣地境界線に接して設けることができる。", "建築主は、3階建ての木造の共同住宅を新築する場合において、特定行政庁が、安全上、防火上及び避難上支障がないと認めたときは、検査済証の交付を受ける前においても、仮に、当該共同住宅を使用することができる。"], "page": 11, "img": ["q17_0.jpg"]}, {"stem": "次の記述のうち、建築基準法の規定によれば、誤っているものはどれか。", "ch": ["都市計画により建蔽率の限度が10分の6と定められている近隣商業地域において、準防火地域内にある耐火建築物で、街区の角にある敷地又はこれに準ずる敷地で特定行政庁が指定するものの内にある建築物については、建蔽率の限度が10分の8となる。", "市町村は、集落地区計画の区域において、用途地域における用途の制限を補完し、当該区域の特性にふさわしい土地利用の増進等の目的を達成するため必要と認める場合においては、国土交通大臣の承認を得て、当該区域における用途制限を緩和することができる。", "居住環境向上用途誘導地区内においては、公益上必要な一定の建築物を除き、建築物の建蔽率は、居住環境向上用途誘導地区に関する都市計画において建築物の建蔽率の最高限度が定められたときは、当該最高限度以下でなければならない。", "都市計画区域内のごみ焼却場の用途に供する建築物について、特定行政庁が建築基準法第51条に規定する都市計画審議会の議を経てその敷地の位置が都市計画上支障がないと認めて許可した場合においては、都市計画においてその敷地の位置が決定しているものでなくても、新築することができる。"], "page": 12, "img": ["q18_0.jpg"]}, {"stem": "宅地造成等規制法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。", "ch": ["宅地造成工事規制区域内において、宅地を造成するために切土をする土地の面積が500㎡であって盛土を生じない場合、切土をした部分に生じる崖の高さが1.5mであれば、都道府県知事の法第8条第1項本文の工事の許可は不要である。", "都道府県知事は、法第8条第1項本文の工事の許可の申請があった場合においては、遅滞なく、文書をもって許可又は不許可の処分を申請者に通知しなければならない。", "都道府県知事は、一定の場合には都道府県（地方自治法に基づく指定都市、中核市又は施行時特例市の区域にあっては、それぞれ指定都市、中核市又は施行時特例市）の規則で、宅地造成工事規制区域内において行われる宅地造成に関する工事の技術的基準を強化し、又は付加することができる。", "都道府県知事は、関係市町村長の意見を聴いて、宅地造成工事規制区域内で、宅地造成に伴う災害で相当数の居住者その他の者に危害を生ずるものの発生のおそれが大きい一団の造成宅地の区域であって一定の基準に該当するものを、造成宅地防災区域として指定することができる。"], "page": 12, "img": ["q19_0.jpg"]}, {"stem": "土地区画整理法に関する次の記述のうち、誤っているものはどれか。", "ch": ["換地計画において参加組合員に対して与えるべきものとして定められた宅地は、換地処分の公告があった日の翌日において、当該宅地の所有者となるべきものとして換地計画において定められた参加組合員が取得する。", "換地計画において換地を定める場合においては、換地及び従前の宅地の位置、地積、土質、水利、利用状況、環境等が照応するように定めなければならない。", "土地区画整理組合の設立の認可の公告があった日後、換地処分の公告がある日までは、施行地区内において、土地区画整理事業の施行の障害となるおそれがある土地の形質の変更を行おうとする者は、当該土地区画整理組合の許可を受けなければならない。", "土地区画整理組合の組合員は、組合員の3分の1以上の連署をもって、その代表者から理由を記載した書面を土地区画整理組合に提出して、理事又は監事の解任を請求することができる。"], "page": 13, "img": ["q20_0.jpg"]}, {"stem": "農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、誤っているものはどれか。", "ch": ["遺産分割によって農地を取得する場合には、法第3条第1項の許可は不要であるが、農業委員会への届出が必要である。", "法第3条第1項の許可を受けなければならない場合の売買については、その許可を受けずに農地の売買契約を締結しても、所有権移転の効力は生じない。", "砂利採取法第16条の認可を受けて市街化調整区域内の農地を砂利採取のために一時的に借り受ける場合には、法第5条第1項の許可は不要である。", "都道府県が市街化調整区域内の農地を取得して病院を建設する場合には、都道府県知事（法第4条第1項に規定する指定市町村の区域内にあってはその長）との協議が成立すれば、法第5条第1項の許可があったものとみなされる。"], "page": 13, "img": ["q21_0.jpg"]}, {"stem": "国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。", "ch": ["土地売買等の契約を締結した場合には、当事者のうち当該契約による権利取得者は、その契約を締結した日の翌日から起算して3週間以内に、事後届出を行わなければならない。", "都道府県知事は、事後届出をした者に対し、その届出に係る土地に関する権利の移転若しくは設定後における土地の利用目的又は土地に関する権利の移転若しくは設定の対価の額について、当該土地を含む周辺の地域の適正かつ合理的な土地利用を図るために必要な助言をすることができる。", "事後届出が必要な土地売買等の契約を締結したにもかかわらず、所定の期間内に当該届出をしなかった者は、都道府県知事からの勧告を受けるが、罰則の適用はない。", "宅地建物取引業者Ａが所有する準都市計画区域内の20,000㎡の土地について、10,000㎡をＢ市に、10,000㎡を宅地建物取引業者Ｃに売却する契約を締結した場合、Ｂ市は事後届出を行う必要はないが、Ｃは一定の場合を除き事後届出を行う必要がある。"], "page": 14, "img": ["q22_0.jpg"]}, {"stem": "所得税法に関する次の記述のうち、正しいものはどれか。", "ch": ["譲渡所得の特別控除額（50万円）は、譲渡益のうち、まず、資産の取得の日以後5年以内にされた譲渡による所得で政令で定めるものに該当しないものに係る部分の金額から控除し、なお控除しきれない特別控除額がある場合には、それ以外の譲渡による所得に係る部分の金額から控除する。", "譲渡所得の金額の計算上、資産の譲渡に係る総収入金額から控除する資産の取得費には、その資産の取得時に支出した購入代金や購入手数料の金額は含まれるが、その資産の取得後に支出した設備費及び改良費の額は含まれない。", "建物の全部の所有を目的とする土地の賃借権の設定の対価として支払を受ける権利金の金額が、その土地の価額の10分の5に相当する金額を超えるときは、不動産所得として課税される。", "居住者がその取得の日以後5年以内に固定資産を譲渡した場合には、譲渡益から譲渡所得の特別控除額（50万円）を控除した後の譲渡所得の金額の2分の1に相当する金額が課税標準とされる。"], "page": 14, "img": ["q23_0.jpg"]}, {"stem": "不動産取得税に関する次の記述のうち、正しいものはどれか。", "ch": ["平成28年に新築された既存住宅（床面積210㎡）を個人が自己の居住のために取得した場合、当該取得に係る不動産取得税の課税標準の算定については、当該住宅の価格から1,200万円が控除される。", "家屋が新築された日から3年を経過して、なお、当該家屋について最初の使用又は譲渡が行われない場合においては、当該家屋が新築された日から3年を経過した日において家屋の取得がなされたものとみなし、当該家屋の所有者を取得者とみなして、これに対して不動産取得税を課する。", "不動産取得税は、不動産の取得があった日の翌日から起算して2か月以内に当該不動産の所在する都道府県に申告納付しなければならない。", "不動産取得税は、不動産を取得するという比較的担税力のある機会に相当の税負担を求める観点から創設されたものであるが、不動産取得税の税率は4％を超えることができない。"], "page": 15, "img": ["q24_0.jpg"]}, {"stem": "不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。", "ch": ["不動産鑑定士の通常の調査の範囲では、対象不動産の価格への影響の程度を判断するための事実の確認が困難な特定の価格形成要因がある場合、鑑定評価書の利用者の利益を害するおそれがないと判断されるときに限り、当該価格形成要因について調査の範囲に係る条件を設定することができる。", "対象不動産を価格時点において再調達することを想定した場合において必要とされる適正な原価の総額を再調達原価というが、建設資材、工法等の変遷により、対象不動産の再調達原価を求めることが困難な場合には、対象不動産と同等の有用性を持つものに置き換えて求めた原価を再調達原価とみなすものとする。", "取引事例等に係る取引が特殊な事情を含み、これが当該取引事例等に係る価格等に影響を及ぼしている場合に、適切に補正することを時点修正という。", "不動産の鑑定評価によって求める賃料は、一般的には正常賃料又は継続賃料であるが、鑑定評価の依頼目的に対応した条件により限定賃料を求めることができる場合がある。"], "page": 15, "img": ["q25_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として宅地建物取引業者ではない買主Ｂに対し建物の売却を行う場合における宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。", "ch": ["Ａは、Ｂに対し、専任の宅地建物取引士をして説明をさせなければならない。", "Ａは、Ｂに対し、代金以外に授受される金銭の額だけでなく、当該金銭の授受の目的についても説明しなければならない。", "Ａは、Ｂに対し、建物の上に存する登記された権利の種類及び内容だけでなく、移転登記の申請の時期についても説明しなければならない。", "Ａは、Ｂに対し、売買の対象となる建物の引渡しの時期について説明しなければならない。"], "page": 16, "img": ["q26_0.jpg"]}, {"stem": "宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["個人Ａが不正の手段により免許を受けた後、免許を取り消され、その取消しの日から5年を経過した場合、その間に免許を受けることができない事由に該当することがなかったとしても、Ａは再び免許を受けることはできない。", "免許を受けようとする個人Ｂが破産手続開始の決定を受けた後に復権を得た場合においても、Ｂは免許を受けることができない。", "免許を受けようとするＣ社の役員Ｄが刑法第211条（業務上過失致死傷等）の罪により地方裁判所で懲役1年の判決を言い渡された場合、当該判決に対してＤが高等裁判所に控訴し裁判が係属中であっても、Ｃ社は免許を受けることができない。", "免許を受けようとするＥ社の役員に、宅地建物取引業法の規定に違反したことにより罰金の刑に処せられた者がいる場合、その刑の執行が終わって5年を経過しなければ、Ｅ社は免許を受けることができない。"], "page": 16, "img": ["q27_0.jpg"]}, {"stem": "宅地建物取引士の登録（以下この問において「登録」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引士Ａ（甲県知事登録）が、乙県に所在する宅地建物取引業者の事務所の業務に従事することとなったときは、Ａは甲県知事を経由せずに、直接乙県知事に対して登録の移転を申請しなければならない。", "甲県知事の登録を受けているが宅地建物取引士証の交付を受けていないＢが、宅地建物取引士としてすべき事務を行った場合、情状のいかんを問わず、甲県知事はＢの登録を消除しなければならない。", "宅地建物取引士Ｃ（甲県知事登録）は、宅地建物取引業者Ｄ社を退職し、宅地建物取引業者Ｅ社に再就職したが、ＣはＤ社及びＥ社のいずれにおいても専任の宅地建物取引士ではないので、勤務先の変更の登録を申請しなくてもよい。", "甲県で宅地建物取引士資格試験を受け、合格したＦは、乙県に転勤することとなったとしても、登録は甲県知事に申請しなければならない。"], "page": 17, "img": ["q28_0.jpg"]}, {"stem": "次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者は、その事務所ごとに従業者の氏名、従業者証明書番号その他国土交通省令で定める事項を記載した従業者名簿を備えなければならず、当該名簿を最終の記載をした日から5年間保存しなければならない。", "宅地建物取引業者は、一団の宅地の分譲を行う案内所において宅地の売買の契約の締結を行わない場合、その案内所には国土交通省令で定める標識を掲示しなくてもよい。", "宅地建物取引業者が、一団の宅地の分譲を行う案内所において宅地の売買の契約の締結を行う場合、その案内所には国土交通大臣が定めた報酬の額を掲示しなければならない。", "宅地建物取引業者は、事務所以外の継続的に業務を行うことができる施設を有する場所であっても、契約（予約を含む。）を締結せず、かつ、その申込みを受けない場合、当該場所に専任の宅地建物取引士を置く必要はない。"], "page": 17, "img": ["q29_0.jpg"]}, {"stem": "宅地建物取引業者がその業務に関して行う広告に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "宅地の販売広告において、宅地に対する将来の利用の制限について、著しく事実に相違する表示をしてはならない。"}, {"m": "イ", "t": "建物の貸借の媒介において広告を行った場合には、依頼者の依頼の有無にかかわらず、報酬の限度額を超えて、当該広告の料金に相当する額を受領することができる。"}, {"m": "ウ", "t": "複数の区画がある宅地の売買について、数回に分けて広告するときは、最初に行う広告に取引態様の別を明示すれば足り、それ以降は明示する必要はない。"}, {"m": "エ", "t": "賃貸マンションの貸借に係る媒介の依頼を受け、媒介契約を締結した場合であっても、当該賃貸マンションが建築確認申請中であるときは広告をすることができない。"}], "page": 18, "img": ["q30_0.jpg"]}, {"stem": "宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。", "ch": ["保証協会は、当該保証協会の社員である宅地建物取引業者が社員となる前に当該宅地建物取引業者と宅地建物取引業に関し取引をした者の有するその取引により生じた債権に関し弁済業務保証金の還付が行われることにより弁済業務の円滑な運営に支障を生ずるおそれがあると認めるときは、当該社員に対し、担保の提供を求めることができる。", "保証協会の社員である宅地建物取引業者は、取引の相手方から宅地建物取引業に係る取引に関する苦情について解決の申出が当該保証協会になされ、その解決のために当該保証協会から資料の提出の求めがあったときは、正当な理由がある場合でなければ、これを拒んではならない。", "保証協会の社員である宅地建物取引業者は、当該宅地建物取引業者と宅地建物取引業に関し取引をした者の有するその取引により生じた債権に関し弁済業務保証金の還付がなされたときは、その日から2週間以内に還付充当金を保証協会に納付しなければならない。", "還付充当金の未納により保証協会の社員がその地位を失ったときは、保証協会は、直ちにその旨を当該社員であった宅地建物取引業者が免許を受けた国土交通大臣又は都道府県知事に報告しなければならない。"], "page": 18, "img": ["q31_0.jpg"]}, {"stem": "宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、いずれの場合も、その行為を業として営むものとする。", "ch": ["Ａ社が、都市計画法に規定する用途地域外の土地であって、ソーラーパネルを設置するための土地の売買を媒介しようとする場合、免許は必要ない。", "Ｂ社が、土地区画整理事業の換地処分により取得した換地を住宅用地として分譲しようとする場合、免許は必要ない。", "農業協同組合Ｃが、組合員が所有する宅地の売却の代理をする場合、免許は必要ない。", "Ｄ社が、地方公共団体が定住促進策としてその所有する土地について住宅を建築しようとする個人に売却する取引の媒介をしようとする場合、免許は必要ない。"], "page": 19, "img": ["q32_0.jpg"]}, {"stem": "宅地建物取引業法第35条に規定する重要事項の説明における水防法施行規則第11条第1号の規定により市町村（特別区を含む。以下この問において同じ。）の長が提供する図面（以下この問において「水害ハザードマップ」という。）に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。", "ch": ["宅地建物取引業者は、市町村が、取引の対象となる宅地又は建物の位置を含む水害ハザードマップを作成せず、又は印刷物の配布若しくはホームページ等への掲載等をしていないことを確認できた場合は、重要事項説明書にその旨記載し、重要事項説明の際に提示すべき水害ハザードマップが存在しない旨を説明すればよい。", "宅地建物取引業者は、市町村が取引の対象となる宅地又は建物の位置を含む「洪水」、「雨水出水（内水）」、「高潮」の水害ハザードマップを作成している場合、重要事項説明の際にいずれか1種類の水害ハザードマップを提示すればよい。", "宅地建物取引業者は、市町村が取引の対象となる宅地又は建物の位置を含む水害ハザードマップを作成している場合、売買又は交換の媒介のときは重要事項説明の際に水害ハザードマップを提示しなければならないが、貸借の媒介のときはその必要はない。", "宅地建物取引業者は、市町村が取引の対象となる宅地又は建物の位置を含む水害ハザードマップを作成している場合、重要事項説明書に水害ハザードマップを添付すれば足りる。"], "page": 19, "img": ["q33_0.jpg"]}, {"stem": "宅地建物取引業法の規定に基づく営業保証金に関する次の記述のうち、正しいものはどれか。", "ch": ["国土交通大臣から免許を受けた宅地建物取引業者が、営業保証金を主たる事務所のもよりの供託所に供託した場合、当該供託所から国土交通大臣にその旨が通知されるため、当該宅地建物取引業者は国土交通大臣にその旨を届け出る必要はない。", "宅地建物取引業者と宅地建物取引業に関し取引をした者は、その取引により生じた債権に関し、当該宅地建物取引業者が供託した営業保証金について、その債権の弁済を受ける権利を有するが、取引をした者が宅地建物取引業者に該当する場合は、その権利を有しない。", "営業保証金は、金銭による供託のほか、有価証券をもって供託することができるが、金銭と有価証券とを併用して供託することはできない。", "有価証券を営業保証金に充てる場合における当該有価証券の価額は、国債証券の場合はその額面金額の100分の90、地方債証券の場合はその額面金額の100分の80である。"], "page": 20, "img": ["q34_0.jpg"]}, {"stem": "宅地建物取引士の登録（以下この問において「登録」という。）及び宅地建物取引士証に関する次の記述のうち、正しいものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "宅地建物取引士（甲県知事登録）が事務禁止処分を受けた場合、宅地建物取引士証を甲県知事に速やかに提出しなければならず、速やかに提出しなかったときは10万円以下の過料に処せられることがある。"}, {"m": "イ", "t": "宅地建物取引士（甲県知事登録）が宅地建物取引士としての事務禁止処分を受け、その禁止の期間中に本人の申請により登録が消除された場合は、その者が乙県で宅地建物取引士資格試験に合格したとしても、当該期間が満了していないときは、乙県知事の登録を受けることができない。"}, {"m": "ウ", "t": "宅地建物取引士（甲県知事登録）が甲県から乙県に住所を変更したときは、乙県知事に対し、登録の移転の申請をすることができる。"}, {"m": "エ", "t": "宅地建物取引士（甲県知事登録）が本籍を変更した場合、遅滞なく、甲県知事に変更の登録を申請しなければならない。"}], "page": 20, "img": ["q35_0.jpg"]}, {"stem": "宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、同法の規定に少なくとも説明しなければならない事項として掲げられていないものはどれか。", "ch": ["建物の貸借の媒介を行う場合における、「都市計画法第29条第1項の規定に基づく制限」", "建物の貸借の媒介を行う場合における、「当該建物について、石綿の使用の有無の調査の結果が記録されているときは、その内容」", "建物の貸借の媒介を行う場合における、「台所、浴室、便所その他の当該建物の設備の整備の状況」", "宅地の貸借の媒介を行う場合における、「敷金その他いかなる名義をもって授受されるかを問わず、契約終了時において精算することとされている金銭の精算に関する事項」"], "page": 21, "img": ["q36_0.jpg"]}, {"stem": "宅地建物取引業法第35条の規定に基づく重要事項の説明及び同法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["宅地建物取引業者は、媒介により区分所有建物の賃貸借契約を成立させた場合、専有部分の用途その他の利用の制限に関する規約においてペットの飼育が禁止されているときは、その旨を重要事項説明書に記載して説明し、37条書面にも記載しなければならない。", "宅地建物取引業者は、自ら売主となる土地付建物の売買契約において、宅地建物取引業者ではない買主から保全措置を講ずる必要のない金額の手付金を受領する場合、手付金の保全措置を講じないことを、重要事項説明書に記載して説明し、37条書面にも記載しなければならない。", "宅地建物取引業者は、媒介により建物の敷地に供せられる土地の売買契約を成立させた場合において、当該売買代金以外の金銭の授受に関する定めがあるときは、その額並びに当該金銭の授受の時期及び目的を37条書面に記載しなければならない。", "宅地建物取引業者は、自ら売主となる土地付建物の売買契約及び自ら貸主となる土地付建物の賃貸借契約のいずれにおいても、37条書面を作成し、その取引の相手方に交付しなければならない。"], "page": 21, "img": ["q37_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、宅地建物取引業者ＢからＢ所有の建物の売却を依頼され、Ｂと一般媒介契約（以下この問において「本件契約」という。）を締結した場合に関する次の記述のうち、宅地建物取引業法の規定に違反しないものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "本件契約を締結する際に、Ｂから有効期間を6か月としたい旨の申出があったが、ＡとＢが協議して、有効期間を3か月とした。"}, {"m": "イ", "t": "当該物件に係る買受けの申込みはなかったが、ＡはＢに対し本件契約に係る業務の処理状況の報告を口頭により14日に1回以上の頻度で行った。"}, {"m": "ウ", "t": "Ａは本件契約を締結した後、所定の事項を遅滞なく指定流通機構に登録したが、その登録を証する書面を、登録してから14日後にＢに交付した。"}, {"m": "エ", "t": "本件契約締結後、1年を経過しても当該物件を売却できなかったため、Ｂは売却をあきらめ、当該物件を賃貸することにした。そこでＢはＡと当該物件の貸借に係る一般媒介契約を締結したが、当該契約の有効期間を定めなかった。"}], "page": 22, "img": ["q38_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者Ｂの媒介により、宅地建物取引業者ではないＣを買主とするマンションの売買契約を締結した場合における宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフについて告げるときに交付すべき書面（以下この問において「告知書面」という。）に関する次の記述のうち、正しいものはどれか。", "ch": ["告知書面には、クーリング・オフによる買受けの申込みの撤回又は売買契約の解除があったときは、Ａは、その買受けの申込みの撤回又は売買契約の解除に伴う損害賠償又は違約金の支払を請求することができないことを記載しなければならない。", "告知書面には、クーリング・オフについて告げられた日から起算して8日を経過するまでの間は、Ｃが当該マンションの引渡しを受け又は代金の全部を支払った場合を除き、書面によりクーリング・オフによる買受けの申込みの撤回又は売買契約の解除を行うことができることを記載しなければならない。", "告知書面には、Ｃがクーリング・オフによる売買契約の解除をするときは、その旨を記載した書面がＡに到達した時点で、その効力が発生することを記載しなければならない。", "告知書面には、Ａ及びＢの商号又は名称及び住所並びに免許証番号を記載しなければならない。"], "page": 22, "img": ["q39_0.jpg"]}, {"stem": "次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["宅地建物取引業者は、その業務に関する帳簿を備え、取引のあったつど、その年月日、その取引に係る宅地又は建物の所在及び面積その他国土交通省令で定める事項を記載しなければならないが、支店及び案内所には備え付ける必要はない。", "成年である宅地建物取引業者は、宅地建物取引業の業務に関し行った行為について、行為能力の制限を理由に取り消すことができる。", "宅地建物取引業者は、一団の宅地建物の分譲をする場合における当該宅地又は建物の所在する場所に国土交通省令で定める標識を掲示しなければならない。", "宅地建物取引業者は、業務上取り扱ったことについて知り得た秘密に関し、税務署の職員から質問検査権の規定に基づき質問を受けたときであっても、回答してはならない。"], "page": 23, "img": ["q40_0.jpg"]}, {"stem": "宅地建物取引業者Ａが行う業務に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、この問において「37条書面」とは、同法第37条の規定により交付すべき書面をいうものとする。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "Ａが自ら売主として建物を売却する場合、宅地建物取引業者Ｂに当該売却の媒介を依頼したときは、Ｂは宅地建物取引士をして37条書面に記名押印させなければならず、Ａも宅地建物取引士をして37条書面に記名押印させなければならない。"}, {"m": "イ", "t": "Ａが自ら売主として建物を売却する場合、当該売買契約に際し、買主から支払われる手付金の額が売買代金の5％未満であるときは、当該手付金の額の記載があれば、授受の時期については37条書面に記載しなくてもよい。"}, {"m": "ウ", "t": "Ａが売主を代理して建物を売却する場合、買主が宅地建物取引業者であるときは、37条書面を交付しなくてもよい。"}, {"m": "エ", "t": "Ａが売主を代理して抵当権が設定されている建物を売却する場合、当該抵当権の内容について37条書面に記載しなければならない。"}], "page": 23, "img": ["q41_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として宅地建物取引業者ではないＢを買主とする土地付建物の売買契約（代金3,200万円）を締結する場合に関する次の記述のうち、民法及び宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["割賦販売の契約を締結し、当該土地付建物を引き渡した場合、Ａは、Ｂから800万円の賦払金の支払を受けるまでに、当該土地付建物に係る所有権の移転登記をしなければならない。", "当該土地付建物の工事の完了前に契約を締結した場合、Ａは、宅地建物取引業法第41条に定める手付金等の保全措置を講じなくても手付金100万円、中間金60万円を受領することができる。", "当事者の債務の不履行を理由とする契約の解除に伴う損害賠償の予定額を400万円とし、かつ、違約金の額を240万円とする特約を定めた場合、当該特約は無効となる。", "当事者の債務の不履行を理由とする契約の解除に伴う損害賠償の予定額を定めていない場合、債務の不履行による損害賠償の請求額は売買代金の額の10分の2を超えてはならない。"], "page": 24, "img": ["q42_0.jpg"]}, {"stem": "宅地建物取引業者の業務に関する次の記述のうち、宅地建物取引業法の規定に違反するものはいくつあるか。", "ch": ["一つ", "二つ", "三つ", "四つ"], "items": [{"m": "ア", "t": "マンションの販売に際して、買主が手付として必要な額を持ち合わせていなかったため、手付を分割受領することにより、契約の締結を誘引した。"}, {"m": "イ", "t": "宅地の売買に際して、相手方が「契約の締結をするかどうか明日まで考えさせてほしい」と申し出たのに対し、事実を歪めて「明日では契約締結できなくなるので、今日しか待てない」と告げた。"}, {"m": "ウ", "t": "マンション販売の勧誘を電話で行った際に、勧誘に先立って電話口で宅地建物取引業者の商号又は名称を名乗らずに勧誘を行った。"}, {"m": "エ", "t": "建物の貸借の媒介に際して、賃貸借契約の申込みをした者がその撤回を申し出たが、物件案内等に経費がかかったため、預り金を返還しなかった。"}], "page": 24, "img": ["q43_0.jpg"]}, {"stem": "宅地建物取引業者Ａ（消費税課税事業者）が受け取ることができる報酬額についての次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。", "ch": ["居住の用に供する建物（1か月の借賃20万円。消費税等相当額を含まない。）の貸借であって100万円の権利金の授受があるものの媒介をする場合、依頼者双方から受領する報酬の合計額は11万円を超えてはならない。", "宅地（代金1,000万円。消費税等相当額を含まない。）の売買について、売主から代理の依頼を受け、買主から媒介の依頼を受け、売買契約を成立させて買主から303,000円の報酬を受領する場合、売主からは489,000円を上限として報酬を受領することができる。", "宅地（代金300万円。消費税等相当額を含まない。）の売買の媒介について、通常の媒介と比較して現地調査等の費用が6万円（消費税等相当額を含まない。）多く要した場合、依頼者双方から合計で44万円を上限として報酬を受領することができる。", "店舗兼住宅（1か月の借賃20万円。消費税等相当額を含まない。）の貸借の媒介をする場合、依頼者の一方から受領する報酬は11万円を超えてはならない。"], "page": 25, "img": ["q44_0.jpg"]}, {"stem": "宅地建物取引業者Ａが、自ら売主として宅地建物取引業者ではない買主Ｂに新築住宅を販売する場合における次の記述のうち、特定住宅瑕疵担保責任の履行の確保等に関する法律の規定によれば、正しいものはどれか。", "ch": ["Ｂが建設業者である場合、Ａは、Ｂに引き渡した新築住宅について、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負わない。", "Ａが住宅販売瑕疵担保責任保険契約を締結する場合、当該契約は、ＢがＡから当該新築住宅の引渡しを受けた時から2年以上の期間にわたって有効なものでなければならない。", "Ａが住宅販売瑕疵担保責任保険契約を締結した場合、Ａ及びＢは、指定住宅紛争処理機関に特別住宅紛争処理の申請をすることにより、当該新築住宅の瑕疵に関するＡとＢとの間の紛争について、あっせん、調停又は仲裁を受けることができる。", "ＡＢ間の新築住宅の売買契約において、当該新築住宅の構造耐力上主要な部分に瑕疵があってもＡが瑕疵担保責任を負わない旨の特約があった場合、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務はない。"], "page": 25, "img": ["q45_0.jpg"]}, {"stem": "独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。", "ch": ["機構は、証券化支援事業（買取型）において、賃貸住宅の購入に必要な資金の貸付けに係る金融機関の貸付債権を譲受けの対象としている。", "機構は、市街地の土地の合理的な利用に寄与する一定の建築物の建設に必要な資金の貸付けを業務として行っている。", "機構は、証券化支援事業（買取型）において、省エネルギー性に優れた住宅を取得する場合について、貸付金の利率を一定期間引き下げる制度を設けている。", "機構は、経済事情の変動に伴い、貸付けを受けた者の住宅ローンの元利金の支払が著しく困難になった場合に、償還期間の延長等の貸付条件の変更を行っている。"], "page": 26, "img": ["q46_0.jpg"]}, {"stem": "宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。", "ch": ["住宅の居室の広さを畳数で表示する場合には、畳1枚当たりの広さにかかわらず、実際に当該居室に敷かれている畳の数を表示しなければならない。", "団地（一団の宅地又は建物をいう。）と駅との間の距離は、駅から最も近い当該団地内の地点を起点又は着点として算出した数値を表示しなければならず、当該団地を数区に区分して取引するときは各区分ごとに距離を算出して表示しなければならない。", "新築分譲マンションを完成予想図により表示する場合、完成予想図である旨を表示すれば、緑豊かな環境であることを訴求するために周囲に存在しない公園等を表示することができる。", "新築分譲住宅の販売に当たって行う二重価格表示は、実際に過去において販売価格として公表していた価格を比較対照価格として用いて行うのであれば、値下げの時期から1年以内の期間は表示することができる。"], "page": 26, "img": ["q47_0.jpg"]}, {"stem": "次の記述のうち、正しいものはどれか。", "ch": ["建築着工統計（令和3年1月公表）によれば、令和2年1月から令和2年12月までの新設住宅着工戸数は約81.5万戸となり、4年ぶりに増加に転じた。", "令和3年版土地白書（令和3年6月公表）によれば、土地取引について、売買による所有権移転登記の件数でその動向を見ると、令和2年の全国の土地取引件数は約128万件となり、5年連続の増加となっている。", "令和3年地価公示（令和3年3月公表）によれば、令和2年1月以降の1年間の地価の変動を見ると、全国平均の用途別では、住宅地及び商業地は下落に転じたが、工業地は5年連続の上昇となっている。", "年次別法人企業統計調査（令和元年度。令和2年10月公表）によれば、令和元年度における不動産業の営業利益は約5兆円を超え、前年度を上回った。"], "page": 27, "img": ["q48_0.jpg"]}, {"stem": "土地に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["森林は、木材資源としても重要で、水源涵養、洪水防止等の大きな役割を担っている。", "活動度の高い火山の火山麓では、火山活動に伴う災害にも留意する必要がある。", "林相は良好でも、破砕帯や崖錐等の上の杉の植林地は、豪雨に際して崩壊することがある。", "崖錐や小河川の出口で堆積物の多い所等は、土石流の危険が少ない。"], "page": 27, "img": ["q49_0.jpg"]}, {"stem": "建物の構造に関する次の記述のうち、最も不適当なものはどれか。", "ch": ["鉄骨構造は、主要構造の構造形式にトラス、ラーメン、アーチ等が用いられ、高層建築の骨組に適している。", "鉄骨構造の床は既製気泡コンクリート板、プレキャストコンクリート板等でつくられる。", "鉄骨構造は、耐火被覆や鋼材の加工性の問題があり、現在は住宅、店舗等の建物には用いられていない。", "鉄骨構造は、工場、体育館、倉庫等の単層で大空間の建物に利用されている。"], "page": 27, "img": ["q50_0.jpg"]}]},
